name: G2 Existing Image DB Patcher

on:
  push:
    branches:
      - g2/integrate-existing-image-db
    paths:
      - scripts/ci/apply_g2_existing_image_db_integration.py
      - .github/workflows/g2-existing-image-db-patcher.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g2/integrate-existing-image-db
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply fail-closed integration patch
        run: python scripts/ci/apply_g2_existing_image_db_integration.py
      - name: Compile changed Python
        run: python -m compileall -q src/srstudio/graphics2/image_database_runtime.py src/srstudio/graphics2/qt_host.py
      - name: Commit patched host/UI and remove patcher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(g2): connect existing Image DB to host and product panel"
          git push origin HEAD:g2/integrate-existing-image-db
