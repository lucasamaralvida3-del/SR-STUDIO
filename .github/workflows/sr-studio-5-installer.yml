name: SR Studio 5 Installer

on:
  workflow_dispatch:
  push:
    branches: [sr-studio-5-professional]
    paths:
      - 'installer/**'
      - 'src/srstudio/**'
      - 'pyproject.toml'
      - '.github/workflows/sr-studio-5-installer.yml'

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install application builder
        run: python -m pip install -e . pyinstaller
      - name: Build application directory
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name "SR Studio 5" --paths src --collect-all pypdfium2 --collect-all pypdfium2_raw --icon "src/srstudio/assets/brand/SR_Studio.ico" --add-data "src/srstudio/assets/brand;srstudio/assets/brand" --add-data "src/srstudio/assets/poster_templates;srstudio/assets/poster_templates" src/srstudio/app/turbo_posters.py
          if (!(Test-Path "dist/SR Studio 5/SR Studio 5.exe")) { throw "Aplicativo não foi gerado" }
          $legacyA = "dist/SR Studio 5/_internal/srstudio/assets/poster_templates/legacy/models/ATACADO.pptx"
          $legacyB = "dist/SR Studio 5/srstudio/assets/poster_templates/legacy/models/ATACADO.pptx"
          if (!(Test-Path $legacyA) -and !(Test-Path $legacyB)) { throw "Modelo ATACADO.pptx não foi empacotado" }
          $promoA = "dist/SR Studio 5/_internal/srstudio/assets/poster_templates/legacy/engines/PowerPointEngine.ps1"
          $promoB = "dist/SR Studio 5/srstudio/assets/poster_templates/legacy/engines/PowerPointEngine.ps1"
          if (!(Test-Path $promoA) -and !(Test-Path $promoB)) { throw "Engine de Promoções não foi empacotado" }
          $atacadoA = "dist/SR Studio 5/_internal/srstudio/assets/poster_templates/legacy/engines/AtacadoEngine.ps1"
          $atacadoB = "dist/SR Studio 5/srstudio/assets/poster_templates/legacy/engines/AtacadoEngine.ps1"
          if (!(Test-Path $atacadoA) -and !(Test-Path $atacadoB)) { throw "Engine de Atacado não foi empacotado" }
          $pdfium = Get-ChildItem "dist/SR Studio 5" -Recurse -File -Filter "pdfium.dll" | Select-Object -First 1
          if ($null -eq $pdfium) { throw "PDFium nativo não foi empacotado" }
          python -c "import pypdfium2; from srstudio.posters.legacy_batch import LegacyBatchRenderer; from srstudio.app.turbo_posters import SRStudioTurboPosters; from srstudio.app.responsive_posters import poster_pane_ratio; from srstudio.importers.pptx.reader import PptxImporter; from srstudio.importers.pptx.semantic import SemanticMapper; from srstudio.images.library import ImageLibrary; from srstudio.images.canva_training import CanvaTrainingService; from srstudio.templates.corpus import LayoutCorpus; from srstudio.app.image_bank_view import ImageBankView; from srstudio.app.layout_corpus_view import LayoutCorpusView; from srstudio.images.cloud_sync import ImageBankCloudSync; from srstudio.images.cloud_publish import ImageBankPublicationBuilder; from srstudio.images.r2_publish import R2Config, R2Publisher; from srstudio.app.cloud_image_bank_view import CloudImageBankView; assert poster_pane_ratio(1500) == (68, 32); print(LegacyBatchRenderer.__name__, SRStudioTurboPosters.__name__, PptxImporter.__name__, SemanticMapper.__name__, ImageLibrary.__name__, CanvaTrainingService.__name__, LayoutCorpus.__name__, ImageBankView.__name__, LayoutCorpusView.__name__, ImageBankCloudSync.__name__, ImageBankPublicationBuilder.__name__, R2Config.__name__, R2Publisher.__name__, CloudImageBankView.__name__)"
      - name: Read application version
        shell: pwsh
        run: |
          $version = python -c "from srstudio import __version__; print(__version__)"
          "SR_STUDIO_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:SR_STUDIO_VERSION" "installer\sr-studio-5.iss"
          if (!(Test-Path "release\SR-Studio-5-Setup.exe")) { throw "Instalador não foi gerado" }
      - name: Create installer checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "release\SR-Studio-5-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" | Set-Content "release/SR-Studio-5-Setup.sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: SR-Studio-5-Installer
          path: |
            release/SR-Studio-5-Setup.exe
            release/SR-Studio-5-Setup.sha256.txt
          if-no-files-found: error
