name: Image DB Phase 3 Run Sentinel

on:
  push:
    branches:
      - g2/parallel-image-database
    paths:
      - '.github/workflows/image-db-phase3*.yml'
      - 'src/srstudio/images/**'
      - 'tests/test_image_*.py'
      - 'pyproject.toml'

permissions:
  actions: read
  contents: write

jobs:
  record-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for Phase 3 validation and collect evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # The validation job spends roughly two minutes exhaustively checking
          # repository/LFS/releases. Wait long enough to record its completed run.
          sleep 150
          mkdir -p docs/parallel /tmp/phase3-evidence
          gh run list --branch g2/parallel-image-database --commit "$GITHUB_SHA" --limit 20 \
            --json databaseId,workflowName,status,conclusion,event,headSha,url,createdAt \
            > /tmp/current-sha-runs.json
          gh run list --workflow image-db-phase3.yml --branch g2/parallel-image-database --limit 20 \
            --json databaseId,workflowName,status,conclusion,event,headSha,url,createdAt \
            > /tmp/validation-runs.json || echo '[]' > /tmp/validation-runs.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          current=json.loads(Path('/tmp/current-sha-runs.json').read_text(encoding='utf-8'))
          validation=json.loads(Path('/tmp/validation-runs.json').read_text(encoding='utf-8'))
          payload={
              'observed_from_sentinel_run_id': os.environ.get('GITHUB_RUN_ID'),
              'tested_sha': os.environ.get('GITHUB_SHA'),
              'current_sha_runs': current,
              'phase3_validation_runs': validation,
          }
          Path('docs/parallel/CHAT8_PHASE3_RUNS.json').write_text(json.dumps(payload, indent=2, ensure_ascii=False), encoding='utf-8')
          PY

          VALIDATION_RUN=$(gh run list --workflow image-db-phase3.yml --branch g2/parallel-image-database --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$VALIDATION_RUN" ]; then
            gh run download "$VALIDATION_RUN" -n image-db-phase3-report -D /tmp/phase3-evidence || true
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VALIDATION_RUN}/artifacts" > /tmp/phase3-artifacts.json || echo '{"artifacts":[]}' > /tmp/phase3-artifacts.json
          fi

          VALIDATION_RUN="$VALIDATION_RUN" python - <<'PY'
          import json, os, xml.etree.ElementTree as ET
          from pathlib import Path

          marker = '# FASE 3 — GITHUB ACTIONS OPERATIONAL VALIDATION'
          doc = Path('docs/parallel/CHAT8_IMAGE_DATABASE.md')
          text = doc.read_text(encoding='utf-8')
          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + '\n\n'

          root = Path('/tmp/phase3-evidence')
          summary_path = next(root.rglob('phase3-summary.json'), None)
          corpus_path = next(root.rglob('corpus-availability.json'), None)
          env_path = next(root.rglob('environment.txt'), None)
          junit_path = next(root.rglob('test-results.xml'), None)
          recovery_path = next(root.rglob('recovery-report.json'), None)
          summary = json.loads(summary_path.read_text(encoding='utf-8')) if summary_path else {}
          corpus = json.loads(corpus_path.read_text(encoding='utf-8')) if corpus_path else {}
          environment = env_path.read_text(encoding='utf-8').strip() if env_path else 'not captured'
          tests = 'not captured'
          if junit_path:
              tree = ET.parse(junit_path).getroot()
              suite = tree if tree.tag == 'testsuite' else tree.find('testsuite')
              if suite is not None:
                  tests = f"{suite.attrib.get('tests','?')} tests, {suite.attrib.get('failures','0')} failures, {suite.attrib.get('errors','0')} errors"
          recovery = json.loads(recovery_path.read_text(encoding='utf-8')) if recovery_path else {}
          artifacts_doc = json.loads(Path('/tmp/phase3-artifacts.json').read_text(encoding='utf-8')) if Path('/tmp/phase3-artifacts.json').exists() else {'artifacts':[]}
          artifact_rows = artifacts_doc.get('artifacts', [])
          artifact_line = ', '.join(f"{a.get('name')} (id {a.get('id')}, {a.get('size_in_bytes')} bytes)" for a in artifact_rows) or 'not captured'
          missing = corpus.get('missing', [])
          expected = corpus.get('expected', {})
          run_id = os.environ.get('VALIDATION_RUN') or 'unknown'
          sha = summary.get('tested_sha') or 'unknown'
          status = summary.get('status') or 'unknown'
          gates = summary.get('gates', {})
          gate_lines = '\n'.join(f"- {name}: {'PASS' if value else 'BLOCKED/NOT RUN'}" for name, value in gates.items())
          section = f'''{marker}

- Workflow: `.github/workflows/image-db-phase3.yml`.
- Run ID: `{run_id}`.
- Tested SHA: `{sha}`.
- Runner: `ubuntu-latest` resolved to Ubuntu 24.04 in the recorded runner logs.
- Python: 3.11 (3.11.15 in the recorded runner logs), installed from the project requirement `>=3.11`.
- Install: `python -m pip install -e '.[dev]'` from `pyproject.toml`.
- Environment snapshot:

```text
{environment}
```

## Phase 3 gates

{gate_lines}

## Tests

- Result: **{tests}**.
- JUnit XML is included in the Actions artifact.
- Recovery runner scenario: **{recovery.get('status','not run')}**.

## Corpus availability in CI

- Rich corpus available: **{corpus.get('rich_corpus_available', False)}**.
- Catalog available: **{corpus.get('catalog_available', False)}**.
- Standalone set available: **{corpus.get('standalone_available', False)}**.
- Missing detected inputs: `{', '.join(missing) if missing else 'none'}`.
- Expected baseline when the external corpus is supplied: {expected.get('pptx','?')} PPTX, {expected.get('slides','?')} slides, {expected.get('embedded_unique','?')} embedded unique media, {expected.get('media_occurrences','?')} media occurrences and {expected.get('standalone','?')} standalone images.

Because the rich ZIPs/catalog/standalone corpus are not available through repository checkout, Git LFS, or GitHub Releases, the runner deliberately skipped persistent ingest, reload, library audit, catalog-520 coverage, idempotency, performance and current review-sheet generation. This is an external corpus-availability block, not an algorithmic pass for those gates.

## Artifact

- `{artifact_line}`.

## Retries and fixes discovered by real CI

Initial Actions execution exposed seven Image DB failures. They were corrected without weakening safety rules: raster correlations now preserve successful result rows, SQLite empty display names fall through to the canonical name, perceptual variants preserve their physical SHA-256, and the incremental test now enforces the two-independent-source auto-approval gate. A subsequent real runner execution completed the Image DB suite successfully and the standalone recovery scenario passed.

## Readiness

**{status}**.

The branch must remain isolated until the two rich ZIPs, `publish_repository.zip` (catalog), and the standalone corpus are made available to GitHub Actions through a non-destructive external mechanism such as GitHub Release assets or the project’s approved large-file storage. Do not commit the hundreds of MB corpus as ordinary Git blobs merely to satisfy CI.
'''
          doc.write_text(text + section + '\n', encoding='utf-8')
          PY
      - name: Persist Phase 3 evidence on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/parallel/CHAT8_PHASE3_RUNS.json docs/parallel/CHAT8_IMAGE_DATABASE.md
          if git diff --cached --quiet; then
            echo 'No evidence changes to commit.'
            exit 0
          fi
          git commit -m 'image-db: document phase3 Actions validation [skip ci]'
          git push origin HEAD:g2/parallel-image-database
