name: Image DB Phase 3 Run Sentinel

on:
  push:
    branches:
      - g2/parallel-image-database
    paths:
      - '.github/workflows/image-db-phase3*.yml'
      - 'src/srstudio/images/**'
      - 'tests/test_image_*.py'
      - 'pyproject.toml'

permissions:
  actions: read
  contents: write

jobs:
  record-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record workflow runs for Phase 3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 15
          mkdir -p docs/parallel
          gh run list --branch g2/parallel-image-database --commit "$GITHUB_SHA" --limit 20 \
            --json databaseId,workflowName,status,conclusion,event,headSha,url,createdAt \
            > /tmp/current-sha-runs.json
          gh run list --workflow image-db-phase3.yml --branch g2/parallel-image-database --limit 20 \
            --json databaseId,workflowName,status,conclusion,event,headSha,url,createdAt \
            > /tmp/validation-runs.json || echo '[]' > /tmp/validation-runs.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          current=json.loads(Path('/tmp/current-sha-runs.json').read_text(encoding='utf-8'))
          validation=json.loads(Path('/tmp/validation-runs.json').read_text(encoding='utf-8'))
          payload={
              'observed_from_sentinel_run_id': os.environ.get('GITHUB_RUN_ID'),
              'tested_sha': os.environ.get('GITHUB_SHA'),
              'current_sha_runs': current,
              'phase3_validation_runs': validation,
          }
          Path('docs/parallel/CHAT8_PHASE3_RUNS.json').write_text(json.dumps(payload, indent=2, ensure_ascii=False), encoding='utf-8')
          PY
      - name: Persist sentinel result on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/parallel/CHAT8_PHASE3_RUNS.json
          git commit -m 'image-db: record phase3 Actions run ids [skip ci]'
          git push origin HEAD:g2/parallel-image-database
