name: Image DB Phase 3 Run Sentinel

on:
  push:
    branches:
      - g2/parallel-image-database
    paths:
      - '.github/workflows/image-db-phase3*.yml'
      - 'src/srstudio/images/**'
      - 'tests/test_image_*.py'
      - 'pyproject.toml'

permissions:
  actions: read
  contents: write

jobs:
  record-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record workflow runs for tested SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 15
          mkdir -p docs/parallel
          gh run list --branch g2/parallel-image-database --commit "$GITHUB_SHA" --limit 20 \
            --json databaseId,workflowName,status,conclusion,event,headSha,url,createdAt \
            > docs/parallel/CHAT8_PHASE3_RUNS.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('docs/parallel/CHAT8_PHASE3_RUNS.json')
          rows=json.loads(p.read_text(encoding='utf-8'))
          p.write_text(json.dumps({'observed_from_sentinel_run_id': os.environ.get('GITHUB_RUN_ID'), 'tested_sha': os.environ.get('GITHUB_SHA'), 'runs': rows}, indent=2, ensure_ascii=False), encoding='utf-8')
          PY
      - name: Persist sentinel result on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/parallel/CHAT8_PHASE3_RUNS.json
          git commit -m 'image-db: record phase3 Actions run ids [skip ci]'
          git push origin HEAD:g2/parallel-image-database
