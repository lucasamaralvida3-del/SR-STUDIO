name: G2 Editor Polish Inspector Parented Diagnostic

on:
  pull_request:
    branches:
      - g2/integration-beta

permissions:
  contents: read

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Linux Qt prerequisites
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install runtime Linux
        if: runner.os != 'Windows'
        shell: bash
        run: python -m pip install -e '.[dev,graphics2]'
      - name: Install runtime Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m pip install -e '.[dev,graphics2]'
      - name: Run parented diagnostic
        run: python -m pytest -s -q tests/test_graphics2_image_inspector_parented_diagnostic.py
