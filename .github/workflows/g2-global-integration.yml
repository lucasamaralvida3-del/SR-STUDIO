name: G2 Global Integration

on:
  push:
    branches:
      - g2/integration-beta
    paths:
      - "src/srstudio/graphics2/**"
      - "src/srstudio/importers/**"
      - "tests/**"
      - "tools/g2_qa_*.py"
      - ".github/workflows/g2-global-integration.yml"
  pull_request:
    branches:
      - g2/integration-beta
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-global:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Qt prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install full G2 test runtime
        run: python -m pip install -e ".[dev,graphics2]"
      - name: Compile G2 runtime
        run: python -m compileall -q src/srstudio/graphics2 src/srstudio/importers
      - name: Full Graphics2 regression suite
        run: python -m pytest -q tests -k graphics2 --durations=20
      - name: Performance smoke
        run: python tools/g2_qa_baseline.py --output g2-global-performance-linux.json --pages 1,10,25
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g2-global-linux
          path: g2-global-performance-linux.json
          if-no-files-found: ignore

  windows-global:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install full G2 test runtime
        shell: pwsh
        run: python -m pip install -e ".[dev,graphics2]"
      - name: Compile G2 runtime
        shell: pwsh
        run: python -m compileall -q src/srstudio/graphics2 src/srstudio/importers
      - name: Full Graphics2 regression suite
        shell: pwsh
        run: python -m pytest -q tests -k graphics2 --durations=20
      - name: Performance smoke
        shell: pwsh
        run: python tools/g2_qa_baseline.py --output g2-global-performance-windows.json --pages 1,10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g2-global-windows
          path: g2-global-performance-windows.json
          if-no-files-found: ignore
