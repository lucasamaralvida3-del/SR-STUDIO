name: Publicar Launcher Base 3.4 - Correção de Abertura

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-launcher-base3.4-startfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir Launcher Base 3.4
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          from pathlib import Path
          import re

          p=Path('launcher/files/SRStudioLauncher.ps1')
          text=p.read_text(encoding='utf-8-sig')

          old="$LauncherVersion = '4.0.1-hybrid.base3.3'"
          new="$LauncherVersion = '4.0.1-hybrid.base3.4'"
          if old not in text and new not in text:
              raise SystemExit('Versao esperada do Launcher nao encontrada')
          text=text.replace(old,new,1)

          marker='function Start-SrOfficialDesktopProcess'
          if marker not in text:
              anchor='function Start-SrDesktop {'
              if anchor not in text:
                  raise SystemExit('Start-SrDesktop nao encontrado')
              helper=r'''function Start-SrOfficialDesktopProcess([string]$FilePath,[object[]]$ArgumentList,[string]$WorkingDirectory) {
            # Base 3.4: o Core 5.0 exige esta marca para distinguir a abertura oficial
            # de atalhos/Python antigos. O processo filho herda a variavel e o Launcher
            # restaura o ambiente logo apos iniciar o Core.
            $previousLaunchMarker = [Environment]::GetEnvironmentVariable('SR_STUDIO_LAUNCHED_BY_UPDATER','Process')
            [Environment]::SetEnvironmentVariable('SR_STUDIO_LAUNCHED_BY_UPDATER','1','Process')
            try {
              Write-SrLog ('Opening officially through Launcher Base 3.4: ' + $FilePath)
              if($null -ne $ArgumentList -and @($ArgumentList).Count -gt 0) {
                Start-Process -FilePath $FilePath -ArgumentList $ArgumentList -WorkingDirectory $WorkingDirectory
              } else {
                Start-Process -FilePath $FilePath -WorkingDirectory $WorkingDirectory
              }
            }
            finally {
              [Environment]::SetEnvironmentVariable('SR_STUDIO_LAUNCHED_BY_UPDATER',$previousLaunchMarker,'Process')
            }
          }

          '''
              text=text.replace(anchor,helper+anchor,1)

          # Troca somente as tres inicializacoes do Desktop Core dentro de Start-SrDesktop.
          start=text.index('function Start-SrDesktop {')
          end=text.index('\ntry {', start)
          block=text[start:end]
          block_new=block
          block_new=block_new.replace("Start-Process -FilePath $entry -WorkingDirectory $AppDir\n    return", "Start-SrOfficialDesktopProcess $entry @() $AppDir\n    return", 1)
          block_new=block_new.replace("Start-Process -FilePath $pythonPath -ArgumentList @('\"' + $entry + '\"') -WorkingDirectory $AppDir\n    return", "Start-SrOfficialDesktopProcess $pythonPath @('\"' + $entry + '\"') $AppDir\n    return", 1)
          # fallback final do Start-SrDesktop
          block_new=block_new.replace("Start-Process -FilePath $entry -WorkingDirectory $AppDir\n}", "Start-SrOfficialDesktopProcess $entry @() $AppDir\n}", 1)
          if block_new == block:
              raise SystemExit('Nenhuma chamada de abertura foi corrigida')
          if 'Start-Process -FilePath $pythonPath' in block_new:
              raise SystemExit('Abertura Python direta ainda presente')
          text=text[:start]+block_new+text[end:]

          p.write_text(text,encoding='utf-8',newline='\n')
          print('LAUNCHER_BASE34_PATCH_OK')
          '@ | Set-Content fix_launcher.py -Encoding UTF8
          python fix_launcher.py
          if($LASTEXITCODE -ne 0){throw 'Patch do Launcher falhou'}

      - name: Validar sintaxe e proteção de abertura
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path=(Resolve-Path 'launcher/files/SRStudioLauncher.ps1').Path
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors -and $errors.Count -gt 0){throw "Erro PowerShell: $($errors[0].Message)"}
          $t=Get-Content -Raw $path
          foreach($required in @(
            "4.0.1-hybrid.base3.4",
            "function Start-SrOfficialDesktopProcess",
            "SR_STUDIO_LAUNCHED_BY_UPDATER",
            "Start-SrOfficialDesktopProcess `$pythonPath",
            "Start-SrOfficialDesktopProcess `$entry"
          )){if(-not $t.Contains($required)){throw "Protecao ausente: $required"}}
          Write-Host 'BASE34_SYNTAX_AND_GUARD_OK'

      - name: Testar herança da variável no processo filho
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $probe=Join-Path $env:RUNNER_TEMP 'sr_env_probe.txt'
          Remove-Item $probe -Force -ErrorAction SilentlyContinue
          $previous=[Environment]::GetEnvironmentVariable('SR_STUDIO_LAUNCHED_BY_UPDATER','Process')
          [Environment]::SetEnvironmentVariable('SR_STUDIO_LAUNCHED_BY_UPDATER','1','Process')
          try {
            $p=Start-Process -FilePath powershell.exe -ArgumentList @('-NoProfile','-Command',"[IO.File]::WriteAllText('$probe',`$env:SR_STUDIO_LAUNCHED_BY_UPDATER)") -Wait -PassThru
            if($p.ExitCode -ne 0){throw 'Processo filho falhou'}
          } finally {
            [Environment]::SetEnvironmentVariable('SR_STUDIO_LAUNCHED_BY_UPDATER',$previous,'Process')
          }
          if((Get-Content -Raw $probe).Trim() -ne '1'){throw 'Processo filho nao herdou a marca oficial'}
          Write-Host 'BASE34_CHILD_ENV_OK'

      - name: Atualizar manifestos Launcher, Stable e Beta
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $file='launcher/files/SRStudioLauncher.ps1'
          $sha=(Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
          $size=(Get-Item $file).Length
          $now=[DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(-3)).ToString('yyyy-MM-ddTHH:mm:sszzz')

          $lm=Get-Content -Raw manifests/launcher.json|ConvertFrom-Json
          $lm.version='4.0.1-hybrid.base3.4'
          $lm.published_at=$now
          $lm.files=@([pscustomobject]@{path='SRStudioLauncher.ps1';source='launcher/files/SRStudioLauncher.ps1';sha256=$sha;size=[int64]$size})
          [IO.File]::WriteAllText((Resolve-Path manifests/launcher.json),($lm|ConvertTo-Json -Depth 20),(New-Object Text.UTF8Encoding($false)))

          foreach($manifestPath in @('stable/manifest.json','beta/manifest.json')){
            $m=Get-Content -Raw $manifestPath|ConvertFrom-Json
            if($m.PSObject.Properties.Name -contains 'min_launcher'){$m.min_launcher='4.0.1-hybrid.base3.4'}else{$m|Add-Member min_launcher '4.0.1-hybrid.base3.4'}
            if($m.PSObject.Properties.Name -contains 'min_launcher_version'){$m.min_launcher_version='4.0.1-hybrid.base3.4'}else{$m|Add-Member min_launcher_version '4.0.1-hybrid.base3.4'}
            [IO.File]::WriteAllText((Resolve-Path $manifestPath),($m|ConvertTo-Json -Depth 30),(New-Object Text.UTF8Encoding($false)))
          }
          Write-Host "BASE34_MANIFEST $sha $size"

      - name: Publicar Base 3.4 no main
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'SR Studio Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add launcher/files/SRStudioLauncher.ps1 manifests/launcher.json stable/manifest.json beta/manifest.json
          git commit -m 'Publica Launcher Base 3.4 e corrige abertura do Core 5.0'
          if($LASTEXITCODE -ne 0){throw 'Falha ao registrar Base 3.4'}
          git push origin HEAD:main
          if($LASTEXITCODE -ne 0){throw 'Falha ao publicar Base 3.4'}

      - name: Sincronizar correção na linha next/5.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin next/5.0
          $work=Join-Path $env:RUNNER_TEMP 'sr-next50-base34'
          if(Test-Path $work){Remove-Item $work -Recurse -Force}
          git worktree add $work origin/next/5.0
          $source=(Resolve-Path 'launcher/files/SRStudioLauncher.ps1').Path
          $target=Join-Path $work 'launcher/files/SRStudioLauncher.ps1'
          if(Test-Path $target){
            Copy-Item $source $target -Force
            Push-Location $work
            git config user.name 'SR Studio Update Bot';git config user.email 'actions@users.noreply.github.com'
            git add launcher/files/SRStudioLauncher.ps1
            if(-not (git diff --cached --quiet)){
              git commit -m 'Sincroniza Launcher Base 3.4 na linha 5.0'
              git push origin HEAD:next/5.0
            }
            Pop-Location
          }

      - name: Verificar publicação pública
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Start-Sleep 5
          $stamp=[DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $lm=Invoke-RestMethod -Uri ("https://raw.githubusercontent.com/lucasamaralvida3-del/SR-STUDIO/main/manifests/launcher.json?ts="+$stamp) -Headers @{'Cache-Control'='no-cache'}
          if([string]$lm.version -ne '4.0.1-hybrid.base3.4'){throw "Launcher publico incorreto: $($lm.version)"}
          $remote=Invoke-WebRequest -UseBasicParsing -Uri ("https://raw.githubusercontent.com/lucasamaralvida3-del/SR-STUDIO/main/launcher/files/SRStudioLauncher.ps1?ts="+($stamp+1)) -Headers @{'Cache-Control'='no-cache'}
          $tmp=Join-Path $env:RUNNER_TEMP 'launcher_public.ps1'
          [IO.File]::WriteAllBytes($tmp,$remote.Content -as [byte[]])
          if(-not (Test-Path $tmp) -or (Get-Item $tmp).Length -eq 0){
            Invoke-WebRequest -UseBasicParsing -Uri ("https://raw.githubusercontent.com/lucasamaralvida3-del/SR-STUDIO/main/launcher/files/SRStudioLauncher.ps1?ts="+($stamp+2)) -OutFile $tmp -Headers @{'Cache-Control'='no-cache'}
          }
          $sha=(Get-FileHash -Algorithm SHA256 $tmp).Hash.ToLowerInvariant()
          if($sha -ne [string]$lm.files[0].sha256){throw "SHA publico divergente: $sha"}
          $s=Invoke-RestMethod -Uri ("https://raw.githubusercontent.com/lucasamaralvida3-del/SR-STUDIO/main/stable/manifest.json?ts="+($stamp+3)) -Headers @{'Cache-Control'='no-cache'}
          $b=Invoke-RestMethod -Uri ("https://raw.githubusercontent.com/lucasamaralvida3-del/SR-STUDIO/main/beta/manifest.json?ts="+($stamp+4)) -Headers @{'Cache-Control'='no-cache'}
          if([string]$s.min_launcher_version -ne '4.0.1-hybrid.base3.4'){throw 'Stable nao exige Base 3.4'}
          if([string]$b.min_launcher_version -ne '4.0.1-hybrid.base3.4'){throw 'Beta nao exige Base 3.4'}
          Write-Host "BASE34_PUBLICADA $($lm.version) $($lm.files[0].sha256) $($lm.files[0].size)"
