name: G2 Editor Polish Apply Inspector Direct Signal Fix

on:
  push:
    branches:
      - g2/parallel-editor-polish
    paths:
      - '.github/workflows/g2-editor-polish-apply-inspector-direct-signal.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g2/parallel-editor-polish
          fetch-depth: 0
      - name: Apply direct signal synchronization
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/srstudio/graphics2/qml/ImageInspector.qml')
          text = path.read_text(encoding='utf-8')
          old = '''    property var scene: {\n        try {\n            return JSON.parse(sceneBridge.sceneJson)\n        } catch (error) {\n            return ({})\n        }\n    }\n    property var imageNode: selectedImage(scene)\n    readonly property bool hasImageSelection: imageNode !== null && imageNode !== undefined\n    property bool syncing: false\n\n    onImageNodeChanged: Qt.callLater(panel.refresh)\n'''
          new = '''    property var scene: ({})\n    property var imageNode: null\n    property bool hasImageSelection: false\n    property bool syncing: false\n'''
          if text.count(old) != 1:
              raise SystemExit('reactive property block mismatch')
          text = text.replace(old, new, 1)

          old_refresh = '''    function refresh() {\n        syncing = true\n        try {\n            if (!hasImageSelection)\n                return\n'''
          new_refresh = '''    function refresh() {\n        syncing = true\n        try {\n            var parsedScene = JSON.parse(sceneBridge.sceneJson)\n            var selected = selectedImage(parsedScene)\n            scene = parsedScene\n            imageNode = selected\n            hasImageSelection = selected !== null && selected !== undefined\n            if (!hasImageSelection)\n                return\n'''
          if text.count(old_refresh) != 1:
              raise SystemExit('refresh block mismatch')
          text = text.replace(old_refresh, new_refresh, 1)

          old_completed = '''    Component.onCompleted: refresh()\n'''
          new_completed = '''    Component.onCompleted: {\n        sceneBridge.sceneChanged.connect(panel.refresh)\n        refresh()\n    }\n    Component.onDestruction: {\n        try { sceneBridge.sceneChanged.disconnect(panel.refresh) } catch (error) {}\n    }\n'''
          if text.count(old_completed) != 1:
              raise SystemExit('Component.onCompleted block mismatch')
          text = text.replace(old_completed, new_completed, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify scope
        run: |
          git diff --check
          git diff -- src/srstudio/graphics2/qml/ImageInspector.qml
          grep -q 'sceneBridge.sceneChanged.connect(panel.refresh)' src/srstudio/graphics2/qml/ImageInspector.qml
      - name: Commit isolated fix
        run: |
          git config user.name "g2-editor-polish-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/srstudio/graphics2/qml/ImageInspector.qml
          git commit -m "fix(g2): connect Image Inspector refresh directly"
          git push origin HEAD:g2/parallel-editor-polish
