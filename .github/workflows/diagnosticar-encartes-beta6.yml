name: Diagnosticar Encartes Beta 7

on:
  push:
    paths:
      - 'diagnostic/encartes-beta6.json'
      - '.github/workflows/diagnosticar-encartes-beta6.yml'

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspecionar painel Encartes da Beta 7
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sr7 && mkdir -p /tmp/sr7
          gh release download v4.0.6-hybrid.beta7 -p 'SR_STUDIO_4.0.6_BETA7_HOTFIX_ENCARTES.zip' -D /tmp/sr7
          unzip -q /tmp/sr7/SR_STUDIO_4.0.6_BETA7_HOTFIX_ENCARTES.zip -d /tmp/sr7/work
          echo '=== ENCARTES3ENGINE.PY COMPLETO ==='
          cat /tmp/sr7/work/files/Encartes3Engine.py
          echo '=== NAVIGATE / CLEAR_CONTENT ==='
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/sr7/work/files/SR_Studio_Gerador.py')
          lines=p.read_text(encoding='utf-8',errors='replace').splitlines()
          for key in ('def navigate(', 'def clear_content('):
              for i,line in enumerate(lines,1):
                  if key in line:
                      a=max(1,i-8); b=min(len(lines),i+85)
                      print(f'--- {key} {a}:{b} ---')
                      for n in range(a,b+1): print(f'{n:05d}: {lines[n-1]}')
                      break
          PY
          echo '=== PALETAS ==='
          grep -RniE 'APP_BG|CARD|BLUE2|MUTED|TEXT' /tmp/sr7/work/files/ui_v2.py | head -n 100 || true
