name: Diagnosticar XLSX Encartes Beta 8

on:
  push:
    paths:
      - '.github/workflows/diagnosticar-encartes-beta6.yml'

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspecionar suporte XLSX da Beta 8
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sr8 && mkdir -p /tmp/sr8
          gh release download v4.0.7-hybrid.beta8 -p 'SR_STUDIO_4.0.7_BETA8_ENCARTES_LOCAL.zip' -D /tmp/sr8
          unzip -q /tmp/sr8/SR_STUDIO_4.0.7_BETA8_ENCARTES_LOCAL.zip -d /tmp/sr8/work
          echo '=== HTML ENCARTES ==='
          grep -nEi 'script|xlsx|sheet' /tmp/sr8/work/files/Encartes3_index.html || true
          echo '=== ARQUIVOS XLSX/SHEET ==='
          find /tmp/sr8/work/files -type f | grep -Ei 'xlsx|sheet' || true
          echo '=== IMPORTADOR NOVO EDITOR ==='
          grep -nE 'window\.XLSX|XLSX\.read|\.xlsx|importFile' /tmp/sr8/work/files/Encartes4_beta6.js || true
          echo '=== IMPORTADOR LEGADO ==='
          grep -nEi 'xlsx|sheet|FileReader|arrayBuffer' /tmp/sr8/work/files/Encartes3_app.js | head -n 120 || true
