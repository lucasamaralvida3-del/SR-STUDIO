name: G2 Image DB Current Head Reconcile

on:
  push:
    paths:
      - '.github/workflows/diagnosticar-encartes-beta6.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g2/integrate-existing-image-db
          fetch-depth: 0
      - name: Reconcile existing Image DB work with current G2 integration head
        run: python scripts/ci/g2_image_db_rebase_current.py
