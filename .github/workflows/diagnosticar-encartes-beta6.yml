name: Diagnosticar Encartes Beta 6

on:
  push:
    paths:
      - 'diagnostic/encartes-beta6.json'

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar Beta 6 e inspecionar atualizador
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sr6
          gh release download v4.0.5-hybrid.beta6 -p 'SR_STUDIO_4.0.5_BETA6_NOVO_EDITOR_ENCARTES.zip' -D /tmp/sr6
          unzip -q /tmp/sr6/SR_STUDIO_4.0.5_BETA6_NOVO_EDITOR_ENCARTES.zip -d /tmp/sr6/work
          echo '=== UPDATE MANAGER ==='
          sed -n '1,360p' /tmp/sr6/work/files/UpdateManager.py
          echo '=== REFERENCIAS DE UPDATE ==='
          grep -RniE 'UpdateManager|manifest|distribution_version|release_label|beta6|auto_update' /tmp/sr6/work/files/SR_Studio_Gerador.py /tmp/sr6/work/files/ui_v2.py /tmp/sr6/work/files/SRStudio21.py | head -n 220 || true
