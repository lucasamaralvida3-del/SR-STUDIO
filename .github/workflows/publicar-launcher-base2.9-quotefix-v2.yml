name: SR Studio Launcher base2.9 - Python Quote Fix v2

on:
  push:
    paths:
      - '.github/workflows/publicar-launcher-base2.9-quotefix-v2.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correcao Base 2.9
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          from datetime import datetime, timezone, timedelta

          p=Path('launcher/files/SRStudioLauncher.ps1')
          text=p.read_text(encoding='utf-8-sig')
          if "$LauncherVersion = '4.0.1-hybrid.base2.8'" not in text:
              raise SystemExit('Launcher base2.8 nao encontrado')
          text=text.replace("$LauncherVersion = '4.0.1-hybrid.base2.8'", "$LauncherVersion = '4.0.1-hybrid.base2.9'", 1)

          candidate_line = '''        $proc = Start-Process -FilePath $exe -ArgumentList @('-c',\"import sys; print('%d.%d.%d' % sys.version_info[:3])\") -Wait -PassThru -RedirectStandardOutput $tmpOut -RedirectStandardError $tmpErr -WindowStyle Hidden'''
          candidate_new = '''        $probe = Join-Path $LogDir 'python_candidate_probe.py'\n        [IO.File]::WriteAllText($probe,\"import sys`nprint('%d.%d.%d' % sys.version_info[:3])`n\",(New-Object Text.UTF8Encoding($false)))\n        & $exe $probe 1> $tmpOut 2> $tmpErr\n        $candidateExit = $LASTEXITCODE'''
          if candidate_line not in text:
              raise SystemExit('Linha candidate Start-Process nao encontrada')
          text=text.replace(candidate_line,candidate_new,1)
          text=text.replace('if($proc.ExitCode -ne 0 -or -not $ver)', 'if($candidateExit -ne 0 -or -not $ver)', 1)
          text=text.replace("Write-SrLog ('Python candidate rejected. Exit=' + $proc.ExitCode", "Write-SrLog ('Python candidate rejected. Exit=' + $candidateExit", 1)

          stage_line = '''      $stageProc = Start-Process -FilePath $stagePython -ArgumentList @('-c',\"import sys; print('%d.%d.%d' % sys.version_info[:3])\") -Wait -PassThru -RedirectStandardOutput $stageOut -RedirectStandardError $stageErr -WindowStyle Hidden'''
          stage_new = '''      $stageProbe = Join-Path $LogDir 'portable_python_start_probe.py'\n      [IO.File]::WriteAllText($stageProbe,\"import sys`nprint('%d.%d.%d' % sys.version_info[:3])`n\",(New-Object Text.UTF8Encoding($false)))\n      & $stagePython $stageProbe 1> $stageOut 2> $stageErr\n      $stageExit = $LASTEXITCODE'''
          if stage_line not in text:
              raise SystemExit('Linha stage Start-Process nao encontrada')
          text=text.replace(stage_line,stage_new,1)
          text=text.replace("Write-SrLog ('Portable Python startup exit=' + $stageProc.ExitCode", "Write-SrLog ('Portable Python startup exit=' + $stageExit", 1)
          text=text.replace('if($stageProc.ExitCode -ne 0 -or $stageVersion', 'if($stageExit -ne 0 -or $stageVersion', 1)
          text=text.replace("'Runtime Python portatil nao iniciou corretamente. Exit=' + $stageProc.ExitCode", "'Runtime Python portatil nao iniciou corretamente. Exit=' + $stageExit", 1)

          import_line = '''    $importProc = Start-Process -FilePath $stagePython -ArgumentList @('-c',\"import tkinter, openpyxl, pypdf, PIL, numpy, cv2, tkinterdnd2; print('SR_RUNTIME_OK')\") -Wait -PassThru -RedirectStandardOutput $importOut -RedirectStandardError $importErr -WindowStyle Hidden'''
          import_new = '''    $importProbe = Join-Path $LogDir 'portable_python_imports_probe.py'\n    [IO.File]::WriteAllText($importProbe,\"import tkinter, openpyxl, pypdf, PIL, numpy, cv2, tkinterdnd2`nprint('SR_RUNTIME_OK')`n\",(New-Object Text.UTF8Encoding($false)))\n    & $stagePython $importProbe 1> $importOut 2> $importErr\n    $importExit = $LASTEXITCODE'''
          if import_line not in text:
              raise SystemExit('Linha imports Start-Process nao encontrada')
          text=text.replace(import_line,import_new,1)
          text=text.replace('if($importProc.ExitCode -ne 0)', 'if($importExit -ne 0)', 1)
          text=text.replace("'Runtime Python portatil esta incompleto. Exit=' + $importProc.ExitCode", "'Runtime Python portatil esta incompleto. Exit=' + $importExit", 1)

          # As chamadas pip continuam usando Start-Process; apenas testes Python -c foram removidos.
          if "ArgumentList @('-c'" in text:
              raise SystemExit('Ainda existe teste Python via -c/ArgumentList')

          data=('\ufeff'+text.lstrip('\ufeff')).encode('utf-8')
          p.write_bytes(data)
          now=datetime.now(timezone(timedelta(hours=-3))).isoformat(timespec='seconds')
          manifest={
              'format':'SRSTUDIO_LAUNCHER_MANIFEST_1',
              'product':'SR Studio Launcher',
              'version':'4.0.1-hybrid.base2.9',
              'published_at':now,
              'files':[{
                  'path':'SRStudioLauncher.ps1',
                  'source':'launcher/files/SRStudioLauncher.ps1',
                  'sha256':hashlib.sha256(data).hexdigest(),
                  'size':len(data),
              }],
          }
          Path('manifests/launcher.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

      - name: Validar PowerShell Base 2.9
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='launcher/files/SRStudioLauncher.ps1'
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors -and $errors.Count -gt 0){ throw "PowerShell invalido: $($errors[0].Message)" }
          foreach($required in @('4.0.1-hybrid.base2.9','python_candidate_probe.py','portable_python_start_probe.py','portable_python_imports_probe.py')){
            if(-not (Select-String -LiteralPath $p -SimpleMatch $required)){ throw "Marcador ausente: $required" }
          }

      - name: Testar runtime real com arquivos probe
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP 'runtime1.zip'
          $dir=Join-Path $env:RUNNER_TEMP 'runtime1-test'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/lucasamaralvida3-del/SR-STUDIO/releases/download/v4.0.16-runtime1/SR_STUDIO_PYTHON_3.12.10_RUNTIME1.zip' -OutFile $zip
          $sha=(Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if($sha -ne '80acc2aaffecb83a04cf60e7dc8a4b806124ee01e9f6f20a17fa2c439e65e0e9'){ throw "SHA incorreto: $sha" }
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $probe1=Join-Path $env:RUNNER_TEMP 'start_probe.py'
          [IO.File]::WriteAllText($probe1,"import sys`nprint('%d.%d.%d' % sys.version_info[:3])`n",(New-Object Text.UTF8Encoding($false)))
          $out1=& (Join-Path $dir 'python.exe') $probe1
          if($LASTEXITCODE -ne 0 -or ([string]$out1).Trim() -notmatch '^3\.12\.'){ throw 'Startup probe falhou' }
          $probe2=Join-Path $env:RUNNER_TEMP 'imports_probe.py'
          [IO.File]::WriteAllText($probe2,"import tkinter, openpyxl, pypdf, PIL, numpy, cv2, tkinterdnd2`nprint('SR_RUNTIME_OK')`n",(New-Object Text.UTF8Encoding($false)))
          $out2=& (Join-Path $dir 'python.exe') $probe2
          if($LASTEXITCODE -ne 0 -or ([string]$out2).Trim() -ne 'SR_RUNTIME_OK'){ throw 'Imports probe falhou' }
          Write-Host "Runtime validado por arquivos probe: $out1 / $out2"

      - name: Publicar Launcher Base 2.9
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'SR Studio Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add launcher/files/SRStudioLauncher.ps1 manifests/launcher.json
          if(-not (git diff --cached --quiet)){
            git commit -m 'Corrige quoting Python no Launcher base2.9'
            git push origin HEAD:main
          }

      - name: Confirmar Base 2.9 online
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Start-Sleep -Seconds 2
          $url='https://raw.githubusercontent.com/lucasamaralvida3-del/SR-STUDIO/main/manifests/launcher.json?x='+[DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $m=Invoke-RestMethod -Uri $url -Headers @{'Cache-Control'='no-cache'}
          if([string]$m.version -ne '4.0.1-hybrid.base2.9'){ throw "Manifesto online em $($m.version)" }
