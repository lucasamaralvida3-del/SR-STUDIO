name: Image DB Phase 3B V2 Gate Fix and Rerun

on:
  push:
    branches:
      - g2/parallel-image-database
    paths:
      - '.github/workflows/image-db-phase3b-v2-gate-fix-rerun.yml'

permissions:
  contents: write
  actions: write

jobs:
  fix-rerun-observe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix zero-value gate bug only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/image-db-phase3b-v2.yml')
          text = path.read_text(encoding='utf-8')
          old = "'corrupt_images_zero': int(metrics.get('corrupt_images') or -1)==0,"
          new = "'corrupt_images_zero': int(metrics.get('corrupt_images', -1))==0,"
          if old not in text:
              if new in text:
                  print('Gate already fixed.')
              else:
                  raise SystemExit('Expected Phase 3B zero-value gate expression not found; refusing unrelated edit.')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff -- .github/workflows/image-db-phase3b-v2.yml

      - name: Commit isolated CI gate fix
        id: fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/image-db-phase3b-v2.yml
          if ! git diff --cached --quiet; then
            git commit -m 'ci: fix Phase 3B zero corrupt-images gate [skip ci]'
            git push origin HEAD:g2/parallel-image-database
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch corrected Phase 3B V2
        env:
          GH_TOKEN: ${{ github.token }}
          FIX_SHA: ${{ steps.fix.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase3b-final-rerun
          gh workflow run image-db-phase3b-v2.yml --ref g2/parallel-image-database
          run_id=''
          for attempt in $(seq 1 60); do
            run_id=$(gh run list --workflow image-db-phase3b-v2.yml --branch g2/parallel-image-database --commit "$FIX_SHA" --event workflow_dispatch --limit 5 --json databaseId --jq '.[0].databaseId // empty' || true)
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo 'Unable to resolve dispatched Phase 3B V2 run.' >&2
            exit 2
          fi
          echo "$run_id" > /tmp/phase3b-final-rerun/run-id.txt
          echo "Dispatched Phase 3B V2 run: $run_id on $FIX_SHA"

      - name: Wait for corrected run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          run_id=$(cat /tmp/phase3b-final-rerun/run-id.txt)
          gh run watch "$run_id" --interval 20 --exit-status
          echo "$?" > /tmp/phase3b-final-rerun/watch-exit-code.txt
          exit 0

      - name: Persist corrected run evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FIX_SHA: ${{ steps.fix.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(cat /tmp/phase3b-final-rerun/run-id.txt 2>/dev/null || true)
          if [ -z "$run_id" ]; then exit 3; fi
          out=/tmp/phase3b-final-rerun
          gh run view "$run_id" --json databaseId,status,conclusion,headSha,headBranch,event,url,createdAt,updatedAt,workflowName,jobs > "$out/run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" > "$out/artifacts.json"
          gh run download "$run_id" -n image-db-phase3b-v2-report -D "$out/artifact" || true

          git pull --rebase origin g2/parallel-image-database
          dst=docs/parallel/phase3-evidence/phase3b-final-rerun
          rm -rf "$dst"
          mkdir -p "$dst"
          cp "$out/run.json" "$dst/run.json"
          cp "$out/artifacts.json" "$dst/artifacts.json"
          cp "$out/watch-exit-code.txt" "$dst/watch-exit-code.txt" 2>/dev/null || true
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          src=Path('/tmp/phase3b-final-rerun/artifact')
          dst=Path('docs/parallel/phase3-evidence/phase3b-final-rerun')
          wanted={
              'phase3b-summary.json','standalone-manifest.json','standalone-asset-verification.json','standalone-reference-gate.json',
              'phase3a-physical-restore.json','phase3a-before-equivalence.json','phase3b-idempotency.json','fresh-rebuild-equivalence.json',
              'top-missing-delta.json','new-auto-approved.json','important-product-lookups.json','standalone-ingest-report.json',
              'second-standalone-ingest-report.json','recovery-report.json','test-results.xml','pytest.log'
          }
          copied=[]
          if src.exists():
              for name in sorted(wanted):
                  path=next(src.rglob(name),None)
                  if path and path.is_file():
                      shutil.copy2(path,dst/name); copied.append(name)
              sheet=next(src.rglob('new-auto-approved-contact-sheet.png'),None)
              if sheet and sheet.is_file():
                  shutil.copy2(sheet,dst/'new-auto-approved-contact-sheet.png'); copied.append('new-auto-approved-contact-sheet.png')
              before_dep=next(src.rglob('before/coverage-departments.json'),None)
              after_dep=next(src.rglob('after/coverage-departments.json'),None)
              before_cov=next(src.rglob('before/coverage-catalog-520.json'),None)
              after_cov=next(src.rglob('after/coverage-catalog-520.json'),None)
              after_audit=next(src.rglob('after/library-audit.json'),None)
              after_perf=next(src.rglob('after/performance.json'),None)
              after_top=next(src.rglob('after/top-missing-100.csv'),None)
              review_manifest=next(src.rglob('after/review/review-dataset.json'),None)
              review_sheet=next(src.rglob('after/review/review-contact-sheet.png'),None)
              for source,name in ((before_dep,'departments-before.json'),(after_dep,'departments-after.json'),(before_cov,'coverage-before.json'),(after_cov,'coverage-after.json'),(after_audit,'library-audit-after.json'),(after_perf,'performance-after.json'),(after_top,'top-missing-100.csv'),(review_manifest,'review-dataset.json'),(review_sheet,'review-contact-sheet.png')):
                  if source and source.is_file(): shutil.copy2(source,dst/name); copied.append(name)
          run=json.loads((dst/'run.json').read_text(encoding='utf-8'))
          arts=json.loads((dst/'artifacts.json').read_text(encoding='utf-8'))
          (dst/'observer-result.json').write_text(json.dumps({'fix_sha':os.environ.get('FIX_SHA'),'run':run,'artifacts':arts.get('artifacts',[]),'copied_evidence':copied},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git add "$dst"
          git commit -m 'image-db: persist corrected Phase 3B final evidence [skip ci]' || true
          git push origin HEAD:g2/parallel-image-database
