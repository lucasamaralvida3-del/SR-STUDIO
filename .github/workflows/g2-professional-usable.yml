name: G2 Professional Usable

on:
  push:
    branches:
      - g2/chatgpt-professional-usable
    paths:
      - "src/srstudio/graphics2/**"
      - "tests/test_graphics2*.py"
      - ".github/workflows/g2-professional-usable.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g2-professional-usable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-contracts:
    name: G2 backend contracts
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install G2 test runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graphics2]"

      - name: Compile Graphics2
        shell: pwsh
        run: python -m compileall -q src/srstudio/graphics2

      - name: Runtime lint guard
        shell: pwsh
        run: >-
          python -m ruff check
          src/srstudio/graphics2/page_duplicate.py
          src/srstudio/graphics2/usability_gate.py
          src/srstudio/graphics2/professional_probe.py
          src/srstudio/graphics2/qt_render_runtime.py
          src/srstudio/graphics2/semantic_runtime.py
          tests/test_graphics2_page_duplicate.py
          tests/test_graphics2_usability_gate.py
          tests/test_graphics2_professional_workflow.py
          tests/test_graphics2_professional_export.py
          tests/test_graphics2_professional_probe.py
          tests/test_graphics2_recovered_slot_identity.py

      - name: Professional usability contracts
        id: professional_tests
        continue-on-error: true
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
        run: |
          $args = @(
            "-m", "pytest", "-q", "-ra", "--junitxml=g2-test-results.xml",
            "tests/test_graphics2_page_duplicate.py",
            "tests/test_graphics2_usability_gate.py",
            "tests/test_graphics2_professional_workflow.py",
            "tests/test_graphics2_professional_export.py",
            "tests/test_graphics2_professional_probe.py",
            "tests/test_graphics2_recovered_slot_identity.py",
            "tests/test_graphics2_semantic_product_card.py",
            "tests/test_graphics2_semantic_spatial_card.py",
            "tests/test_graphics2_core.py",
            "tests/test_graphics2_autosave.py"
          )
          & python @args 2>&1 | Tee-Object -FilePath g2-pytest.log
          exit $LASTEXITCODE

      - name: Preserve G2 test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-professional-test-diagnostics
          path: |
            g2-pytest.log
            g2-test-results.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce G2 test gate
        if: steps.professional_tests.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Error "G2 Professional Usable contracts failed. See g2-professional-test-diagnostics."
          exit 1
