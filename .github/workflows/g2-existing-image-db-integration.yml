name: G2 Existing Image DB Integration

on:
  push:
    branches:
      - g2/integrate-existing-image-db
      - g2/image-db-current-clean
    paths:
      - 'src/srstudio/graphics2/image_database_runtime.py'
      - 'src/srstudio/graphics2/full_studio_bridge.py'
      - 'src/srstudio/graphics2/qt_host.py'
      - 'src/srstudio/graphics2/qml/GraphicsEditor.qml'
      - 'scripts/ci/image_db_build_distribution_seed.py'
      - 'tests/test_graphics2_existing_image_database.py'
      - '.github/workflows/g2-existing-image-db-integration.yml'
      - '.github/workflows/g2-full-studio-beta.yml'
  pull_request:
    branches:
      - g2/integrate-studio-shell
    paths:
      - 'src/srstudio/graphics2/image_database_runtime.py'
      - 'src/srstudio/graphics2/full_studio_bridge.py'
      - 'src/srstudio/graphics2/qt_host.py'
      - 'src/srstudio/graphics2/qml/GraphicsEditor.qml'
      - 'scripts/ci/image_db_build_distribution_seed.py'
      - 'tests/test_graphics2_existing_image_database.py'
      - '.github/workflows/g2-existing-image-db-integration.yml'
      - '.github/workflows/g2-full-studio-beta.yml'

permissions:
  contents: write
  actions: read

jobs:
  existing-image-db:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install focused frozen-build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graphics2-build]" pyinstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record exact SHA
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          $expected = "${{ github.event.pull_request.head.sha || github.sha }}"
          if ($actual -ne $expected) { throw "Exact SHA mismatch" }
          "SOURCE_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "SOURCE_SHA=$actual"
          Write-Host "CHECKED_OUT_SHA=$actual"
          Write-Host "SHA_MATCH=PASS"

      - name: Focused existing Image DB tests
        shell: pwsh
        run: |
          python -m compileall -q src/srstudio/graphics2/image_database_runtime.py src/srstudio/graphics2/qt_host.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/test_graphics2_existing_image_database.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize existing approved Image DB seed fail-closed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path image-db-approved | Out-Null
          New-Item -ItemType Directory -Force -Path image-db-corpus | Out-Null
          New-Item -ItemType Directory -Force -Path image-db-dist | Out-Null
          gh run download 32197750743 --repo lucasamaralvida3-del/SR-STUDIO --name image-db-coverage-baseline-32197750743 --dir image-db-approved
          if ($LASTEXITCODE -ne 0) { throw "Approved Image DB baseline unavailable" }
          foreach ($path in @(
            "image-db-approved/image-db-coverage-library/index.json",
            "image-db-approved/image-db-coverage-baseline/final/coverage-catalog-520.json",
            "image-db-approved/image-db-coverage-baseline/final/library-audit.json"
          )) { if (!(Test-Path $path)) { throw "Approved baseline file missing: $path" } }
          foreach ($asset in @("Downloads.1.1.zip", "Downloads.2.1.zip", "standalone-images.zip")) {
            gh release download image-db-corpus-v1 --repo lucasamaralvida3-del/SR-STUDIO --pattern $asset --dir image-db-corpus
            if ($LASTEXITCODE -ne 0) { throw "Approved corpus asset unavailable: $asset" }
          }
          $expected = @{
            "Downloads.1.1.zip" = "aae355ed0ddcb60867172cf11b637553bf1f292c488c536ca090d15472ca79ba"
            "Downloads.2.1.zip" = "035789d47d06e8f2667d776c023b055e5d68b8c2240f98d5f775289874fbfd86"
            "standalone-images.zip" = "9c2f12d23aa827fa88124dcf82468daed42a05fb44df6ab8109e0b487dc384ff"
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $path = Join-Path "image-db-corpus" $entry.Key
            if (!(Test-Path $path)) { throw "Corpus asset missing: $path" }
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $entry.Value) { throw "Corpus SHA mismatch: $($entry.Key)" }
          }
          $builder = Join-Path $env:RUNNER_TEMP "image_db_build_distribution_seed.py"
          $url = "https://raw.githubusercontent.com/${{ github.repository }}/$env:SOURCE_SHA/scripts/ci/image_db_build_distribution_seed.py"
          Invoke-WebRequest -Uri $url -OutFile $builder
          if (!(Test-Path $builder)) { throw "Exact-SHA seed builder unavailable" }
          python $builder `
            --index image-db-approved/image-db-coverage-library/index.json `
            --catalog-report image-db-approved/image-db-coverage-baseline/final/coverage-catalog-520.json `
            --audit-report image-db-approved/image-db-coverage-baseline/final/library-audit.json `
            --pptx-archive image-db-corpus/Downloads.1.1.zip `
            --pptx-archive image-db-corpus/Downloads.2.1.zip `
            --image-archive image-db-corpus/standalone-images.zip `
            --source-artifact "image-db-coverage-baseline-32197750743 / artifact 9346445276" `
            --output image-db-dist/image-db-library-v1.zip | Tee-Object -FilePath image-db-dist/build-report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "image-db-dist/image-db-library-v1.zip")) { throw "Image DB seed missing" }
          $seedSha = (Get-FileHash "image-db-dist/image-db-library-v1.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$seedSha  image-db-library-v1.zip" | Out-File image-db-dist/image-db-library-v1.sha256 -Encoding ascii
          Write-Host "CORPUS_HASHES=PASS"
          Write-Host "SEED_SHA256=$seedSha"

      - name: Product lookup aliases fallback and 10 real samples
        shell: pwsh
        run: |
          $env:SR_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP "srstudio-image-db-logical"
          $env:SR_STUDIO_IMAGE_DB_SEED = Join-Path $env:GITHUB_WORKSPACE "image-db-dist/image-db-library-v1.zip"
          if (Test-Path $env:SR_STUDIO_DATA_DIR) { Remove-Item $env:SR_STUDIO_DATA_DIR -Recurse -Force }
          @'
          from pathlib import Path
          from PIL import Image
          from srstudio.graphics2.image_database_runtime import GraphicsImageDatabaseRuntime
          runtime = GraphicsImageDatabaseRuntime.from_environment(require_library=True)
          metrics = runtime.validate_full()
          manifest = runtime.seed_manifest
          required = ("schema", "catalog_version", "total_products", "total_images", "index_sha256", "source_release", "source_artifact", "provenance_status", "dedup_status")
          missing = [key for key in required if key not in manifest]
          assert not missing, missing
          assert type(manifest["total_products"]) is int and manifest["total_products"] == 520
          assert type(manifest["total_images"]) is int and manifest["total_images"] == 1037
          assert metrics["total_images"] == 1037
          assert manifest["provenance_status"] == "PASS"
          assert manifest["dedup_status"] == "PASS"
          known = runtime.lookup_product("BATATA INGLESA")
          assert known.best_match is not None
          alias = runtime.lookup_product("TOMATE PÊRA")
          assert alias.best_match is not None and alias.best_match.asset.id == "4088292755a7e25ce30e2a9a"
          unknown = runtime.lookup_product("PRODUTO TOTALMENTE INEXISTENTE XYZ 987ML")
          assert unknown.best_match is None
          print("KNOWN_IMAGE_ID=" + known.best_match.asset.id)
          print("KNOWN_CONFIDENCE=" + str(known.confidence))
          print("ALIAS_IMAGE_ID=" + alias.best_match.asset.id)
          print("UNKNOWN_PRODUCT_FALLBACK=PASS")
          queries = ["ARROZ PATOSUL 5KG", "ARROZ VASCONCELOS 5KG", "CAFE VASCONCELOS 500G", "LEITE TRIANGULO 1L", "DETERGENTE YPE 500ML", "ENERGETICO MONSTER 473ML", "TODDY 750G", "ACUCAR DELTA 5KG", "EXTRATO DE TOMATE ELEFANTE 300G", "Detergente Ypê Neutro 500ml"]
          for query in queries:
              rows = runtime.product_candidates({"id": query, "name": query})
              top = rows[0] if rows else None
              visual = "placeholder"
              if top:
                  path = Path(top["path"]); assert path.is_file()
                  with Image.open(path) as image: image.verify()
                  visual = "preview-decodable"
              print("PRODUCT_IMAGE_ROW=" + repr({"product": query, "top_candidate": top["image_id"] if top else "", "confidence": top["confidence"] if top else 0.0, "image_found": bool(top), "automatic": bool(top and top.get("automatic")), "visual_result": visual, "candidate_count": len(rows)}))
          print("CATALOG_VERSION=" + str(manifest["catalog_version"]))
          print("TOTAL_PRODUCTS=520")
          print("TOTAL_IMAGES=1037")
          print("DEDUP_STATUS=PASS")
          print("PROVENANCE_STATUS=PASS")
          print("LOOKUP=PASS")
          '@ | python - | Tee-Object -FilePath image-db-dist/product-image-report.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build frozen Graphics2 host with existing Image DB seed
        shell: pwsh
        run: |
          if (!(Test-Path "build/build_graphics2_host.py")) { throw "Frozen host build script absent" }
          python build/build_graphics2_host.py --output image-db-frozen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hostRoot = "image-db-frozen/SRGraphicsEngine2Host"
          if (!(Test-Path "$hostRoot/SRGraphicsEngine2Host.exe")) { throw "Frozen G2 host missing" }
          New-Item -ItemType Directory -Force -Path "$hostRoot/ImageDatabaseSeed" | Out-Null
          Copy-Item "image-db-dist/image-db-library-v1.zip" "$hostRoot/ImageDatabaseSeed/image-db-library-v1.zip" -Force

      - name: Frozen lookup outside checkout using production runtime
        shell: pwsh
        run: |
          $hostExe = Join-Path $env:GITHUB_WORKSPACE "image-db-frozen/SRGraphicsEngine2Host/SRGraphicsEngine2Host.exe"
          $env:SR_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP "srstudio-frozen-image-db"
          Remove-Item Env:SR_STUDIO_IMAGE_DB_SEED -ErrorAction SilentlyContinue
          if (Test-Path $env:SR_STUDIO_DATA_DIR) { Remove-Item $env:SR_STUDIO_DATA_DIR -Recurse -Force }
          Push-Location $env:RUNNER_TEMP
          try { $probe = & $hostExe --image-db-probe "BATATA INGLESA"; $probeExit = $LASTEXITCODE } finally { Pop-Location }
          if ($probeExit -notin @(0,3)) { throw "Frozen Image DB probe failed: $probeExit" }
          $probe | Tee-Object -FilePath image-db-dist/frozen-probe.json
          $row = $probe | ConvertFrom-Json
          if ($row.available -ne $true -or [int]$row.candidate_count -lt 1) { throw "Frozen known-product lookup failed" }
          if ([int]$row.total_products -ne 520 -or [int]$row.total_images -ne 1037) { throw "Frozen catalog metrics diverge" }
          if ([string]$row.provenance_status -ne "PASS" -or [string]$row.dedup_status -ne "PASS") { throw "Frozen integrity invalid" }
          $index = Join-Path $env:SR_STUDIO_DATA_DIR "images/index.json"
          if (!(Test-Path $index)) { throw "Official Image DB root not bootstrapped" }
          if ((Get-Content $index -Raw).Contains($env:GITHUB_WORKSPACE)) { throw "Developer checkout path leaked" }
          Write-Host "FROZEN_LOOKUP=PASS"
          Write-Host "NO_DEV_PATH=PASS"
          Write-Host "FAIL_CLOSED=PASS"

      - uses: actions/upload-artifact@v4
        with:
          name: g2-existing-image-db-certification
          path: |
            image-db-dist/build-report.json
            image-db-dist/product-image-report.txt
            image-db-dist/image-db-library-v1.sha256
            image-db-dist/frozen-probe.json
          if-no-files-found: error
          retention-days: 30
