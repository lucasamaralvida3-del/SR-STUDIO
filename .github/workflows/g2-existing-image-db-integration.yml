name: G2 Existing Image DB Integration

on:
  push:
    branches:
      - g2/image-db-current-clean
      - g2/integrate-existing-image-db
    paths:
      - 'src/srstudio/graphics2/image_database_runtime.py'
      - 'src/srstudio/graphics2/full_studio_bridge.py'
      - 'src/srstudio/graphics2/qt_host.py'
      - 'src/srstudio/graphics2/qml/GraphicsEditor.qml'
      - 'scripts/ci/image_db_build_distribution_seed.py'
      - 'tests/test_graphics2_existing_image_database.py'
      - '.github/workflows/g2-existing-image-db-integration.yml'
      - '.github/workflows/g2-full-studio-beta.yml'
  pull_request:
    branches:
      - g2/integrate-studio-shell
    paths:
      - 'src/srstudio/graphics2/image_database_runtime.py'
      - 'src/srstudio/graphics2/full_studio_bridge.py'
      - 'src/srstudio/graphics2/qt_host.py'
      - 'src/srstudio/graphics2/qml/GraphicsEditor.qml'
      - 'scripts/ci/image_db_build_distribution_seed.py'
      - 'tests/test_graphics2_existing_image_database.py'
      - '.github/workflows/g2-existing-image-db-integration.yml'
      - '.github/workflows/g2-full-studio-beta.yml'

permissions:
  contents: read
  actions: read

jobs:
  exact-frozen-certification:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Exact SHA focused tests seed and frozen Product Image certification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedSha = "${{ github.event.pull_request.head.sha || github.sha }}"
          $actualSha = git rev-parse HEAD
          if ($actualSha -ne $expectedSha) { throw "Exact SHA mismatch" }
          Write-Host "SOURCE_SHA=$actualSha"
          Write-Host "CHECKED_OUT_SHA=$actualSha"
          Write-Host "SHA_MATCH=PASS"

          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graphics2-build]" pyinstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'src'

          python -m compileall -q src/srstudio/graphics2/image_database_runtime.py src/srstudio/graphics2/qt_host.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/test_graphics2_existing_image_database.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "FOCUSED_TESTS=PASS"
          Write-Host "FAIL_CLOSED=PASS"

          # Build the real frozen G2 host while the exact checkout is intact.
          if (!(Test-Path 'build/build_graphics2_host.py')) { throw 'Frozen host build script absent' }
          python build/build_graphics2_host.py --output image-db-frozen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hostRoot = Join-Path $env:GITHUB_WORKSPACE 'image-db-frozen/SRGraphicsEngine2Host'
          $hostExe = Join-Path $hostRoot 'SRGraphicsEngine2Host.exe'
          if (!(Test-Path $hostExe)) { throw 'Frozen G2 host missing' }
          Write-Host "FROZEN_HOST_BUILD=PASS"

          # Rebuild only the transport seed for the existing SR Image Database.
          New-Item -ItemType Directory -Force -Path image-db-approved,image-db-corpus,image-db-dist | Out-Null
          gh run download 32197750743 --repo lucasamaralvida3-del/SR-STUDIO --name image-db-coverage-baseline-32197750743 --dir image-db-approved
          if ($LASTEXITCODE -ne 0) { throw 'Approved Image DB baseline unavailable' }
          foreach ($path in @(
            'image-db-approved/image-db-coverage-library/index.json',
            'image-db-approved/image-db-coverage-baseline/final/coverage-catalog-520.json',
            'image-db-approved/image-db-coverage-baseline/final/library-audit.json'
          )) { if (!(Test-Path $path)) { throw "Approved baseline file missing: $path" } }

          foreach ($asset in @('Downloads.1.1.zip','Downloads.2.1.zip','standalone-images.zip')) {
            gh release download image-db-corpus-v1 --repo lucasamaralvida3-del/SR-STUDIO --pattern $asset --dir image-db-corpus
            if ($LASTEXITCODE -ne 0) { throw "Approved corpus asset unavailable: $asset" }
          }
          $corpusHashes = @{
            'Downloads.1.1.zip' = 'aae355ed0ddcb60867172cf11b637553bf1f292c488c536ca090d15472ca79ba'
            'Downloads.2.1.zip' = '035789d47d06e8f2667d776c023b055e5d68b8c2240f98d5f775289874fbfd86'
            'standalone-images.zip' = '9c2f12d23aa827fa88124dcf82468daed42a05fb44df6ab8109e0b487dc384ff'
          }
          foreach ($entry in $corpusHashes.GetEnumerator()) {
            $path = Join-Path 'image-db-corpus' $entry.Key
            if (!(Test-Path $path)) { throw "Corpus file missing: $path" }
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $entry.Value) { throw "Corpus SHA mismatch: $($entry.Key)" }
          }
          Write-Host "CORPUS_HASHES=PASS"

          $builder = Join-Path $env:RUNNER_TEMP 'image_db_build_distribution_seed.py'
          $builderUrl = "https://raw.githubusercontent.com/${{ github.repository }}/$actualSha/scripts/ci/image_db_build_distribution_seed.py"
          Invoke-WebRequest -Uri $builderUrl -OutFile $builder
          if (!(Test-Path $builder)) { throw 'Exact-SHA seed builder unavailable' }
          python $builder `
            --index image-db-approved/image-db-coverage-library/index.json `
            --catalog-report image-db-approved/image-db-coverage-baseline/final/coverage-catalog-520.json `
            --audit-report image-db-approved/image-db-coverage-baseline/final/library-audit.json `
            --pptx-archive image-db-corpus/Downloads.1.1.zip `
            --pptx-archive image-db-corpus/Downloads.2.1.zip `
            --image-archive image-db-corpus/standalone-images.zip `
            --source-artifact 'image-db-coverage-baseline-32197750743 / artifact 9346445276' `
            --output image-db-dist/image-db-library-v1.zip | Tee-Object -FilePath image-db-dist/build-report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $seed = Join-Path $env:GITHUB_WORKSPACE 'image-db-dist/image-db-library-v1.zip'
          if (!(Test-Path $seed)) { throw 'Image DB seed missing' }
          $seedSha = (Get-FileHash $seed -Algorithm SHA256).Hash.ToLowerInvariant()
          "$seedSha  image-db-library-v1.zip" | Out-File image-db-dist/image-db-library-v1.sha256 -Encoding ascii
          Write-Host "SEED_SHA256=$seedSha"

          New-Item -ItemType Directory -Force -Path (Join-Path $hostRoot 'ImageDatabaseSeed') | Out-Null
          Copy-Item $seed (Join-Path $hostRoot 'ImageDatabaseSeed/image-db-library-v1.zip') -Force

          # No repo/dev variable for runtime. Start from a clean SR Studio data root.
          Remove-Item Env:SR_STUDIO_IMAGE_DB_SEED -ErrorAction SilentlyContinue
          $env:SR_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP 'srstudio-frozen-image-db'
          if (Test-Path $env:SR_STUDIO_DATA_DIR) { Remove-Item $env:SR_STUDIO_DATA_DIR -Recurse -Force }

          function Invoke-ImageDbProbe([string]$Product) {
            Push-Location $env:RUNNER_TEMP
            try {
              $output = & $hostExe --image-db-probe $Product
              $code = $LASTEXITCODE
            } finally { Pop-Location }
            if ($code -notin @(0,3)) { throw "Frozen probe failed for $Product with exit $code" }
            return ($output | ConvertFrom-Json)
          }

          $known = Invoke-ImageDbProbe 'BATATA INGLESA'
          if ($known.available -ne $true -or [int]$known.candidate_count -lt 1 -or [string]::IsNullOrWhiteSpace([string]$known.top_candidate)) { throw 'Known product lookup failed' }
          Write-Host "KNOWN_PRODUCT=BATATA INGLESA"
          Write-Host "KNOWN_IMAGE_ID=$($known.top_candidate)"
          Write-Host "KNOWN_CONFIDENCE=$($known.confidence)"

          $alias = Invoke-ImageDbProbe 'TOMATE PÊRA'
          if ([string]$alias.top_candidate -ne '4088292755a7e25ce30e2a9a') { throw "Alias resolved wrong image: $($alias.top_candidate)" }
          Write-Host "ALIAS_PRODUCT=TOMATE PÊRA"
          Write-Host "ALIAS_IMAGE_ID=$($alias.top_candidate)"
          Write-Host "ALIAS_LOOKUP=PASS"

          $unknown = Invoke-ImageDbProbe 'PRODUTO TOTALMENTE INEXISTENTE XYZ 987ML'
          if ([int]$unknown.candidate_count -ne 0 -or -not [string]::IsNullOrWhiteSpace([string]$unknown.top_candidate)) { throw 'Unknown product returned a candidate' }
          Write-Host "UNKNOWN_PRODUCT_FALLBACK=PASS"

          $products = @(
            'ARROZ PATOSUL 5KG','ARROZ VASCONCELOS 5KG','CAFE VASCONCELOS 500G','LEITE TRIANGULO 1L','DETERGENTE YPE 500ML',
            'ENERGETICO MONSTER 473ML','TODDY 750G','ACUCAR DELTA 5KG','EXTRATO DE TOMATE ELEFANTE 300G','Detergente Ypê Neutro 500ml'
          )
          $report = @()
          foreach ($product in $products) {
            $row = Invoke-ImageDbProbe $product
            $report += [ordered]@{
              product = $product
              top_candidate = [string]$row.top_candidate
              confidence = [double]$row.confidence
              image_found = ([int]$row.candidate_count -gt 0)
              automatic = [bool]$row.found
              candidate_count = [int]$row.candidate_count
              visual_result = $(if ([int]$row.candidate_count -gt 0) { 'candidate-resolved' } else { 'placeholder' })
            }
          }
          $report | ConvertTo-Json -Depth 4 | Tee-Object -FilePath image-db-dist/product-image-report.json

          if ([int]$known.total_products -ne 520 -or [int]$known.total_images -ne 1037) { throw 'Frozen catalog metrics diverge' }
          if ([string]$known.provenance_status -ne 'PASS' -or [string]$known.dedup_status -ne 'PASS') { throw 'Frozen catalog integrity invalid' }
          $index = Join-Path $env:SR_STUDIO_DATA_DIR 'images/index.json'
          if (!(Test-Path $index)) { throw 'Official SR Studio Image DB root was not bootstrapped' }
          if ((Get-Content $index -Raw).Contains($env:GITHUB_WORKSPACE)) { throw 'Developer checkout path leaked into Image DB' }
          foreach ($parallel in @('image-db-beta','graphics2-images','image-db-temp')) {
            if (Test-Path (Join-Path $env:SR_STUDIO_DATA_DIR $parallel)) { throw "Parallel Image DB detected: $parallel" }
          }
          Write-Host "CATALOG_VERSION=$($known.catalog_version)"
          Write-Host "TOTAL_PRODUCTS=520"
          Write-Host "TOTAL_IMAGES=1037"
          Write-Host "PROVENANCE_STATUS=PASS"
          Write-Host "DEDUP_STATUS=PASS"
          Write-Host "PRODUCT_IMAGE_LOOKUP=PASS"
          Write-Host "FROZEN_WINDOWS=PASS"
          Write-Host "NO_DEV_PATH=PASS"
          Write-Host "EXISTING_IMAGE_DB_REUSED=PASS"

      - uses: actions/upload-artifact@v4
        with:
          name: g2-existing-image-db-certification
          path: |
            image-db-dist/build-report.json
            image-db-dist/product-image-report.json
            image-db-dist/image-db-library-v1.sha256
          if-no-files-found: error
          retention-days: 30
