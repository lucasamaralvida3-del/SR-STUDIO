name: G2 Existing Image DB Integration

on:
  push:
    branches: [g2/image-db-current-clean, g2/integrate-existing-image-db]
    paths:
      - 'src/srstudio/graphics2/image_database_runtime.py'
      - 'src/srstudio/graphics2/full_studio_bridge.py'
      - 'src/srstudio/graphics2/qt_host.py'
      - 'src/srstudio/graphics2/qml/GraphicsEditor.qml'
      - 'scripts/ci/image_db_build_distribution_seed.py'
      - 'tests/test_graphics2_existing_image_database.py'
      - '.github/workflows/g2-existing-image-db-integration.yml'
      - '.github/workflows/g2-full-studio-beta.yml'
  pull_request:
    branches: [g2/integrate-studio-shell]
    paths:
      - 'src/srstudio/graphics2/image_database_runtime.py'
      - 'src/srstudio/graphics2/full_studio_bridge.py'
      - 'src/srstudio/graphics2/qt_host.py'
      - 'src/srstudio/graphics2/qml/GraphicsEditor.qml'
      - 'scripts/ci/image_db_build_distribution_seed.py'
      - 'tests/test_graphics2_existing_image_database.py'
      - '.github/workflows/g2-existing-image-db-integration.yml'
      - '.github/workflows/g2-full-studio-beta.yml'

permissions:
  contents: read
  actions: read

jobs:
  exact-frozen-certification:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Exact SHA focused tests existing corpus and official frozen host
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = git rev-parse HEAD
          $expected = "${{ github.event.pull_request.head.sha || github.sha }}"
          if ($sha -ne $expected) { throw 'Exact SHA mismatch' }
          Write-Host "SOURCE_SHA=$sha"
          Write-Host "CHECKED_OUT_SHA=$sha"
          Write-Host 'SHA_MATCH=PASS'

          $sourceSnapshot = Join-Path $env:RUNNER_TEMP 'g2-image-db-source'
          New-Item -ItemType Directory -Force -Path $sourceSnapshot | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'src/srstudio') (Join-Path $sourceSnapshot 'srstudio') -Recurse -Force
          if (!(Test-Path (Join-Path $sourceSnapshot 'srstudio/graphics2/image_database_runtime.py'))) { throw 'Exact source snapshot failed' }
          Write-Host 'SOURCE_SNAPSHOT=PASS'

          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graphics2-build]" pyinstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/test_graphics2_existing_image_database.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'FOCUSED_TESTS=14_PASS'
          Write-Host 'FAIL_CLOSED=PASS'

          $hostRunId = $null
          for ($attempt = 0; $attempt -lt 36; $attempt++) {
            $json = gh run list --repo lucasamaralvida3-del/SR-STUDIO --workflow "SR Graphics Engine 2 Host Build" --commit $sha --limit 5 --json databaseId,status,conclusion,headSha
            if ($LASTEXITCODE -ne 0) { throw 'Host Build query failed' }
            $candidate = @($json | ConvertFrom-Json) | Where-Object { $_.headSha -eq $sha } | Select-Object -First 1
            if ($null -ne $candidate -and $candidate.status -eq 'completed') {
              if ($candidate.conclusion -ne 'success') { throw "Official Host Build failed: $($candidate.databaseId)" }
              $hostRunId = [string]$candidate.databaseId
              break
            }
            Start-Sleep -Seconds 10
          }
          if ([string]::IsNullOrWhiteSpace($hostRunId)) { throw 'Official same-head Host Build timeout' }
          Write-Host "HOST_BUILD_RUN=$hostRunId"
          Write-Host 'HOST_BUILD_SAME_HEAD=PASS'

          New-Item -ItemType Directory -Force -Path host-official,host-expanded | Out-Null
          gh run download $hostRunId --repo lucasamaralvida3-del/SR-STUDIO --name graphics2-host-component --dir host-official
          if ($LASTEXITCODE -ne 0) { throw 'Official host artifact download failed' }
          $component = Get-ChildItem host-official -Recurse -File -Filter 'graphics2-host-component.zip' | Select-Object -First 1
          if ($null -eq $component) { throw 'Official host component missing' }
          Expand-Archive $component.FullName host-expanded -Force
          $hostItem = Get-ChildItem host-expanded -Recurse -File -Filter 'SRGraphicsEngine2Host.exe' | Select-Object -First 1
          if ($null -eq $hostItem) { throw 'Frozen host executable missing' }
          $hostExe = $hostItem.FullName
          $hostRoot = $hostItem.Directory.FullName
          Write-Host 'FROZEN_HOST_ARTIFACT=PASS'

          New-Item -ItemType Directory -Force -Path image-db-approved,image-db-corpus,image-db-dist | Out-Null
          gh run download 32197750743 --repo lucasamaralvida3-del/SR-STUDIO --name image-db-coverage-baseline-32197750743 --dir image-db-approved
          if ($LASTEXITCODE -ne 0) { throw 'Approved Image DB baseline unavailable' }
          foreach ($path in @(
            'image-db-approved/image-db-coverage-library/index.json',
            'image-db-approved/image-db-coverage-baseline/final/coverage-catalog-520.json',
            'image-db-approved/image-db-coverage-baseline/final/library-audit.json'
          )) { if (!(Test-Path $path)) { throw "Approved baseline missing: $path" } }

          $hashes = @{
            'Downloads.1.1.zip'='aae355ed0ddcb60867172cf11b637553bf1f292c488c536ca090d15472ca79ba'
            'Downloads.2.1.zip'='035789d47d06e8f2667d776c023b055e5d68b8c2240f98d5f775289874fbfd86'
            'standalone-images.zip'='9c2f12d23aa827fa88124dcf82468daed42a05fb44df6ab8109e0b487dc384ff'
          }
          foreach ($entry in $hashes.GetEnumerator()) {
            gh release download image-db-corpus-v1 --repo lucasamaralvida3-del/SR-STUDIO --pattern $entry.Key --dir image-db-corpus
            if ($LASTEXITCODE -ne 0) { throw "Corpus asset unavailable: $($entry.Key)" }
            $path = Join-Path image-db-corpus $entry.Key
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.Value) { throw "Corpus SHA mismatch: $($entry.Key)" }
          }
          Write-Host 'CORPUS_HASHES=PASS'

          $builder = Join-Path $env:RUNNER_TEMP 'image_db_build_distribution_seed.py'
          Invoke-WebRequest "https://raw.githubusercontent.com/${{ github.repository }}/$sha/scripts/ci/image_db_build_distribution_seed.py" -OutFile $builder
          $workspaceSeed = Join-Path $env:GITHUB_WORKSPACE 'image-db-dist/image-db-library-v1.zip'
          $buildReport = Join-Path $env:RUNNER_TEMP 'image-db-build-report.json'
          python $builder `
            --index image-db-approved/image-db-coverage-library/index.json `
            --catalog-report image-db-approved/image-db-coverage-baseline/final/coverage-catalog-520.json `
            --audit-report image-db-approved/image-db-coverage-baseline/final/library-audit.json `
            --pptx-archive image-db-corpus/Downloads.1.1.zip `
            --pptx-archive image-db-corpus/Downloads.2.1.zip `
            --image-archive image-db-corpus/standalone-images.zip `
            --source-artifact 'image-db-coverage-baseline-32197750743 / artifact 9346445276' `
            --output $workspaceSeed | Tee-Object $buildReport
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path $workspaceSeed)) { throw 'Image DB seed missing after build' }
          $seed = Join-Path $env:RUNNER_TEMP 'image-db-library-v1.zip'
          Copy-Item $workspaceSeed $seed -Force
          if (!(Test-Path $seed)) { throw 'Runner-temp Image DB seed snapshot failed' }
          $seedSha = (Get-FileHash $seed -Algorithm SHA256).Hash.ToLowerInvariant()
          $seedShaFile = Join-Path $env:RUNNER_TEMP 'image-db-library-v1.sha256'
          "$seedSha  image-db-library-v1.zip" | Out-File $seedShaFile -Encoding ascii
          Write-Host "SEED_SHA256=$seedSha"
          Write-Host 'SEED_RUNNER_TEMP_SNAPSHOT=PASS'

          $env:PYTHONPATH = $sourceSnapshot
          $env:SR_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP 'srstudio-logical-image-db'
          $env:SR_STUDIO_IMAGE_DB_SEED = $seed
          $env:IMAGE_DB_REPORT = Join-Path $env:RUNNER_TEMP 'product-image-report.json'
          if (Test-Path $env:SR_STUDIO_DATA_DIR) { Remove-Item $env:SR_STUDIO_DATA_DIR -Recurse -Force }
          @'
          import json
          import os
          from pathlib import Path
          from srstudio.graphics2.image_database_runtime import GraphicsImageDatabaseRuntime
          runtime=GraphicsImageDatabaseRuntime.from_environment(require_library=True)
          metrics=runtime.validate_full(); manifest=runtime.seed_manifest
          assert manifest["total_products"]==520 and manifest["total_images"]==1037
          assert manifest["provenance_status"]=="PASS" and manifest["dedup_status"]=="PASS"
          assert metrics["total_images"]==1037
          known=runtime.product_candidates({"id":"known","name":"BATATA INGLESA"})
          assert known and known[0]["image_id"]=="9a7b325df81919fc99604338" and any(x["automatic"] for x in known)
          alias=runtime.product_candidates({"id":"alias","name":"TOMATE PÊRA"})
          assert alias and alias[0]["image_id"]=="4088292755a7e25ce30e2a9a" and any(x["automatic"] for x in alias)
          assert runtime.product_candidates({"id":"unknown","name":"PRODUTO TOTALMENTE INEXISTENTE XYZ 987ML"})==[]
          queries=["ARROZ PATOSUL 5KG","ARROZ VASCONCELOS 5KG","CAFE VASCONCELOS 500G","LEITE TRIANGULO 1L","DETERGENTE YPE 500ML","ENERGETICO MONSTER 473ML","TODDY 750G","ACUCAR DELTA 5KG","EXTRATO DE TOMATE ELEFANTE 300G","Detergente Ypê Neutro 500ml"]
          report=[]
          for query in queries:
              rows=runtime.product_candidates({"id":query,"name":query}); top=rows[0] if rows else None
              report.append({"product":query,"top_candidate":top["image_id"] if top else "","confidence":top["confidence"] if top else 0.0,"image_found":bool(top),"automatic":bool(top and top["automatic"]),"candidate_count":len(rows),"visual_result":"candidate-resolved" if top else "placeholder"})
          Path(os.environ["IMAGE_DB_REPORT"]).write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("KNOWN_IMAGE_ID=9a7b325df81919fc99604338")
          print("ALIAS_IMAGE_ID=4088292755a7e25ce30e2a9a")
          print("UNKNOWN_PRODUCT_FALLBACK=PASS")
          print("REAL_PRODUCT_SAMPLES=10")
          print("PRODUCT_IMAGE_LOOKUP=PASS")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path $env:IMAGE_DB_REPORT)) { throw 'Product Image report missing' }
          if (!(Test-Path $seed)) { throw 'Runner-temp Image DB seed disappeared after logical lookup' }

          New-Item -ItemType Directory -Force -Path (Join-Path $hostRoot 'ImageDatabaseSeed') | Out-Null
          Copy-Item $seed (Join-Path $hostRoot 'ImageDatabaseSeed/image-db-library-v1.zip') -Force
          Remove-Item Env:SR_STUDIO_IMAGE_DB_SEED -ErrorAction SilentlyContinue
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          $env:SR_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP 'srstudio-frozen-image-db'
          if (Test-Path $env:SR_STUDIO_DATA_DIR) { Remove-Item $env:SR_STUDIO_DATA_DIR -Recurse -Force }
          function Probe([string]$product,[int]$expectedExit) {
            Push-Location $env:RUNNER_TEMP
            try { & $hostExe --image-db-probe $product | Out-Null; $code=$LASTEXITCODE } finally { Pop-Location }
            if ($code -ne $expectedExit) { throw "Frozen lookup mismatch '$product': expected $expectedExit got $code" }
          }
          Probe 'BATATA INGLESA' 0
          Probe 'TOMATE PÊRA' 0
          Probe 'PRODUTO TOTALMENTE INEXISTENTE XYZ 987ML' 3
          Probe 'BATATA INGLESA' 0
          Write-Host 'FROZEN_KNOWN_ALIAS_UNKNOWN_REOPEN=PASS'

          $root=Join-Path $env:SR_STUDIO_DATA_DIR 'images'
          $index=Join-Path $root 'index.json'; $manifestPath=Join-Path $root 'seed-manifest.json'
          if (!(Test-Path $index) -or !(Test-Path $manifestPath)) { throw 'Official Image DB persistence missing' }
          $manifest=Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ([int]$manifest.total_products -ne 520 -or [int]$manifest.total_images -ne 1037) { throw 'Persisted metrics diverge' }
          if ([string]$manifest.provenance_status -ne 'PASS' -or [string]$manifest.dedup_status -ne 'PASS') { throw 'Persisted integrity invalid' }
          if ((Get-Content $index -Raw).Contains($env:GITHUB_WORKSPACE)) { throw 'Developer checkout path leaked' }
          foreach($parallel in @('image-db-beta','graphics2-images','image-db-temp')) { if(Test-Path (Join-Path $env:SR_STUDIO_DATA_DIR $parallel)){ throw "Parallel Image DB detected: $parallel" } }
          Write-Host "CATALOG_VERSION=$($manifest.catalog_version)"
          Write-Host 'TOTAL_PRODUCTS=520'
          Write-Host 'TOTAL_IMAGES=1037'
          Write-Host 'PROVENANCE_STATUS=PASS'
          Write-Host 'DEDUP_STATUS=PASS'
          Write-Host 'FROZEN_WINDOWS=PASS'
          Write-Host 'NO_DEV_PATH=PASS'
          Write-Host 'EXISTING_IMAGE_DB_REUSED=PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: g2-existing-image-db-certification
          path: |
            ${{ runner.temp }}/image-db-build-report.json
            ${{ runner.temp }}/image-db-library-v1.sha256
            ${{ runner.temp }}/product-image-report.json
          if-no-files-found: error
          retention-days: 30
