# activation touch
# retrigger hardened base runner
name: G2 ItemSlot Stable Resize Capture Once

on:
  push:
    branches:
      - g2/fix-item-slot-interaction-performance
    paths:
      - '.github/workflows/g2-item-slot-stable-resize-capture-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(g2): apply stable ItemSlot resize capture once'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g2/fix-item-slot-interaction-performance
          fetch-depth: 0
      - name: Apply guarded stable interaction geometry patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/srstudio/graphics2/qml/GraphicsEditor.qml')
          text = path.read_text(encoding='utf-8')

          old = '''                                    property var displayBounds: previewActive ? preview_bounds : bounds
                                    property bool isManualItemSlot: !!(modelData.metadata && modelData.metadata.manual_item_slot)
                                    property bool slotEditActive: isManualItemSlot || smartSlotEditMode
'''
          new = '''                                    property var displayBounds: previewActive ? preview_bounds : bounds
                                    property bool isManualItemSlot: !!(modelData.metadata && modelData.metadata.manual_item_slot)
                                    property bool slotEditActive: isManualItemSlot || smartSlotEditMode
                                    property bool manualResizePreview: isManualItemSlot && previewActive && window.itemSlotInteractionKind === "resize"
                                    property var interactionBounds: manualResizePreview ? bounds : displayBounds
'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''                                    x: displayBounds.x * zoom
                                    y: displayBounds.y * zoom
                                    width: displayBounds.width * zoom
                                    height: displayBounds.height * zoom
'''
          new = '''                                    x: interactionBounds.x * zoom
                                    y: interactionBounds.y * zoom
                                    width: interactionBounds.width * zoom
                                    height: interactionBounds.height * zoom
'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''                                    Rectangle {
                                        anchors.fill: parent
                                        color: isDropTarget ? "#16A34A2A" : (isSelectedSlot ? "#0F5BD811" : (productDragActive ? "#0F5BD808" : "transparent"))
                                        border.width: isDropTarget ? 3 : (isSelectedSlot ? 2 : 1)
                                        border.color: isDropTarget ? "#16A34A" : (isSelectedSlot ? "#0F5BD8" : "#0F5BD855")
                                        radius: 4
                                    }
'''
          new = '''                                    Rectangle {
                                        x: (slotOverlay.displayBounds.x - slotOverlay.interactionBounds.x) * zoom
                                        y: (slotOverlay.displayBounds.y - slotOverlay.interactionBounds.y) * zoom
                                        width: slotOverlay.displayBounds.width * zoom
                                        height: slotOverlay.displayBounds.height * zoom
                                        color: isDropTarget ? "#16A34A2A" : (isSelectedSlot ? "#0F5BD811" : (productDragActive ? "#0F5BD808" : "transparent"))
                                        border.width: isDropTarget ? 3 : (isSelectedSlot ? 2 : 1)
                                        border.color: isDropTarget ? "#16A34A" : (isSelectedSlot ? "#0F5BD8" : "#0F5BD855")
                                        radius: 4
                                    }
'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''                                            color: "white"
                                            border.width: 2
                                            border.color: "#0F5BD8"
                                            z: 10
                                            MouseArea {
'''
          new = '''                                            color: slotOverlay.isManualItemSlot ? "transparent" : "white"
                                            border.width: slotOverlay.isManualItemSlot ? 0 : 2
                                            border.color: "#0F5BD8"
                                            z: 10
                                            Rectangle {
                                                visible: slotOverlay.isManualItemSlot
                                                x: (slotOverlay.displayBounds.x - slotOverlay.interactionBounds.x) * zoom
                                                   + modelData.fx * (slotOverlay.displayBounds.width - slotOverlay.interactionBounds.width) * zoom
                                                y: (slotOverlay.displayBounds.y - slotOverlay.interactionBounds.y) * zoom
                                                   + modelData.fy * (slotOverlay.displayBounds.height - slotOverlay.interactionBounds.height) * zoom
                                                width: parent.width
                                                height: parent.height
                                                radius: parent.radius
                                                color: "white"
                                                border.width: 2
                                                border.color: "#0F5BD8"
                                            }
                                            MouseArea {
'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''                                                preventStealing: true
                                                enabled: !slotOverlay.isManualItemSlot
                                                property real startGlobalX: 0
'''
          new = '''                                                preventStealing: true
                                                property real startGlobalX: 0
'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          start = text.index('\n                                  DragHandler {')
          marker = '\n                                  }\n                                        }\n                                    }\n'
          end = text.index(marker, start) + len('\n                                  }')
          text = text[:start] + text[end:]

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- src/srstudio/graphics2/qml/GraphicsEditor.qml
      - name: Commit production QML patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/srstudio/graphics2/qml/GraphicsEditor.qml
          git commit -m 'fix(g2): stabilize ItemSlot resize capture during local preview'
          git push origin HEAD:g2/fix-item-slot-interaction-performance