name: G2 Reconciliation One-Shot Source Fix

on:
  push:
    branches:
      - g2/reconcile-studio-ui-with-itemslot-perf
    paths:
      - .github/workflows/g2-reconciliation-one-shot-source-fix.yml

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g2/reconcile-studio-ui-with-itemslot-perf
          fetch-depth: 1

      - name: Restore certified toolbar commands and legacy block markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/srstudio/graphics2/qml/GraphicsEditor.qml")
          text = path.read_text(encoding="utf-8")

          restore = '                ToolButton { text: "Restaurar"; visible: smartSlotEditMode && selectedSlotId !== "" && !window.tightUi; onClicked: sceneBridge.dispatch(JSON.stringify({"name":"restore_smart_slot_auto","slot_id":selectedSlotId})) }\n'
          restored_controls = restore + (
              '                ToolButton { text: "Não-produto"; visible: smartSlotEditMode && selectedSlotId !== "" && !window.tightUi; onClicked: sceneBridge.dispatch(JSON.stringify({"name":"mark_smart_slot_non_product","slot_id":selectedSlotId})) }\n'
              '                ToolButton { text: "Excluir Slot"; visible: smartSlotEditMode && selectedSlotId !== "" && !window.tightUi; onClicked: sceneBridge.dispatch(JSON.stringify({"name":"delete_smart_slot","slot_id":selectedSlotId})) }\n'
          )
          if '"name":"mark_smart_slot_non_product"' not in text:
              if restore not in text:
                  raise SystemExit("restore toolbar anchor not found")
              text = text.replace(restore, restored_controls, 1)

          add_page = '                Button { text: "+ Página"; onClicked: sceneBridge.dispatch(\'{"name":"add_page"}\') }\n'
          duplicate_page = add_page + '                Button { visible: !window.tightUi; text: "⧉ Página"; onClicked: sceneBridge.dispatch(\'{"name":"duplicate_page"}\') }\n'
          if '"name":"duplicate_page"' not in text:
              if add_page not in text:
                  raise SystemExit("add-page toolbar anchor not found")
              text = text.replace(add_page, duplicate_page, 1)

          slot_start = '\n                        Repeater {\n                            model: slots()\n'
          expected_slot_start = '\n                            Repeater {\n                                model: slots()\n'
          if expected_slot_start not in text:
              if slot_start not in text:
                  raise SystemExit("smart-slot repeater anchor not found")
              text = text.replace(slot_start, expected_slot_start, 1)

          selection_start = '\n                        Item {\n                            id: selectionOverlay'
          expected_selection_start = '\n                            Item {\n                                id: selectionOverlay'
          if expected_selection_start not in text:
              if selection_start not in text:
                  raise SystemExit("selection overlay anchor not found")
              text = text.replace(selection_start, expected_selection_start, 1)

          path.write_text(text, encoding="utf-8")
          PY

          git diff --check
          git diff -- src/srstudio/graphics2/qml/GraphicsEditor.qml

      - name: Commit exact source fix
        shell: bash
        run: |
          if git diff --quiet -- src/srstudio/graphics2/qml/GraphicsEditor.qml; then
            echo "Source already reconciled; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/srstudio/graphics2/qml/GraphicsEditor.qml
          git commit -m "fix(g2): restore certified Studio controls and smart-slot contract"
          git push origin HEAD:g2/reconcile-studio-ui-with-itemslot-perf
