name: Apply G2 Smart Slot Performance Patch

on:
  push:
    branches:
      - g2/perf-smart-slot-preview
    paths:
      - '.github/workflows/apply-smart-slot-perf-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g2/perf-smart-slot-preview
          fetch-depth: 1

      - name: Apply guarded patch
        run: python tools/apply_smart_slot_perf_patch.py

      - name: Verify scoped diff
        shell: bash
        run: |
          git diff --check
          git status --short
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            src/srstudio/graphics2/command_router.py \
            src/srstudio/graphics2/qml/GraphicsEditor.qml \
            src/srstudio/graphics2/qt_host.py \
            src/srstudio/graphics2/smart_slot_manual.py | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected changed files"
            echo "$changed"
            exit 1
          fi

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/srstudio/graphics2/command_router.py src/srstudio/graphics2/qml/GraphicsEditor.qml src/srstudio/graphics2/qt_host.py src/srstudio/graphics2/smart_slot_manual.py
          git commit -m "perf(g2): make Smart Slot drag and resize preview-only"
          git push origin HEAD:g2/perf-smart-slot-preview
