name: Integrar Central SR Studio 5.0

on:
  push:
    branches:
      - next/5.0
    paths:
      - '.github/workflows/integrate-next5-ui.yml'

permissions:
  contents: write

jobs:
  integrar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar integração da Central 5.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python build/integrate_studio5.py src/sr_studio/SR_Studio_Gerador.py
          python -m py_compile src/sr_studio/SR_Studio_Gerador.py
          python -m py_compile src/sr_studio/modules/Studio5Module.py
          node --check src/sr_studio/Encartes11_v5.js
          $text=Get-Content -Raw 'src/sr_studio/SR_Studio_Gerador.py'
          foreach($required in @('from modules.Studio5Module import Studio5Panel','("studio5","★","Central 5.0")','def show_studio5(self):','elif key == "studio5": self.show_studio5()')){
            if(-not $text.Contains($required)){ throw "Integração ausente: $required" }
          }

      - name: Commitar integração
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'SR Studio Architecture Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/sr_studio/SR_Studio_Gerador.py
          if(-not (git diff --cached --quiet)){
            git commit -m 'Integra Central 5.0 ao menu principal do SR Studio'
            git pull --rebase origin next/5.0
            git push origin HEAD:next/5.0
          }
