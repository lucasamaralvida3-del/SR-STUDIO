name: G2 Editor Polish Apply Keyboard Focus Patch

on:
  push:
    branches:
      - g2/parallel-editor-polish
    paths:
      - '.github/workflows/g2-editor-polish-apply-keyboard-focus.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g2/parallel-editor-polish
          fetch-depth: 0
      - name: Apply exact QML edits
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/srstudio/graphics2/qml/GraphicsEditor.qml')
          text = path.read_text(encoding='utf-8')

          replacements = []
          replacements.append((
              '    property string dragHoverSlotId: ""\n',
              '''    property string dragHoverSlotId: ""\n    readonly property bool textEditingActive: isEditableTextControl(activeFocusItem)\n\n    function isEditableTextControl(item) {\n        var current = item\n        while (current) {\n            if (current instanceof TextInput || current instanceof TextEdit)\n                return true\n            current = current.parent\n        }\n        return false\n    }\n\n    function restoreCanvasFocus() {\n        if (sheet)\n            sheet.forceActiveFocus()\n    }\n'''))

          replacements.append((
              '''    function refreshScene() {\n        scene = JSON.parse(sceneBridge.sceneJson)\n        page = activePage()\n''',
              '''    function refreshScene() {\n        var previousPageId = page ? String(page.id || "") : ""\n        scene = JSON.parse(sceneBridge.sceneJson)\n        page = activePage()\n        var nextPageId = page ? String(page.id || "") : ""\n        if (previousPageId && nextPageId !== previousPageId)\n            Qt.callLater(restoreCanvasFocus)\n'''))

          old_shortcuts = '''    Shortcut { sequence: StandardKey.Undo; onActivated: sceneBridge.undo() }\n    Shortcut { sequence: StandardKey.Redo; onActivated: sceneBridge.redo() }\n    Shortcut { sequence: StandardKey.Delete; onActivated: sceneBridge.dispatch('{"name":"delete"}') }\n    Shortcut { sequence: "Ctrl+D"; onActivated: sceneBridge.dispatch('{"name":"duplicate"}') }\n    Shortcut { sequence: "Ctrl+G"; onActivated: sceneBridge.dispatch('{"name":"group"}') }\n    Shortcut { sequence: "Ctrl+Shift+G"; onActivated: sceneBridge.dispatch('{"name":"ungroup"}') }\n    Shortcut { sequence: "G"; onActivated: showGrid = !showGrid }\n'''
          new_shortcuts = '''    Shortcut { sequence: StandardKey.Undo; enabled: !window.textEditingActive; onActivated: sceneBridge.undo() }\n    Shortcut { sequence: StandardKey.Redo; enabled: !window.textEditingActive; onActivated: sceneBridge.redo() }\n    Shortcut { sequence: StandardKey.Delete; enabled: !window.textEditingActive; onActivated: sceneBridge.dispatch('{"name":"delete"}') }\n    Shortcut { sequence: "Ctrl+D"; enabled: !window.textEditingActive; onActivated: sceneBridge.dispatch('{"name":"duplicate"}') }\n    Shortcut { sequence: "Ctrl+G"; enabled: !window.textEditingActive; onActivated: sceneBridge.dispatch('{"name":"group"}') }\n    Shortcut { sequence: "Ctrl+Shift+G"; enabled: !window.textEditingActive; onActivated: sceneBridge.dispatch('{"name":"ungroup"}') }\n    Shortcut { sequence: "G"; enabled: !window.textEditingActive; onActivated: showGrid = !showGrid }\n    Shortcut { sequence: "Escape"; enabled: window.textEditingActive; onActivated: window.restoreCanvasFocus() }\n'''
          replacements.append((old_shortcuts, new_shortcuts))

          replacements.append((
              '''                        Rectangle {\n                            id: sheet\n                            x: 140\n''',
              '''                        Rectangle {\n                            id: sheet\n                            objectName: "editorCanvasFocusTarget"\n                            focus: true\n                            x: 140\n'''))

          replacements.append((
              '''                                        onPressed: sceneBridge.selectNodeAdvanced(modelData.id, (mouse.modifiers & Qt.ShiftModifier) !== 0, (mouse.modifiers & Qt.ControlModifier) !== 0)\n''',
              '''                                        onPressed: {\n                                            window.restoreCanvasFocus()\n                                            sceneBridge.selectNodeAdvanced(modelData.id, (mouse.modifiers & Qt.ShiftModifier) !== 0, (mouse.modifiers & Qt.ControlModifier) !== 0)\n                                        }\n'''))

          replacements.append((
              '''                            TextField { id: xField; Layout.fillWidth: true; inputMethodHints: Qt.ImhFormattedNumbersOnly }\n''',
              '''                            TextField { id: xField; objectName: "editorGeometryXField"; Layout.fillWidth: true; inputMethodHints: Qt.ImhFormattedNumbersOnly }\n'''))

          replacements.append((
              '''                            TextArea { id: textEditor; Layout.fillWidth: true; Layout.preferredHeight: 90; wrapMode: TextEdit.Wrap }\n''',
              '''                            TextArea { id: textEditor; objectName: "editorTextArea"; Layout.fillWidth: true; Layout.preferredHeight: 90; wrapMode: TextEdit.Wrap }\n'''))

          replacements.append((
              '''                        onClicked: sceneBridge.dispatch(JSON.stringify({"name":"select_page","page_id":modelData.id}))\n''',
              '''                        onClicked: {\n                            window.restoreCanvasFocus()\n                            sceneBridge.dispatch(JSON.stringify({"name":"select_page","page_id":modelData.id}))\n                        }\n'''))

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify scope
        run: |
          git diff --check
          git diff -- src/srstudio/graphics2/qml/GraphicsEditor.qml
          python - <<'PY'
          from pathlib import Path
          p=Path('src/srstudio/graphics2/qml/GraphicsEditor.qml').read_text(encoding='utf-8')
          assert 'readonly property bool textEditingActive' in p
          assert p.count('enabled: !window.textEditingActive') == 7
          assert 'sequence: "Escape"; enabled: window.textEditingActive' in p
          PY
      - name: Commit isolated patch
        run: |
          git config user.name "g2-editor-polish-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/srstudio/graphics2/qml/GraphicsEditor.qml
          git commit -m "fix(g2): suppress canvas shortcuts during text editing"
          git push origin HEAD:g2/parallel-editor-polish
