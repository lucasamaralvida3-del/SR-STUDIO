name: G2 Editor Polish Image Inspector Certification

on:
  push:
    branches:
      - g2/parallel-editor-polish
    paths:
      - '.github/workflows/g2-editor-polish-image-inspector-cert.yml'

permissions:
  contents: read

env:
  TARGET_SHA: 0de7177c29a015f6d63e781383ea5a83b31f2462

jobs:
  windows-qt-cert:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0de7177c29a015f6d63e781383ea5a83b31f2462
          fetch-depth: 0
      - name: Prove exact checkout
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          Write-Host "HEAD=$head"
          if ($head -ne "$env:TARGET_SHA") { throw "SHA mismatch: $head != $env:TARGET_SHA" }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Windows Qt / G2 dependencies
        shell: pwsh
        run: python -m pip install -U pip; python -m pip install -e '.[dev,graphics2]'
      - name: Prove real Qt Quick runtime
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from srstudio.graphics2.qt_host import qt_quick_available; assert qt_quick_available(); print('Qt Quick runtime OK')"
          python -m srstudio.graphics2.qt_host --graphics-api software --probe-graphics-api
      - name: Certify ImageInspector and GraphicsEditor QML
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          @'
          import json
          import os
          import sys
          from pathlib import Path
          from PySide6.QtCore import QObject, Property, Signal, Slot, QUrl
          from PySide6.QtGui import QGuiApplication
          from PySide6.QtQml import QQmlComponent, QQmlEngine

          ROOT = Path.cwd()
          QML = ROOT / "src" / "srstudio" / "graphics2" / "qml"

          class Bridge(QObject):
              sceneChanged = Signal()
              def __init__(self, scene):
                  super().__init__()
                  self._scene = scene
                  self.calls = []
              @Property(str, notify=sceneChanged)
              def sceneJson(self):
                  return json.dumps(self._scene)
              @Property(str, constant=True)
              def status(self):
                  return "certification"
              def set_scene(self, scene):
                  self._scene = scene
                  self.sceneChanged.emit()
                  app.processEvents()
              @Slot(str, result=str)
              def dispatch(self, payload):
                  self.calls.append(("dispatch", payload))
                  return json.dumps({"ok": True, "payload": {}})
              @Slot()
              def undo(self): self.calls.append(("undo", None))
              @Slot()
              def redo(self): self.calls.append(("redo", None))
              @Slot(str, str)
              def editText(self, node_id, text): self.calls.append(("editText", node_id, text))

          def scene(kind=None, node_id=""):
              nodes = {}
              selection = []
              anchor = ""
              if kind:
                  node = {
                      "id": node_id,
                      "kind": kind,
                      "name": node_id,
                      "selected": True,
                      "visible": True,
                      "opacity": 1.0,
                      "transform": {"x": 10, "y": 20, "width": 100, "height": 80, "rotation": 0},
                      "style": {},
                      "metadata": {},
                      "text": "sample" if kind == "text" else ""
                  }
                  nodes[node_id] = node
                  selection = [node_id]
                  anchor = node_id
              return {
                  "id": "cert-scene",
                  "name": "Certification",
                  "active_page_id": "p1",
                  "pages": [{"id": "p1", "name": "Page 1", "width": 800, "height": 600, "nodes": nodes, "slots": {}, "metadata": {}}],
                  "assets": {},
                  "editor": {"selection": selection, "anchor_id": anchor, "products": [], "can_undo": False, "can_redo": False}
              }

          app = QGuiApplication.instance() or QGuiApplication(sys.argv)

          def load(name, bridge):
              engine = QQmlEngine()
              engine.rootContext().setContextProperty("sceneBridge", bridge)
              component = QQmlComponent(engine, QUrl.fromLocalFile(str(QML / name)))
              if component.status() == QQmlComponent.Error:
                  raise AssertionError(name + " component errors: " + " | ".join(e.toString() for e in component.errors()))
              obj = component.create()
              if obj is None:
                  raise AssertionError(name + " create failed: " + " | ".join(e.toString() for e in component.errors()))
              app.processEvents()
              return engine, component, obj

          # GraphicsEditor.qml must instantiate under a real QQmlEngine/QQmlComponent.
          graphics_bridge = Bridge(scene())
          ge, gc, go = load("GraphicsEditor.qml", graphics_bridge)
          assert go is not None
          print("GRAPHICS_EDITOR_QML=PASS")
          go.close()
          go.deleteLater()
          app.processEvents()

          # ImageInspector state-transition contract.
          bridge = Bridge(scene())
          ie, ic, inspector = load("ImageInspector.qml", bridge)
          assert inspector.property("visible") is False
          print("NO_IMAGE_VISIBLE_FALSE=PASS")

          bridge.set_scene(scene("image", "img-1"))
          assert inspector.property("visible") is True
          image_node = inspector.property("imageNode")
          assert image_node and image_node.get("id") == "img-1", image_node
          print("IMAGE_VISIBLE_TRUE=PASS")

          bridge.set_scene(scene("text", "text-1"))
          assert inspector.property("visible") is False
          assert inspector.property("imageNode") is None
          print("IMAGE_TO_TEXT=PASS")

          bridge.set_scene(scene("image", "img-1"))
          assert inspector.property("visible") is True
          assert inspector.property("imageNode").get("id") == "img-1"
          print("TEXT_TO_IMAGE=PASS")

          bridge.set_scene(scene("image", "img-2"))
          assert inspector.property("visible") is True
          assert inspector.property("imageNode").get("id") == "img-2"
          print("IMAGE_TO_IMAGE=PASS")

          bridge.sceneChanged.emit()
          app.processEvents()
          assert inspector.property("visible") is True
          assert inspector.property("imageNode").get("id") == "img-2"
          print("SCENE_CHANGED_REFRESH=PASS")
          print("IMAGE_INSPECTOR_QML=PASS")
          '@ | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\cert_image_inspector.py"
          python "$env:RUNNER_TEMP\cert_image_inspector.py"
      - name: Compile Graphics2
        shell: pwsh
        run: python -m compileall -q src/srstudio/graphics2
      - name: QA - Ruff Graphics2
        shell: pwsh
        run: python -m ruff check src/srstudio/graphics2 tests/test_graphics2_*.py
      - name: Alpha 43 focused regression - Windows Qt
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest -q
          tests/test_graphics2_real_flyer_e2e.py
          tests/test_graphics2_global_id_preflight.py
          tests/test_graphics2_page_clone_ids.py
          tests/test_graphics2_id_repair.py
          tests/test_graphics2_id_repair_router.py
          tests/test_graphics2_recovered_optional_bindings.py
          tests/test_graphics2_recovered_spatial_atomic.py
          tests/test_graphics2_qt_renderer.py
          tests/test_graphics2_package_stress.py
          tests/test_graphics2_image_replace.py
          tests/test_graphics2_image_replace_portable.py
          tests/test_graphics2_image_replace_router.py
          tests/test_graphics2_image_replace_qml.py
      - name: Graphics2 full - Windows Qt
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests -k graphics2

  linux-quality-cert:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0de7177c29a015f6d63e781383ea5a83b31f2462
          fetch-depth: 0
      - name: Prove exact checkout
        run: |
          HEAD=$(git rev-parse HEAD)
          echo "HEAD=$HEAD"
          test "$HEAD" = "$TARGET_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -U pip && python -m pip install -e '.[dev]'
      - name: Compile Graphics2
        run: python -m compileall -q src/srstudio/graphics2
      - name: QA - Ruff Graphics2
        run: python -m ruff check src/srstudio/graphics2 tests/test_graphics2_*.py
      - name: Graphics2 full - Linux
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests -k graphics2
