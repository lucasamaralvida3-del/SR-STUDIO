name: G2 CustGeom Post-Port Exact SHA Certification

on:
  pull_request:
    branches:
      - g2/integration-beta
    paths:
      - ".github/workflows/g2-custgeom-postport-certification.yml"

permissions:
  contents: read

env:
  CERT_TARGET_SHA: 3e568f7717bb86978c58f50a5162fe44e27c4bd8
  QT_QPA_PLATFORM: offscreen
  PYTHONUNBUFFERED: "1"

jobs:
  exact-sha:
    name: Exact SHA preflight
    runs-on: ubuntu-latest
    outputs:
      checked_out_sha: ${{ steps.verify.outputs.checked_out_sha }}
      sha_match: ${{ steps.verify.outputs.sha_match }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CERT_TARGET_SHA }}
          fetch-depth: 1
          clean: true
      - name: Verify exact HEAD
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          requested="$(printf '%s' "$CERT_TARGET_SHA" | tr '[:upper:]' '[:lower:]')"
          match=false
          [[ "$actual" == "$requested" ]] && match=true
          echo "checked_out_sha=$actual" >> "$GITHUB_OUTPUT"
          echo "sha_match=$match" >> "$GITHUB_OUTPUT"
          printf '{"requested_sha":"%s","checked_out_sha":"%s","sha_match":%s}\n' "$requested" "$actual" "$match" > exact-sha.json
          cat exact-sha.json
          [[ "$match" == "true" ]]
      - uses: actions/upload-artifact@v4
        with:
          name: g2-custgeom-postport-preflight
          path: exact-sha.json

  compile-lint:
    name: Compile and lint
    needs: exact-sha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.CERT_TARGET_SHA }}", fetch-depth: 1, clean: true}
      - run: test "$(git rev-parse HEAD)" = "$CERT_TARGET_SHA"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: python -m pip install -U pip && python -m pip install -e '.[dev,graphics2]'
      - run: python -m compileall -q src/srstudio/graphics2 src/srstudio/importers tests
      - run: python -m ruff check src/srstudio/graphics2 src/srstudio/importers tests/test_graphics2_*.py

  graphics2:
    name: Graphics2 full
    needs: exact-sha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.CERT_TARGET_SHA }}", fetch-depth: 1, clean: true}
      - run: test "$(git rev-parse HEAD)" = "$CERT_TARGET_SHA"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m pip install -e '.[dev,graphics2]'
      - run: python -m pytest -q tests -k graphics2 --durations=20

  global:
    name: G2 Global (${{ matrix.os }})
    needs: exact-sha
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.CERT_TARGET_SHA }}", fetch-depth: 1, clean: true}
      - name: Verify exact HEAD
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CERT_TARGET_SHA"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - shell: bash
        run: python -m pip install -e '.[dev,graphics2]'
      - shell: bash
        run: python -m compileall -q src/srstudio/graphics2 src/srstudio/importers
      - shell: bash
        run: python -m pytest -q tests -k graphics2 --durations=20
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "from srstudio.graphics2.qt_host import qt_quick_available; assert qt_quick_available(); print('Qt Quick runtime OK')"
          python -m srstudio.graphics2.qt_host --graphics-api software --probe-graphics-api
      - shell: bash
        run: python tools/g2_qa_baseline.py --output g2-global-performance.json --pages 1,10

  qa:
    name: QA (${{ matrix.os }})
    needs: exact-sha
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.CERT_TARGET_SHA }}", fetch-depth: 1, clean: true}
      - shell: bash
        run: test "$(git rev-parse HEAD)" = "$CERT_TARGET_SHA"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - shell: bash
        run: python -m pip install -e '.[dev,graphics2]'
      - shell: bash
        run: >-
          python -m pytest -q
          tests/test_graphics2_autosave.py
          tests/test_graphics2_bridge_roundtrip.py
          tests/test_graphics2_package_stress.py
          tests/test_graphics2_page_clone_ids.py
          tests/test_graphics2_project_actions.py
          tests/test_graphics2_product_card_duplicate.py
          tests/test_graphics2_pdf_multipage.py
          tests/test_graphics2_real_flyer_e2e.py
          tests/test_graphics2_image_replace_qml.py
          tests/test_graphics2_qa_longrun.py
          tests/test_graphics2_qa_pptx_e2e.py
      - shell: bash
        run: python tools/g2_qa_baseline.py --output g2-qa-baseline.json --pages 1,10
      - if: runner.os == 'Linux'
        run: python tools/g2_qa_pptx_baseline.py --output g2-qa-pptx-baseline.json

  export:
    name: Export (${{ matrix.os }})
    needs: exact-sha
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.CERT_TARGET_SHA }}", fetch-depth: 1, clean: true}
      - shell: bash
        run: test "$(git rev-parse HEAD)" = "$CERT_TARGET_SHA"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1
      - shell: bash
        run: python -m pip install -e '.[dev,graphics2]'
      - shell: bash
        run: >-
          python -m pytest -q
          tests/test_graphics2_export_output.py
          tests/test_graphics2_export_roundtrip.py
          tests/test_graphics2_export_batch_transaction.py
          tests/test_graphics2_export_print_contract.py
          tests/test_graphics2_qt_renderer.py
      - if: runner.os == 'Windows'
        shell: pwsh
        run: python tests/benchmark_graphics2_export_output.py --output g2-export-benchmark.json

  release:
    name: Release Engineering (${{ matrix.os }})
    needs: exact-sha
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.CERT_TARGET_SHA }}", fetch-depth: 1, clean: true}
      - shell: bash
        run: test "$(git rev-parse HEAD)" = "$CERT_TARGET_SHA"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1
      - name: Install release runtime
        shell: bash
        run: |
          python -m pip install -U pip
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            python -m pip install -e '.[dev,graphics2-build]'
          else
            python -m pip install -e '.[dev,graphics2]'
          fi
      - shell: bash
        run: >-
          python -m pytest -q
          tests/test_graphics2_release_engineering.py
          tests/test_graphics2_host_build.py
          tests/test_graphics2_host_runtime.py
          tests/test_graphics2_host_install.py
          tests/test_graphics2_studio_bridge.py
          tests/test_graphics2_component_package.py
          tests/test_graphics2_launcher_component.py
          tests/test_graphics2_launcher_manifest.py
          tests/test_graphics2_installer_component.py
      - name: Development release smoke
        shell: bash
        run: |
          smoke="$RUNNER_TEMP/g2-postport-release-smoke"
          cd "$RUNNER_TEMP"
          sr-graphics2-release-smoke --output-dir "$smoke"
          test -s "$smoke/release-smoke.srscene"
          test -s "$smoke/release-smoke.png"
          test -s "$smoke/release-smoke.pdf"
          test -s "$smoke/release-smoke.json"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: python build/build_graphics2_host.py --output "$env:RUNNER_TEMP\graphics2-host"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'graphics2-host'
          $bundle = Join-Path $root 'SRGraphicsEngine2Host'
          $engineVersion = python -c "from srstudio.graphics2 import ENGINE_VERSION; print(ENGINE_VERSION)"
          python -m srstudio.graphics2.host_runtime "$bundle" --full --engine-version $engineVersion

  alpha43:
    name: Alpha 43 (${{ matrix.os }})
    needs: exact-sha
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.CERT_TARGET_SHA }}", fetch-depth: 1, clean: true}
      - shell: bash
        run: test "$(git rev-parse HEAD)" = "$CERT_TARGET_SHA"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - shell: bash
        run: python -m pip install -U pip && python -m pip install -e '.[dev,graphics2]'
      - shell: bash
        run: >-
          python -m pytest -q
          tests/test_graphics2_real_flyer_e2e.py
          tests/test_graphics2_global_id_preflight.py
          tests/test_graphics2_page_clone_ids.py
          tests/test_graphics2_id_repair.py
          tests/test_graphics2_id_repair_router.py
          tests/test_graphics2_recovered_optional_bindings.py
          tests/test_graphics2_recovered_spatial_atomic.py
          tests/test_graphics2_qt_renderer.py
          tests/test_graphics2_package_stress.py
          tests/test_graphics2_image_replace.py
          tests/test_graphics2_image_replace_portable.py
          tests/test_graphics2_image_replace_router.py
          tests/test_graphics2_image_replace_qml.py
      - shell: bash
        run: python -m pytest -q tests -k graphics2

  quality:
    name: Quality
    needs: exact-sha
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.CERT_TARGET_SHA }}", fetch-depth: 1, clean: true}
      - shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if($actual -ne $env:CERT_TARGET_SHA.ToLowerInvariant()) { throw "ACTUAL_HEAD != TARGET_SHA" }
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - shell: pwsh
        run: python -m pip install -e ".[dev,graphics2]"
      - shell: pwsh
        run: python -m compileall -q src tests
      - shell: pwsh
        run: python -m ruff check src tests
      - shell: pwsh
        run: python -m pytest -q

  custgeom:
    name: custGeom late recovery regression
    needs: exact-sha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.CERT_TARGET_SHA }}", fetch-depth: 1, clean: true}
      - run: test "$(git rev-parse HEAD)" = "$CERT_TARGET_SHA"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: python -m pip install -e '.[dev,graphics2]'
      - name: Late-recovery fixture 1/1
        run: python -m pytest -q tests/test_graphics2_custgeom_picture_fill_diagnostic.py::test_import_bridge_recovers_late_artwork_before_custgeom_fidelity_pass
      - name: Full custGeom regression
        run: python -m pytest -q tests/test_graphics2_custgeom_picture_fill_diagnostic.py
      - name: Idempotency generic PPTX and duplicate guards
        run: |
          python - <<'PY'
          import importlib.util
          import tempfile
          from pathlib import Path
          import zipfile
          from unittest.mock import patch

          spec = importlib.util.spec_from_file_location("custgeom_fixture", "tests/test_graphics2_custgeom_picture_fill_diagnostic.py")
          mod = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(mod)

          import srstudio.graphics2.import_bridge as bridge
          import srstudio.graphics2.pptx_fill_rect as fillrect
          from srstudio.graphics2.import_bridge import GraphicsImportService
          from srstudio.graphics2.model import NodeKind

          def import_blank(path: Path):
              service = GraphicsImportService()
              service.pipeline = mod._NoImagePipeline()
              return service.import_file(path, project_name="post-port-certification")

          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              late = mod._write_late_artwork_pptx(root / "late.pptx")
              real_recover = bridge.recover_pptx_artwork
              real_nested = fillrect._recover_artwork_contracts
              with patch.object(bridge, "recover_pptx_artwork", wraps=real_recover) as primary, patch.object(fillrect, "_recover_artwork_contracts", wraps=real_nested) as nested:
                  first = import_blank(late)
                  assert primary.call_count == 1
                  assert nested.call_count == 0
              second = import_blank(late)

              def signature(result):
                  images = [n for n in result.document.active_page.nodes.values() if n.kind is NodeKind.IMAGE]
                  assert len(images) == 1
                  image = images[0]
                  return (image.metadata.get("clip_path"), image.style.get("fill_rect"), image.asset_id)

              assert signature(first) == signature(second)
              images = [n for n in first.document.active_page.nodes.values() if n.kind is NodeKind.IMAGE]
              duplicate_images = len(images) - len({n.id for n in images})
              associations = [(n.id, n.asset_id) for n in images if n.asset_id]
              duplicate_associations = len(associations) - len(set(associations))
              assert duplicate_images == 0
              assert duplicate_associations == 0

              presentation = f'<p:presentation xmlns:p="{mod.P_NS}"><p:sldSz cx="1000000" cy="1000000"/></p:presentation>'
              slide = f'''<p:sld xmlns:p="{mod.P_NS}" xmlns:a="{mod.A_NS}"><p:cSld><p:spTree><p:nvGrpSpPr/><p:grpSpPr/><p:sp><p:nvSpPr><p:cNvPr id="2" name="Generic Rectangle"/><p:cNvSpPr/><p:nvPr/></p:nvSpPr><p:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="100000" cy="100000"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></p:spPr></p:sp></p:spTree></p:cSld></p:sld>'''
              generic = root / "generic.pptx"
              with zipfile.ZipFile(generic, "w", compression=zipfile.ZIP_DEFLATED) as archive:
                  archive.writestr("ppt/presentation.xml", presentation)
                  archive.writestr("ppt/slides/slide1.xml", slide)
              generic_result = import_blank(generic)
              assert generic_result.document.active_page is not None
              assert generic_result.document.metadata.get("pptx_artwork_recovery", {}).get("error") is None

          print("idempotency=PASS")
          print("generic_pptx=PASS")
          print("duplicate_artwork_recovery=0")
          print("duplicate_IMAGE=0")
          print("duplicate_associations=0")
          PY

  report:
    name: Persist post-port certification report
    if: always()
    needs: [exact-sha, compile-lint, graphics2, global, qa, export, release, alpha43, quality, custgeom]
    runs-on: ubuntu-latest
    steps:
      - name: Build report
        env:
          CHECKED: ${{ needs.exact-sha.outputs.checked_out_sha }}
          SHA_MATCH: ${{ needs.exact-sha.outputs.sha_match }}
          COMPILE: ${{ needs.compile-lint.result }}
          GRAPHICS2: ${{ needs.graphics2.result }}
          GLOBAL: ${{ needs.global.result }}
          QA: ${{ needs.qa.result }}
          EXPORT: ${{ needs.export.result }}
          RELEASE: ${{ needs.release.result }}
          ALPHA43: ${{ needs.alpha43.result }}
          QUALITY: ${{ needs.quality.result }}
          CUSTGEOM: ${{ needs.custgeom.result }}
        run: |
          python - <<'PY'
          import json, os
          gates = {k.lower(): os.environ[k] for k in ["COMPILE","GRAPHICS2","GLOBAL","QA","EXPORT","RELEASE","ALPHA43","QUALITY","CUSTGEOM"]}
          payload = {
            "requested_sha": os.environ["CERT_TARGET_SHA"],
            "checked_out_sha": os.environ.get("CHECKED", ""),
            "sha_match": os.environ.get("SHA_MATCH", "false") == "true",
            "gates": gates,
            "ready": os.environ.get("SHA_MATCH", "false") == "true" and all(v == "success" for v in gates.values()),
          }
          open("g2-custgeom-postport-certification.json", "w", encoding="utf-8").write(json.dumps(payload, indent=2) + "\n")
          print(json.dumps(payload, indent=2))
          if not payload["ready"]:
              raise SystemExit("post-port certification failed")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g2-custgeom-postport-certification-${{ env.CERT_TARGET_SHA }}
          path: g2-custgeom-postport-certification.json
