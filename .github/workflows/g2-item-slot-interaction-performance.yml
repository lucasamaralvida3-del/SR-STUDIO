# Temporary transport only; restore permanent gate immediately after the direct MouseArea commit lands.
name: G2 ItemSlot Interaction Performance

on:
  push:
    branches:
      - g2/fix-item-slot-interaction-performance
  pull_request:
    branches:
      - g2/fix-full-studio-entrypoint-beta27
      - g2/integrate-studio-shell

permissions:
  contents: write

jobs:
  patch-direct-mousearea:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g2/fix-item-slot-interaction-performance
          fetch-depth: 0

      - id: patch
        name: Make stable resize delegate own MouseArea directly
        shell: bash
        run: |
          set -euo pipefail
          echo "changed=false" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          from pathlib import Path

          path = Path('src/srstudio/graphics2/qml/GraphicsEditor.qml')
          text = path.read_text(encoding='utf-8')
          marker = 'objectName: "smartSlotHandle-" + String(modelData.dir) + "-" + String(slotOverlay.modelData.id || "")'
          pos = text.index(marker)
          start = text.rfind('                                        delegate: Rectangle {', 0, pos)
          if start < 0:
              region = text[text.index('model: slots()'):text.index('id: selectionOverlay')]
              if 'delegate: MouseArea {' in region and 'id: slotResizeArea' not in region:
                  raise SystemExit(0)
              raise SystemExit('ItemSlot resize delegate not found')

          def matching_brace(source: str, block_start: int) -> int:
              opening = source.index('{', block_start)
              depth = 0
              quote = None
              escape = False
              for i in range(opening, len(source)):
                  ch = source[i]
                  if quote:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                      continue
                  if ch in ('"', "'"):
                      quote = ch
                      continue
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return i
              raise RuntimeError('unbalanced QML braces')

          end = matching_brace(text, start)
          block = text[start:end + 1]
          nested_marker = '                                            MouseArea {\n                                                id: slotResizeArea\n'
          nested_start = block.index(nested_marker)
          nested_end = matching_brace(block, nested_start)
          nested = block[nested_start:nested_end + 1]
          body = nested[nested.index('{') + 1:-1]
          for line in [
              '                                                id: slotResizeArea\n',
              '                                                objectName: "smartSlotResizeArea-" + String(modelData.dir) + "-" + String(slotOverlay.modelData.id || "")\n',
              '                                                anchors.fill: parent\n',
              '                                                cursorShape: modelData.cursor\n',
              '                                                preventStealing: true\n',
          ]:
              if line not in body:
                  raise SystemExit(f'nested contract missing: {line.strip()}')
              body = body.replace(line, '', 1)
          body = ''.join(line[4:] if line.startswith('    ') else line for line in body.splitlines(keepends=True))

          prefix = block[:nested_start]
          prefix = prefix.replace('                                        delegate: Rectangle {', '                                        delegate: MouseArea {', 1)
          prefix = prefix.replace(marker, 'objectName: "smartSlotResizeArea-" + String(modelData.dir) + "-" + String(slotOverlay.modelData.id || "")', 1)
          for obsolete in [
              '                                            radius: 2\n',
              '                                            color: "transparent"\n',
              '                                            border.width: 0\n',
          ]:
              prefix = prefix.replace(obsolete, '', 1)
          anchor = '                                            z: 10\n'
          child = '''                                            acceptedButtons: Qt.LeftButton
                                            cursorShape: modelData.cursor
                                            preventStealing: true
                                            Item {
                                                objectName: "smartSlotHandle-" + String(modelData.dir) + "-" + String(slotOverlay.modelData.id || "")
                                                anchors.fill: parent
                                            }
'''
          if anchor not in prefix:
              raise SystemExit('stable z anchor missing')
          prefix = prefix.replace(anchor, anchor + child, 1)
          replacement = prefix + body + block[nested_end + 1:]
          text = text[:start] + replacement + text[end + 1:]

          region = text[text.index('model: slots()'):text.index('id: selectionOverlay')]
          for token in [
              'delegate: MouseArea {',
              'objectName: "smartSlotResizeArea-"',
              'objectName: "smartSlotHandle-"',
              'objectName: "smartSlotVisualHandle-"',
              'acceptedButtons: Qt.LeftButton',
              'preventStealing: true',
              'onPressed: {',
              'onPositionChanged: {',
              'onReleased: {',
          ]:
              if token not in region:
                  raise SystemExit(f'missing direct MouseArea token: {token}')
          if 'id: slotResizeArea' in region or 'DragHandler {' in region or 'manualItemSlotResizeHandler' in region:
              raise SystemExit('obsolete/experimental resize path remains')
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          if git diff --quiet -- src/srstudio/graphics2/qml/GraphicsEditor.qml; then
            echo "Direct MouseArea already present"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/srstudio/graphics2/qml/GraphicsEditor.qml
          git commit -m 'fix(g2): make stable ItemSlot handle own mouse grab directly'
          git push origin HEAD:g2/fix-item-slot-interaction-performance
          echo "changed=true" >> "$GITHUB_OUTPUT"

  frozen-windows-itemslot-performance:
    needs: patch-direct-mousearea
    if: needs.patch-direct-mousearea.outputs.changed != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install focused dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graphics2,graphics2-build]" pyinstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record exact source SHA
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          $expected = "${{ github.event.pull_request.head.sha || github.sha }}"
          Write-Host "SOURCE_SHA=$sha"
          Write-Host "EXPECTED_SHA=$expected"
          if ($sha -ne $expected) { throw "Exact SHA mismatch" }
          git diff --quiet
          if ($LASTEXITCODE -ne 0) { throw "Tracked working tree changed before ItemSlot gate" }

      - name: Focused ItemSlot interaction regression suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
        run: |
          python -m compileall -q src/srstudio/graphics2/item_slot_host.py tests/test_graphics2_item_slot_interaction_performance.py tools/benchmark_frozen_item_slot_interaction.py tools/verify_frozen_item_slot_interaction.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/test_graphics2_item_slots.py tests/test_graphics2_item_slot_interaction_performance.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build exact frozen Graphics2 host
        shell: pwsh
        run: |
          python build/build_graphics2_host.py --output "dist/graphics2-host"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = "dist/graphics2-host/SRGraphicsEngine2Host"
          if (!(Test-Path "$root/SRGraphicsEngine2Host.exe")) { throw "Frozen Graphics2Host missing" }
          if (!(Test-Path "$root/_internal/srstudio/graphics2/qml/GraphicsEditor.qml")) { throw "Frozen GraphicsEditor.qml missing" }
          & "$root/SRGraphicsEngine2Host.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Frozen Graphics2Host --version failed" }

      - name: Continuous 3-second move resize and save reopen gate
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          QSG_RHI_BACKEND: software
        run: |
          New-Item -ItemType Directory -Force -Path itemslot-perf-evidence | Out-Null
          python tools/verify_frozen_item_slot_interaction.py `
            --qml "dist/graphics2-host/SRGraphicsEngine2Host/_internal/srstudio/graphics2/qml/GraphicsEditor.qml" `
            --output-dir "itemslot-perf-evidence/continuous"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Benchmark 200 move and resize events for all ItemSlot presets
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          QSG_RHI_BACKEND: software
        run: |
          python tools/benchmark_frozen_item_slot_interaction.py `
            --qml "dist/graphics2-host/SRGraphicsEngine2Host/_internal/srstudio/graphics2/qml/GraphicsEditor.qml" `
            --output "itemslot-perf-evidence/benchmark.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enforce hard performance thresholds
        shell: pwsh
        run: |
          $perf = Get-Content "itemslot-perf-evidence/benchmark.json" -Raw | ConvertFrom-Json
          foreach ($preset in $perf.presets) {
            if ([double]$preset.move.median_ms -ge 1.0) { throw "$($preset.preset) move median >= 1ms" }
            if ([double]$preset.move.p95_ms -ge 4.0) { throw "$($preset.preset) move p95 >= 4ms" }
            if ([double]$preset.resize.median_ms -ge 1.0) { throw "$($preset.preset) resize median >= 1ms" }
            if ([double]$preset.resize.p95_ms -ge 4.0) { throw "$($preset.preset) resize p95 >= 4ms" }
            if ([int]$preset.backend_dispatches_during_move -ne 0) { throw "$($preset.preset) dispatched during move" }
            if ([int]$preset.backend_dispatches_during_resize -ne 0) { throw "$($preset.preset) dispatched during resize" }
            if ([int]$preset.backend_commits_move_release -ne 1) { throw "$($preset.preset) move release commits != 1" }
            if ([int]$preset.backend_commits_resize_release -ne 1) { throw "$($preset.preset) resize release commits != 1" }
          }
          $continuous = Get-Content "itemslot-perf-evidence/continuous/continuous-result.json" -Raw | ConvertFrom-Json
          if (-not [bool]$continuous.pass) { throw "Continuous frozen gate failed" }
          if (-not [bool]$continuous.children_relative_alignment_preserved) { throw "Child alignment changed" }
          if (-not [bool]$continuous.save_reopen_preserved) { throw "Save/reopen did not preserve ItemSlot" }
          Write-Host "MOVE_MEDIAN_MAX_MS=$($perf.aggregate.move_median_max_ms)"
          Write-Host "MOVE_P95_MAX_MS=$($perf.aggregate.move_p95_max_ms)"
          Write-Host "RESIZE_MEDIAN_MAX_MS=$($perf.aggregate.resize_median_max_ms)"
          Write-Host "RESIZE_P95_MAX_MS=$($perf.aggregate.resize_p95_max_ms)"
          Write-Host "BACKEND_DISPATCH_DURING_MOVE=$($perf.aggregate.backend_dispatches_during_move)"
          Write-Host "BACKEND_DISPATCH_DURING_RESIZE=$($perf.aggregate.backend_dispatches_during_resize)"
          Write-Host "FROZEN_WINDOWS_ITEMSLOT_INTERACTION=PASS"
          Write-Host "SAVE_REOPEN=PASS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g2-item-slot-interaction-performance-${{ github.run_id }}
          path: itemslot-perf-evidence/**
          if-no-files-found: warn
          retention-days: 30
