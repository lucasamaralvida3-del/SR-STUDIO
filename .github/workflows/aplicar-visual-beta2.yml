name: Integrar Visual SR Studio 5.0 Beta 2

on:
  push:
    branches:
      - next/5.0
    paths:
      - '.github/workflows/aplicar-visual-beta2.yml'

permissions:
  contents: write

jobs:
  integrar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: next/5.0
          fetch-depth: 0

      - name: Preparar dependências
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check "openpyxl>=3.1.2" "Pillow>=10.0.0" "pypdf>=4.0.0" "tkinterdnd2>=0.4.2" "numpy>=1.26,<3" "opencv-python-headless>=4.9.0"

      - name: Aplicar patch visual no aplicativo principal
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python build/apply_visual_beta2.py
          if(-not (Select-String -LiteralPath 'src/sr_studio/SR_Studio_Gerador.py' -SimpleMatch '_install_studio5_visual(App)')){ throw 'Patch visual não foi ligado ao App' }

      - name: Validar código visual e núcleo
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m py_compile src/sr_studio/ui/studio5_visual.py src/sr_studio/SR_Studio_Gerador.py build/apply_visual_beta2.py tests/test_v5_visual.py
          node --check src/sr_studio/Encartes12_visual.js
          python -m unittest tests.test_v5_visual -v
          python -m unittest tests.test_foundation -v
          python -m unittest tests.test_v5_services -v
          $env:PYTHONPATH=(Resolve-Path 'src/sr_studio').Path
          python -c "import SR_Studio_Gerador as app; assert getattr(app.App,'_SR5_VISUAL_INSTALLED',False); print('VISUAL_APP_OK')"

      - name: Validar arquivos do Encartes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $index=Get-Content -Raw 'src/sr_studio/Encartes3_index.html'
          if(-not $index.Contains('Encartes12_visual.css')){ throw 'CSS visual não carregado' }
          if(-not $index.Contains('Encartes12_visual.js')){ throw 'JS visual não carregado' }
          $css=Get-Content -Raw 'src/sr_studio/Encartes12_visual.css'
          if(-not $css.Contains('.sr5-rail')){ throw 'Trilho visual do editor ausente' }

      - name: Commitar integração visual
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'SR Studio Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/sr_studio/SR_Studio_Gerador.py
          if(-not (git diff --cached --quiet)){
            git commit -m 'Ativa nova interface visual do SR Studio 5.0 Beta 2'
            git push origin HEAD:next/5.0
          }
