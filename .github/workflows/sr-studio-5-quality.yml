name: SR Studio 5 Quality

on:
  push:
    branches: [sr-studio-5-professional]
  pull_request:
    paths:
      - 'src/srstudio/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/sr-studio-5-quality.yml'

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Ruff
        run: ruff check src tests
      - name: Tests
        run: pytest -q
