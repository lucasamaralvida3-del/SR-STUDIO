name: G2 ItemSlot QML Patch Runner

on:
  pull_request:
    branches:
      - g2/tmp-itemslot-perf-patch-base

permissions:
  contents: write

jobs:
  patch-itemslot-stable-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g2/fix-item-slot-interaction-performance
          fetch-depth: 0
      - name: Apply stable ItemSlot resize overlay contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/srstudio/graphics2/qml/GraphicsEditor.qml')
          t=p.read_text(encoding='utf-8')
          handler='id: manualItemSlotResizeHandler'
          if t.count(handler)!=1: raise SystemExit(f'handler count={t.count(handler)}')
          pos=t.index(handler); start=t.rfind('DragHandler {',0,pos)
          if start<0: raise SystemExit('DragHandler start missing')
          start=t.rfind('\n',0,start)+1; brace=t.index('{',start)
          depth=0; quote=None; esc=False; end=None
          for i in range(brace,len(t)):
              c=t[i]
              if quote:
                  if esc: esc=False
                  elif c=='\\': esc=True
                  elif c==quote: quote=None
                  continue
              if c in ('"',"'"): quote=c
              elif c=='{': depth+=1
              elif c=='}':
                  depth-=1
                  if depth==0: end=i+1; break
          if end is None: raise SystemExit('DragHandler end missing')
          while end<len(t) and t[end] in ' \t': end+=1
          if end<len(t) and t[end]=='\n': end+=1
          t=t[:start]+t[end:]
          disabled='                                                enabled: !slotOverlay.isManualItemSlot\n'
          if t.count(disabled)!=1: raise SystemExit(f'disable count={t.count(disabled)}')
          t=t.replace(disabled,'',1)
          anchor='                                    property bool isManualItemSlot: !!(modelData.metadata && modelData.metadata.manual_item_slot)\n'
          if t.count(anchor)!=1: raise SystemExit(f'anchor count={t.count(anchor)}')
          t=t.replace(anchor,anchor+'                                    // Keep the pressed resize MouseArea in stable geometry while preview_bounds drives only visuals.\n'+'                                    property bool resizePreviewKeepsInteractionGeometry: previewActive && isManualItemSlot && window.itemSlotInteractionKind === "resize"\n'+'                                    property var interactionBounds: resizePreviewKeepsInteractionGeometry ? bounds : displayBounds\n',1)
          old='                                    x: displayBounds.x * zoom\n                                    y: displayBounds.y * zoom\n                                    width: displayBounds.width * zoom\n                                    height: displayBounds.height * zoom\n'
          new='                                    x: interactionBounds.x * zoom\n                                    y: interactionBounds.y * zoom\n                                    width: interactionBounds.width * zoom\n                                    height: interactionBounds.height * zoom\n'
          if t.count(old)!=1: raise SystemExit(f'geometry count={t.count(old)}')
          t=t.replace(old,new,1)
          old='''                                    Rectangle {
                                        anchors.fill: parent
                                        color: isDropTarget ? "#16A34A2A" : (isSelectedSlot ? "#0F5BD811" : (productDragActive ? "#0F5BD808" : "transparent"))
                                        border.width: isDropTarget ? 3 : (isSelectedSlot ? 2 : 1)
                                        border.color: isDropTarget ? "#16A34A" : (isSelectedSlot ? "#0F5BD8" : "#0F5BD855")
                                        radius: 4
                                    }
'''
          new='''                                    Rectangle {
                                        x: slotOverlay.resizePreviewKeepsInteractionGeometry ? (slotOverlay.displayBounds.x - slotOverlay.interactionBounds.x) * zoom : 0
                                        y: slotOverlay.resizePreviewKeepsInteractionGeometry ? (slotOverlay.displayBounds.y - slotOverlay.interactionBounds.y) * zoom : 0
                                        width: slotOverlay.resizePreviewKeepsInteractionGeometry ? Math.max(1, slotOverlay.displayBounds.width * zoom) : parent.width
                                        height: slotOverlay.resizePreviewKeepsInteractionGeometry ? Math.max(1, slotOverlay.displayBounds.height * zoom) : parent.height
                                        color: isDropTarget ? "#16A34A2A" : (isSelectedSlot ? "#0F5BD811" : (productDragActive ? "#0F5BD808" : "transparent"))
                                        border.width: isDropTarget ? 3 : (isSelectedSlot ? 2 : 1)
                                        border.color: isDropTarget ? "#16A34A" : (isSelectedSlot ? "#0F5BD8" : "#0F5BD855")
                                        radius: 4
                                    }
'''
          if t.count(old)!=1: raise SystemExit(f'frame count={t.count(old)}')
          t=t.replace(old,new,1)
          if 'manualItemSlotResizeHandler' in t: raise SystemExit('DragHandler still present')
          if t.count('resizePreviewKeepsInteractionGeometry')<5: raise SystemExit('stable contract incomplete')
          p.write_text(t,encoding='utf-8')
          PY
          git diff --check
      - name: Commit to performance branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/srstudio/graphics2/qml/GraphicsEditor.qml
          git commit -m 'fix(g2): keep ItemSlot resize interaction geometry stable'
          git push origin HEAD:g2/fix-item-slot-interaction-performance
