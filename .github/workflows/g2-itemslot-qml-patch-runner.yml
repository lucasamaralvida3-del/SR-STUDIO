name: G2 ItemSlot QML Patch Runner

on:
  pull_request:
    branches:
      - g2/tmp-itemslot-perf-patch-base

permissions:
  contents: write

jobs:
  restore-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g2/fix-item-slot-interaction-performance
          fetch-depth: 0
      - name: Restore Smart Slot tests from certified base and patch only assertions
        shell: bash
        run: |
          git checkout f60b65644b9adb0671b4a410aaf7849012ec635b -- \
            tests/test_graphics2_smart_slot_interaction_perf.py \
            tests/test_graphics2_smart_slot_detection_manual.py
          python - <<'PY'
          from pathlib import Path

          perf = Path('tests/test_graphics2_smart_slot_interaction_perf.py')
          text = perf.read_text(encoding='utf-8')
          old = '    assert block.count(\'"name":"adjust_smart_slot"\') == 1\n'
          new = '    assert \'isManualItemSlot ? "commit_item_slot_bounds" : "adjust_smart_slot"\' in block\n'
          if text.count(old) != 1:
              raise SystemExit(f'perf assertion: expected 1 match, got {text.count(old)}')
          perf.write_text(text.replace(old, new, 1), encoding='utf-8')

          detection = Path('tests/test_graphics2_smart_slot_detection_manual.py')
          text = detection.read_text(encoding='utf-8')
          old = '    assert \'"name":"adjust_smart_slot"\' in qml or \'"name": "adjust_smart_slot"\' in qml\n'
          new = '    assert \'isManualItemSlot ? "commit_item_slot_bounds" : "adjust_smart_slot"\' in qml\n'
          if text.count(old) != 1:
              raise SystemExit(f'detection assertion: expected 1 match, got {text.count(old)}')
          detection.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff --stat
      - name: Commit repaired tests to performance branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_graphics2_smart_slot_interaction_perf.py tests/test_graphics2_smart_slot_detection_manual.py
          git commit -m 'test(g2): update Smart Slot contract for shared release selector'
          git push origin HEAD:g2/fix-item-slot-interaction-performance
