name: SR Graphics Engine 2 Spacing Diagnostics

on:
  push:
    branches:
      - integration/sr-studio-next
    paths:
      - 'src/srstudio/graphics2/**'
      - 'tests/test_graphics2_*.py'
      - '.github/workflows/graphics-engine-2-spacing-diagnostics.yml'

permissions:
  contents: read

jobs:
  spacing-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install SR Studio + dev tools
        run: python -m pip install -U pip && python -m pip install -e '.[dev]'
      - name: Compile Graphics2
        run: python -m compileall -q src/srstudio/graphics2
      - name: Lint spacing integration
        run: python -m ruff check src/srstudio/graphics2/pptx_structure.py src/srstudio/graphics2/quality.py tests/test_graphics2_pptx_spacing_coverage.py tests/test_graphics2_quality_inspector_spacing.py
      - name: Exact spacing contracts
        run: python -m pytest -q tests/test_graphics2_pptx_spacing_coverage.py
      - name: Existing PPTX structure regression
        run: python -m pytest -q tests/test_graphics2_pptx_structure.py
      - name: Production Gate regression
        run: python -m pytest -q tests/test_graphics2_quality_gate.py
      - name: Quality Inspector spacing contract
        run: python -m pytest -q tests/test_graphics2_quality_inspector_spacing.py
      - name: Quality Inspector QML regression
        run: python -m pytest -q tests/test_graphics2_quality_inspector_qml.py
