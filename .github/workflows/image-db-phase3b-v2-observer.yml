name: Image DB Phase 3B V2 Observer

on:
  push:
    branches:
      - g2/parallel-image-database
    paths:
      - '.github/workflows/image-db-phase3b-v2-observer.yml'

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env:
      TARGET_SHA: e7c0d814b6770ffeff179c534bb1deead9041437
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for corrected Phase 3B V2 run and persist evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase3b-final-observer docs/parallel/phase3-evidence/phase3b-final-rerun
          run_id=''
          for attempt in $(seq 1 240); do
            row=$(gh run list --workflow image-db-phase3b-v2.yml --branch g2/parallel-image-database --commit "$TARGET_SHA" --limit 5 --json databaseId,status,conclusion,headSha,url,createdAt,updatedAt,workflowName --jq '.[0] // empty' || true)
            if [ -n "$row" ]; then
              printf '%s\n' "$row" > /tmp/phase3b-final-observer/run-list.json
              run_id=$(printf '%s\n' "$row" | jq -r '.databaseId')
              status=$(printf '%s\n' "$row" | jq -r '.status')
              echo "Observed corrected run $run_id status=$status target=$TARGET_SHA"
              if [ "$status" = completed ]; then break; fi
            fi
            sleep 30
          done
          if [ -z "$run_id" ]; then echo 'No corrected Phase 3B V2 run found.' >&2; exit 2; fi
          status=$(jq -r '.status' /tmp/phase3b-final-observer/run-list.json)
          if [ "$status" != completed ]; then echo 'Corrected Phase 3B V2 did not complete before timeout.' >&2; exit 3; fi
          gh run view "$run_id" --json databaseId,status,conclusion,headSha,headBranch,event,url,createdAt,updatedAt,workflowName,jobs > /tmp/phase3b-final-observer/run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" > /tmp/phase3b-final-observer/artifacts.json
          gh run download "$run_id" -n image-db-phase3b-v2-report -D /tmp/phase3b-final-observer/artifact || true
          cp /tmp/phase3b-final-observer/run.json docs/parallel/phase3-evidence/phase3b-final-rerun/run.json
          cp /tmp/phase3b-final-observer/artifacts.json docs/parallel/phase3-evidence/phase3b-final-rerun/artifacts.json
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          src=Path('/tmp/phase3b-final-observer/artifact'); dst=Path('docs/parallel/phase3-evidence/phase3b-final-rerun')
          wanted={
            'phase3b-summary.json','standalone-manifest.json','standalone-asset-verification.json','standalone-reference-gate.json',
            'phase3a-physical-restore.json','phase3a-before-equivalence.json','phase3b-idempotency.json','fresh-rebuild-equivalence.json',
            'top-missing-delta.json','new-auto-approved.json','important-product-lookups.json','standalone-ingest-report.json',
            'second-standalone-ingest-report.json','recovery-report.json','test-results.xml','pytest.log'
          }
          copied=[]
          if src.exists():
            for name in sorted(wanted):
              path=next(src.rglob(name),None)
              if path and path.is_file(): shutil.copy2(path,dst/name); copied.append(name)
            for rel,name in (
              ('before/coverage-catalog-520.json','coverage-before.json'),('after/coverage-catalog-520.json','coverage-after.json'),
              ('before/coverage-departments.json','departments-before.json'),('after/coverage-departments.json','departments-after.json'),
              ('after/library-audit.json','library-audit-after.json'),('after/performance.json','performance-after.json'),
              ('after/top-missing-100.csv','top-missing-100.csv'),('after/review/review-dataset.json','review-dataset.json'),
              ('after/review/review-contact-sheet.png','review-contact-sheet.png')):
              path=next(src.rglob(rel),None)
              if path and path.is_file(): shutil.copy2(path,dst/name); copied.append(name)
            sheet=next(src.rglob('new-auto-approved-contact-sheet.png'),None)
            if sheet and sheet.is_file(): shutil.copy2(sheet,dst/'new-auto-approved-contact-sheet.png'); copied.append('new-auto-approved-contact-sheet.png')
          run=json.loads((dst/'run.json').read_text(encoding='utf-8'))
          arts=json.loads((dst/'artifacts.json').read_text(encoding='utf-8'))
          (dst/'observer-result.json').write_text(json.dumps({'target_sha':os.environ['TARGET_SHA'],'run':run,'artifacts':arts.get('artifacts',[]),'copied_evidence':copied},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/parallel/phase3-evidence/phase3b-final-rerun
          git commit -m 'image-db: persist corrected Phase 3B final observer evidence [skip ci]' || exit 0
          for attempt in 1 2 3; do
            if git push origin HEAD:g2/parallel-image-database; then exit 0; fi
            git pull --rebase origin g2/parallel-image-database
          done
          exit 1
