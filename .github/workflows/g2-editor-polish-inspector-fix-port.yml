name: G2 Editor Polish Inspector Fix Port

on:
  push:
    branches:
      - g2/parallel-editor-polish-inspector-fix
    paths:
      - '.github/workflows/g2-editor-polish-inspector-fix-port.yml'

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 3e568f7717bb86978c58f50a5162fe44e27c4bd8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g2/parallel-editor-polish-inspector-fix
          fetch-depth: 0
      - name: Verify base ancestry
        run: |
          echo "HEAD_BEFORE=$(git rev-parse HEAD)"
          echo "BASE=$(git rev-parse $BASE_SHA)"
          test "$(git rev-parse $BASE_SHA)" = "$BASE_SHA"
          test "$(git merge-base HEAD $BASE_SHA)" = "$BASE_SHA"
      - name: Apply minimal authoritative-selection fix
        run: |
          python - <<'PY'
          from pathlib import Path

          inspector = Path('src/srstudio/graphics2/qml/ImageInspector.qml')
          text = inspector.read_text(encoding='utf-8')
          old = '    visible: bridgeHasImageSelection\n'
          new = '    visible: hasImageSelection\n'
          if text.count(old) != 1:
              raise SystemExit(f'ImageInspector visible anchor mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)

          old_block = '''    readonly property bool bridgeHasImageSelection: {\n        try {\n            var parsedScene = JSON.parse(sceneBridge.sceneJson)\n            return selectedImage(parsedScene) !== null\n        } catch (error) {\n            return false\n        }\n    }\n'''
          if text.count(old_block) != 1:
              raise SystemExit(f'bridgeHasImageSelection block mismatch: {text.count(old_block)}')
          text = text.replace(old_block, '', 1)

          old_connections = '''    Connections {\n        target: sceneBridge\n        function onSceneChanged() { panel.refresh() }\n    }\n'''
          new_connections = '''    Connections {\n        target: sceneBridge\n        ignoreUnknownSignals: true\n        function onSceneChanged() { panel.refresh() }\n        function onSelectionChanged() { panel.refresh() }\n    }\n'''
          if text.count(old_connections) != 1:
              raise SystemExit(f'Connections block mismatch: {text.count(old_connections)}')
          text = text.replace(old_connections, new_connections, 1)
          inspector.write_text(text, encoding='utf-8')

          host = Path('src/srstudio/graphics2/qt_host.py')
          text = host.read_text(encoding='utf-8')

          old_signals = '''    class SceneBridge(QObject):\n        sceneChanged = Signal()\n        statusChanged = Signal()\n'''
          new_signals = '''    class SceneBridge(QObject):\n        sceneChanged = Signal()\n        selectionChanged = Signal()\n        statusChanged = Signal()\n'''
          if text.count(old_signals) != 1:
              raise SystemExit(f'SceneBridge signal block mismatch: {text.count(old_signals)}')
          text = text.replace(old_signals, new_signals, 1)

          old_busy = '''        @Property(bool, notify=statusChanged)\n        def busy(self) -> bool:\n            return self._busy\n\n        def _run(self, command: dict) -> None:\n            result = router.dispatch(command)\n'''
          new_busy = '''        @Property(bool, notify=statusChanged)\n        def busy(self) -> bool:\n            return self._busy\n\n        def _selection_state(self) -> tuple[tuple[str, ...], str, str]:\n            return (\n                tuple(sorted(session.selection)),\n                str(session.anchor_id or ""),\n                str(session.document.active_page_id or ""),\n            )\n\n        def _emit_selection_changed_if_needed(self, before: tuple[tuple[str, ...], str, str]) -> None:\n            if self._selection_state() != before:\n                self.selectionChanged.emit()\n\n        def _run(self, command: dict) -> None:\n            selection_before = self._selection_state()\n            result = router.dispatch(command)\n'''
          if text.count(old_busy) != 1:
              raise SystemExit(f'_run anchor mismatch: {text.count(old_busy)}')
          text = text.replace(old_busy, new_busy, 1)

          old_run_end = '''            self.statusChanged.emit()\n            self.sceneChanged.emit()\n\n        def set_status(self, text: str) -> None:\n'''
          new_run_end = '''            self.statusChanged.emit()\n            self._emit_selection_changed_if_needed(selection_before)\n            self.sceneChanged.emit()\n\n        def set_status(self, text: str) -> None:\n'''
          if text.count(old_run_end) != 1:
              raise SystemExit(f'_run end mismatch: {text.count(old_run_end)}')
          text = text.replace(old_run_end, new_run_end, 1)

          old_dispatch = '''        @Slot(str, result=str)\n        def dispatch(self, payload: str) -> str:\n            result_raw = router.dispatch_json(payload)\n'''
          new_dispatch = '''        @Slot(str, result=str)\n        def dispatch(self, payload: str) -> str:\n            selection_before = self._selection_state()\n            result_raw = router.dispatch_json(payload)\n'''
          if text.count(old_dispatch) != 1:
              raise SystemExit(f'dispatch anchor mismatch: {text.count(old_dispatch)}')
          text = text.replace(old_dispatch, new_dispatch, 1)

          old_dispatch_end = '''            self.statusChanged.emit()\n            self.sceneChanged.emit()\n            return result_raw\n'''
          new_dispatch_end = '''            self.statusChanged.emit()\n            self._emit_selection_changed_if_needed(selection_before)\n            self.sceneChanged.emit()\n            return result_raw\n'''
          if text.count(old_dispatch_end) != 1:
              raise SystemExit(f'dispatch end mismatch: {text.count(old_dispatch_end)}')
          text = text.replace(old_dispatch_end, new_dispatch_end, 1)

          host.write_text(text, encoding='utf-8')
          PY
      - name: Verify scope and invariants
        run: |
          git diff --check
          grep -q 'visible: hasImageSelection' src/srstudio/graphics2/qml/ImageInspector.qml
          ! grep -q 'bridgeHasImageSelection' src/srstudio/graphics2/qml/ImageInspector.qml
          grep -q 'function onSelectionChanged() { panel.refresh() }' src/srstudio/graphics2/qml/ImageInspector.qml
          grep -q 'selectionChanged = Signal()' src/srstudio/graphics2/qt_host.py
          grep -q 'self.selectionChanged.emit()' src/srstudio/graphics2/qt_host.py
          git diff -- src/srstudio/graphics2/qml/ImageInspector.qml src/srstudio/graphics2/qt_host.py
      - name: Commit product fix
        run: |
          git config user.name "g2-editor-polish-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/srstudio/graphics2/qml/ImageInspector.qml src/srstudio/graphics2/qt_host.py
          git commit -m "fix(g2): synchronize Image Inspector from selection signal"
      - name: Remove temporary helper and push clean candidate
        run: |
          git rm .github/workflows/g2-editor-polish-inspector-fix-port.yml
          git commit -m "chore(g2): remove Inspector fix helper"
          git push origin HEAD:g2/parallel-editor-polish-inspector-fix
