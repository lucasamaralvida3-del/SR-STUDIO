name: G2 ItemSlot Final Applicator Runner

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches:
      - g2/tmp-itemslot-stable-resize-runner-v2

permissions:
  contents: write

jobs:
  apply-final-itemslot-gate:
    if: github.event.pull_request.head.ref == 'g2/fix-item-slot-interaction-performance' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g2/fix-item-slot-interaction-performance
          fetch-depth: 2

      - name: Execute the guarded applicator already staged on the head
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/g2-item-slot-interaction-performance.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          marker = '        run: |'
          positions = [i for i, line in enumerate(lines) if line == marker]
          if len(positions) != 1:
              raise SystemExit(f'expected one applicator run block, got {len(positions)}')
          body = []
          for line in lines[positions[0] + 1:]:
              if line.startswith('          '):
                  body.append(line[10:])
              elif not line.strip():
                  body.append('')
              else:
                  break
          if not body or "git commit -m 'fix(g2): finalize stable ItemSlot preview certification path'" not in '\n'.join(body):
              raise SystemExit('guarded final applicator body not found')
          Path('/tmp/apply-final-itemslot.sh').write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY
          bash /tmp/apply-final-itemslot.sh
