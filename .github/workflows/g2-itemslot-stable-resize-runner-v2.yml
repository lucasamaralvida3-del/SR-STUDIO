name: G2 ItemSlot Direct Stable MouseArea Runner

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches:
      - g2/tmp-itemslot-stable-resize-runner-v2

permissions:
  contents: write

jobs:
  patch-direct-stable-mousearea:
    if: github.event.pull_request.head.ref == 'g2/fix-item-slot-interaction-performance' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g2/fix-item-slot-interaction-performance
          fetch-depth: 0

      - name: Make stable resize delegate the MouseArea itself
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/srstudio/graphics2/qml/GraphicsEditor.qml')
          text = path.read_text(encoding='utf-8')
          if 'manualItemSlotResizeHandler' in text:
              raise SystemExit('experimental DragHandler remains')
          marker = 'objectName: "smartSlotHandle-" + String(modelData.dir) + "-" + String(slotOverlay.modelData.id || "")'
          pos = text.index(marker)
          start = text.rfind('                                        delegate: Rectangle {', 0, pos)
          if start < 0:
              if '                                        delegate: MouseArea {' in text[max(0, pos-500):pos]:
                  raise SystemExit(0)
              raise SystemExit('ItemSlot resize delegate start not found')

          def matching_brace(source: str, block_start: int) -> int:
              opening = source.index('{', block_start)
              depth = 0
              quote = None
              escape = False
              for i in range(opening, len(source)):
                  ch = source[i]
                  if quote:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                      continue
                  if ch in ('"', "'"):
                      quote = ch
                      continue
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return i
              raise RuntimeError('unbalanced QML braces')

          end = matching_brace(text, start)
          block = text[start:end + 1]
          nested_marker = '                                            MouseArea {\n                                                id: slotResizeArea\n'
          nested_start = block.index(nested_marker)
          nested_end = matching_brace(block, nested_start)
          nested = block[nested_start:nested_end + 1]
          open_brace = nested.index('{')
          body = nested[open_brace + 1:-1]
          remove_lines = [
              '                                                id: slotResizeArea\n',
              '                                                objectName: "smartSlotResizeArea-" + String(modelData.dir) + "-" + String(slotOverlay.modelData.id || "")\n',
              '                                                anchors.fill: parent\n',
              '                                                cursorShape: modelData.cursor\n',
              '                                                preventStealing: true\n',
          ]
          for line in remove_lines:
              if line not in body:
                  raise SystemExit(f'nested MouseArea contract missing: {line.strip()}')
              body = body.replace(line, '', 1)
          body = ''.join(line[4:] if line.startswith('    ') else line for line in body.splitlines(keepends=True))

          prefix = block[:nested_start]
          prefix = prefix.replace('                                        delegate: Rectangle {', '                                        delegate: MouseArea {', 1)
          prefix = prefix.replace(marker, 'objectName: "smartSlotResizeArea-" + String(modelData.dir) + "-" + String(slotOverlay.modelData.id || "")', 1)
          for obsolete in [
              '                                            radius: 2\n',
              '                                            color: "transparent"\n',
              '                                            border.width: 0\n',
          ]:
              prefix = prefix.replace(obsolete, '', 1)
          z_line = '                                            z: 10\n'
          addition = '''                                            acceptedButtons: Qt.LeftButton
                                            cursorShape: modelData.cursor
                                            preventStealing: true
                                            Item {
                                                objectName: "smartSlotHandle-" + String(modelData.dir) + "-" + String(slotOverlay.modelData.id || "")
                                                anchors.fill: parent
                                            }
'''
          if z_line not in prefix:
              raise SystemExit('stable resize z anchor missing')
          prefix = prefix.replace(z_line, z_line + addition, 1)
          suffix = block[nested_end + 1:]
          replacement = prefix + body + suffix
          text = text[:start] + replacement + text[end + 1:]

          region_start = text.index('model: slots()')
          region_end = text.index('id: selectionOverlay')
          region = text[region_start:region_end]
          required = [
              'delegate: MouseArea {',
              'objectName: "smartSlotResizeArea-"',
              'objectName: "smartSlotHandle-"',
              'objectName: "smartSlotVisualHandle-"',
              'preventStealing: true',
              'onPressed: {',
              'onPositionChanged: {',
              'onReleased: {',
          ]
          for token in required:
              if token not in region:
                  raise SystemExit(f'direct stable MouseArea token missing: {token}')
          if 'id: slotResizeArea' in region:
              raise SystemExit('nested resize MouseArea remains')
          if 'DragHandler {' in region:
              raise SystemExit('experimental DragHandler remains')
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/srstudio/graphics2/qml/GraphicsEditor.qml
          if git diff --cached --quiet; then
            echo 'Direct stable MouseArea already present'
          else
            git commit -m 'fix(g2): make stable ItemSlot handle own mouse grab directly'
            git push origin HEAD:g2/fix-item-slot-interaction-performance
          fi
