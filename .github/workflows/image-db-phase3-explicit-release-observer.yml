name: Image DB Phase 3 Explicit Release Observer

on:
  push:
    branches:
      - g2/parallel-image-database
    paths:
      - '.github/workflows/image-db-phase3-explicit-release-observer.yml'

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env:
      TARGET_SHA: 7a18ca2586c1fbbe5584761054337785d9de5ac3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for exact Phase 3A run and persist evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase3-explicit docs/parallel/phase3-evidence/explicit-release
          run_id=''
          for attempt in $(seq 1 240); do
            row=$(gh run list --workflow image-db-phase3.yml --branch g2/parallel-image-database --commit "$TARGET_SHA" --limit 5 --json databaseId,status,conclusion,headSha,url,createdAt,updatedAt,workflowName --jq '.[0] // empty' || true)
            if [ -n "$row" ]; then
              printf '%s\n' "$row" > /tmp/phase3-explicit/run.json
              run_id=$(printf '%s\n' "$row" | jq -r '.databaseId')
              status=$(printf '%s\n' "$row" | jq -r '.status')
              echo "Observed run $run_id status=$status target=$TARGET_SHA"
              if [ "$status" = completed ]; then break; fi
            else
              echo "No exact Phase 3A run visible for $TARGET_SHA yet (attempt $attempt)"
            fi
            sleep 30
          done
          if [ -z "$run_id" ]; then echo 'No exact Phase 3A run found.' >&2; exit 2; fi
          status=$(jq -r '.status' /tmp/phase3-explicit/run.json)
          if [ "$status" != completed ]; then echo 'Phase 3A run did not complete before observer timeout.' >&2; exit 3; fi

          gh run view "$run_id" --json databaseId,status,conclusion,headSha,headBranch,event,url,createdAt,updatedAt,workflowName,jobs > /tmp/phase3-explicit/run-view.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" > /tmp/phase3-explicit/artifacts.json
          gh run download "$run_id" -n image-db-phase3-report -D /tmp/phase3-explicit/artifact || true

          cp /tmp/phase3-explicit/run-view.json docs/parallel/phase3-evidence/explicit-release/run.json
          cp /tmp/phase3-explicit/artifacts.json docs/parallel/phase3-evidence/explicit-release/artifacts.json
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          source=Path('/tmp/phase3-explicit/artifact')
          target=Path('docs/parallel/phase3-evidence/explicit-release')
          wanted={
            'phase3-summary.json','release-api-response.json','release-assets.json','corpus-availability.json','corpus-download-verification.json','corpus-download.log','catalog-source-validation.json','standalone-phase.json','standalone-deferred.txt','corpus-inventory-gate.json','ingest-report.json','persistence-report.json','before-second.json','second-ingest-report.json','idempotency-report.json','recovery-report.json','library-audit.json','coverage-catalog-520.json','coverage-departments.json','structured-corpus-coverage.json','product-priority.json','top-missing-100.csv','find-image-results.json','performance.json','memory.json','operational-analysis-gates.json','review-files.txt','test-results.xml','pytest.log','environment.txt'
          }
          copied=[]
          if source.exists():
              for name in sorted(wanted):
                  path=next(source.rglob(name),None)
                  if path and path.is_file(): shutil.copy2(path,target/name); copied.append(name)
              review=next((p for p in source.rglob('review') if p.is_dir()),None)
              if review:
                  dst=target/'review'
                  if dst.exists(): shutil.rmtree(dst)
                  shutil.copytree(review,dst); copied.append('review/')
          run=json.loads(Path('/tmp/phase3-explicit/run-view.json').read_text(encoding='utf-8'))
          artifacts=json.loads(Path('/tmp/phase3-explicit/artifacts.json').read_text(encoding='utf-8'))
          summary=json.loads((target/'phase3-summary.json').read_text(encoding='utf-8')) if (target/'phase3-summary.json').is_file() else {}
          payload={'target_sha':os.environ['TARGET_SHA'],'run':run,'artifacts':artifacts.get('artifacts',[]),'phase3_status':summary.get('status','UNKNOWN'),'copied_evidence':copied}
          (target/'observer-result.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/parallel/phase3-evidence/explicit-release
          git commit -m 'image-db: persist Phase 3A explicit Release evidence [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:g2/parallel-image-database; then exit 0; fi
            git pull --rebase origin g2/parallel-image-database
          done
          exit 1