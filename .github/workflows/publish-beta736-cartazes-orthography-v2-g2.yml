name: Publish SR Studio 5 Beta 7.36 Cartazes Orthography V2 G2

on:
  workflow_dispatch:
  push:
    branches:
      - integration/sr-studio-next
    paths:
      - 'release/BETA736_CARTAZES_ORTHOGRAPHY_V2_G2'

permissions:
  contents: write

jobs:
  publish-beta:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install and validate full source
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install -e . pyinstaller pytest ruff
          python -m compileall -q src build
          ruff check src build tests --select E9,F63,F7,F82
          pytest -q
          python -c "from srstudio import __distribution_version__, __release_label__; assert __distribution_version__ == '5.0.0-hybrid.beta7.36'; assert __release_label__ == 'Beta 7.36 Professional'; print(__release_label__)"
          python -c "from srstudio.posters.orthography import PosterOrthographyCorrector as C; c=C(); assert c.MODE == 'aggressive_offline_v2'; assert c.correct('refrgerante') == 'REFRIGERANTE'; assert c.correct('margairna') == 'MARGARINA'; assert c.correct('refri gerante') == 'REFRIGERANTE'; assert c.correct('leitecondensado triangulo 395g') == 'LEITE CONDENSADO TRIÂNGULO 395G'; assert c.correct('COCA COLA 2L') == 'COCA COLA 2L'; print('Aggressive orthography gate OK')"
          python -c "from srstudio.core.models import Product; p=Product(original_name='refrgerante coca cola 2l', source='promotion_workbook'); assert p.original_name == 'refrgerante coca cola 2l'; assert p.name == 'REFRIGERANTE COCA COLA 2L'; assert p.metadata['orthography_mode'] == 'aggressive_offline_v2'; assert p.metadata['orthography_changed'] is True; print('Import-time orthography gate OK')"
          python -c "from srstudio.graphics2 import ENGINE_VERSION; assert ENGINE_VERSION.startswith('2.0.0-alpha.'); print('Graphics2', ENGINE_VERSION)"

      - name: Build SR Studio 5 Professional
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name "SR Studio 5" --collect-all pypdfium2 --collect-all pypdfium2_raw --icon "src/srstudio/assets/brand/SR_Studio.ico" --add-data "src/srstudio/assets/brand;srstudio/assets/brand" --add-data "src/srstudio/assets/poster_templates;srstudio/assets/poster_templates" --paths src src/srstudio/app/turbo_posters.py
          if (!(Test-Path "dist/SR Studio 5/SR Studio 5.exe")) { throw "Executavel Professional nao foi gerado." }
          $pdfium = Get-ChildItem "dist/SR Studio 5" -Recurse -File -Filter "pdfium.dll" | Select-Object -First 1
          if ($null -eq $pdfium) { throw "PDFium nativo ausente do executavel principal." }
          $analysis = "build/SR Studio 5/Analysis-00.toc"
          if (!(Test-Path $analysis)) { throw "Analise PyInstaller ausente." }
          if (!(Select-String -LiteralPath $analysis -Pattern "srstudio.posters.orthography" -Quiet)) { throw "Corretor ortografico nao entrou no frozen app." }

      - name: Install Graphics2 frozen host toolchain
        shell: pwsh
        run: |
          python -m pip install -e '.[graphics2-build]'
          python -c "import PyInstaller, PySide6; print('PyInstaller', PyInstaller.__version__, 'PySide6', PySide6.__version__)"
          python -m pytest -q tests -k graphics2

      - name: Build path-safe Graphics2 Qt host
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $hostRoot = Join-Path $env:RUNNER_TEMP 'g2host'
          python build/build_graphics2_host.py --output "$hostRoot"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao construir Graphics2Host." }
          $hostSource = Join-Path $hostRoot 'SRGraphicsEngine2Host'
          $hostTarget = 'dist/SR Studio 5/Graphics2Host'
          if (!(Test-Path $hostSource)) { throw "Bundle Graphics2Host nao foi gerado." }
          New-Item -ItemType Directory -Force -Path $hostTarget | Out-Null
          Copy-Item "$hostSource\*" $hostTarget -Recurse -Force
          if (!(Test-Path "$hostTarget/SRGraphicsEngine2Host.exe")) { throw "Host Qt nao foi incorporado ao SR Studio." }
          if (Get-ChildItem $hostTarget -Recurse -Directory | Where-Object { $_.Name -like 'objects-Debug*' -or $_.Name -like 'objects-RelWithDebInfo*' -or $_.Name -like 'objects-Release*' -or $_.Name -like 'objects-MinSizeRel*' }) {
            throw "Residuos objects-* do Qt ainda existem no host de producao."
          }
          python -m srstudio.graphics2.host_runtime "$hostTarget" --full
          if ($LASTEXITCODE -ne 0) { throw "Catalogo do runtime Graphics2 invalido." }
          $probe = Start-Process -FilePath (Resolve-Path "$hostTarget/SRGraphicsEngine2Host.exe") -ArgumentList @('--graphics-api','software','--probe-graphics-api') -Wait -PassThru
          if ($probe.ExitCode -ne 0) { throw "Probe do Graphics2Host falhou: $($probe.ExitCode)" }

      - name: Read release metadata
        shell: pwsh
        run: |
          $version = python -c "from srstudio import __version__; print(__version__)"
          $label = python -c "from srstudio import __release_label__; print(__release_label__)"
          $distribution = python -c "from srstudio import __distribution_version__; print(__distribution_version__)"
          $productVersion = ($version.Trim() -split '-')[0]
          $fileSafe = ($distribution.Trim() -replace '[^A-Za-z0-9._-]', '_') -replace '\.', '_'
          "PRODUCT_VERSION=$productVersion" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_LABEL=$($label.Trim())" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DIST_VERSION=$($distribution.Trim())" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "BETA_TAG=v$($distribution.Trim())" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "BETA_FILE=SR_STUDIO_${fileSafe}_PROFESSIONAL.zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Assemble path-safe G2 bundle
        shell: pwsh
        run: |
          $bundleRoot = 'release/beta736-bundle'
          $filesRoot = Join-Path $bundleRoot 'files'
          $appRoot = Join-Path $filesRoot 'SRStudio5'
          Remove-Item $bundleRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $appRoot | Out-Null
          Copy-Item 'dist/SR Studio 5/*' $appRoot -Recurse -Force

          "SR Studio $env:PRODUCT_VERSION - $env:RELEASE_LABEL - Graphics2 + Cartazes Orthography V2" | Set-Content -LiteralPath (Join-Path $filesRoot 'VERSAO.txt') -Encoding UTF8
          @{
            version = $env:DIST_VERSION
            product_version = $env:PRODUCT_VERSION
            channel = 'beta'
            release_label = $env:RELEASE_LABEL
            entrypoint = 'SRStudio5/SR Studio 5.exe'
            professional_executable = 'SRStudio5/SR Studio 5.exe'
            graphics2_host = 'SRStudio5/Graphics2Host/SRGraphicsEngine2Host.exe'
            graphics2_test = $true
            graphics2_primary = $true
            legacy_encartes_fallback = $true
            launcher_path_safe = $true
            cartazes_orthography = $true
            orthography_mode = 'aggressive_offline_v2'
            orthography_at_import = $true
            source_commit = $env:GITHUB_SHA
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $filesRoot 'version.json') -Encoding UTF8

          $zip = Join-Path 'release' $env:BETA_FILE
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path $filesRoot -DestinationPath $zip -CompressionLevel Optimal
          if (!(Test-Path $zip)) { throw "Bundle Beta 7.36 nao foi criado." }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $zip).Length
          if ($size -lt 200MB) { throw "Bundle Beta 7.36 pequeno demais para conter Graphics2: $size bytes." }
          "BETA_ZIP=$zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "BETA_SHA256=$hash" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "BETA_SIZE=$size" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Bundle: $zip | $size bytes | $hash"

      - name: Validate Windows extraction and release contract
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $env:BETA_ZIP))
          try {
            $entries = @($archive.Entries | Where-Object { $_.FullName -and -not $_.FullName.EndsWith('/') })
            $versao = $entries | Where-Object { $_.FullName.Replace('\','/') -eq 'files/VERSAO.txt' } | Select-Object -First 1
            $versionJsonEntry = $entries | Where-Object { $_.FullName.Replace('\','/') -eq 'files/version.json' } | Select-Object -First 1
            if ($null -eq $versao) { throw 'VERSAO.txt ausente do ZIP final.' }
            if ($null -eq $versionJsonEntry) { throw 'version.json ausente do ZIP final.' }
            $longest = $entries | Sort-Object { $_.FullName.Length } -Descending | Select-Object -First 1
            Write-Host "Maior entrada ZIP: $($longest.FullName.Length) chars | $($longest.FullName)"
            if ($longest.FullName.Length -gt 160) { throw "ZIP possui caminho interno longo demais para o Launcher: $($longest.FullName.Length)" }
          } finally {
            $archive.Dispose()
          }

          $validationRoot = Join-Path $env:RUNNER_TEMP 'SRStudio\Staging\bundle_beta736_cartazes_orthography_v2_g2\extra_padding_1234567890\extracted'
          Remove-Item (Split-Path $validationRoot -Parent) -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $env:BETA_ZIP -DestinationPath $validationRoot -Force
          if (!(Test-Path "$validationRoot/files/VERSAO.txt")) { throw 'Emulacao do Launcher nao extraiu VERSAO.txt.' }
          if (!(Test-Path "$validationRoot/files/version.json")) { throw 'Emulacao do Launcher nao extraiu version.json.' }
          if (!(Test-Path "$validationRoot/files/SRStudio5/SR Studio 5.exe")) { throw 'Executavel principal ausente apos extracao longa.' }
          $hostExePath = "$validationRoot/files/SRStudio5/Graphics2Host/SRGraphicsEngine2Host.exe"
          if (!(Test-Path $hostExePath)) { throw 'Graphics2Host ausente apos extracao longa.' }
          $versionJson = Get-Content -Raw "$validationRoot/files/version.json" | ConvertFrom-Json
          if ([string]$versionJson.version -ne '5.0.0-hybrid.beta7.36') { throw 'Versao interna do bundle invalida.' }
          if ([string]$versionJson.entrypoint -ne 'SRStudio5/SR Studio 5.exe') { throw 'Entrypoint invalido.' }
          if (-not [bool]$versionJson.graphics2_primary) { throw 'Graphics2 nao foi marcado como principal.' }
          if (-not [bool]$versionJson.launcher_path_safe) { throw 'Bundle nao foi marcado path-safe.' }
          if (-not [bool]$versionJson.cartazes_orthography) { throw 'Corretor ortografico nao foi marcado no contrato do bundle.' }
          if ([string]$versionJson.orthography_mode -ne 'aggressive_offline_v2') { throw 'Modo do corretor ortografico invalido.' }
          if (-not [bool]$versionJson.orthography_at_import) { throw 'Correcao na importacao nao foi marcada no contrato.' }
          $probe = Start-Process -FilePath (Resolve-Path $hostExePath) -ArgumentList @('--graphics-api','software','--probe-graphics-api') -Wait -PassThru
          if ($probe.ExitCode -ne 0) { throw "Graphics2Host extraido falhou no probe: $($probe.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: SR_Studio_Beta_7_36_Graphics2_Cartazes_Orthography_V2
          path: ${{ env.BETA_ZIP }}
          if-no-files-found: error
          retention-days: 14

      - name: Create Beta 7.36 prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          SR Studio Beta 7.36 Professional - Graphics2 + Corretor Ortografico V2

          - Corrige o nome do produto assim que a planilha de Cartazes e importada, antes da fila, previa e PDF.
          - Mantem o texto bruto original da planilha para auditoria e usa o nome corrigido em display_name.
          - Corrige acentuacao, cedilha, letras faltando, sobrando, trocadas ou invertidas e erros comuns de digitacao.
          - Recupera palavras grudadas e palavras separadas incorretamente quando ha correspondencia segura no vocabulario de supermercado.
          - Preserva marcas protegidas, EANs, codigos, pesos, medidas e abreviacoes operacionais.
          - Promocoes, Atacado Excel e relatorio 782 recebem a correcao na importacao.
          - Studio de Encartes Graphics Engine 2 continua como experiencia principal e nao recebe esta alteracao automatica.
          - Mantem bundle path-safe para Windows e Launcher.
          - Stable permanece inalterada.
          "@
          if (gh release view $env:BETA_TAG *> $null) {
            gh release upload $env:BETA_TAG $env:BETA_ZIP --clobber
            gh release edit $env:BETA_TAG --prerelease --title "SR Studio $env:RELEASE_LABEL - Graphics2 + Cartazes Orthography V2" --notes $notes
          } else {
            gh release create $env:BETA_TAG $env:BETA_ZIP --target $env:GITHUB_SHA --prerelease --title "SR Studio $env:RELEASE_LABEL - Graphics2 + Cartazes Orthography V2" --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar prerelease Beta 7.36.' }

      - name: Checkout main for guarded Beta activation
        uses: actions/checkout@v4
        with:
          ref: main
          path: mainrepo

      - name: Activate Beta 7.36 only if no parallel release advanced
        shell: pwsh
        run: |
          $integrationHead = ((git ls-remote origin refs/heads/integration/sr-studio-next) -split "`t")[0].Trim()
          if ($integrationHead -ne $env:GITHUB_SHA) {
            throw "integration/sr-studio-next avancou durante o build ($integrationHead != $env:GITHUB_SHA). Release criada, mas canal Beta nao sera sobrescrito."
          }

          $manifestPath = 'mainrepo/beta/manifest.json'
          if (!(Test-Path $manifestPath)) { throw 'Manifesto Beta atual ausente.' }
          $current = Get-Content -Raw $manifestPath | ConvertFrom-Json
          if ([string]$current.version -ne '5.0.0-hybrid.beta7.35') {
            throw "Canal Beta avancou durante o build para $($current.version). Release 7.36 criada, mas nao sera ativada automaticamente."
          }
          if (-not [bool]$current.graphics2_primary) { throw 'Canal Beta anterior nao esta marcado como Graphics2 primary; abortando ativacao.' }
          $previousVersion = [string]$current.version
          $minLauncher = [string]$current.min_launcher_version
          if ([string]::IsNullOrWhiteSpace($minLauncher)) { $minLauncher = [string]$current.min_launcher }
          if ([string]::IsNullOrWhiteSpace($minLauncher)) { $minLauncher = '4.0.1-hybrid.base3.5' }

          $published = (Get-Date).ToString('o')
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:BETA_TAG/$env:BETA_FILE"
          $manifest = [ordered]@{
            format = 'SRSTUDIO_HYBRID_BUNDLE_1'
            product = 'SR Studio'
            channel = 'beta'
            version = $env:DIST_VERSION
            product_version = $env:PRODUCT_VERSION
            release_label = $env:RELEASE_LABEL
            published_at = $published
            min_launcher = $minLauncher
            min_launcher_version = $minLauncher
            bundle = [ordered]@{
              url = $url
              sha256 = $env:BETA_SHA256
              size = [int64]$env:BETA_SIZE
              member_prefix = 'files/'
            }
            url = $url
            bundle_url = $url
            sha256 = $env:BETA_SHA256
            size = [int64]$env:BETA_SIZE
            member_prefix = 'files/'
            previous_version = $previousVersion
            entrypoint = 'SRStudio5/SR Studio 5.exe'
            graphics2_test = $true
            graphics2_primary = $true
            launcher_path_safe = $true
            cartazes_orthography = $true
            orthography_mode = 'aggressive_offline_v2'
            orthography_at_import = $true
            source_commit = $env:GITHUB_SHA
            notes = 'Beta 7.36 Professional - Graphics2 preservado e corretor ortografico V2 aplicado na importacao dos Cartazes.'
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $manifestPath -Encoding UTF8

          Push-Location mainrepo
          git config user.name 'SR Studio Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main
          git add beta/manifest.json
          git commit -m 'release: activate SR Studio Beta 7.36 Graphics2 + Cartazes Orthography V2'
          git push origin HEAD:main
          Pop-Location

      - name: Publication summary
        shell: pwsh
        run: |
          Write-Host "Beta 7.36 Graphics2 + Cartazes Orthography V2 publicada e ativada."
          Write-Host "Tag: $env:BETA_TAG"
          Write-Host "SHA256: $env:BETA_SHA256"
          Write-Host "Size: $env:BETA_SIZE"
