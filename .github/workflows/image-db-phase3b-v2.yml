name: Image DB Phase 3B Standalone Validation V2

on:
  workflow_dispatch:
  push:
    branches:
      - g2/parallel-image-database
    paths:
      - '.github/workflows/image-db-phase3b-v2.yml'
      - 'scripts/ci/image_db_phase3b_restore.py'
      - 'scripts/ci/image_db_phase3b.py'
      - 'src/srstudio/images/**'
      - 'tests/test_image_*.py'
      - 'pyproject.toml'

permissions:
  contents: write
  actions: read

env:
  ARTIFACT_DIR: artifacts/image-db-phase3b-v2
  CORPUS_DIR: .phase3-corpus
  INC_LIBRARY: artifacts/phase3b-incremental-library
  INC_IMPORTS: artifacts/phase3b-incremental-imports
  FRESH_LIBRARY: artifacts/phase3b-fresh-library
  FRESH_IMPORTS: artifacts/phase3b-fresh-imports
  PYTHON_VERSION: '3.11'
  PHASE3A_RUN_ID: '32166973267'
  EXPECTED_STANDALONE_SIZE: '48848012'
  EXPECTED_STANDALONE_SHA256: '9c2f12d23aa827fa88124dcf82468daed42a05fb44df6ab8109e0b487dc384ff'

jobs:
  validate:
    name: Validate Image Database Phase 3B V2
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout tested SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Prepare evidence directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR" "$CORPUS_DIR" "$INC_LIBRARY" "$INC_IMPORTS" "$FRESH_LIBRARY" "$FRESH_IMPORTS"
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "ref=$GITHUB_REF"
            echo "sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "event=$GITHUB_EVENT_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "timestamp_utc=$(date -u +%FT%TZ)"
            echo "phase3a_run_id=$PHASE3A_RUN_ID"
            echo "phase3b_mode=persisted-phase3a-plus-standalone-incremental"
          } > "$ARTIFACT_DIR/environment.txt"
          git status --short --branch >> "$ARTIFACT_DIR/environment.txt"
          git log -10 --oneline >> "$ARTIFACT_DIR/environment.txt"
          echo "$GITHUB_SHA" > "$ARTIFACT_DIR/tested-sha.txt"
          df -h . > "$ARTIFACT_DIR/disk-before.txt"
          grep -E '^(MemTotal|MemAvailable):' /proc/meminfo > "$ARTIFACT_DIR/memory-baseline.txt"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install official project dependencies
        shell: bash
        run: |
          set +e
          python --version 2>&1 | tee -a "$ARTIFACT_DIR/environment.txt"
          python -m pip install --upgrade pip 2>&1 | tee "$ARTIFACT_DIR/pip-upgrade.log"
          python -m pip install -e '.[dev]' 2>&1 | tee "$ARTIFACT_DIR/install.log"
          install_rc=${PIPESTATUS[0]}
          sanity_rc=1
          if [ "$install_rc" -eq 0 ]; then
            python -m compileall -q src scripts/ci
            python - <<'PY'
          from srstudio.images.safe_library import SafeImageLibrary
          from srstudio.images.standalone_cli import run_incremental_standalone
          print('phase3b-v2-import-sanity=PASS')
          PY
            sanity_rc=$?
          fi
          if [ "$install_rc" -eq 0 ] && [ "$sanity_rc" -eq 0 ]; then
            echo 'ENVIRONMENT_PASS=true' >> "$GITHUB_ENV"
          else
            echo 'ENVIRONMENT_PASS=false' >> "$GITHUB_ENV"
          fi
          exit 0

      - name: Run Image DB tests
        if: env.ENVIRONMENT_PASS == 'true'
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_image_*.py --junitxml="$ARTIFACT_DIR/test-results.xml" 2>&1 | tee "$ARTIFACT_DIR/pytest.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 0 ]; then echo 'TESTS_PASS=true' >> "$GITHUB_ENV"; else echo 'TESTS_PASS=false' >> "$GITHUB_ENV"; fi
          exit 0

      - name: Restore approved Phase 3A persisted logical index
        if: env.ENVIRONMENT_PASS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          mkdir -p .phase3a-persisted artifacts/phase3a-persisted-index
          gh run download "$PHASE3A_RUN_ID" -n image-db-phase3a-report -D .phase3a-persisted > "$ARTIFACT_DIR/phase3a-artifact-download.log" 2>&1
          rc=$?
          index=$(find .phase3a-persisted -type f -name index.json | head -1)
          if [ "$rc" -eq 0 ] && [ -n "$index" ]; then
            cp "$index" artifacts/phase3a-persisted-index/index.json
            python scripts/ci/image_db_phase3b.py snapshot --library artifacts/phase3a-persisted-index --output "$ARTIFACT_DIR/phase3a-persisted-snapshot.json"
            echo 'PHASE3A_PERSISTED_INDEX_PASS=true' >> "$GITHUB_ENV"
            echo "PHASE3A_INDEX=$index" >> "$GITHUB_ENV"
          else
            echo 'PHASE3A_PERSISTED_INDEX_PASS=false' >> "$GITHUB_ENV"
          fi
          exit 0

      - name: Resolve exact Phase 3A rich corpus and catalog for physical restore and later fresh control
        if: env.ENVIRONMENT_PASS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python scripts/ci/image_db_phase3_corpus.py > "$ARTIFACT_DIR/phase3a-corpus-resolver.stdout.json" 2> "$ARTIFACT_DIR/phase3a-corpus-resolver.stderr.txt"
          echo "$?" > "$ARTIFACT_DIR/phase3a-corpus-resolver-exit-code.txt"
          exit 0

      - name: Confirm Phase 3A corpus/catalog resolver result
        if: env.ENVIRONMENT_PASS == 'true'
        shell: bash
        run: |
          set +e
          if [ "${RICH_CORPUS_AVAILABLE:-false}" = true ] && [ "${CATALOG_AVAILABLE:-false}" = true ] && [ -n "${PRODUCT_DB:-}" ]; then
            echo 'PHASE3A_CORPUS_PASS=true' >> "$GITHUB_ENV"
          else
            echo 'PHASE3A_CORPUS_PASS=false' >> "$GITHUB_ENV"
          fi
          exit 0

      - name: Resolve, download, verify and inventory standalone-images.zip
        if: env.ENVIRONMENT_PASS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python scripts/ci/image_db_phase3b.py inventory --artifact-dir "$ARTIFACT_DIR" --corpus-dir "$CORPUS_DIR" > "$ARTIFACT_DIR/standalone-inventory.stdout.txt" 2> "$ARTIFACT_DIR/standalone-inventory.stderr.txt"
          echo "$?" > "$ARTIFACT_DIR/standalone-inventory-exit-code.txt"
          exit 0

      - name: Require exact standalone reference SHA, size, ZIP integrity and 160 valid images
        if: env.ENVIRONMENT_PASS == 'true'
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json, os
          from pathlib import Path
          art=Path(os.environ['ARTIFACT_DIR'])
          ver=json.loads((art/'standalone-asset-verification.json').read_text(encoding='utf-8')) if (art/'standalone-asset-verification.json').is_file() else {}
          manifest=json.loads((art/'standalone-manifest.json').read_text(encoding='utf-8')) if (art/'standalone-manifest.json').is_file() else {}
          metrics=manifest.get('metrics',{})
          expected_size=int(os.environ['EXPECTED_STANDALONE_SIZE'])
          expected_sha=os.environ['EXPECTED_STANDALONE_SHA256']
          checks={
            'asset_found': ver.get('asset_found') is True,
            'asset_id_present': bool(ver.get('asset_id')),
            'download_complete': ver.get('download_complete') is True,
            'zip_integrity': ver.get('zip_integrity') is True,
            'size_exact_reference': int(ver.get('actual_size') or 0)==expected_size,
            'sha256_exact_reference': str(ver.get('sha256') or '').lower()==expected_sha,
            'verified': ver.get('verified') is True,
            'image_files_160': int(metrics.get('image_files') or -1)==160,
            'valid_images_160': int(metrics.get('valid_images') or -1)==160,
            'corrupt_images_zero': int(metrics.get('corrupt_images', -1))==0,
          }
          report={'expected_size':expected_size,'expected_sha256':expected_sha,'verification':ver,'manifest_metrics':metrics,'checks':checks,'pass':all(checks.values())}
          (art/'standalone-reference-gate.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8')
          raise SystemExit(0 if report['pass'] else 61)
          PY
          rc=$?
          if [ "$rc" -eq 0 ] && [ "${STANDALONE_AVAILABLE:-false}" = true ] && [ "${STANDALONE_CORPUS_VALIDATED:-false}" = true ]; then
            echo 'STANDALONE_ASSET_PASS=true' >> "$GITHUB_ENV"
          else
            echo 'STANDALONE_ASSET_PASS=false' >> "$GITHUB_ENV"
          fi
          exit 0

      - name: Phase 3B corpus gate
        shell: bash
        run: |
          set +e
          if [ "${ENVIRONMENT_PASS:-false}" = true ] && [ "${TESTS_PASS:-false}" = true ] && \
             [ "${PHASE3A_PERSISTED_INDEX_PASS:-false}" = true ] && [ "${PHASE3A_CORPUS_PASS:-false}" = true ] && \
             [ "${STANDALONE_ASSET_PASS:-false}" = true ]; then
            echo 'PHASE3B_CORPUS_GATE_PASS=true' >> "$GITHUB_ENV"
          else
            echo 'PHASE3B_CORPUS_GATE_PASS=false' >> "$GITHUB_ENV"
          fi
          exit 0

      - name: Materialize approved Phase 3A physical bank without reingesting the 36 PPTX
        if: env.PHASE3B_CORPUS_GATE_PASS == 'true'
        shell: bash
        run: |
          set +e
          python scripts/ci/image_db_phase3b_restore.py \
            --index-source "$PHASE3A_INDEX" \
            --library "$INC_LIBRARY" \
            --archive "$CORPUS_DIR/Downloads(1)(1).zip" \
            --archive "$CORPUS_DIR/Downloads(2)(1).zip" \
            --output "$ARTIFACT_DIR/phase3a-physical-restore.json" \
            > "$ARTIFACT_DIR/phase3a-physical-restore.stdout.txt" 2> "$ARTIFACT_DIR/phase3a-physical-restore.stderr.txt"
          rc=$?
          python scripts/ci/image_db_phase3b.py snapshot --library "$INC_LIBRARY" --output "$ARTIFACT_DIR/phase3a-materialized-snapshot.json"
          if [ "$rc" -eq 0 ]; then echo 'PHASE3A_MATERIALIZED_PASS=true' >> "$GITHUB_ENV"; else echo 'PHASE3A_MATERIALIZED_PASS=false' >> "$GITHUB_ENV"; fi
          exit 0

      - name: Validate exact Phase 3A BEFORE baseline without training replay
        if: env.PHASE3A_MATERIALIZED_PASS == 'true'
        shell: bash
        run: |
          set +e
          mkdir -p "$ARTIFACT_DIR/before"
          python scripts/ci/image_db_phase3_analysis.py \
            --library "$INC_LIBRARY" --product-db "$PRODUCT_DB" \
            --corpus-source "$CORPUS_DIR/Downloads(1)(1).zip" --corpus-source "$CORPUS_DIR/Downloads(2)(1).zip" \
            --artifact-dir "$ARTIFACT_DIR/before" --review-limit 100 \
            > "$ARTIFACT_DIR/before-analysis.stdout.txt" 2> "$ARTIFACT_DIR/before-analysis.stderr.txt"
          analysis_rc=$?
          python - <<'PY'
          import json, os
          from pathlib import Path
          art=Path(os.environ['ARTIFACT_DIR'])
          persisted=json.loads((art/'phase3a-persisted-snapshot.json').read_text())
          materialized=json.loads((art/'phase3a-materialized-snapshot.json').read_text())
          coverage=json.loads((art/'before/coverage-catalog-520.json').read_text())
          audit=json.loads((art/'before/library-audit.json').read_text())['metrics']
          checks={
            'logical_signature_equal': persisted['logical_signature_sha256']==materialized['logical_signature_sha256'],
            'canonical_1036': materialized['canonical']==1036,
            'physical_1036': materialized['physical']==1036,
            'auto_2': coverage.get('auto_approved')==2,
            'likely_42': coverage.get('likely')==42,
            'review_7': coverage.get('review_required')==7,
            'missing_469': coverage.get('missing')==469,
            'coverage_9_8077': coverage.get('any_candidate_coverage_percent')==9.8077,
            'audit_physical_1036': audit.get('physical_images')==1036,
            'audit_canonical_1036': audit.get('canonical_assets')==1036,
          }
          report={'method':'persisted Phase 3A index + physical byte materialization only; no rich-corpus training before standalone','checks':checks,'pass':all(checks.values())}
          (art/'phase3a-before-equivalence.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          raise SystemExit(0 if report['pass'] else 62)
          PY
          baseline_rc=$?
          if [ "$analysis_rc" -eq 0 ] && [ "$baseline_rc" -eq 0 ]; then echo 'PHASE3A_BEFORE_PASS=true' >> "$GITHUB_ENV"; else echo 'PHASE3A_BEFORE_PASS=false' >> "$GITHUB_ENV"; fi
          exit 0

      - name: Record standalone BEFORE state
        if: env.PHASE3A_BEFORE_PASS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp "$INC_LIBRARY/index.json" "$ARTIFACT_DIR/before-standalone-index.json"
          python scripts/ci/image_db_phase3b.py snapshot --library "$INC_LIBRARY" --output "$ARTIFACT_DIR/before-standalone-snapshot.json"

      - name: Incremental standalone ingest only
        if: env.PHASE3A_BEFORE_PASS == 'true'
        shell: bash
        run: |
          set +e
          start=$(date +%s)
          /usr/bin/time -v python -m srstudio.images.standalone_cli \
            --library "$INC_LIBRARY" --product-db "$PRODUCT_DB" --manifest "$STANDALONE_MANIFEST" \
            --state "$INC_IMPORTS/standalone-state.json" --report "$ARTIFACT_DIR/standalone-ingest-report.json" \
            > "$ARTIFACT_DIR/standalone-ingest.stdout.json" 2> "$ARTIFACT_DIR/standalone-ingest-time.txt"
          rc=$?
          echo $(( $(date +%s) - start )) > "$ARTIFACT_DIR/standalone-ingest-seconds.txt"
          python scripts/ci/image_db_phase3b.py snapshot --library "$INC_LIBRARY" --output "$ARTIFACT_DIR/after-first-standalone-snapshot.json"
          if [ "$rc" -eq 0 ]; then echo 'STANDALONE_INGEST_PASS=true' >> "$GITHUB_ENV"; else echo 'STANDALONE_INGEST_PASS=false' >> "$GITHUB_ENV"; fi
          exit 0

      - name: Second standalone ingest and idempotency proof
        if: env.STANDALONE_INGEST_PASS == 'true'
        shell: bash
        run: |
          set +e
          start=$(date +%s)
          /usr/bin/time -v python -m srstudio.images.standalone_cli \
            --library "$INC_LIBRARY" --product-db "$PRODUCT_DB" --manifest "$STANDALONE_MANIFEST" \
            --state "$INC_IMPORTS/standalone-state.json" --report "$ARTIFACT_DIR/second-standalone-ingest-report.json" \
            > "$ARTIFACT_DIR/second-standalone-ingest.stdout.json" 2> "$ARTIFACT_DIR/second-standalone-ingest-time.txt"
          cli_rc=$?
          echo $(( $(date +%s) - start )) > "$ARTIFACT_DIR/second-standalone-ingest-seconds.txt"
          python scripts/ci/image_db_phase3b.py snapshot --library "$INC_LIBRARY" --output "$ARTIFACT_DIR/after-second-standalone-snapshot.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          art=Path(os.environ['ARTIFACT_DIR'])
          first=json.loads((art/'after-first-standalone-snapshot.json').read_text())
          second=json.loads((art/'after-second-standalone-snapshot.json').read_text())
          report=json.loads((art/'second-standalone-ingest-report.json').read_text())
          metrics=report.get('metrics',{})
          selected=int(os.environ.get('STANDALONE_TRAINING_FILES','-2'))
          checks={
            'new_physical_zero': second['physical']-first['physical']==0,
            'new_canonical_zero': second['canonical']-first['canonical']==0,
            'logical_signature_unchanged': first['logical_signature_sha256']==second['logical_signature_sha256'],
            'processed_zero': int(metrics.get('processed',-1))==0,
            'all_selected_skipped': int(metrics.get('skipped',-1))==selected,
          }
          payload={'first':{k:v for k,v in first.items() if k!='logical_rows'},'second':{k:v for k,v in second.items() if k!='logical_rows'},'second_metrics':metrics,'selected_training_files':selected,'checks':checks,'pass':all(checks.values())}
          (art/'phase3b-idempotency.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
          raise SystemExit(0 if payload['pass'] else 63)
          PY
          idem_rc=$?
          if [ "$cli_rc" -eq 0 ] && [ "$idem_rc" -eq 0 ]; then echo 'PHASE3B_IDEMPOTENCY_PASS=true' >> "$GITHUB_ENV"; else echo 'PHASE3B_IDEMPOTENCY_PASS=false' >> "$GITHUB_ENV"; fi
          exit 0

      - name: Recovery regression
        if: env.TESTS_PASS == 'true'
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_image_standalone_recovery.py --junitxml="$ARTIFACT_DIR/recovery-test-results.xml" > "$ARTIFACT_DIR/recovery.log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then echo 'RECOVERY_PASS=true' >> "$GITHUB_ENV"; echo '{"status":"PASS"}' > "$ARTIFACT_DIR/recovery-report.json"; else echo 'RECOVERY_PASS=false' >> "$GITHUB_ENV"; echo '{"status":"FAIL"}' > "$ARTIFACT_DIR/recovery-report.json"; fi
          exit 0

      - name: Recompute audit, catalog 520, departments, top missing, find_image and performance
        if: env.PHASE3B_IDEMPOTENCY_PASS == 'true' && env.RECOVERY_PASS == 'true'
        shell: bash
        run: |
          set +e
          mkdir -p "$ARTIFACT_DIR/after"
          cp "$ARTIFACT_DIR/standalone-ingest-seconds.txt" "$ARTIFACT_DIR/after/standalone-ingest-seconds.txt"
          cp "$ARTIFACT_DIR/second-standalone-ingest-seconds.txt" "$ARTIFACT_DIR/after/second-ingest-seconds.txt"
          /usr/bin/time -v python scripts/ci/image_db_phase3_analysis.py \
            --library "$INC_LIBRARY" --product-db "$PRODUCT_DB" \
            --corpus-source "$CORPUS_DIR/Downloads(1)(1).zip" --corpus-source "$CORPUS_DIR/Downloads(2)(1).zip" \
            --artifact-dir "$ARTIFACT_DIR/after" --review-limit 100 \
            > "$ARTIFACT_DIR/after-analysis.stdout.txt" 2> "$ARTIFACT_DIR/after-analysis-time.txt"
          rc=$?
          if [ "$rc" -eq 0 ]; then echo 'AFTER_ANALYSIS_PASS=true' >> "$GITHUB_ENV"; else echo 'AFTER_ANALYSIS_PASS=false' >> "$GITHUB_ENV"; fi
          exit 0

      - name: Important products, Top Missing delta and new-auto review evidence
        if: env.AFTER_ANALYSIS_PASS == 'true'
        shell: bash
        run: |
          set +e
          python scripts/ci/image_db_phase3b.py important --library "$INC_LIBRARY" --standalone-report "$ARTIFACT_DIR/standalone-ingest-report.json" --output "$ARTIFACT_DIR/important-product-lookups.json"
          imp_rc=$?
          python scripts/ci/image_db_phase3b.py top-delta --before "$ARTIFACT_DIR/before/top-missing-100.csv" --after "$ARTIFACT_DIR/after/top-missing-100.csv" --output "$ARTIFACT_DIR/top-missing-delta.json"
          top_rc=$?
          python scripts/ci/image_db_phase3b.py new-auto --before-index "$ARTIFACT_DIR/before-standalone-index.json" --library "$INC_LIBRARY" --output-manifest "$ARTIFACT_DIR/new-auto-approved.json" --output-sheet "$ARTIFACT_DIR/new-auto-approved-contact-sheet.png"
          auto_rc=$?
          if [ "$imp_rc" -eq 0 ] && [ "$top_rc" -eq 0 ] && [ "$auto_rc" -eq 0 ]; then echo 'PHASE3B_REVIEW_EVIDENCE_PASS=true' >> "$GITHUB_ENV"; else echo 'PHASE3B_REVIEW_EVIDENCE_PASS=false' >> "$GITHUB_ENV"; fi
          exit 0

      - name: Fresh rebuild control only after incremental Phase 3B passed
        if: env.PHASE3B_REVIEW_EVIDENCE_PASS == 'true'
        shell: bash
        run: |
          set +e
          start=$(date +%s)
          /usr/bin/time -v python -m srstudio.images.batch_training \
            --library "$FRESH_LIBRARY" --imports-root "$FRESH_IMPORTS" --state "$FRESH_IMPORTS/corpus-state.json" \
            --report "$ARTIFACT_DIR/fresh-rich-ingest-report.json" \
            "$CORPUS_DIR/Downloads(1)(1).zip" "$CORPUS_DIR/Downloads(2)(1).zip" \
            > "$ARTIFACT_DIR/fresh-rich.stdout.json" 2> "$ARTIFACT_DIR/fresh-rich-time.txt"
          rich_rc=$?
          python -m srstudio.images.standalone_cli \
            --library "$FRESH_LIBRARY" --product-db "$PRODUCT_DB" --manifest "$STANDALONE_MANIFEST" \
            --state "$FRESH_IMPORTS/standalone-state.json" --report "$ARTIFACT_DIR/fresh-standalone-ingest-report.json" \
            > "$ARTIFACT_DIR/fresh-standalone.stdout.json" 2> "$ARTIFACT_DIR/fresh-standalone.stderr.txt"
          standalone_rc=$?
          echo $(( $(date +%s) - start )) > "$ARTIFACT_DIR/fresh-rebuild-seconds.txt"
          python scripts/ci/image_db_phase3b.py compare --left-library "$INC_LIBRARY" --right-library "$FRESH_LIBRARY" --product-db "$PRODUCT_DB" --output "$ARTIFACT_DIR/fresh-rebuild-equivalence.json"
          compare_rc=$?
          if [ "$rich_rc" -eq 0 ] && [ "$standalone_rc" -eq 0 ] && [ "$compare_rc" -eq 0 ]; then echo 'FRESH_REBUILD_PASS=true' >> "$GITHUB_ENV"; else echo 'FRESH_REBUILD_PASS=false' >> "$GITHUB_ENV"; fi
          exit 0

      - name: Build Phase 3B automated final report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          art=Path(os.environ['ARTIFACT_DIR'])
          def load(rel):
              p=art/rel
              return json.loads(p.read_text(encoding='utf-8')) if p.is_file() else {}
          def text(rel):
              p=art/rel
              return p.read_text(encoding='utf-8',errors='replace') if p.is_file() else ''
          def envbool(name): return os.environ.get(name,'false').lower()=='true'
          def rss(rel):
              m=re.search(r'Maximum resident set size \(kbytes\):\s*(\d+)',text(rel)); return int(m.group(1)) if m else None
          before_cov=load('before/coverage-catalog-520.json'); after_cov=load('after/coverage-catalog-520.json')
          before_dep=load('before/coverage-departments.json'); after_dep=load('after/coverage-departments.json')
          before_audit=load('before/library-audit.json').get('metrics',{}); after_audit=load('after/library-audit.json').get('metrics',{})
          inv=load('standalone-manifest.json'); ingest=load('standalone-ingest-report.json'); new_auto=load('new-auto-approved.json'); perf=load('after/performance.json')
          gates={
            'Environment':envbool('ENVIRONMENT_PASS'),'Tests':envbool('TESTS_PASS'),'Phase 3A persisted index':envbool('PHASE3A_PERSISTED_INDEX_PASS'),
            'Phase 3A corpus/catalog':envbool('PHASE3A_CORPUS_PASS'),'Standalone asset exact reference':envbool('STANDALONE_ASSET_PASS'),
            'Phase 3A physical materialization without reingest':envbool('PHASE3A_MATERIALIZED_PASS'),'Phase 3A before baseline':envbool('PHASE3A_BEFORE_PASS'),
            'Standalone incremental ingest':envbool('STANDALONE_INGEST_PASS'),'Phase 3B idempotency':envbool('PHASE3B_IDEMPOTENCY_PASS'),'Recovery':envbool('RECOVERY_PASS'),
            'Audit/Catalog/Departments/TopMissing/FindImage/Performance':envbool('AFTER_ANALYSIS_PASS'),'Review evidence':envbool('PHASE3B_REVIEW_EVIDENCE_PASS'),'Fresh rebuild equivalence':envbool('FRESH_REBUILD_PASS')}
          automated_pass=all(gates.values())
          coverage_delta={
            'any_candidate_products': after_cov.get('any_candidate',0)-before_cov.get('any_candidate',0),
            'auto_approved': after_cov.get('auto_approved',0)-before_cov.get('auto_approved',0),
            'likely': after_cov.get('likely',0)-before_cov.get('likely',0),
            'review_required': after_cov.get('review_required',0)-before_cov.get('review_required',0),
            'missing': after_cov.get('missing',0)-before_cov.get('missing',0),
          }
          new_auto_count=int(new_auto.get('sample_size',0) or 0)
          status='AUTOMATED PASS — HUMAN AUTO-APPROVAL REVIEW PENDING' if automated_pass and new_auto_count>0 else ('READY FOR INTEGRATION — COVERAGE EXPANSION PENDING' if automated_pass else 'NOT READY')
          report={
            'status':status,'automated_pass':automated_pass,'tested_sha':os.environ.get('GITHUB_SHA',''),'run_id':os.environ.get('GITHUB_RUN_ID',''),'gates':gates,
            'phase3a_before_equivalence':load('phase3a-before-equivalence.json'),'physical_restore':load('phase3a-physical-restore.json'),
            'standalone_asset':load('standalone-asset-verification.json'),'standalone_reference_gate':load('standalone-reference-gate.json'),'standalone_manifest_metrics':inv.get('metrics',{}),
            'standalone_ingest':ingest.get('metrics',{}),'database_before':before_audit,'database_after':after_audit,
            'coverage_before':before_cov,'coverage_after':after_cov,'coverage_delta':coverage_delta,'departments_before':before_dep,'departments_after':after_dep,
            'idempotency':load('phase3b-idempotency.json'),'recovery':load('recovery-report.json'),'important_product_lookups':load('important-product-lookups.json'),
            'top_missing_delta':load('top-missing-delta.json'),'new_auto_review':{'sample_size':new_auto_count,'human_review':'PENDING' if new_auto_count else 'NOT_REQUIRED_NO_NEW_AUTO_APPROVED'},
            'performance':{
              'standalone_ingest_seconds':int(text('standalone-ingest-seconds.txt').strip() or 0),'second_ingest_seconds':int(text('second-standalone-ingest-seconds.txt').strip() or 0),
              'index_load_seconds':perf.get('index_load_seconds'),'exact_lookup':perf.get('exact_lookup',{}),'fuzzy_lookup':perf.get('fuzzy_lookup',{}),'audit_seconds':perf.get('audit_seconds'),
              'standalone_ingest_peak_rss_kb':rss('standalone-ingest-time.txt'),'second_ingest_peak_rss_kb':rss('second-standalone-ingest-time.txt'),'audit_peak_rss_kb':rss('after-analysis-time.txt'),
              'phase3a_ingest_reference_seconds':514,'phase3a_index_load_reference_seconds':0.028297,'phase3a_audit_reference_seconds':0.125125,
            },
            'fresh_rebuild':load('fresh-rebuild-equivalence.json'),'fresh_rebuild_seconds':int(text('fresh-rebuild-seconds.txt').strip() or 0),
            'merges_performed':False,
          }
          (art/'phase3b-summary.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
            f.write('# Image DB Phase 3B Standalone Validation V2\n\n')
            f.write(f"**SHA:** `{report['tested_sha']}`  \n**Run:** `{report['run_id']}`  \n**Status:** **{status}**\n\n")
            f.write('| Gate | Result |\n|---|---|\n')
            for name,value in gates.items(): f.write(f"| {name} | {'PASS' if value else 'FAIL'} |\n")
            asset=report['standalone_asset']; metrics=report['standalone_manifest_metrics']
            f.write(f"\n## Standalone asset\n- asset id: {asset.get('asset_id')}\n- size: {asset.get('actual_size')}\n- sha256: `{asset.get('sha256')}`\n- download complete: {asset.get('download_complete')}\n- zip integrity: {asset.get('zip_integrity')}\n- verified: {asset.get('verified')}\n- files: {metrics.get('image_files')}\n- valid: {metrics.get('valid_images')}\n- corrupt: {metrics.get('corrupt_images')}\n- candidate: {metrics.get('candidate_images')}\n- decorative/rejected: {metrics.get('decorative_rejected')}\n- exact duplicate observations: {metrics.get('exact_duplicate_observations')}\n- near duplicate groups: {metrics.get('near_duplicate_groups')}\n")
            f.write(f"\n## Coverage 520\n- before: {before_cov.get('any_candidate_coverage_percent')}%\n- after: {after_cov.get('any_candidate_coverage_percent')}%\n- auto: {before_cov.get('auto_approved')} → {after_cov.get('auto_approved')}\n- likely: {before_cov.get('likely')} → {after_cov.get('likely')}\n- review: {before_cov.get('review_required')} → {after_cov.get('review_required')}\n- missing: {before_cov.get('missing')} → {after_cov.get('missing')}\n")
            f.write(f"\n## New auto-approved review sample\n- sample size: {new_auto_count}\n- human result: {report['new_auto_review']['human_review']}\n")
            f.write(f"\n## Reproducibility\n- fresh rebuild equivalent: {report['fresh_rebuild'].get('pass')}\n")
          PY
          df -h . > "$ARTIFACT_DIR/disk-after.txt"

      - name: Persist Phase 3B V2 evidence on isolated branch
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p docs/parallel/phase3-evidence/phase3b-v2
          for file in standalone-manifest.json standalone-asset-verification.json standalone-reference-gate.json phase3b-summary.json phase3b-idempotency.json fresh-rebuild-equivalence.json top-missing-delta.json new-auto-approved.json important-product-lookups.json phase3a-physical-restore.json phase3a-before-equivalence.json; do
            [ -f "$ARTIFACT_DIR/$file" ] && cp "$ARTIFACT_DIR/$file" "docs/parallel/phase3-evidence/phase3b-v2/$file"
          done
          [ -f "$ARTIFACT_DIR/after/top-missing-100.csv" ] && cp "$ARTIFACT_DIR/after/top-missing-100.csv" docs/parallel/phase3-evidence/phase3b-v2/top-missing-100.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/parallel/phase3-evidence/phase3b-v2
          if ! git diff --cached --quiet; then
            git commit -m 'image-db: persist Phase 3B V2 standalone evidence [skip ci]'
            for attempt in 1 2 3; do
              if git push origin HEAD:g2/parallel-image-database; then break; fi
              git pull --rebase origin g2/parallel-image-database
            done
          fi
          exit 0

      - name: Upload complete Phase 3B V2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-db-phase3b-v2-report
          path: |
            artifacts/image-db-phase3b-v2
            artifacts/phase3b-incremental-library/index.json
            artifacts/phase3b-incremental-imports/*.json
            artifacts/phase3b-fresh-library/index.json
            artifacts/phase3b-fresh-imports/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Final automated Phase 3B V2 gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          report=json.load(open('artifacts/image-db-phase3b-v2/phase3b-summary.json',encoding='utf-8'))
          print('Phase 3B V2 automated status:', report['status'])
          raise SystemExit(0 if report.get('automated_pass') else 1)
          PY
