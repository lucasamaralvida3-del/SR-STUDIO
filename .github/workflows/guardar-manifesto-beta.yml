name: Guardar manifesto Beta

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'beta/manifest.json'
      - 'manifests/launcher.json'
      - 'tools/repair_beta_manifest.py'
      - '.github/workflows/guardar-manifesto-beta.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verificar e reparar manifesto Beta
        run: python tools/repair_beta_manifest.py
      - name: Publicar reparo quando necessário
        run: |
          git config user.name 'SR Studio Manifest Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add beta/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Auto-repara manifesto Beta'
            git push origin HEAD:main
          fi
