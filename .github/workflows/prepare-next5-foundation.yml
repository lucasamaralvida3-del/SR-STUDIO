name: Preparar base SR Studio 5.0

on:
  push:
    branches:
      - next/5.0
    paths:
      - '.github/workflows/prepare-next5-foundation.yml'

permissions:
  contents: write

jobs:
  preparar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar Stable 4 publicada
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path '.next5/base' -Force | Out-Null
          gh release download 'v4.0.16-hybrid.stable4' -p 'SR_STUDIO_4.0.16_STABLE4_MAXIMIZADO.zip' -D '.next5/base' --clobber
          $zip='.next5/base/SR_STUDIO_4.0.16_STABLE4_MAXIMIZADO.zip'
          $sha=(Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if($sha -ne '4ac83d3e1a704caab3c77ae21270d74bbe56182d9b22c7ae1b445f83a30089d6'){
            throw "Stable 4 com SHA inesperado: $sha"
          }
          if((Get-Item $zip).Length -ne 2526714){ throw 'Stable 4 com tamanho inesperado' }

      - name: Materializar fonte canônica
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $zip='.next5/base/SR_STUDIO_4.0.16_STABLE4_MAXIMIZADO.zip'
          $expanded='.next5/expanded'
          Remove-Item -LiteralPath $expanded -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $zip -DestinationPath $expanded -Force
          if(Test-Path (Join-Path $expanded 'files')){
            $source=(Resolve-Path (Join-Path $expanded 'files')).Path
          } else {
            $entries=Get-ChildItem -LiteralPath $expanded
            if($entries.Count -eq 1 -and $entries[0].PSIsContainer){ $source=$entries[0].FullName } else { $source=(Resolve-Path $expanded).Path }
          }
          Remove-Item -LiteralPath 'src/sr_studio' -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path 'src/sr_studio' -Force | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination 'src/sr_studio' -Recurse -Force
          Get-ChildItem -LiteralPath 'src/sr_studio' -Directory -Recurse -Filter '__pycache__' | Remove-Item -Recurse -Force
          Get-ChildItem -LiteralPath 'src/sr_studio' -File -Recurse -Include '*.pyc','*.pyo' | Remove-Item -Force
          if(-not (Test-Path 'src/sr_studio/SR_Studio_Gerador.py')){ throw 'Fonte principal não encontrada na Stable 4 extraída' }
          if(-not (Test-Path 'src/sr_studio/assets/SR_logo.png')){ throw 'Logo oficial não encontrada na base canônica' }
          if(-not (Test-Path 'src/sr_studio/version.json')){ throw 'version.json não encontrado na base canônica' }

      - name: Validar fonte canônica
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m py_compile src/sr_studio/SR_Studio_Gerador.py
          Get-ChildItem -LiteralPath 'src/sr_studio' -Filter '*.py' -File | ForEach-Object { python -m py_compile $_.FullName }
          $version=Get-Content -Raw 'src/sr_studio/version.json' | ConvertFrom-Json
          $dist=[string]($version.distribution_version)
          if(-not $dist){ $dist=[string]($version.version) }
          if($dist -ne '4.0.16-hybrid.stable4'){ throw "A fonte canônica não corresponde à Stable 4: $dist" }
          $count=(Get-ChildItem -LiteralPath 'src/sr_studio' -File -Recurse).Count
          if($count -lt 50){ throw "Base extraída incompleta: apenas $count arquivos" }
          "Arquivos canônicos: $count"

      - name: Gravar metadados da fundação
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path 'docs' -Force | Out-Null
          New-Item -ItemType Directory -Path 'build' -Force | Out-Null
          New-Item -ItemType Directory -Path 'tests' -Force | Out-Null
          @'
          {
            "format": "SRSTUDIO_NEXT_FOUNDATION_1",
            "target_major": "5.0.0",
            "source_of_truth": "src/sr_studio",
            "baseline": "4.0.16-hybrid.stable4",
            "baseline_tag": "v4.0.16-hybrid.stable4",
            "status": "foundation",
            "public_release": false
          }
          '@ | Set-Content -LiteralPath 'build/foundation.json' -Encoding UTF8

      - name: Commitar base canônica
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'SR Studio Architecture Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/sr_studio build/foundation.json
          if(-not (git diff --cached --quiet)){
            git commit -m 'Materializa Stable 4 como base canônica da versão 5.0'
            git push origin HEAD:next/5.0
          }
