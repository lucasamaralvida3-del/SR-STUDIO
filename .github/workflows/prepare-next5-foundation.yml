name: Preparar base SR Studio 5.0

on:
  push:
    branches:
      - next/5.0
    paths:
      - '.github/workflows/prepare-next5-foundation.yml'

permissions:
  contents: write

jobs:
  preparar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar Stable 4 publicada
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path '.next5/base' -Force | Out-Null
          gh release download 'v4.0.16-hybrid.stable4' -p 'SR_STUDIO_4.0.16_STABLE4_MAXIMIZADO.zip' -D '.next5/base' --clobber
          $zip='.next5/base/SR_STUDIO_4.0.16_STABLE4_MAXIMIZADO.zip'
          $sha=(Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if($sha -ne '4ac83d3e1a704caab3c77ae21270d74bbe56182d9b22c7ae1b445f83a30089d6'){
            throw "Stable 4 com SHA inesperado: $sha"
          }
          if((Get-Item $zip).Length -ne 2526714){ throw 'Stable 4 com tamanho inesperado' }

      - name: Materializar fonte canônica
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python build/materialize_baseline.py '.next5/base/SR_STUDIO_4.0.16_STABLE4_MAXIMIZADO.zip' 'src/sr_studio' --metadata 'build/foundation.json'

      - name: Validar fonte canônica
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem -LiteralPath 'src/sr_studio' -Filter '*.py' -File | ForEach-Object { python -m py_compile $_.FullName }
          $meta=Get-Content -Raw 'build/foundation.json' | ConvertFrom-Json
          if([string]$meta.baseline -ne '4.0.16-hybrid.stable4'){ throw 'Baseline incorreta' }
          if([int]$meta.canonical_file_count -ne 65){ throw 'Quantidade canônica incorreta' }
          foreach($required in @('SR_Studio_Gerador.py','AtacadoModule.py','ManualModule.py','Encartes10_beta16.js','assets/SR_logo.png','modelos/ATACADO.pptx','version.json')){
            if(-not (Test-Path -LiteralPath (Join-Path 'src/sr_studio' $required))){ throw "Arquivo canônico ausente: $required" }
          }

      - name: Commitar base canônica
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'SR Studio Architecture Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/sr_studio build/foundation.json
          if(-not (git diff --cached --quiet)){
            git commit -m 'Materializa Stable 4 como base canônica da versão 5.0'
            git pull --rebase origin next/5.0
            git push origin HEAD:next/5.0
          }
