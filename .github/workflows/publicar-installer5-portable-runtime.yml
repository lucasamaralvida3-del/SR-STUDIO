name: SR Studio Installer 5 - Python Portatil

on:
  push:
    paths:
      - '.github/workflows/publicar-installer5-portable-runtime.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: 'x64'

      - name: Montar runtime Python portatil completo
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $runtime=Join-Path $env:RUNNER_TEMP 'srstudio-python-runtime'
          Remove-Item -LiteralPath $runtime -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $runtime -Force | Out-Null
          Write-Host "Copiando Python de $env:pythonLocation"
          Copy-Item -Path (Join-Path $env:pythonLocation '*') -Destination $runtime -Recurse -Force

          $requirements=(Resolve-Path 'staging/stable2/base/requirements.txt').Path
          & (Join-Path $runtime 'python.exe') -m pip install --disable-pip-version-check --no-warn-script-location --upgrade --target (Join-Path $runtime 'Lib\site-packages') -r $requirements
          if($LASTEXITCODE -ne 0){ throw 'Falha instalando dependencias no runtime portatil' }

          Get-ChildItem -LiteralPath $runtime -Directory -Recurse -Filter '__pycache__' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $runtime -File -Recurse -Filter '*.pyc' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $runtime 'Lib\test') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $runtime 'Lib\idlelib\idle_test') -Recurse -Force -ErrorAction SilentlyContinue

          & (Join-Path $runtime 'python.exe') -c "import sys, tkinter, openpyxl, pypdf, PIL, numpy, cv2, tkinterdnd2; assert sys.version_info[:2] == (3,12); print(sys.version); print(tkinter.TkVersion); print('SR_RUNTIME_OK')"
          if($LASTEXITCODE -ne 0){ throw 'Runtime portatil falhou no teste de imports' }

          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $zip='dist/SR_STUDIO_PYTHON_3.12.10_RUNTIME1.zip'
          Remove-Item -LiteralPath $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $runtime '*') -DestinationPath $zip -CompressionLevel Optimal
          $sha=(Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          $size=(Get-Item -LiteralPath $zip).Length
          $reqSha=(Get-FileHash -Algorithm SHA256 -LiteralPath $requirements).Hash.ToLowerInvariant()
          "RUNTIME_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUNTIME_SIZE=$size" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "REQ_SHA=$reqSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Runtime ZIP: $size bytes / $sha"

      - name: Publicar runtime Python
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          gh release create 'v4.0.16-runtime1' 'dist/SR_STUDIO_PYTHON_3.12.10_RUNTIME1.zip' --title 'SR Studio Python Runtime 3.12.10 Runtime 1' --notes 'Runtime Python 3.12.10 x64 portatil do SR Studio, com Tk/Tcl e dependencias do requirements.txt. Nao instala Python no Windows e nao requer administrador.'
          if($LASTEXITCODE -ne 0){ throw 'Falha publicando runtime Python' }

      - name: Criar manifesto do runtime e Launcher base2.7
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, os, re
          from datetime import datetime, timezone, timedelta

          root=Path('.')
          launcher_path=root/'launcher/files/SRStudioLauncher.ps1'
          text=launcher_path.read_text(encoding='utf-8-sig')
          text=text.replace("$LauncherVersion = '4.0.1-hybrid.base2.6'", "$LauncherVersion = '4.0.1-hybrid.base2.7'", 1)

          new_func=r'''function Ensure-SrPythonRuntime {
            $pythonRoot = Join-Path $RuntimeDir 'python'
            New-Item -ItemType Directory -Path $RuntimeDir -Force | Out-Null

            $candidateList = New-Object 'System.Collections.Generic.List[string]'
            function Add-SrPythonCandidate([string]$Candidate) {
              if(-not $Candidate) { return }
              try { $expanded = Expand-SrEnv $Candidate } catch { $expanded = $Candidate }
              if(-not $expanded) { return }
              if($expanded -match '\\WindowsApps\\') { return }
              if((Test-Path -LiteralPath $expanded -PathType Leaf) -and -not $candidateList.Contains($expanded)) {
                $candidateList.Add($expanded)
              }
            }

            function Resolve-SrPythonPair($Candidates) {
              foreach($candidate in @($Candidates)) {
                $leaf = [IO.Path]::GetFileName($candidate).ToLowerInvariant()
                $dir = Split-Path $candidate -Parent
                if($leaf -eq 'pythonw.exe') {
                  $wexe = $candidate
                  $exe = Join-Path $dir 'python.exe'
                } else {
                  $exe = $candidate
                  $wexe = Join-Path $dir 'pythonw.exe'
                }
                if(-not (Test-Path -LiteralPath $exe -PathType Leaf)) { continue }
                try {
                  $ver = (& $exe -c "import sys; print('%d.%d.%d' % sys.version_info[:3])" 2>$null | Select-Object -First 1)
                  if($LASTEXITCODE -ne 0 -or -not $ver) { continue }
                  if((([string]$ver).Trim()) -notmatch '^3\.12\.') { continue }
                  if(-not (Test-Path -LiteralPath $wexe -PathType Leaf)) { $wexe = $exe }
                  return @{ python=$exe; pythonw=$wexe; version=(([string]$ver).Trim()) }
                } catch { }
              }
              return $null
            }

            # 1) Runtime portatil do proprio SR Studio.
            Add-SrPythonCandidate (Join-Path $pythonRoot 'pythonw.exe')
            Add-SrPythonCandidate (Join-Path $pythonRoot 'python.exe')

            # 2) Python configurado ou ja instalado no computador.
            Add-SrPythonCandidate ([string](Get-SrProperty $cfg 'python_command' ''))
            Add-SrPythonCandidate (Join-Path $env:LOCALAPPDATA 'Programs\Python\Python312\pythonw.exe')
            Add-SrPythonCandidate (Join-Path $env:LOCALAPPDATA 'Programs\Python\Python312\python.exe')
            if($env:ProgramFiles) {
              Add-SrPythonCandidate (Join-Path $env:ProgramFiles 'Python312\pythonw.exe')
              Add-SrPythonCandidate (Join-Path $env:ProgramFiles 'Python312\python.exe')
            }
            foreach($cmdName in @('pythonw.exe','python.exe')) {
              try {
                $cmd = Get-Command $cmdName -ErrorAction SilentlyContinue
                if($cmd) { Add-SrPythonCandidate $cmd.Source }
              } catch { }
            }

            $resolvedPair = Resolve-SrPythonPair $candidateList
            $runtimeRequirementsHash = ''

            if($null -eq $resolvedPair) {
              Write-SrLog 'Python 3.12 nao encontrado. Preparando runtime portatil oficial do SR Studio (ZERO ADMIN / sem instalar Python no Windows).'
              $runtimeManifestUrl = $officialRepositoryBase.TrimEnd('/') + '/runtime/manifest.json'
              $runtimeManifestPath = Join-Path $CacheDir 'python_runtime_manifest.json'
              Invoke-SrDownload $runtimeManifestUrl $runtimeManifestPath 60 3
              $runtimeManifest = Read-SrJson $runtimeManifestPath
              if([string]$runtimeManifest.format -ne 'SRSTUDIO_PYTHON_RUNTIME_1') { throw 'Manifesto do runtime Python invalido.' }
              if(([string]$runtimeManifest.python_version) -notmatch '^3\.12\.') { throw 'Versao Python do runtime nao suportada.' }
              $runtimeUrl = [string]$runtimeManifest.url
              if(-not (Test-SrUrlAllowed $runtimeUrl)) { throw 'URL insegura no runtime Python.' }
              $runtimeZip = Join-Path $CacheDir 'srstudio_python_runtime.zip'
              Invoke-SrDownload $runtimeUrl $runtimeZip ([int](Get-SrProperty $cfg 'download_timeout_seconds' 300)) 3
              $expectedSize = [int64]$runtimeManifest.size
              if($expectedSize -gt 0 -and (Get-Item -LiteralPath $runtimeZip).Length -ne $expectedSize) { throw 'Tamanho invalido do runtime Python.' }
              $expectedHash = ([string]$runtimeManifest.sha256).ToLowerInvariant()
              if((Get-SrSha256 $runtimeZip) -ne $expectedHash) { throw 'SHA-256 invalido do runtime Python.' }
              Write-SrLog ('Runtime Python validado: ' + $expectedHash)

              $runtimeStage = Join-Path $StageDir ('python_runtime_' + (Get-Date -Format 'yyyyMMdd_HHmmss'))
              Remove-Item -LiteralPath $runtimeStage -Recurse -Force -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Path $runtimeStage -Force | Out-Null
              Expand-Archive -LiteralPath $runtimeZip -DestinationPath $runtimeStage -Force
              $stagePython = Join-Path $runtimeStage 'python.exe'
              if(-not (Test-Path -LiteralPath $stagePython -PathType Leaf)) { throw 'python.exe ausente no runtime portatil.' }
              $stageVersion = (& $stagePython -c "import sys; print('%d.%d.%d' % sys.version_info[:3])" 2>$null | Select-Object -First 1)
              if($LASTEXITCODE -ne 0 -or (([string]$stageVersion).Trim()) -notmatch '^3\.12\.') { throw 'Runtime Python portatil nao iniciou corretamente.' }
              & $stagePython -c "import tkinter, openpyxl, pypdf, PIL, numpy, cv2, tkinterdnd2; print('SR_RUNTIME_OK')" | Out-Null
              if($LASTEXITCODE -ne 0) { throw 'Runtime Python portatil esta incompleto.' }

              Remove-Item -LiteralPath $pythonRoot -Recurse -Force -ErrorAction SilentlyContinue
              Move-Item -LiteralPath $runtimeStage -Destination $pythonRoot -Force
              $runtimeRequirementsHash = ([string]$runtimeManifest.requirements_sha256).ToLowerInvariant()
              $resolvedPair = Resolve-SrPythonPair @((Join-Path $pythonRoot 'pythonw.exe'),(Join-Path $pythonRoot 'python.exe'))
              if($null -eq $resolvedPair) { throw 'Runtime Python foi extraido, mas nao pode ser iniciado.' }
              Write-SrLog ('Runtime Python portatil pronto: ' + [string]$resolvedPair.version)
            }

            $pythonExe = [string]$resolvedPair.python
            $pythonwExe = [string]$resolvedPair.pythonw
            Write-SrLog ('Using Python ' + [string]$resolvedPair.version + ': ' + $pythonExe)

            $requirementsPath = Join-Path $AppDir 'requirements.txt'
            if(Test-Path $requirementsPath) {
              $requirementsHash = Get-SrSha256 $requirementsPath
              $marker = Join-Path $RuntimeDir 'srstudio_requirements.sha256'
              $markerValue = $requirementsHash + '|' + $pythonExe
              if($runtimeRequirementsHash -and $runtimeRequirementsHash -eq $requirementsHash) {
                [IO.File]::WriteAllText($marker,$markerValue,(New-Object Text.UTF8Encoding($false)))
              }
              $installedMarker = ''
              if(Test-Path $marker) { try { $installedMarker = (Get-Content -Raw -LiteralPath $marker).Trim() } catch { } }
              if($installedMarker -ne $markerValue) {
                Write-SrLog 'Installing/updating SR Studio Python dependencies.'
                $pipLog = Join-Path $LogDir 'pip_runtime.log'
                $pipErr = $pipLog + '.err'
                $pipArgs = @('-m','pip','install','--disable-pip-version-check','--no-warn-script-location','--upgrade','-r',$requirementsPath)
                $proc = Start-Process -FilePath $pythonExe -ArgumentList $pipArgs -Wait -PassThru -RedirectStandardOutput $pipLog -RedirectStandardError $pipErr
                if($proc.ExitCode -ne 0) { throw ('Python dependencies failed to install. See ' + $pipErr) }
                [IO.File]::WriteAllText($marker,$markerValue,(New-Object Text.UTF8Encoding($false)))
                Write-SrLog 'SR Studio Python dependencies are ready.'
              }
            }
            return $pythonwExe
          }

          function Start-SrDesktop'''

          pattern=r'function Ensure-SrPythonRuntime \{.*?\r?\n\}\r?\n\r?\nfunction Start-SrDesktop'
          updated,n=re.subn(pattern,lambda _m:new_func,text,count=1,flags=re.S)
          if n != 1:
              raise SystemExit(f'Falha substituindo Ensure-SrPythonRuntime: {n}')
          launcher_bytes=('\ufeff'+updated.lstrip('\ufeff')).encode('utf-8')
          launcher_path.write_bytes(launcher_bytes)

          runtime_dir=root/'runtime'
          runtime_dir.mkdir(exist_ok=True)
          runtime_manifest={
              'format':'SRSTUDIO_PYTHON_RUNTIME_1',
              'product':'SR Studio Python Runtime',
              'version':'runtime1',
              'python_version':'3.12.10',
              'architecture':'x64',
              'url':'https://github.com/lucasamaralvida3-del/SR-STUDIO/releases/download/v4.0.16-runtime1/SR_STUDIO_PYTHON_3.12.10_RUNTIME1.zip',
              'sha256':os.environ['RUNTIME_SHA'],
              'size':int(os.environ['RUNTIME_SIZE']),
              'requirements_sha256':os.environ['REQ_SHA'],
          }
          (runtime_dir/'manifest.json').write_text(json.dumps(runtime_manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          now=datetime.now(timezone(timedelta(hours=-3))).isoformat(timespec='seconds')
          launcher_manifest={
              'format':'SRSTUDIO_LAUNCHER_MANIFEST_1',
              'product':'SR Studio Launcher',
              'version':'4.0.1-hybrid.base2.7',
              'published_at':now,
              'files':[{
                  'path':'SRStudioLauncher.ps1',
                  'source':'launcher/files/SRStudioLauncher.ps1',
                  'sha256':hashlib.sha256(launcher_bytes).hexdigest(),
                  'size':len(launcher_bytes),
              }],
          }
          (root/'manifests/launcher.json').write_text(json.dumps(launcher_manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

      - name: Validar Launcher base2.7
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $launcher='launcher/files/SRStudioLauncher.ps1'
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $launcher),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors -and $errors.Count -gt 0){ throw "Launcher PowerShell invalido: $($errors[0].Message)" }
          if(-not (Select-String -LiteralPath $launcher -SimpleMatch "4.0.1-hybrid.base2.7")){ throw 'Launcher base2.7 ausente' }
          if(-not (Select-String -LiteralPath $launcher -SimpleMatch 'runtime/manifest.json')){ throw 'Suporte a runtime portatil ausente' }
          $m=Get-Content -Raw 'runtime/manifest.json' | ConvertFrom-Json
          if([string]$m.sha256 -ne $env:RUNTIME_SHA){ throw 'Manifesto runtime com hash incorreto' }

      - name: Publicar Launcher e manifesto runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'SR Studio Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add launcher/files/SRStudioLauncher.ps1 manifests/launcher.json runtime/manifest.json
          git commit -m 'Adiciona Python portatil no Launcher base2.7'
          git push origin HEAD:main

      - name: Confirmar Launcher online
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Start-Sleep -Seconds 3
          $m=Invoke-RestMethod -Uri ('https://raw.githubusercontent.com/lucasamaralvida3-del/SR-STUDIO/main/manifests/launcher.json?x=' + [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()) -Headers @{'Cache-Control'='no-cache'}
          if([string]$m.version -ne '4.0.1-hybrid.base2.7'){ throw "Launcher online ainda em $($m.version)" }
          $r=Invoke-RestMethod -Uri ('https://raw.githubusercontent.com/lucasamaralvida3-del/SR-STUDIO/main/runtime/manifest.json?x=' + [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()) -Headers @{'Cache-Control'='no-cache'}
          if([string]$r.sha256 -ne $env:RUNTIME_SHA){ throw 'Manifesto runtime online ainda nao atualizado' }

      - name: Gerar Installer 5
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd='dist/SR_STUDIO_SETUP_4.0.16_STABLE_PORTATIL.cmd'
          $text=@'
          @echo off
          setlocal EnableExtensions
          chcp 65001 >nul 2>&1
          title SR Studio 4.0.16 - Instalador Python Portatil
          set "ROOT=%LOCALAPPDATA%\SRStudio"
          set "LAUNCHER=%ROOT%\Launcher"
          set "CONFIG=%ROOT%\Config"
          set "LOGS=%ROOT%\Logs"
          set "RAW=https://raw.githubusercontent.com/lucasamaralvida3-del/SR-STUDIO/main"
          echo ============================================================
          echo       SR STUDIO 4.0.16 - INSTALADOR PORTATIL
          echo ============================================================
          echo.
          echo Python privado portatil: nao instala Python no Windows.
          echo Sem payload Base64 e sem necessidade de administrador.
          echo.
          where curl.exe >nul 2>&1 || (echo ERRO: curl.exe nao encontrado no Windows.& pause & exit /b 10)
          mkdir "%LAUNCHER%" "%CONFIG%" "%LOGS%" >nul 2>&1
          echo [1/4] Baixando Bootstrap oficial...
          curl.exe -fL --retry 3 "%RAW%/launcher/files/SRStudioBootstrap.ps1" -o "%LAUNCHER%\SRStudioBootstrap.ps1" || (echo Falha no Bootstrap.& pause & exit /b 11)
          echo [2/4] Baixando Launcher oficial...
          curl.exe -fL --retry 3 "%RAW%/launcher/files/SRStudioLauncher.ps1" -o "%LAUNCHER%\SRStudioLauncher.ps1" || (echo Falha no Launcher.& pause & exit /b 12)
          echo [3/4] Preparando configuracao Stable...
          >"%CONFIG%\launcher.json" echo {
          >>"%CONFIG%\launcher.json" echo   "schema": 3,
          >>"%CONFIG%\launcher.json" echo   "channel": "stable",
          >>"%CONFIG%\launcher.json" echo   "auto_update": true,
          >>"%CONFIG%\launcher.json" echo   "repair_on_start": true,
          >>"%CONFIG%\launcher.json" echo   "full_repair_every_days": 7,
          >>"%CONFIG%\launcher.json" echo   "allow_offline": true,
          >>"%CONFIG%\launcher.json" echo   "remote_manifest_base": "https://raw.githubusercontent.com/lucasamaralvida3-del/SR-STUDIO/main",
          >>"%CONFIG%\launcher.json" echo   "local_repository": "",
          >>"%CONFIG%\launcher.json" echo   "entrypoint": "SR_Studio_Gerador.py",
          >>"%CONFIG%\launcher.json" echo   "python_command": "",
          >>"%CONFIG%\launcher.json" echo   "encartes_cloud_url": "http://127.0.0.1:3000",
          >>"%CONFIG%\launcher.json" echo   "keep_backups": 3,
          >>"%CONFIG%\launcher.json" echo   "connect_timeout_seconds": 15,
          >>"%CONFIG%\launcher.json" echo   "download_timeout_seconds": 600,
          >>"%CONFIG%\launcher.json" echo   "download_retries": 3,
          >>"%CONFIG%\launcher.json" echo   "auto_update_launcher": true
          >>"%CONFIG%\launcher.json" echo }
          >"%ROOT%\ABRIR_SR_STUDIO.cmd" echo @echo off
          >>"%ROOT%\ABRIR_SR_STUDIO.cmd" echo "%%SystemRoot%%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File "%%LOCALAPPDATA%%\SRStudio\Launcher\SRStudioBootstrap.ps1"
          copy /y "%ROOT%\ABRIR_SR_STUDIO.cmd" "%USERPROFILE%\Desktop\SR Studio.cmd" >nul 2>&1
          echo [4/4] Instalando SR Studio e preparando Python portatil...
          "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File "%LAUNCHER%\SRStudioBootstrap.ps1"
          set "RC=%ERRORLEVEL%"
          if not "%RC%"=="0" (
            echo.
            echo A instalacao encontrou um erro. Codigo: %RC%
            echo Envie os arquivos de %%LOCALAPPDATA%%\SRStudio\Logs para diagnostico.
            pause
            exit /b %RC%
          )
          echo.
          echo SR Studio instalado com sucesso.
          exit /b 0
          '@
          [IO.File]::WriteAllText($cmd,$text,(New-Object Text.UTF8Encoding($false)))
          $zip='dist/SR_STUDIO_SETUP_4.0.16_STABLE_PORTATIL.zip'
          Compress-Archive -LiteralPath $cmd -DestinationPath $zip -CompressionLevel Optimal -Force

      - name: Publicar Installer 5
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          gh release create 'v4.0.16-installer5' 'dist/SR_STUDIO_SETUP_4.0.16_STABLE_PORTATIL.cmd' 'dist/SR_STUDIO_SETUP_4.0.16_STABLE_PORTATIL.zip' --title 'SR Studio 4.0.16 - Instalador Python Portatil' --notes 'Installer 5: elimina a instalacao do Python no Windows. O Launcher base2.7 baixa um runtime Python 3.12.10 x64 portatil, valida SHA-256, testa Tkinter e todas as dependencias e executa diretamente em LocalAppData.'
          if($LASTEXITCODE -ne 0){ throw 'Falha publicando Installer 5' }
