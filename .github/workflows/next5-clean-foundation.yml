name: Limpeza final da fundação 5.0

on:
  push:
    branches:
      - next/5.0
    paths:
      - '.github/workflows/next5-clean-foundation.yml'

permissions:
  contents: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remover compilados rastreados
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SR Studio Architecture Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -r --cached --ignore-unmatch src/sr_studio/__pycache__
          find src/sr_studio -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find src/sr_studio -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete || true
          if ! git diff --cached --quiet; then
            git commit -m 'Remove compilados da fonte canônica 5.0'
            git pull --rebase origin next/5.0
            git push origin HEAD:next/5.0
          fi
