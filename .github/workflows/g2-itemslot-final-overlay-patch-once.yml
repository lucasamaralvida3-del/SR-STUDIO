# activation
name: G2 ItemSlot Final Stable Overlay Patch Once

on:
  push:
    branches:
      - g2/fix-item-slot-interaction-performance
    paths:
      - '.github/workflows/g2-itemslot-final-overlay-patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(g2): activate final ItemSlot stable overlay patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g2/fix-item-slot-interaction-performance
          fetch-depth: 0

      - name: Apply final stable interaction overlay patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/srstudio/graphics2/qml/GraphicsEditor.qml')
          text = path.read_text(encoding='utf-8')

          if 'id: manualItemSlotResizeHandler' not in text:
              raise SystemExit('experimental manualItemSlotResizeHandler not found at expected pre-patch state')
          if 'property var interactionBounds:' in text:
              raise SystemExit('interactionBounds already present before final patch')

          old = '''                                    property var displayBounds: previewActive ? preview_bounds : bounds
                                    property bool isManualItemSlot: !!(modelData.metadata && modelData.metadata.manual_item_slot)
                                    property bool slotEditActive: isManualItemSlot || smartSlotEditMode
'''
          new = '''                                    property var displayBounds: previewActive ? preview_bounds : bounds
                                    property bool isManualItemSlot: !!(modelData.metadata && modelData.metadata.manual_item_slot)
                                    property bool slotEditActive: isManualItemSlot || smartSlotEditMode
                                    // Resize capture geometry stays frozen; displayBounds is visual-only preview.
                                    property bool manualResizePreview: isManualItemSlot && previewActive && window.itemSlotInteractionKind === "resize"
                                    property var interactionBounds: manualResizePreview ? bounds : displayBounds
'''
          if text.count(old) != 1:
              raise SystemExit(f'slot overlay property anchor mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''                                    x: displayBounds.x * zoom
                                    y: displayBounds.y * zoom
                                    width: displayBounds.width * zoom
                                    height: displayBounds.height * zoom
'''
          new = '''                                    x: interactionBounds.x * zoom
                                    y: interactionBounds.y * zoom
                                    width: interactionBounds.width * zoom
                                    height: interactionBounds.height * zoom
'''
          if text.count(old) != 1:
              raise SystemExit(f'slot overlay geometry anchor mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''                                    Rectangle {
                                        anchors.fill: parent
                                        color: isDropTarget ? "#16A34A2A" : (isSelectedSlot ? "#0F5BD811" : (productDragActive ? "#0F5BD808" : "transparent"))
                                        border.width: isDropTarget ? 3 : (isSelectedSlot ? 2 : 1)
                                        border.color: isDropTarget ? "#16A34A" : (isSelectedSlot ? "#0F5BD8" : "#0F5BD855")
                                        radius: 4
                                    }
'''
          new = '''                                    Rectangle {
                                        // Visual frame follows displayBounds even while the interaction overlay is frozen.
                                        x: (slotOverlay.displayBounds.x - slotOverlay.interactionBounds.x) * zoom
                                        y: (slotOverlay.displayBounds.y - slotOverlay.interactionBounds.y) * zoom
                                        width: Math.max(1, slotOverlay.displayBounds.width * zoom)
                                        height: Math.max(1, slotOverlay.displayBounds.height * zoom)
                                        color: isDropTarget ? "#16A34A2A" : (isSelectedSlot ? "#0F5BD811" : (productDragActive ? "#0F5BD808" : "transparent"))
                                        border.width: isDropTarget ? 3 : (isSelectedSlot ? 2 : 1)
                                        border.color: isDropTarget ? "#16A34A" : (isSelectedSlot ? "#0F5BD8" : "#0F5BD855")
                                        radius: 4
                                    }
'''
          if text.count(old) != 1:
              raise SystemExit(f'visual frame anchor mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''                                            color: "white"
                                            border.width: 2
                                            border.color: "#0F5BD8"
                                            z: 10
                                            MouseArea {
'''
          new = '''                                            // Parent remains the fixed hit target for manual ItemSlot resize.
                                            color: slotOverlay.isManualItemSlot ? "transparent" : "white"
                                            border.width: slotOverlay.isManualItemSlot ? 0 : 2
                                            border.color: "#0F5BD8"
                                            z: 10
                                            Rectangle {
                                                // Visual handle follows displayBounds without moving the MouseArea grab target.
                                                visible: slotOverlay.isManualItemSlot
                                                x: (slotOverlay.displayBounds.x - slotOverlay.interactionBounds.x) * zoom
                                                   + modelData.fx * (slotOverlay.displayBounds.width - slotOverlay.interactionBounds.width) * zoom
                                                y: (slotOverlay.displayBounds.y - slotOverlay.interactionBounds.y) * zoom
                                                   + modelData.fy * (slotOverlay.displayBounds.height - slotOverlay.interactionBounds.height) * zoom
                                                width: parent.width
                                                height: parent.height
                                                radius: parent.radius
                                                color: "white"
                                                border.width: 2
                                                border.color: "#0F5BD8"
                                            }
                                            MouseArea {
'''
          if text.count(old) != 1:
              raise SystemExit(f'handle visual anchor mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)

          disable = '                                                enabled: !slotOverlay.isManualItemSlot\n'
          if text.count(disable) != 1:
              raise SystemExit(f'manual MouseArea disable anchor mismatch: {text.count(disable)}')
          text = text.replace(disable, '', 1)

          signature = '                                                function resizedBounds(px, py) {\n'
          if text.count(signature) != 1:
              raise SystemExit(f'resizedBounds signature mismatch: {text.count(signature)}')
          text = text.replace(signature, '                                                function resizedBounds(px, py, modifiers) {\n', 1)

          clamp = '''                                                    if (nw < 1) { if (modelData.dir.indexOf("w") >= 0) nx -= (1 - nw); nw = 1 }
                                                    if (nh < 1) { if (modelData.dir.indexOf("n") >= 0) ny -= (1 - nh); nh = 1 }
                                                    return {"x":nx,"y":ny,"width":nw,"height":nh}
'''
          ratio = '''                                                    if (nw < 1) { if (modelData.dir.indexOf("w") >= 0) nx -= (1 - nw); nw = 1 }
                                                    if (nh < 1) { if (modelData.dir.indexOf("n") >= 0) ny -= (1 - nh); nh = 1 }
                                                    if (slotOverlay.isManualItemSlot && (modifiers & Qt.ShiftModifier)) {
                                                        var aspect = Math.max(0.000001, startW) / Math.max(0.000001, startH)
                                                        var hasH = modelData.dir.indexOf("e") >= 0 || modelData.dir.indexOf("w") >= 0
                                                        var hasV = modelData.dir.indexOf("n") >= 0 || modelData.dir.indexOf("s") >= 0
                                                        var targetW = nw
                                                        var targetH = nh
                                                        if (hasH && hasV) {
                                                            var relW = Math.abs(nw - startW) / Math.max(1, startW)
                                                            var relH = Math.abs(nh - startH) / Math.max(1, startH)
                                                            if (relW >= relH)
                                                                targetH = Math.max(1, targetW / aspect)
                                                            else
                                                                targetW = Math.max(1, targetH * aspect)
                                                        } else if (hasH) {
                                                            targetH = Math.max(1, targetW / aspect)
                                                        } else if (hasV) {
                                                            targetW = Math.max(1, targetH * aspect)
                                                        }
                                                        if (modelData.dir.indexOf("w") >= 0)
                                                            nx = startX + startW - targetW
                                                        if (modelData.dir.indexOf("n") >= 0)
                                                            ny = startY + startH - targetH
                                                        nw = targetW
                                                        nh = targetH
                                                    }
                                                    return {"x":nx,"y":ny,"width":nw,"height":nh}
'''
          if text.count(clamp) != 1:
              raise SystemExit(f'resizedBounds clamp anchor mismatch: {text.count(clamp)}')
          text = text.replace(clamp, ratio, 1)

          call = 'slotOverlay.queuePreview(resizedBounds(point.x, point.y), false)'
          if text.count(call) != 1:
              raise SystemExit(f'position resizedBounds call mismatch: {text.count(call)}')
          text = text.replace(call, 'slotOverlay.queuePreview(resizedBounds(point.x, point.y, mouse.modifiers), false)', 1)
          call = 'slotOverlay.commitPreview(resizedBounds(point.x, point.y), "resize")'
          if text.count(call) != 1:
              raise SystemExit(f'release resizedBounds call mismatch: {text.count(call)}')
          text = text.replace(call, 'slotOverlay.commitPreview(resizedBounds(point.x, point.y, mouse.modifiers), "resize")', 1)

          marker = 'id: manualItemSlotResizeHandler'
          id_pos = text.index(marker)
          start = text.rfind('DragHandler {', 0, id_pos)
          if start < 0:
              raise SystemExit('DragHandler start not found')
          line_start = text.rfind('\n', 0, start) + 1
          brace_start = text.index('{', start)
          depth = 0
          in_string = False
          quote = ''
          escape = False
          end = None
          for i in range(brace_start, len(text)):
              ch = text[i]
              if in_string:
                  if escape:
                      escape = False
                  elif ch == '\\':
                      escape = True
                  elif ch == quote:
                      in_string = False
                  continue
              if ch in ('"', "'"):
                  in_string = True
                  quote = ch
              elif ch == '{':
                  depth += 1
              elif ch == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit('DragHandler closing brace not found')
          while end < len(text) and text[end] in ' \t':
              end += 1
          if end < len(text) and text[end] == '\n':
              end += 1
          text = text[:line_start] + text[end:]

          required = [
              'property bool manualResizePreview: isManualItemSlot && previewActive && window.itemSlotInteractionKind === "resize"',
              'property var interactionBounds: manualResizePreview ? bounds : displayBounds',
              'x: interactionBounds.x * zoom',
              'slotOverlay.displayBounds.x - slotOverlay.interactionBounds.x',
              'function resizedBounds(px, py, modifiers)',
              'modifiers & Qt.ShiftModifier',
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'missing final QML token: {token}')
          forbidden = [
              'id: manualItemSlotResizeHandler',
              'enabled: !slotOverlay.isManualItemSlot',
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'forbidden experimental token remains: {token}')

          path.write_text(text, encoding='utf-8')
          PY

          git rm -- .github/workflows/g2-itemslot-final-overlay-patch-once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/srstudio/graphics2/qml/GraphicsEditor.qml
          git commit -m 'fix(g2): stabilize ItemSlot interaction overlay during resize'
          git push origin HEAD:g2/fix-item-slot-interaction-performance
