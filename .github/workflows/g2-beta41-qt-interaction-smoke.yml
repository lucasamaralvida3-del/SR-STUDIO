name: G2 Beta41 Product Images Qt Smoke
on:
  push:
    branches:
      - release/g2beta41-product-images-publish
    paths:
      - '.github/workflows/g2-beta41-qt-interaction-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qt-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QSG_RHI_BACKEND: software
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f803839922799df4ce4e87d7b98fd59fff48e5ab
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup Qt, model adapter and pytest
        shell: pwsh
        run: |
          python -m pip install -e ".[dev,graphics2,background-removal]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Load and interact with editor and image panel offscreen
        shell: pwsh
        run: |
          python -m pytest -q tests/test_graphics2_qml_load.py tests/test_graphics2_image_inspector_qquickwindow_harness.py tests/test_graphics2_image_inspector_qml.py tests/test_graphics2_beta40_single_price_drag.py tests/test_graphics2_withoutbg_and_slot_perf.py tests/test_graphics2_product_image_library_beta41.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
