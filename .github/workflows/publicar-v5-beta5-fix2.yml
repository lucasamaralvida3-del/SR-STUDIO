name: Republicar SR Studio 5.0 Beta 5 - Fix 2

on:
  push:
    branches:
      - next/5.0
    paths:
      - '.github/workflows/publicar-v5-beta5-fix2.yml'

permissions:
  contents: write

jobs:
  corrigir-validar-publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: next/5.0
          fetch-depth: 0

      - name: Preparar dependências
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check "Pillow>=10.0.0" "openpyxl>=3.1.2" "pypdf>=4.0.0" "tkinterdnd2>=0.4.2" "numpy>=1.26,<3" "opencv-python-headless>=4.9.0"

      - name: Aplicar correções reais Beta 5
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $logo='https://raw.githubusercontent.com/${{ github.repository }}/main/staging/logo_update/source/SR_logo.png?ts=${{ github.run_id }}'
          python build/apply_beta5_fixes_v2.py --logo-url $logo

      - name: Validar menu revisão e logo
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          from pathlib import Path
          from PIL import Image
          import ast
          app=Path('src/sr_studio')
          fidelity=(app/'ui'/'studio5_fidelity.py').read_text(encoding='utf-8-sig')
          for token in ('SR5_BETA5_FIDELITY_SCROLL','nav_scroll.pack','self.quick_config_btn','Configurações','<MouseWheel>'):
              assert token in fidelity,token
          review=(app/'SR_Studio_Gerador.py').read_text(encoding='utf-8-sig')
          for token in ('class ReviewWindow','SR5_BETA5_REVIEW_FIRST_PAINT','self.after_idle(_sr5_first_review_paint)','self.after(140,_sr5_first_review_paint)','self.refresh_tree()'):
              assert token in review,token
          ast.parse(fidelity);ast.parse(review)
          logo=app/'assets'/'SR_logo.png'
          with Image.open(logo) as im:
              im.load(); assert im.size==(2048,2048),im.size
              probe=im.convert('RGB').resize((96,96),Image.Resampling.LANCZOS);pix=list(probe.getdata())
          black=sum(1 for r,g,b in pix if r<25 and g<25 and b<25)/len(pix)
          white=sum(1 for r,g,b in pix if r>235 and g>235 and b>235)/len(pix)
          blue=sum(1 for r,g,b in pix if b>110 and b>r*1.15 and b>g*1.05)/len(pix)
          assert black<.12,(black,white,blue)
          assert white>.08,(black,white,blue)
          assert blue>.08,(black,white,blue)
          assert (app/'assets'/'SR_Studio.ico').stat().st_size>10000
          print('BETA5_FIX2_UI_OK',round(black,3),round(white,3),round(blue,3))
          '@ | Set-Content -LiteralPath 'verify_beta5_fix2.py' -Encoding UTF8
          python verify_beta5_fix2.py

      - name: Compilar e testar base 5.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem -LiteralPath 'src/sr_studio' -Filter '*.py' -File -Recurse | ForEach-Object { python -m py_compile $_.FullName }
          Get-ChildItem -LiteralPath 'src/sr_studio' -Filter '*.js' -File | ForEach-Object { node --check $_.FullName }
          python -m unittest tests.test_foundation -v
          python -m unittest tests.test_v5_services -v
          python -m unittest tests.test_v5_importers -v
          python -m unittest tests.test_v5_export_render -v
          python -m unittest tests.test_v5_visual -v
          python -m unittest tests.test_v5_fidelity -v
          $env:PYTHONPATH=(Resolve-Path 'src/sr_studio').Path
          python -c "import SR_Studio_Gerador as app; assert getattr(app.App,'_SR5_FIDELITY_INSTALLED',False); print('APP_BETA5_FIX2_OK',app.APP_VERSION_INFO)"

      - name: Registrar correções na next 5.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'SR Studio Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/sr_studio/ui/studio5_fidelity.py src/sr_studio/SR_Studio_Gerador.py src/sr_studio/assets/SR_logo.png src/sr_studio/assets/SR_Studio.ico
          if(-not (git diff --cached --quiet)){
            git commit -m 'Corrige menu real revisão inicial e logo na Beta 5'
            git push origin HEAD:next/5.0
          }

      - name: Montar pacote Beta 5
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          python build/package_app.py --version '5.0.0-hybrid.beta5' --channel beta --release-label 'Beta 5' --output 'dist/SR_STUDIO_5.0.0_BETA5_CORRECOES_MENU_REVISAO.zip' --metadata 'dist/package.json'
          $m=Get-Content -Raw 'dist/package.json' | ConvertFrom-Json
          if([string]$m.version -ne '5.0.0-hybrid.beta5'){throw 'Versão incorreta no pacote'}
          if([string]$m.channel -ne 'beta'){throw 'Canal incorreto no pacote'}
          if([int64]$m.size -lt 3000000){throw 'Pacote parece incompleto'}

      - name: Validar ZIP final
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import io,json,zipfile
          from pathlib import Path
          from PIL import Image
          p=Path('dist/SR_STUDIO_5.0.0_BETA5_CORRECOES_MENU_REVISAO.zip')
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
              required={'files/SR_Studio_Gerador.py','files/ui/studio5_fidelity.py','files/assets/SR_logo.png','files/assets/SR_Studio.ico','files/version.json'}
              missing=required-names
              assert not missing,missing
              f=z.read('files/ui/studio5_fidelity.py').decode('utf-8-sig')
              r=z.read('files/SR_Studio_Gerador.py').decode('utf-8-sig')
              assert 'SR5_BETA5_FIDELITY_SCROLL' in f and 'self.quick_config_btn' in f
              assert 'SR5_BETA5_REVIEW_FIRST_PAINT' in r and 'after_idle(_sr5_first_review_paint)' in r
              logo=Image.open(io.BytesIO(z.read('files/assets/SR_logo.png')));logo.load();assert logo.size==(2048,2048)
              v=json.loads(z.read('files/version.json').decode('utf-8-sig'))
              assert v.get('distribution_version')=='5.0.0-hybrid.beta5',v
              assert v.get('release_label')=='Beta 5',v
          print('ZIP_BETA5_FIX2_OK')
          '@ | Set-Content -LiteralPath 'dist/verify_zip.py' -Encoding UTF8
          python dist/verify_zip.py

      - name: Criar ou atualizar release Beta 5
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tag='v5.0.0-hybrid.beta5'
          $asset='dist/SR_STUDIO_5.0.0_BETA5_CORRECOES_MENU_REVISAO.zip'
          $notes='SR Studio 5.0 Beta 5. Corrige o menu lateral na camada Fidelity realmente usada pela Beta: rolagem visível, roda do mouse, menor densidade e Configurações sempre acessível no rodapé. Corrige também a ReviewWindow de revisão dos cartazes para preencher e pintar os produtos imediatamente ao abrir, sem depender de clicar em filtros. A logo oficial é reconstruída da fonte original guardada no repositório e validada antes da publicação. Stable permanece inalterada.'
          cmd /c "gh release view $tag >nul 2>&1"
          if($LASTEXITCODE -eq 0){
            gh release upload $tag $asset --clobber
            gh release edit $tag --prerelease --title 'SR Studio 5.0.0 Beta 5 - Menu e Revisão Corrigidos' --notes $notes
          } else {
            gh release create $tag $asset --target 'next/5.0' --prerelease --title 'SR Studio 5.0.0 Beta 5 - Menu e Revisão Corrigidos' --notes $notes
          }

      - name: Atualizar manifesto Beta no main
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $meta=Get-Content -Raw 'dist/package.json' | ConvertFrom-Json
          $asset='SR_STUDIO_5.0.0_BETA5_CORRECOES_MENU_REVISAO.zip'
          $url="https://github.com/${{ github.repository }}/releases/download/v5.0.0-hybrid.beta5/$asset"
          $published=[DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(-3)).ToString('yyyy-MM-ddTHH:mm:sszzz')
          $manifest=[ordered]@{
            format='SRSTUDIO_HYBRID_BUNDLE_1';product='SR Studio';channel='beta';version='5.0.0-hybrid.beta5';product_version='5.0.0';release_label='Beta 5';published_at=$published
            min_launcher='4.0.1-hybrid.base3.1';min_launcher_version='4.0.1-hybrid.base3.1'
            bundle=[ordered]@{url=$url;sha256=[string]$meta.sha256;size=[int64]$meta.size;member_prefix='files/'}
            url=$url;bundle_url=$url;sha256=[string]$meta.sha256;size=[int64]$meta.size;member_prefix='files/'
            notes='SR Studio 5.0 Beta 5 — menu Fidelity rolável com Configurações sempre acessível, revisão dos cartazes carregando produtos imediatamente e logo oficial íntegra.'
          }
          git fetch origin main
          $work=Join-Path $env:RUNNER_TEMP 'srstudio-main-beta5-fix2'
          if(Test-Path $work){Remove-Item -LiteralPath $work -Recurse -Force}
          git worktree add $work origin/main
          New-Item -ItemType Directory -Path (Join-Path $work 'beta') -Force | Out-Null
          [IO.File]::WriteAllText((Join-Path $work 'beta/manifest.json'),(($manifest|ConvertTo-Json -Depth 20)+"`n"),(New-Object Text.UTF8Encoding($false)))
          Push-Location $work
          git config user.name 'SR Studio Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add beta/manifest.json
          git commit -m 'Publica SR Studio 5.0.0 Beta 5 - Menu e Revisão Corrigidos'
          git push origin HEAD:main
          Pop-Location

      - name: Verificar publicação real
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $local=Get-Content -Raw 'dist/package.json' | ConvertFrom-Json
          $release=gh api repos/${{ github.repository }}/releases/tags/v5.0.0-hybrid.beta5 | ConvertFrom-Json
          if(-not $release.prerelease){throw 'Release não é prerelease'}
          $asset=$release.assets | Where-Object name -eq 'SR_STUDIO_5.0.0_BETA5_CORRECOES_MENU_REVISAO.zip' | Select-Object -First 1
          if(-not $asset){throw 'Asset Beta 5 ausente'}
          if([int64]$asset.size -ne [int64]$local.size){throw 'Tamanho do asset divergente'}
          git fetch origin main
          $txt=git show origin/main:beta/manifest.json
          $m=$txt | ConvertFrom-Json
          if([string]$m.version -ne '5.0.0-hybrid.beta5'){throw 'Manifesto ainda não aponta para Beta 5'}
          if([string]$m.sha256 -ne [string]$local.sha256){throw 'SHA do manifesto divergente'}
          if([int64]$m.size -ne [int64]$local.size){throw 'Tamanho do manifesto divergente'}
          Write-Host ('PUBLICACAO_BETA5_OK version=' + $m.version + ' sha=' + $m.sha256 + ' size=' + $m.size)
