name: Publicar SR Studio 5.0 Beta 6 - Atualizacao Garantida

on:
  push:
    branches:
      - next/5.0
    paths:
      - '.github/workflows/publicar-v5-beta6.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: next/5.0
          fetch-depth: 0

      - name: Preparar dependencias
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check "Pillow>=10.0.0" "openpyxl>=3.1.2" "pypdf>=4.0.0" "tkinterdnd2>=0.4.2" "numpy>=1.26,<3" "opencv-python-headless>=4.9.0"

      - name: Aplicar protecao de atualizacao
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python build/apply_beta6_update_guard.py

      - name: Validar aplicativo e Launcher
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m py_compile src/sr_studio/SR_Studio_Gerador.py
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'launcher/files/SRStudioLauncher.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors -and $errors.Count -gt 0){ throw "Launcher PowerShell invalido: $($errors[0].Message)" }
          $app=Get-Content -Raw 'src/sr_studio/SR_Studio_Gerador.py'
          $launcher=Get-Content -Raw 'launcher/files/SRStudioLauncher.ps1'
          foreach($token in @('SR5_BETA6_DIRECT_LAUNCH_GUARD','SR_STUDIO_LAUNCHED_BY_UPDATER','SRStudioBootstrap.ps1')){ if(-not $app.Contains($token)){ throw "Guard do app ausente: $token" } }
          foreach($token in @('SR5_BETA6_LAUNCH_GUARD','4.0.1-hybrid.base3.2','Start-SrGuardedProcess $pythonPath')){ if(-not $launcher.Contains($token)){ throw "Guard do Launcher ausente: $token" } }
          if($launcher.Contains('Start-Process -FilePath $pythonPath')){ throw 'Launcher ainda abre Python sem marcador' }
          node --check src/sr_studio/Encartes13_fidelity.js
          python -m unittest tests.test_foundation -v
          python -m unittest tests.test_v5_services -v
          python -m unittest tests.test_v5_importers -v
          python -m unittest tests.test_v5_http_bridge -v
          python -m unittest tests.test_v5_export_render -v
          python -m unittest tests.test_v5_visual -v
          python -m unittest tests.test_v5_fidelity -v

      - name: Registrar Beta 6 na base 5.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'SR Studio Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/sr_studio/SR_Studio_Gerador.py launcher/files/SRStudioLauncher.ps1
          if(-not (git diff --cached --quiet)){
            git commit -m 'Garante verificacao de atualizacoes em toda abertura na Beta 6'
            git push origin HEAD:next/5.0
          }

      - name: Montar pacote Beta 6
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          python build/package_app.py --version '5.0.0-hybrid.beta6' --channel beta --release-label 'Beta 6' --output 'dist/SR_STUDIO_5.0.0_BETA6_ATUALIZACAO_GARANTIDA.zip' --metadata 'dist/package.json'
          $meta=Get-Content -Raw 'dist/package.json' | ConvertFrom-Json
          if([string]$meta.version -ne '5.0.0-hybrid.beta6'){ throw 'Versao Beta 6 incorreta' }
          if([int64]$meta.size -lt 3000000){ throw 'Pacote Beta 6 incompleto' }

      - name: Validar pacote Beta 6
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json,zipfile
          from pathlib import Path
          p=Path('dist/SR_STUDIO_5.0.0_BETA6_ATUALIZACAO_GARANTIDA.zip')
          with zipfile.ZipFile(p) as z:
              app=z.read('files/SR_Studio_Gerador.py').decode('utf-8-sig')
              assert 'SR5_BETA6_DIRECT_LAUNCH_GUARD' in app
              assert 'SR_STUDIO_LAUNCHED_BY_UPDATER' in app
              v=json.loads(z.read('files/version.json').decode('utf-8-sig'))
              assert v.get('distribution_version')=='5.0.0-hybrid.beta6',v
              assert 'files/ui/studio5_visual.py' in z.namelist()
              assert 'files/SRStudio21.py' in z.namelist()
              assert 'files/assets/SR_logo.png' in z.namelist()
          print('ZIP_BETA6_OK')
          '@ | Set-Content -LiteralPath 'dist/verify_beta6.py' -Encoding UTF8
          python dist/verify_beta6.py

      - name: Publicar release Beta 6
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tag='v5.0.0-hybrid.beta6'
          $asset='dist/SR_STUDIO_5.0.0_BETA6_ATUALIZACAO_GARANTIDA.zip'
          $notes='Beta 6: corrige definitivamente aberturas que pulavam o sistema de atualizacao. O Launcher marca a abertura oficial; se a copia instalada for aberta diretamente por Python, atalho antigo ou pin da barra de tarefas, o proprio SR Studio redireciona para o Bootstrap antes de iniciar. Preserva as correcoes da Beta 5: menu lateral rolavel, Configuracoes acessivel e revisao de produtos carregada ao abrir.'
          cmd /c "gh release view $tag >nul 2>&1"
          if($LASTEXITCODE -eq 0){
            gh release upload $tag $asset --clobber
            gh release edit $tag --prerelease --title 'SR Studio 5.0.0 Beta 6 - Atualizacao Garantida' --notes $notes
          } else {
            gh release create $tag $asset --target 'next/5.0' --prerelease --title 'SR Studio 5.0.0 Beta 6 - Atualizacao Garantida' --notes $notes
          }

      - name: Atualizar Launcher e manifesto Beta oficiais
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $meta=Get-Content -Raw 'dist/package.json' | ConvertFrom-Json
          $launcherPath=Resolve-Path 'launcher/files/SRStudioLauncher.ps1'
          $launcherSha=(Get-FileHash -Algorithm SHA256 -LiteralPath $launcherPath).Hash.ToLowerInvariant()
          $launcherSize=(Get-Item -LiteralPath $launcherPath).Length
          $published=[DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(-3)).ToString('yyyy-MM-ddTHH:mm:sszzz')
          $asset='SR_STUDIO_5.0.0_BETA6_ATUALIZACAO_GARANTIDA.zip'
          $url="https://github.com/${{ github.repository }}/releases/download/v5.0.0-hybrid.beta6/$asset"
          $betaManifest=[ordered]@{
            format='SRSTUDIO_HYBRID_BUNDLE_1'; product='SR Studio'; channel='beta'; version='5.0.0-hybrid.beta6'; product_version='5.0.0'; release_label='Beta 6'; published_at=$published;
            min_launcher='4.0.1-hybrid.base3.2'; min_launcher_version='4.0.1-hybrid.base3.2';
            bundle=[ordered]@{url=$url;sha256=[string]$meta.sha256;size=[int64]$meta.size;member_prefix='files/'};
            url=$url;bundle_url=$url;sha256=[string]$meta.sha256;size=[int64]$meta.size;member_prefix='files/';
            notes='SR Studio 5.0 Beta 6 - toda abertura instalada passa pelo Bootstrap/Launcher antes do Core; atalhos antigos e abertura direta deixam de pular a verificacao de atualizacoes.'
          }
          $launcherManifest=[ordered]@{
            format='SRSTUDIO_LAUNCHER_MANIFEST_1'; product='SR Studio Launcher'; version='4.0.1-hybrid.base3.2'; published_at=$published;
            files=@([ordered]@{path='SRStudioLauncher.ps1';source='launcher/files/SRStudioLauncher.ps1';sha256=$launcherSha;size=[int64]$launcherSize})
          }
          git fetch origin main
          $work=Join-Path $env:RUNNER_TEMP 'srstudio-main-beta6'
          if(Test-Path $work){ Remove-Item -LiteralPath $work -Recurse -Force }
          git worktree add $work origin/main
          New-Item -ItemType Directory -Path (Join-Path $work 'launcher/files') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $work 'manifests') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $work 'beta') -Force | Out-Null
          Copy-Item -LiteralPath $launcherPath -Destination (Join-Path $work 'launcher/files/SRStudioLauncher.ps1') -Force
          [IO.File]::WriteAllText((Join-Path $work 'manifests/launcher.json'),(($launcherManifest|ConvertTo-Json -Depth 20)+"`n"),(New-Object Text.UTF8Encoding($false)))
          [IO.File]::WriteAllText((Join-Path $work 'beta/manifest.json'),(($betaManifest|ConvertTo-Json -Depth 20)+"`n"),(New-Object Text.UTF8Encoding($false)))
          Push-Location $work
          git config user.name 'SR Studio Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add launcher/files/SRStudioLauncher.ps1 manifests/launcher.json beta/manifest.json
          git commit -m 'Publica Beta 6 e Launcher Base 3.2 com atualizacao garantida'
          git push origin HEAD:main
          Pop-Location

      - name: Verificar publicacao final
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Start-Sleep -Seconds 4
          $release=gh api repos/${{ github.repository }}/releases/tags/v5.0.0-hybrid.beta6 | ConvertFrom-Json
          if(-not $release.prerelease){ throw 'Beta 6 nao esta como prerelease' }
          $asset=$release.assets | Where-Object name -eq 'SR_STUDIO_5.0.0_BETA6_ATUALIZACAO_GARANTIDA.zip' | Select-Object -First 1
          if(-not $asset){ throw 'Asset Beta 6 ausente' }
          $local=Get-Content -Raw 'dist/package.json' | ConvertFrom-Json
          if([int64]$asset.size -ne [int64]$local.size){ throw 'Tamanho Beta 6 divergente' }
          $stamp=[DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $m=Invoke-RestMethod -Uri ("https://raw.githubusercontent.com/${{ github.repository }}/main/beta/manifest.json?ts="+$stamp) -Headers @{'Cache-Control'='no-cache'}
          if([string]$m.version -ne '5.0.0-hybrid.beta6'){ throw "Manifesto Beta incorreto: $($m.version)" }
          if([string]$m.sha256 -ne [string]$local.sha256){ throw 'SHA Beta 6 divergente' }
          $lm=Invoke-RestMethod -Uri ("https://raw.githubusercontent.com/${{ github.repository }}/main/manifests/launcher.json?ts="+$stamp) -Headers @{'Cache-Control'='no-cache'}
          if([string]$lm.version -ne '4.0.1-hybrid.base3.2'){ throw "Manifesto Launcher incorreto: $($lm.version)" }
          Write-Host "BETA6_PUBLICADA $($m.version) $($m.sha256) $($m.size) LAUNCHER=$($lm.version)"
