name: G2 Fix Import Reset Syntax

on:
  push:
    branches:
      - g2/fix-smart-slot-import-reset
    paths:
      - '.github/workflows/g2-fix-import-reset-syntax.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g2/fix-smart-slot-import-reset
          fetch-depth: 0

      - name: Repair exact syntax and self-remove
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/srstudio/graphics2/import_bridge.py')
          text = path.read_text(encoding='utf-8')
          bad = '''            confidence=float((card.overrides.get("recognition_confidence", 1.0) if card is not None else 1.0) or 1.0,\n            ),\n'''
          good = '''            confidence=float((card.overrides.get("recognition_confidence", 1.0) if card is not None else 1.0) or 1.0),\n'''
          count = text.count(bad)
          if count != 1:
              raise SystemExit(f'fail-closed: expected one syntax target, got {count}')
          path.write_text(text.replace(bad, good, 1), encoding='utf-8')

      - name: Commit repair
        shell: bash
        run: |
          git rm .github/workflows/g2-fix-import-reset-syntax.yml
          git config user.name 'sr-studio-beta-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/srstudio/graphics2/import_bridge.py
          git commit -m 'fix(g2): repair Smart Slot import reset patch'
          git push origin HEAD:g2/fix-smart-slot-import-reset
