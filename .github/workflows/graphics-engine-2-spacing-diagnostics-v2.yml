name: SR Graphics2 Spacing Diagnostics V2

on:
  push:
    branches:
      - integration/sr-studio-next
    paths:
      - 'src/srstudio/graphics2/**'
      - 'tests/test_graphics2_*.py'
      - '.github/workflows/graphics-engine-2-spacing-diagnostics-v2.yml'

permissions:
  contents: read

jobs:
  exact-spacing-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -U pip && python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_graphics2_pptx_spacing_coverage.py

  spacing-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -U pip && python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_graphics2_pptx_spacing_recovery.py tests/test_graphics2_pptx_spacing_pipeline.py

  pptx-structure-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -U pip && python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_graphics2_pptx_structure.py

  production-gate-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -U pip && python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_graphics2_quality_gate.py

  quality-inspector-spacing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -U pip && python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_graphics2_quality_inspector_spacing.py tests/test_graphics2_quality_inspector_qml.py
