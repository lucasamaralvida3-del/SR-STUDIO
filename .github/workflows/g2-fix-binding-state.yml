name: G2 Fix Binding State

on:
  push:
    branches:
      - g2/fix-smart-slot-import-reset
    paths:
      - '.github/workflows/g2-fix-binding-state.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g2/fix-smart-slot-import-reset
          fetch-depth: 0

      - name: Patch binding state directly in transaction
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/srstudio/graphics2/import_bridge.py')
          text = path.read_text(encoding='utf-8')

          old_import = 'from .smart_slot_import_reset import mark_slot_product_filled, reset_new_pptx_import_product_content\n'
          new_import = 'from .smart_slot_import_reset import reset_new_pptx_import_product_content\n'
          if text.count(old_import) != 1:
              raise SystemExit('fail-closed: binding helper import target mismatch')
          text = text.replace(old_import, new_import, 1)

          old_state = '''            slot.product_id = str(product.get("id") or product.get("product_id") or "")\n            slot.metadata["product_snapshot"] = dict(product)\n'''
          new_state = '''            slot.product_id = str(product.get("id") or product.get("product_id") or "")\n            slot.metadata["product_snapshot"] = dict(product)\n            slot.metadata["product_binding_state"] = "filled"\n            slot.metadata["product_content_empty"] = False\n            slot.metadata.pop("product_reset_reason", None)\n'''
          if text.count(old_state) != 1:
              raise SystemExit('fail-closed: binding state target mismatch')
          text = text.replace(old_state, new_state, 1)

          old_node = '''                    node = session.page.node(node_id)\n                    if node is None:\n                        continue\n'''
          new_node = '''                    node = session.page.node(node_id)\n                    if node is None:\n                        continue\n                    node.metadata["product_binding_empty"] = False\n'''
          if text.count(old_node) != 1:
              raise SystemExit('fail-closed: binding node target mismatch')
          text = text.replace(old_node, new_node, 1)

          old_helper = '''            mark_slot_product_filled(\n                slot,\n                node_ids=[node_id for node_ids in bindings.values() for node_id in node_ids],\n                page=session.page,\n            )\n'''
          if text.count(old_helper) != 1:
              raise SystemExit('fail-closed: helper call target mismatch')
          text = text.replace(old_helper, '', 1)
          path.write_text(text, encoding='utf-8')

      - name: Remove now-unused helper function
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/srstudio/graphics2/smart_slot_import_reset.py')
          text = path.read_text(encoding='utf-8')
          marker = '\n\ndef mark_slot_product_filled('
          index = text.find(marker)
          if index < 0:
              raise SystemExit('fail-closed: mark_slot_product_filled not found')
          path.write_text(text[:index].rstrip() + '\n', encoding='utf-8')

      - name: Validate Python syntax
        shell: bash
        run: |
          python -m py_compile src/srstudio/graphics2/import_bridge.py src/srstudio/graphics2/smart_slot_import_reset.py

      - name: Commit repair and self-remove
        shell: bash
        run: |
          git rm .github/workflows/g2-fix-binding-state.yml
          git config user.name 'sr-studio-beta-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/srstudio/graphics2/import_bridge.py src/srstudio/graphics2/smart_slot_import_reset.py
          git commit -m 'fix(g2): persist filled state inside product binding transaction'
          git push origin HEAD:g2/fix-smart-slot-import-reset
