name: Finalizar SR Studio 5.0 Beta 6

on:
  push:
    branches: [next/5.0]
    paths:
      - '.github/workflows/finalizar-v5-beta6.yml'

permissions:
  contents: write

jobs:
  finalizar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: next/5.0
          fetch-depth: 0

      - name: Validar base Beta 6
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m py_compile src/sr_studio/SR_Studio_Gerador.py
          $app=Get-Content -Raw src/sr_studio/SR_Studio_Gerador.py
          $launcher=Get-Content -Raw launcher/files/SRStudioLauncher.ps1
          foreach($t in @('SR5_BETA6_DIRECT_LAUNCH_GUARD','SR_STUDIO_LAUNCHED_BY_UPDATER')){if(-not $app.Contains($t)){throw "App sem $t"}}
          foreach($t in @('SR5_BETA6_LAUNCH_GUARD','4.0.1-hybrid.base3.2','Start-SrGuardedProcess $pythonPath')){if(-not $launcher.Contains($t)){throw "Launcher sem $t"}}
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path launcher/files/SRStudioLauncher.ps1),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors -and $errors.Count -gt 0){throw "Launcher PowerShell invalido: $($errors[0].Message)"}

      - name: Montar e validar ZIP Beta 6
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path dist -Force|Out-Null
          python build/package_app.py --version '5.0.0-hybrid.beta6' --channel beta --release-label 'Beta 6' --output 'dist/SR_STUDIO_5.0.0_BETA6_ATUALIZACAO_GARANTIDA.zip' --metadata 'dist/package.json'
          @'
          import json,zipfile
          from pathlib import Path
          p=Path('dist/SR_STUDIO_5.0.0_BETA6_ATUALIZACAO_GARANTIDA.zip')
          assert p.stat().st_size>2_000_000,p.stat().st_size
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
              required={
                'files/SR_Studio_Gerador.py','files/SRStudio21.py','files/ui/studio5_visual.py',
                'files/ui/studio5_fidelity.py','files/ui/splash_v5.py','files/ui/hidpi.py',
                'files/assets/SR_logo.png','files/assets/SR_Studio.ico','files/version.json',
                'files/Encartes13_fidelity.css','files/Encartes13_fidelity.js'
              }
              missing=required-names
              assert not missing,missing
              app=z.read('files/SR_Studio_Gerador.py').decode('utf-8-sig')
              assert 'SR5_BETA6_DIRECT_LAUNCH_GUARD' in app
              assert 'SR_STUDIO_LAUNCHED_BY_UPDATER' in app
              menu=z.read('files/ui/studio5_visual.py').decode('utf-8-sig')
              assert 'SR5_BETA5_NAV_MOUSEWHEEL' in menu and 'self.quick_config_btn' in menu
              review=z.read('files/SRStudio21.py').decode('utf-8-sig')
              assert 'SR5_BETA5_INITIAL_REVIEW_REFRESH' in review
              v=json.loads(z.read('files/version.json').decode('utf-8-sig'))
              assert v.get('distribution_version')=='5.0.0-hybrid.beta6',v
              assert v.get('release_label')=='Beta 6',v
          print('BETA6_ZIP_COMPLETO',p.stat().st_size,len(names))
          '@ | Set-Content dist/check.py -Encoding UTF8
          python dist/check.py

      - name: Publicar release Beta 6
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tag='v5.0.0-hybrid.beta6'
          $asset='dist/SR_STUDIO_5.0.0_BETA6_ATUALIZACAO_GARANTIDA.zip'
          $notes='Beta 6 - Atualizacao Garantida. O SR Studio instalado nao pode mais pular a verificacao: o Launcher marca a abertura oficial e qualquer abertura direta por Python, atalho antigo ou pin da barra e redirecionada ao Bootstrap. Inclui menu rolavel, Configuracoes acessivel e revisao de produtos corrigida da Beta 5.'
          cmd /c "gh release view $tag >nul 2>&1"
          if($LASTEXITCODE -eq 0){gh release upload $tag $asset --clobber;gh release edit $tag --prerelease --title 'SR Studio 5.0.0 Beta 6 - Atualizacao Garantida' --notes $notes}
          else{gh release create $tag $asset --target next/5.0 --prerelease --title 'SR Studio 5.0.0 Beta 6 - Atualizacao Garantida' --notes $notes}

      - name: Atualizar main com Launcher e manifestos
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $meta=Get-Content -Raw dist/package.json|ConvertFrom-Json
          $launcher=(Resolve-Path launcher/files/SRStudioLauncher.ps1).Path
          $lsha=(Get-FileHash -Algorithm SHA256 $launcher).Hash.ToLowerInvariant();$lsize=(Get-Item $launcher).Length
          $now=[DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(-3)).ToString('yyyy-MM-ddTHH:mm:sszzz')
          $asset='SR_STUDIO_5.0.0_BETA6_ATUALIZACAO_GARANTIDA.zip';$url="https://github.com/${{ github.repository }}/releases/download/v5.0.0-hybrid.beta6/$asset"
          $beta=[ordered]@{format='SRSTUDIO_HYBRID_BUNDLE_1';product='SR Studio';channel='beta';version='5.0.0-hybrid.beta6';product_version='5.0.0';release_label='Beta 6';published_at=$now;min_launcher='4.0.1-hybrid.base3.2';min_launcher_version='4.0.1-hybrid.base3.2';bundle=[ordered]@{url=$url;sha256=[string]$meta.sha256;size=[int64]$meta.size;member_prefix='files/'};url=$url;bundle_url=$url;sha256=[string]$meta.sha256;size=[int64]$meta.size;member_prefix='files/';notes='Beta 6 - atualizacao garantida em toda abertura instalada.'}
          $lm=[ordered]@{format='SRSTUDIO_LAUNCHER_MANIFEST_1';product='SR Studio Launcher';version='4.0.1-hybrid.base3.2';published_at=$now;files=@([ordered]@{path='SRStudioLauncher.ps1';source='launcher/files/SRStudioLauncher.ps1';sha256=$lsha;size=[int64]$lsize})}
          git fetch origin main
          $work=Join-Path $env:RUNNER_TEMP 'sr-main-beta6-final';if(Test-Path $work){Remove-Item $work -Recurse -Force}
          git worktree add $work origin/main
          New-Item -ItemType Directory -Force -Path (Join-Path $work 'launcher/files'),(Join-Path $work 'manifests'),(Join-Path $work 'beta')|Out-Null
          Copy-Item $launcher (Join-Path $work 'launcher/files/SRStudioLauncher.ps1') -Force
          [IO.File]::WriteAllText((Join-Path $work 'manifests/launcher.json'),(($lm|ConvertTo-Json -Depth 20)+"`n"),(New-Object Text.UTF8Encoding($false)))
          [IO.File]::WriteAllText((Join-Path $work 'beta/manifest.json'),(($beta|ConvertTo-Json -Depth 20)+"`n"),(New-Object Text.UTF8Encoding($false)))
          Push-Location $work
          git config user.name 'SR Studio Update Bot';git config user.email 'actions@users.noreply.github.com'
          git add launcher/files/SRStudioLauncher.ps1 manifests/launcher.json beta/manifest.json
          git commit -m 'Publica Beta 6 e Launcher 4.0.1 Base 3.2'
          git push origin HEAD:main
          Pop-Location

      - name: Verificar release e manifestos
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';Start-Sleep 4
          $meta=Get-Content -Raw dist/package.json|ConvertFrom-Json
          $r=gh api repos/${{ github.repository }}/releases/tags/v5.0.0-hybrid.beta6|ConvertFrom-Json
          if(-not $r.prerelease){throw 'Beta 6 nao esta prerelease'}
          $a=$r.assets|Where-Object name -eq 'SR_STUDIO_5.0.0_BETA6_ATUALIZACAO_GARANTIDA.zip'|Select-Object -First 1
          if(-not $a){throw 'Asset Beta 6 ausente'}
          if([int64]$a.size -ne [int64]$meta.size){throw 'Tamanho da release divergente'}
          if(([string]$a.digest) -and ([string]$a.digest -ne ('sha256:'+[string]$meta.sha256))){throw 'Digest da release divergente'}
          $ts=[DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $m=Invoke-RestMethod -Uri ("https://raw.githubusercontent.com/${{ github.repository }}/main/beta/manifest.json?ts="+$ts) -Headers @{'Cache-Control'='no-cache'}
          $lm=Invoke-RestMethod -Uri ("https://raw.githubusercontent.com/${{ github.repository }}/main/manifests/launcher.json?ts="+$ts) -Headers @{'Cache-Control'='no-cache'}
          if($m.version -ne '5.0.0-hybrid.beta6'){throw "Beta manifest=$($m.version)"}
          if($m.sha256 -ne $meta.sha256){throw 'SHA manifesto divergente'}
          if($lm.version -ne '4.0.1-hybrid.base3.2'){throw "Launcher manifest=$($lm.version)"}
          Write-Host "BETA6_FINAL_OK $($m.version) $($m.sha256) $($m.size) LAUNCHER=$($lm.version)"
