name: Publish G2 Beta 39 Fluid Smart Slot + Delta
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: sr-studio-beta-channel-promotion
  cancel-in-progress: false

jobs:
  promote-beta39:
    if: github.repository == 'lucasamaralvida3-del/SR-STUDIO' && github.ref == 'refs/heads/release/g2beta39-smart-slot-withoutbg'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_SHA: d9b64eae091b6cf0de37ed8bc3d2211b2ea16e39
      SOURCE_RUN_ID: '40020449403'
      CANDIDATE_ARTIFACT: SR-Studio-G2-Beta39-Slot-WithoutBG-Windows-x64
      BETA_VERSION: 5.0.0-hybrid.g2beta.39
      BETA_TAG: g2-beta-39
      BETA_LABEL: G2 Beta 39 - Smart Slot otimizado e withoutBG
      BETA_BUNDLE_NAME: SR_STUDIO_G2_BETA_39_SMART_SLOT_WITHOUTBG_PROFESSIONAL.zip
      BETA_DELTA_NAME: SR_STUDIO_G2_BETA_39_DELTA_FROM_38.zip
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require successful Windows candidate and delta Launcher 2.6
        shell: bash
        run: |
          set -euo pipefail
          outcome=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .conclusion)
          test "$outcome" = success
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/manifests/launcher.json?ref=main" > launcher-live.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('launcher-live.json').read_text(encoding='utf-8'))
          assert data['version'] == '4.0.1-hybrid.base2.6', data['version']
          assert data['files'][0]['sha256']
          print('DELTA_LAUNCHER_BASE26_VERIFIED')
          PY

      - name: Verify validated source run
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .head_sha)
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .conclusion)
          event=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .event)
          test "$source_sha" = "$SOURCE_SHA"
          test "$conclusion" = success
          test "$event" = push
          echo "VALIDATED_CANDIDATE_SOURCE=$source_sha"

      - name: Download exact Windows build artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$CANDIDATE_ARTIFACT" --dir candidate
          test -f candidate/SR-Studio-G2-Beta39-Slot-WithoutBG-Windows-x64.zip
          test -f candidate/limpeza-blue-provenance.json

      - name: Verify candidate and assemble launcher-compatible bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, json, os, shutil, zipfile
          root = Path.cwd()
          archive = root / 'candidate/SR-Studio-G2-Beta39-Slot-WithoutBG-Windows-x64.zip'
          provenance = json.loads((root / 'candidate/limpeza-blue-provenance.json').read_text(encoding='utf-8-sig'))
          sha = os.environ['SOURCE_SHA']
          digest = hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest()
          assert provenance['schema'] == 'srstudio/g2-beta39-fluid-slots-candidate/1'
          assert provenance['source_sha'] == sha, (provenance['source_sha'], sha)
          assert provenance['sha256'].lower() == digest, 'Candidate hash mismatch'
          assert provenance['size_bytes'] == archive.stat().st_size
          assert provenance['preset'] == 'limpeza-blue-v1'
          assert provenance.get('profile_version') == 2
          source = root / 'candidate-extracted'
          source.mkdir()
          with zipfile.ZipFile(archive) as z:
              names = [i.filename.replace('\\', '/') for i in z.infolist()]
              assert len(names) == len(set(names))
              assert len(names) == len({n.casefold() for n in names})
              for name in names:
                  parts = PurePosixPath(name).parts
                  assert parts and '..' not in parts and not name.startswith('/') and ':' not in name
              assert z.testzip() is None
              z.extractall(source)
          assert (source / 'SR Studio 5.exe').is_file()
          assert (source / 'Graphics2Host/SRGraphicsEngine2Host.exe').is_file()
          qt = list((source / 'Graphics2Host').rglob('*Qt*Quick*'))
          assert qt, 'Missing Qt Quick runtime'
          stage = root / 'bundle-stage'
          files = stage / 'files'
          studio = files / 'SRStudio5'
          shutil.copytree(source, studio)
          launcher = (
              'from pathlib import Path\n'
              'import subprocess\n'
              'import sys\n'
              'root = Path(__file__).resolve().parent\n'
              'exe = root / "SRStudio5" / "SR Studio 5.exe"\n'
              'if not exe.is_file():\n'
              '    raise FileNotFoundError(str(exe))\n'
              'subprocess.Popen([str(exe)], cwd=str(exe.parent))\n'
              'sys.exit(0)\n'
          )
          (files / 'SR_Studio_Gerador.py').write_text(launcher, encoding='utf-8')
          (files / 'VERSAO.txt').write_text(os.environ['BETA_VERSION'] + '\n', encoding='utf-8')
          version = {
              'version': os.environ['BETA_VERSION'],
              'product_version': '5.0.0',
              'channel': 'beta',
              'release_label': os.environ['BETA_LABEL'],
              'entrypoint': 'SR_Studio_Gerador.py',
              'professional_executable': 'SRStudio5/SR Studio 5.exe',
              'graphics2_primary': True,
              'poster_quantity': True,
              'source_commit': sha,
              'limpeza_blue_single_slot': True,
          }
          (files / 'version.json').write_text(json.dumps(version, indent=2, ensure_ascii=False), encoding='utf-8')
          out = root / os.environ['BETA_BUNDLE_NAME']
          # Deterministic archive for safe retries, without relying on filesystem timestamps.
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for path in sorted(files.rglob('*')):
                  if not path.is_file():
                      continue
                  rel = path.relative_to(stage).as_posix()
                  info = zipfile.ZipInfo(rel, date_time=(2020, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  with path.open('rb') as inp, z.open(info, 'w', force_zip64=True) as dest:
                      shutil.copyfileobj(inp, dest, length=1024*1024)
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              names = set(z.namelist())
              assert 'files/SR_Studio_Gerador.py' in names
              assert 'files/SRStudio5/SR Studio 5.exe' in names
              assert 'files/SRStudio5/Graphics2Host/SRGraphicsEngine2Host.exe' in names
              assert json.loads(z.read('files/version.json'))['source_commit'] == sha
          final_sha = hashlib.file_digest(out.open('rb'), 'sha256').hexdigest()
          size = out.stat().st_size
          with (root / 'beta39-checksum.txt').open('w') as f:
              f.write(f'{final_sha}  {out.name}\n')
          with (root / 'beta39-evidence.json').open('w') as f:
              json.dump({'source_sha': sha, 'source_run_id': os.environ['SOURCE_RUN_ID'], 'sha256': final_sha,
                         'bytes': size, 'artifact': out.name, 'candidate_sha256': digest,
                         'visual_certification': 'pending manual review'}, f, indent=2)
          with (Path(os.environ['GITHUB_ENV'])).open('a') as f:
              f.write(f'BETA_SHA256={final_sha}\nBETA_SIZE={size}\n')
          print('BETA_BUNDLE_SHA256', final_sha, 'BYTES', size)
          PY

      - name: Build hash-verified delta package from Beta 37
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previous
          gh release download g2-beta-38 --repo "$GITHUB_REPOSITORY" \
            --pattern "SR_STUDIO_G2_BETA_38_FLUID_SMART_SLOT_PROFESSIONAL.zip" --dir previous
          python - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path, PurePosixPath
          oldname=Path("previous/SR_STUDIO_G2_BETA_38_FLUID_SMART_SLOT_PROFESSIONAL.zip")
          newname=Path(os.environ['BETA_BUNDLE_NAME'])
          out=Path(os.environ['BETA_DELTA_NAME'])
          def digest(data): return hashlib.sha256(data).hexdigest()
          def list_paths(archive):
              result={}
              for name in archive.namelist():
                  if name.endswith('/'): continue
                  parts=PurePosixPath(name).parts
                  assert len(parts)>=2 and parts[0]=='files' and '..' not in parts and '\\' not in name
                  relative='/'.join(parts[1:])
                  assert relative not in result
                  result[relative]=name
              return result
          with zipfile.ZipFile(oldname) as oldzip,zipfile.ZipFile(newname) as newzip:
              assert oldzip.testzip() is None
              assert newzip.testzip() is None
              old=list_paths(oldzip)
              new=list_paths(newzip)
              before={k:digest(oldzip.read(v)) for k,v in old.items()}
              after={k:digest(newzip.read(v)) for k,v in new.items()}
              changed=sorted(k for k in new if before.get(k)!=after[k])
              deleted=sorted(set(old)-set(new))
              assert changed
              files=[]
              with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as delta:
                  for rel in changed:
                      payload=newzip.read(new[rel])
                      delta.writestr('files/'+rel,payload)
                      files.append({'path':rel,'sha256':after[rel],'size':len(payload)})
              with zipfile.ZipFile(out) as delta:
                  assert delta.testzip() is None
                  reconstructed={k:v for k,v in before.items() if k not in deleted}
                  for file in files:
                      reconstructed[file['path']]=digest(delta.read('files/'+file['path']))
                  assert reconstructed==after, 'Delta reconstruction failed'
          payload=out.read_bytes()
          size=len(payload)
          assert size < newname.stat().st_size, 'Incremental archive must save download bandwidth'
          sha=digest(payload)
          meta={'format':'SRSTUDIO_DELTA_FILES_1',
                'from_version':'5.0.0-hybrid.g2beta.38',
                'target_version':os.environ['BETA_VERSION'],
                'member_prefix':'files/','sha256':sha,'size':size,
                'files':files,'delete':deleted}
          Path('beta39-delta.json').write_text(json.dumps(meta,indent=2),encoding='utf-8')
          Path('beta39-delta-checksum.txt').write_text(f'{sha}  {out.name}\n',encoding='ascii')
          with open(os.environ['GITHUB_ENV'],'a') as handle:
              handle.write(f'DELTA_SHA256={sha}\nDELTA_SIZE={size}\n')
          print('DELTA_FILES',len(files),'DELTA_BYTES',size,'FULL_BYTES',newname.stat().st_size)
          PY

      - name: Create prerelease without touching Beta 35
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$BETA_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && {
            echo "Beta 37 release tag already exists; refusing to overwrite" >&2
            exit 1
          }
          cat > release-notes.md <<'MD'
          # SR Studio G2 Beta 39 — Smart Slot fluido
          - Correção estrutural: Smart Slot move e dimensiona o artwork real, inclusive produto e preços.
          - Remoção de fundo withoutBG local (download de modelo ao primeiro uso, sem bloqueio Qt).
          - Prévia leve para cartões densos de PPTX e sem renderizar toda a cena por movimento.
          - Produto importado acompanha o slot; desenho e imagem atualizados sem comandos Python por movimento.
          - Snap final na soltura, preservando ajustes, preços e SR Scene.
          - Download incremental de arquivos alterados da Beta 37 para a Beta 38 com Launcher 2.6.
          - Fallback seguro para pacote completo, SHA-256 e manutenção da versão Stable.
          - A fluidez real, remoção de fundo e as licenças de modelos exigem confirmação do usuário no Windows.
          MD
          gh release create "$BETA_TAG" "$BETA_BUNDLE_NAME" beta39-checksum.txt "$BETA_DELTA_NAME" beta39-delta.json beta39-delta-checksum.txt \
            --repo "$GITHUB_REPOSITORY" --title "SR Studio - G2 Beta 39 Smart Slot e withoutBG" \
            --notes-file release-notes.md --prerelease --latest=false --target "$SOURCE_SHA"
          tag_target=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$BETA_TAG" --jq .object.sha)
          test "$tag_target" = "$SOURCE_SHA"

      - name: Verify public download using two independent clients
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$BETA_TAG/$BETA_BUNDLE_NAME"
          curl --fail --location --retry 3 --retry-delay 4 --connect-timeout 30 -o public-curl.zip "$url"
          wget --tries=3 --timeout=60 --quiet -O public-wget.zip "$url"
          echo "$BETA_SHA256  public-curl.zip" | sha256sum --check -
          echo "$BETA_SHA256  public-wget.zip" | sha256sum --check -
          test "$(stat -c %s public-curl.zip)" = "$BETA_SIZE"
          test "$(stat -c %s public-wget.zip)" = "$BETA_SIZE"
          python - <<'PY'
          import json, zipfile
          for name in ('public-curl.zip', 'public-wget.zip'):
              with zipfile.ZipFile(name) as z:
                  assert z.testzip() is None
                  names = set(z.namelist())
                  assert 'files/SR_Studio_Gerador.py' in names
                  assert 'files/SRStudio5/SR Studio 5.exe' in names
                  assert 'files/SRStudio5/Graphics2Host/SRGraphicsEngine2Host.exe' in names
                  meta = json.loads(z.read('files/version.json'))
                  assert meta['version'] == '5.0.0-hybrid.g2beta.39'
                  assert meta['source_commit'] == 'd9b64eae091b6cf0de37ed8bc3d2211b2ea16e39'
          PY
          delta_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$BETA_TAG/$BETA_DELTA_NAME"
          curl --fail --location --retry 3 --connect-timeout 30 -o public-delta-curl.zip "$delta_url"
          wget --tries=3 --timeout=60 --quiet -O public-delta-wget.zip "$delta_url"
          echo "$DELTA_SHA256  public-delta-curl.zip" | sha256sum --check -
          echo "$DELTA_SHA256  public-delta-wget.zip" | sha256sum --check -
          test "$(stat -c %s public-delta-curl.zip)" = "$DELTA_SIZE"
          test "$(stat -c %s public-delta-wget.zip)" = "$DELTA_SIZE"
          python - <<'PY'
          import json, zipfile
          info=json.load(open('beta39-delta.json',encoding='utf-8'))
          expected={'files/'+e['path'] for e in info['files']}
          for filename in ['public-delta-curl.zip','public-delta-wget.zip']:
              with zipfile.ZipFile(filename) as z:
                  assert z.testzip() is None
                  actual={n for n in z.namelist() if not n.endswith('/')}
                  assert actual==expected, (len(actual),len(expected))
          PY
          echo "PUBLIC_FULL_AND_DELTA_VERIFIED=TRUE"

      - name: Checkout Beta channel control file
        uses: actions/checkout@v4
        with:
          ref: main
          path: channel
          fetch-depth: 0

      - name: Promote verified Beta 37 and leave Stable untouched
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, datetime
          from pathlib import Path
          path = Path('channel/beta/manifest.json')
          old = json.loads(path.read_text(encoding='utf-8'))
          assert old['channel'] == 'beta'
          assert old['version'] == '5.0.0-hybrid.g2beta.38', f"Unexpected beta version {old['version']}"
          asset_url = (f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/"
                       f"{os.environ['BETA_TAG']}/{os.environ['BETA_BUNDLE_NAME']}")
          sha, size = os.environ['BETA_SHA256'], int(os.environ['BETA_SIZE'])
          new = {
              'format': 'SRSTUDIO_HYBRID_BUNDLE_1',
              'product': 'SR Studio', 'channel': 'beta',
              'version': os.environ['BETA_VERSION'], 'product_version': '5.0.0',
              'release_label': os.environ['BETA_LABEL'],
              'published_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'min_launcher': '4.0.1-hybrid.base2.6',
              'min_launcher_version': '4.0.1-hybrid.base2.6',
              'bundle': {'url': asset_url, 'sha256': sha, 'size': size, 'member_prefix': 'files/'},
              'delta': dict(
                  json.loads(Path('beta39-delta.json').read_text(encoding='utf-8')),
                  url=(f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/"
                       f"{os.environ['BETA_TAG']}/{os.environ['BETA_DELTA_NAME']}")
              ),
              'url': asset_url, 'bundle_url': asset_url, 'sha256': sha, 'size': size,
              'member_prefix': 'files/', 'previous_version': old['version'],
              'entrypoint': 'SR_Studio_Gerador.py',
              'graphics2_test': True, 'graphics2_primary': True,
              'launcher_path_safe': True, 'poster_quantity': True,
              'source_commit': os.environ['SOURCE_SHA'],
              'workflow_run': os.environ['GITHUB_RUN_ID'],
              'public_asset_verified': True,
              'public_asset_verified_via': ['curl', 'wget'],
              'limpeza_blue_single_slot': True,
              'notes': 'G2 Beta 39: geometria visual de Smart Slots e remoção local de fundo withoutBG; teste no Windows.',
              'tag': os.environ['BETA_TAG'], 'asset': os.environ['BETA_BUNDLE_NAME'],
          }
          path.write_text(json.dumps(new, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          cd channel
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta/manifest.json
          test "$(git diff --cached --name-only)" = "beta/manifest.json"
          git commit -m "chore(beta): promote verified G2 Beta 39 Limpeza Azul"
          git push origin HEAD:main

      - name: Verify Beta channel manifest at GitHub
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/beta/manifest.json?ref=main" > beta39-live-manifest.json
          python - <<'PY'
          import json, os
          data = json.load(open('beta39-live-manifest.json', encoding='utf-8-sig'))
          assert data['version'] == os.environ['BETA_VERSION']
          assert data['bundle']['sha256'] == os.environ['BETA_SHA256']
          assert data['delta']['sha256'] == os.environ['DELTA_SHA256']
          assert data['delta']['from_version'] == '5.0.0-hybrid.g2beta.38'
          assert data['source_commit'] == os.environ['SOURCE_SHA']
          assert data['public_asset_verified'] is True
          print('LIVE_BETA_39_VERIFIED')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SR-Studio-G2-Beta39-Publication-Evidence
          path: |
            beta39-evidence.json
            beta39-checksum.txt
            beta39-delta.json
            beta39-delta-checksum.txt
            beta39-live-manifest.json
          if-no-files-found: warn
