name: G2 Editor Polish Apply Reactive Image Inspector Fix

on:
  push:
    branches:
      - g2/parallel-editor-polish
    paths:
      - '.github/workflows/g2-editor-polish-apply-image-reactive.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g2/parallel-editor-polish
          fetch-depth: 0
      - name: Apply exact reactive-state edit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/srstudio/graphics2/qml/ImageInspector.qml')
          text = path.read_text(encoding='utf-8')
          old = '''    property var scene: ({})\n    property var imageNode: null\n    property bool hasImageSelection: false\n    readonly property bool bridgeHasImageSelection: {\n        try {\n            var parsedScene = JSON.parse(sceneBridge.sceneJson)\n            return selectedImage(parsedScene) !== null\n        } catch (error) {\n            return false\n        }\n    }\n    property string observedSceneJson: sceneBridge.sceneJson\n    property bool syncing: false\n\n    onObservedSceneJsonChanged: Qt.callLater(panel.refresh)\n'''
          new = '''    property var scene: {\n        try {\n            return JSON.parse(sceneBridge.sceneJson)\n        } catch (error) {\n            return ({})\n        }\n    }\n    property var imageNode: selectedImage(scene)\n    readonly property bool hasImageSelection: imageNode !== null && imageNode !== undefined\n    property bool syncing: false\n\n    onImageNodeChanged: Qt.callLater(panel.refresh)\n'''
          if text.count(old) != 1:
              raise SystemExit('ImageInspector reactive property block mismatch')
          text = text.replace(old, new, 1)

          old_refresh = '''    function refresh() {\n        syncing = true\n        try {\n            var parsedScene = JSON.parse(sceneBridge.sceneJson)\n            var selected = selectedImage(parsedScene)\n            scene = parsedScene\n            imageNode = selected\n            hasImageSelection = selected !== null && selected !== undefined\n            if (!hasImageSelection)\n                return\n'''
          new_refresh = '''    function refresh() {\n        syncing = true\n        try {\n            if (!hasImageSelection)\n                return\n'''
          if text.count(old_refresh) != 1:
              raise SystemExit('ImageInspector refresh block mismatch')
          text = text.replace(old_refresh, new_refresh, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify scope
        run: |
          git diff --check
          git diff -- src/srstudio/graphics2/qml/ImageInspector.qml
          grep -q 'property var imageNode: selectedImage(scene)' src/srstudio/graphics2/qml/ImageInspector.qml
          grep -q 'readonly property bool hasImageSelection' src/srstudio/graphics2/qml/ImageInspector.qml
      - name: Commit isolated fix
        run: |
          git config user.name "g2-editor-polish-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/srstudio/graphics2/qml/ImageInspector.qml
          git commit -m "fix(g2): derive image inspector state reactively"
          git push origin HEAD:g2/parallel-editor-polish
