name: G2 ItemSlot Stable Resize Patch Once

on:
  push:
    branches:
      - g2/fix-item-slot-interaction-performance

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix(g2): keep resize interaction geometry stable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g2/fix-item-slot-interaction-performance
          fetch-depth: 0
      - name: Apply guarded QML patch and remove runner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/srstudio/graphics2/qml/GraphicsEditor.qml')
          text = path.read_text(encoding='utf-8')
          marker = 'property bool resizePreviewKeepsInteractionGeometry:'

          if marker not in text:
              old = '''                                    property real previewIntervalMs: 16
                                    property var displayBounds: previewActive ? preview_bounds : bounds
                                    property bool isManualItemSlot: !!(modelData.metadata && modelData.metadata.manual_item_slot)
                                    property bool slotEditActive: isManualItemSlot || smartSlotEditMode
                                    property bool isDropTarget: productDragActive && dragHoverSlotId === modelData.id
                                    property bool isSelectedSlot: selectedSlotId === modelData.id
                                    property bool isHoveredSlot: hoveredSlotId === modelData.id
                                    property bool showSlotOverlay: smartSlotEditMode || smartSlotInspectionMode || productDragActive || isSelectedSlot || isHoveredSlot
                                    x: displayBounds.x * zoom
                                    y: displayBounds.y * zoom
                                    width: displayBounds.width * zoom
                                    height: displayBounds.height * zoom
'''
              new = '''                                    property real previewIntervalMs: 16
                                    property var displayBounds: previewActive ? preview_bounds : bounds
                                    property bool isManualItemSlot: !!(modelData.metadata && modelData.metadata.manual_item_slot)
                                    // Keep the mouse-grab tree fixed while manual resize previews visually.
                                    // The rendered frame and ItemSlot node subtree still follow displayBounds.
                                    property bool resizePreviewKeepsInteractionGeometry: previewActive && isManualItemSlot && window.itemSlotInteractionKind === "resize"
                                    property var interactionBounds: resizePreviewKeepsInteractionGeometry ? bounds : displayBounds
                                    property bool slotEditActive: isManualItemSlot || smartSlotEditMode
                                    property bool isDropTarget: productDragActive && dragHoverSlotId === modelData.id
                                    property bool isSelectedSlot: selectedSlotId === modelData.id
                                    property bool isHoveredSlot: hoveredSlotId === modelData.id
                                    property bool showSlotOverlay: smartSlotEditMode || smartSlotInspectionMode || productDragActive || isSelectedSlot || isHoveredSlot
                                    x: interactionBounds.x * zoom
                                    y: interactionBounds.y * zoom
                                    width: interactionBounds.width * zoom
                                    height: interactionBounds.height * zoom
'''
              if text.count(old) != 1:
                  raise SystemExit(f'interaction geometry anchor mismatch: {text.count(old)}')
              text = text.replace(old, new, 1)

              old = '''                                    Rectangle {
                                        anchors.fill: parent
                                        color: isDropTarget ? "#16A34A2A" : (isSelectedSlot ? "#0F5BD811" : (productDragActive ? "#0F5BD808" : "transparent"))
                                        border.width: isDropTarget ? 3 : (isSelectedSlot ? 2 : 1)
                                        border.color: isDropTarget ? "#16A34A" : (isSelectedSlot ? "#0F5BD8" : "#0F5BD855")
                                        radius: 4
                                    }
'''
              new = '''                                    Rectangle {
                                        x: slotOverlay.resizePreviewKeepsInteractionGeometry ? (slotOverlay.displayBounds.x - slotOverlay.interactionBounds.x) * zoom : 0
                                        y: slotOverlay.resizePreviewKeepsInteractionGeometry ? (slotOverlay.displayBounds.y - slotOverlay.interactionBounds.y) * zoom : 0
                                        width: slotOverlay.resizePreviewKeepsInteractionGeometry ? Math.max(1, slotOverlay.displayBounds.width * zoom) : parent.width
                                        height: slotOverlay.resizePreviewKeepsInteractionGeometry ? Math.max(1, slotOverlay.displayBounds.height * zoom) : parent.height
                                        color: isDropTarget ? "#16A34A2A" : (isSelectedSlot ? "#0F5BD811" : (productDragActive ? "#0F5BD808" : "transparent"))
                                        border.width: isDropTarget ? 3 : (isSelectedSlot ? 2 : 1)
                                        border.color: isDropTarget ? "#16A34A" : (isSelectedSlot ? "#0F5BD8" : "#0F5BD855")
                                        radius: 4
                                    }
'''
              if text.count(old) != 1:
                  raise SystemExit(f'visual frame anchor mismatch: {text.count(old)}')
              text = text.replace(old, new, 1)

          text = text.replace('                                                enabled: !slotOverlay.isManualItemSlot\n', '', 1)

          handler_id = 'id: manualItemSlotResizeHandler'
          if handler_id in text:
              id_pos = text.index(handler_id)
              start = text.rfind('DragHandler {', 0, id_pos)
              if start < 0:
                  raise SystemExit('DragHandler start not found')
              depth = 0
              end = None
              for index in range(text.index('{', start), len(text)):
                  ch = text[index]
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          break
              if end is None:
                  raise SystemExit('DragHandler end not found')
              while end < len(text) and text[end] in ' \t':
                  end += 1
              if end < len(text) and text[end] == '\n':
                  end += 1
              text = text[:start] + text[end:]

          required = [
              'property bool resizePreviewKeepsInteractionGeometry:',
              'property var interactionBounds: resizePreviewKeepsInteractionGeometry ? bounds : displayBounds',
              'x: interactionBounds.x * zoom',
              'slotOverlay.displayBounds.x - slotOverlay.interactionBounds.x',
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'missing required QML token: {token}')
          if handler_id in text:
              raise SystemExit('experimental DragHandler still present')

          path.write_text(text, encoding='utf-8')
          PY

          git rm -- .github/workflows/g2-itemslot-stable-resize-patch-once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/srstudio/graphics2/qml/GraphicsEditor.qml
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'fix(g2): keep resize interaction geometry stable'
          git push origin HEAD:g2/fix-item-slot-interaction-performance
