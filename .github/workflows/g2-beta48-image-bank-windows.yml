name: G2 Beta48 Banco de Imagens Windows

on:
  push:
    branches:
      - fix/g2-beta48-image-bank-browser
    paths:
      - 'src/srstudio/graphics2/**'
      - 'tests/test_graphics2_beta48_image_bank_browser.py'
      - 'tests/test_graphics2_qml_load.py'
      - '.github/workflows/g2-beta48-image-bank-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-bank-and-qml:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install and compile Qt Graphics2
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,graphics2]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q src/srstudio/graphics2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test real bank catalog, safety, QML and past price/slot regressions
        shell: pwsh
        run: |
          python -m pytest -q tests/test_graphics2_beta48_image_bank_browser.py tests/test_graphics2_beta46_legacy_image_bank.py tests/test_graphics2_qml_load.py tests/test_graphics2_beta47_pptx_source_fidelity.py tests/test_graphics2_beta46_price_integrity.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Confirm no bank association without human review
        shell: pwsh
        run: |
          python -c "from srstudio.graphics2.image_bank_browser import image_bank_inventory; from pathlib import Path; x=image_bank_inventory(); assert all((entry['status']!='pending' or not entry['can_link']) for entry in x['images']); print('IMAGE_BANK_SAFE',x['counts'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
