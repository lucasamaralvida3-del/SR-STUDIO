name: G2 Release Engineering

on:
  workflow_dispatch:
  push:
    branches:
      - g2/parallel-release-engineering
      - g2/integration-beta

permissions:
  contents: read

jobs:
  linux-clean-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install clean G2 development environment
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev,graphics2]'
          python -c "import PySide6, srstudio; print('PySide6', PySide6.__version__, 'SR Studio', srstudio.__version__)"

      - name: Run release engineering unit contracts
        run: |
          python -m pytest -q tests/test_graphics2_release_engineering.py tests/test_graphics2_host_build.py tests/test_graphics2_host_runtime.py

      - name: Run CWD-independent development smoke
        shell: bash
        run: |
          smoke="$RUNNER_TEMP/g2-linux-smoke"
          cd "$RUNNER_TEMP"
          sr-graphics2-release-smoke --output-dir "$smoke"
          test -s "$smoke/release-smoke.srscene"
          test -s "$smoke/release-smoke.png"
          test -s "$smoke/release-smoke.pdf"
          test -s "$smoke/release-smoke.json"
          cat "$smoke/release-smoke.json"

      - name: Upload Linux smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: g2-release-smoke-linux
          path: ${{ runner.temp }}/g2-linux-smoke
          retention-days: 7

  windows-frozen-release:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install clean frozen-host toolchain
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev,graphics2-build]'
          python -c "import PyInstaller, PySide6, srstudio; print('PyInstaller', PyInstaller.__version__, 'PySide6', PySide6.__version__, 'SR Studio', srstudio.__version__)"

      - name: Validate release/build contracts
        shell: pwsh
        run: |
          python build/build_graphics2_host.py --print-args
          python -m pytest -q tests/test_graphics2_release_engineering.py tests/test_graphics2_host_build.py tests/test_graphics2_host_runtime.py tests/test_graphics2_studio_bridge.py tests/test_graphics2_component_package.py tests/test_graphics2_launcher_component.py tests/test_graphics2_launcher_manifest.py tests/test_graphics2_installer_component.py

      - name: Run development smoke outside checkout
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'g2-dev-smoke'
          Push-Location $env:RUNNER_TEMP
          try {
            sr-graphics2-release-smoke --output-dir $smoke
          } finally {
            Pop-Location
          }
          foreach($name in @('release-smoke.srscene','release-smoke.png','release-smoke.pdf','release-smoke.json')) {
            $path = Join-Path $smoke $name
            if(-not (Test-Path -LiteralPath $path)) { throw ('Smoke artifact missing: ' + $path) }
            if((Get-Item -LiteralPath $path).Length -le 0) { throw ('Smoke artifact empty: ' + $path) }
          }
          Get-Content -Raw -LiteralPath (Join-Path $smoke 'release-smoke.json')

      - name: Build isolated Qt host
        shell: pwsh
        run: python build/build_graphics2_host.py --output "$env:RUNNER_TEMP\graphics2-host"

      - name: Validate frozen runtime integrity
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'graphics2-host'
          $bundle = Join-Path $root 'SRGraphicsEngine2Host'
          $engineVersion = python -c "from srstudio.graphics2 import ENGINE_VERSION; print(ENGINE_VERSION)"
          python -m srstudio.graphics2.host_runtime "$bundle" --full --engine-version $engineVersion

      - name: Frozen Qt backend probe outside checkout
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'graphics2-host'
          $manifest = Get-Content -Raw -LiteralPath (Join-Path $root 'graphics2-host-manifest.json') | ConvertFrom-Json
          $exe = Join-Path $root ([string]$manifest.executable).Replace('/','\')
          $process = Start-Process -FilePath $exe -ArgumentList @('--graphics-api','software','--probe-graphics-api') -WorkingDirectory $env:RUNNER_TEMP -Wait -PassThru
          if($process.ExitCode -ne 0) { throw ('Frozen GPU probe failed with exit code ' + $process.ExitCode) }

      - name: Frozen save-load-export smoke outside checkout
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'graphics2-host'
          $manifest = Get-Content -Raw -LiteralPath (Join-Path $root 'graphics2-host-manifest.json') | ConvertFrom-Json
          $exe = Join-Path $root ([string]$manifest.executable).Replace('/','\')
          $smoke = Join-Path $env:RUNNER_TEMP 'g2-frozen-smoke'
          $process = Start-Process -FilePath $exe -ArgumentList @('--release-smoke','--output-dir',$smoke) -WorkingDirectory $env:RUNNER_TEMP -Wait -PassThru
          if($process.ExitCode -ne 0) { throw ('Frozen release smoke failed with exit code ' + $process.ExitCode) }
          foreach($name in @('release-smoke.srscene','release-smoke.png','release-smoke.pdf','release-smoke.json')) {
            $path = Join-Path $smoke $name
            if(-not (Test-Path -LiteralPath $path)) { throw ('Frozen smoke artifact missing: ' + $path) }
            if((Get-Item -LiteralPath $path).Length -le 0) { throw ('Frozen smoke artifact empty: ' + $path) }
          }
          $report = Get-Content -Raw -LiteralPath (Join-Path $smoke 'release-smoke.json') | ConvertFrom-Json
          if(-not [bool]$report.ok) { throw 'Frozen smoke report is not OK.' }
          if(-not [bool]$report.frozen) { throw 'Frozen smoke did not execute from packaged host.' }
          Get-Content -Raw -LiteralPath (Join-Path $smoke 'release-smoke.json')

      - name: Upload Windows release evidence
        uses: actions/upload-artifact@v4
        with:
          name: g2-release-engineering-windows
          path: |
            ${{ runner.temp }}\g2-dev-smoke
            ${{ runner.temp }}\g2-frozen-smoke
            ${{ runner.temp }}\graphics2-host\graphics2-host-manifest.json
            ${{ runner.temp }}\graphics2-host\SRGraphicsEngine2Host\graphics2-host-runtime.json
          retention-days: 7
