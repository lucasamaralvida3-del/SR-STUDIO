name: G2 Editor Production

on:
  push:
    branches:
      - g2/parallel-editor-production
    paths:
      - "src/srstudio/graphics2/**"
      - "tests/test_graphics2*.py"
      - "docs/parallel/CHAT3_EDITOR_PRODUCTION.md"
      - ".github/workflows/g2-editor-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g2-editor-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor-contracts:
    name: Editor persistence and multipage
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install G2 runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graphics2]"

      - name: Compile editor runtime
        shell: pwsh
        run: python -m compileall -q src/srstudio/graphics2

      - name: Lint CHAT 3 runtime and tests
        shell: pwsh
        run: >-
          python -m ruff check
          src/srstudio/graphics2/editor_commands_runtime.py
          src/srstudio/graphics2/editor_persistence.py
          src/srstudio/graphics2/autosave.py
          src/srstudio/graphics2/qt_host.py
          tests/test_graphics2_editor_commands_runtime.py
          tests/test_graphics2_editor_multipage_qml.py
          tests/test_graphics2_editor_persistence.py
          tests/test_graphics2_editor_host_recovery.py
          tests/test_graphics2_editor_roundtrip.py
          tests/test_graphics2_editor_production_e2e.py
          tests/test_graphics2_autosave.py

      - name: Editor production contracts
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
        run: >-
          python -m pytest -q -ra
          tests/test_graphics2_editor_commands_runtime.py
          tests/test_graphics2_editor_multipage_qml.py
          tests/test_graphics2_editor_persistence.py
          tests/test_graphics2_editor_host_recovery.py
          tests/test_graphics2_editor_roundtrip.py
          tests/test_graphics2_editor_production_e2e.py
          tests/test_graphics2_autosave.py
          tests/test_graphics2_page_duplicate.py
          tests/test_graphics2_command_router.py
          tests/test_graphics2_project_actions_qml.py
          tests/test_graphics2_image_replace.py
          tests/test_graphics2_core.py
          tests/test_graphics2_qt_host_cli.py
          tests/test_graphics2_qml_load.py
          tests/test_graphics2_real_qml_host_preview.py
