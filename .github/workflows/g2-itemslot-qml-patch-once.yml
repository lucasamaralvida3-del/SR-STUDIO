name: G2 ItemSlot QML Patch Once

on:
  push:
    branches:
      - g2/fix-item-slot-interaction-performance

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix(g2): add local ItemSlot preview interaction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g2/fix-item-slot-interaction-performance
          fetch-depth: 0
      - name: Apply guarded QML patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/srstudio/graphics2/qml/GraphicsEditor.qml')
          text = path.read_text(encoding='utf-8')
          if 'property bool itemSlotPreviewActive: false' in text:
              print('ItemSlot preview patch already present')
              raise SystemExit(0)

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '    property string smartSlotInteractionKind: ""\n    property var anchorNode: selectedNode()\n',
              '    property string smartSlotInteractionKind: ""\n'
              '    property bool itemSlotPreviewActive: false\n'
              '    property string itemSlotPreviewSlotId: ""\n'
              '    property var itemSlotPreviewStartBounds: ({"x":0,"y":0,"width":1,"height":1})\n'
              '    property var itemSlotPreviewBounds: ({"x":0,"y":0,"width":1,"height":1})\n'
              '    property int itemSlotPreviewEvents: 0\n'
              '    property int itemSlotPreviewUpdates: 0\n'
              '    property int itemSlotBackendCommits: 0\n'
              '    property string itemSlotInteractionKind: ""\n'
              '    property var anchorNode: selectedNode()\n',
              'preview properties',
          )

          replace_once(
              '    function isSelected(node) {\n        return selectedIds().indexOf(node.id) >= 0\n    }\n\n',
              '    function isSelected(node) {\n        return selectedIds().indexOf(node.id) >= 0\n    }\n\n'
              '    function manualItemSlotForNode(nodeId) {\n'
              '        if (!page || !nodeId)\n            return null\n'
              '        var current = page.nodes[String(nodeId)]\n'
              '        var guard = 0\n'
              '        while (current && guard++ < 128) {\n'
              '            var metadata = current.metadata || {}\n'
              '            var slotId = String(metadata.item_slot_id || "")\n'
              '            if (slotId && page.slots && page.slots[slotId]) {\n'
              '                var slot = page.slots[slotId]\n'
              '                var slotMetadata = slot.metadata || {}\n'
              '                if (slotMetadata.manual_item_slot)\n                    return slot\n'
              '            }\n'
              '            var parentId = String(current.parent_id || "")\n'
              '            current = parentId && page.nodes[parentId] ? page.nodes[parentId] : null\n'
              '        }\n'
              '        return null\n'
              '    }\n\n'
              '    function itemSlotDisplayTransform(node) {\n'
              '        var t = node && node.transform ? node.transform : {"x":0,"y":0,"width":1,"height":1}\n'
              '        var base = {"x":Number(t.x || 0),"y":Number(t.y || 0),"width":Math.max(1,Number(t.width || 1)),"height":Math.max(1,Number(t.height || 1))}\n'
              '        if (!itemSlotPreviewActive || !node)\n            return base\n'
              '        var slot = manualItemSlotForNode(node.id)\n'
              '        if (!slot || String(slot.id || "") !== itemSlotPreviewSlotId)\n            return base\n'
              '        var start = itemSlotPreviewStartBounds\n'
              '        var preview = itemSlotPreviewBounds\n'
              '        var startW = Math.max(0.000001, Number(start.width || 1))\n'
              '        var startH = Math.max(0.000001, Number(start.height || 1))\n'
              '        var sx = Math.max(0.000001, Number(preview.width || 1)) / startW\n'
              '        var sy = Math.max(0.000001, Number(preview.height || 1)) / startH\n'
              '        return {\n'
              '            "x":Number(preview.x || 0) + (base.x - Number(start.x || 0)) * sx,\n'
              '            "y":Number(preview.y || 0) + (base.y - Number(start.y || 0)) * sy,\n'
              '            "width":Math.max(1, base.width * sx),\n'
              '            "height":Math.max(1, base.height * sy)\n'
              '        }\n'
              '    }\n\n',
              'manual slot display helpers',
          )

          replace_once(
              '                                    required property var modelData\n                                    x: modelData.transform.x * zoom\n                                    y: modelData.transform.y * zoom\n                                    width: Math.max(1, modelData.transform.width * zoom)\n                                    height: Math.max(1, modelData.transform.height * zoom)\n',
              '                                    required property var modelData\n'
              '                                    property var displayTransform: window.itemSlotDisplayTransform(modelData)\n'
              '                                    x: displayTransform.x * zoom\n'
              '                                    y: displayTransform.y * zoom\n'
              '                                    width: Math.max(1, displayTransform.width * zoom)\n'
              '                                    height: Math.max(1, displayTransform.height * zoom)\n',
              'node display transform',
          )

          replace_once(
              '                                        drag.target: parent\n                                        enabled: !effectiveLocked(modelData)\n                                        preventStealing: true\n                                        onPressed: sceneBridge.selectNodeAdvanced(modelData.id, (mouse.modifiers & Qt.ShiftModifier) !== 0, (mouse.modifiers & Qt.ControlModifier) !== 0)\n                                        onReleased: {\n                                            var dx = (parent.x / zoom) - Number(modelData.transform.x)\n                                            var dy = (parent.y / zoom) - Number(modelData.transform.y)\n                                            if (Math.abs(dx) > 0.001 || Math.abs(dy) > 0.001)\n                                                sceneBridge.moveSelectionAtZoom(dx, dy, zoom)\n                                        }\n',
              '                                        drag.target: window.manualItemSlotForNode(modelData.id) ? null : parent\n'
              '                                        enabled: !effectiveLocked(modelData)\n'
              '                                        preventStealing: true\n'
              '                                        onPressed: {\n'
              '                                            var manualSlot = window.manualItemSlotForNode(modelData.id)\n'
              '                                            if (manualSlot) {\n'
              '                                                selectedSlotId = String(manualSlot.id || "")\n'
              '                                                return\n'
              '                                            }\n'
              '                                            sceneBridge.selectNodeAdvanced(modelData.id, (mouse.modifiers & Qt.ShiftModifier) !== 0, (mouse.modifiers & Qt.ControlModifier) !== 0)\n'
              '                                        }\n'
              '                                        onReleased: {\n'
              '                                            if (window.manualItemSlotForNode(modelData.id))\n'
              '                                                return\n'
              '                                            var dx = (parent.x / zoom) - Number(modelData.transform.x)\n'
              '                                            var dy = (parent.y / zoom) - Number(modelData.transform.y)\n'
              '                                            if (Math.abs(dx) > 0.001 || Math.abs(dy) > 0.001)\n'
              '                                                sceneBridge.moveSelectionAtZoom(dx, dy, zoom)\n'
              '                                        }\n',
              'generic node mouse routing',
          )

          replace_once(
              '                                    property bool isDropTarget: productDragActive && dragHoverSlotId === modelData.id\n                                    property bool isSelectedSlot: selectedSlotId === modelData.id\n',
              '                                    property bool isManualItemSlot: !!(modelData.metadata && modelData.metadata.manual_item_slot)\n'
              '                                    property bool slotEditActive: isManualItemSlot || smartSlotEditMode\n'
              '                                    property bool isDropTarget: productDragActive && dragHoverSlotId === modelData.id\n'
              '                                    property bool isSelectedSlot: selectedSlotId === modelData.id\n',
              'slot edit mode properties',
          )

          replace_once(
              '                                        window.smartSlotInteractionKind = String(kind || "")\n                                    }\n\n                                    function queuePreview(raw, force) {\n',
              '                                        window.smartSlotInteractionKind = String(kind || "")\n'
              '                                        if (isManualItemSlot) {\n'
              '                                            window.itemSlotPreviewActive = true\n'
              '                                            window.itemSlotPreviewSlotId = String(modelData.id || "")\n'
              '                                            window.itemSlotPreviewStartBounds = value\n'
              '                                            window.itemSlotPreviewBounds = value\n'
              '                                            window.itemSlotInteractionKind = String(kind || "")\n'
              '                                        }\n'
              '                                    }\n\n                                    function queuePreview(raw, force) {\n',
              'begin manual preview',
          )

          replace_once(
              '                                        previewEventCount += 1\n                                        window.smartSlotPreviewEvents += 1\n',
              '                                        previewEventCount += 1\n'
              '                                        if (isManualItemSlot)\n'
              '                                            window.itemSlotPreviewEvents += 1\n'
              '                                        else\n'
              '                                            window.smartSlotPreviewEvents += 1\n',
              'preview event counter',
          )

          replace_once(
              '                                        previewUpdateCount += 1\n                                        window.smartSlotPreviewUpdates += 1\n                                    }\n\n                                    function commitPreview(raw, kind) {\n',
              '                                        previewUpdateCount += 1\n'
              '                                        if (isManualItemSlot) {\n'
              '                                            window.itemSlotPreviewUpdates += 1\n'
              '                                            window.itemSlotPreviewBounds = preview_bounds\n'
              '                                        } else {\n'
              '                                            window.smartSlotPreviewUpdates += 1\n'
              '                                        }\n'
              '                                    }\n\n                                    function commitPreview(raw, kind) {\n',
              'preview update counter',
          )

          replace_once(
              '                                        sceneBridge.dispatch(JSON.stringify({\n                                            "name":"adjust_smart_slot",\n                                            "slot_id":slotOverlay.modelData.id,\n                                            "x":finalBounds.x,\n                                            "y":finalBounds.y,\n                                            "width":finalBounds.width,\n                                            "height":finalBounds.height,\n                                            "snap":smartSlotSnap\n                                        }))\n                                        window.smartSlotLastCommitMs = Math.max(0, Date.now() - started)\n                                        window.smartSlotInteractionKind = String(kind || "")\n                                        previewActive = false\n                                        previewTimer.stop()\n',
              '                                        var commandName = isManualItemSlot ? "commit_item_slot_bounds" : "adjust_smart_slot"\n'
              '                                        sceneBridge.dispatch(JSON.stringify({\n'
              '                                            "name":commandName,\n'
              '                                            "slot_id":slotOverlay.modelData.id,\n'
              '                                            "x":finalBounds.x,\n'
              '                                            "y":finalBounds.y,\n'
              '                                            "width":finalBounds.width,\n'
              '                                            "height":finalBounds.height,\n'
              '                                            "snap":smartSlotSnap\n'
              '                                        }))\n'
              '                                        if (isManualItemSlot) {\n'
              '                                            window.itemSlotBackendCommits += 1\n'
              '                                            window.itemSlotInteractionKind = String(kind || "")\n'
              '                                            window.itemSlotPreviewActive = false\n'
              '                                            window.itemSlotPreviewSlotId = ""\n'
              '                                        } else {\n'
              '                                            window.smartSlotLastCommitMs = Math.max(0, Date.now() - started)\n'
              '                                            window.smartSlotInteractionKind = String(kind || "")\n'
              '                                        }\n'
              '                                        previewActive = false\n'
              '                                        previewTimer.stop()\n',
              'release commit routing',
          )

          replace_once(
              '                                        preventStealing: smartSlotEditMode\n',
              '                                        preventStealing: slotOverlay.slotEditActive\n',
              'move prevent stealing',
          )
          replace_once('                                            if (!smartSlotEditMode)\n                                                return\n', '                                            if (!slotOverlay.slotEditActive)\n                                                return\n', 'move pressed guard')
          replace_once('                                            if (!pressed || !smartSlotEditMode || !slotOverlay.previewActive)\n', '                                            if (!pressed || !slotOverlay.slotEditActive || !slotOverlay.previewActive)\n', 'move position guard')
          replace_once('                                            if (!smartSlotEditMode || !slotOverlay.previewActive)\n', '                                            if (!slotOverlay.slotEditActive || !slotOverlay.previewActive)\n', 'move release guard')
          replace_once('                                            visible: smartSlotEditMode && slotOverlay.isSelectedSlot\n', '                                            visible: slotOverlay.slotEditActive && slotOverlay.isSelectedSlot\n', 'manual handles visibility')

          old_cancel = '                                        onCanceled: {\n                                            slotOverlay.previewActive = false\n                                            previewTimer.stop()\n                                        }\n'
          new_cancel = '                                        onCanceled: {\n                                            if (slotOverlay.isManualItemSlot) {\n                                                window.itemSlotPreviewActive = false\n                                                window.itemSlotPreviewSlotId = ""\n                                            }\n                                            slotOverlay.previewActive = false\n                                            previewTimer.stop()\n                                        }\n'
          count = text.count(old_cancel)
          if count != 2:
              raise SystemExit(f'cancel handlers: expected 2 matches, got {count}')
          text = text.replace(old_cancel, new_cancel)

          replace_once(
              '                                visible: anchorNode && page && effectiveVisible(anchorNode)\n',
              '                                visible: anchorNode && page && effectiveVisible(anchorNode) && !window.manualItemSlotForNode(anchorNode.id)\n',
              'hide generic selection overlay for manual ItemSlot',
          )

          path.write_text(text, encoding='utf-8')
          print('Guarded ItemSlot local-preview patch applied')
          PY
          git diff --check
          git diff -- src/srstudio/graphics2/qml/GraphicsEditor.qml
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- src/srstudio/graphics2/qml/GraphicsEditor.qml; then
            echo "No QML change to commit"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/srstudio/graphics2/qml/GraphicsEditor.qml
          git commit -m 'fix(g2): add local ItemSlot preview interaction'
          git push origin HEAD:g2/fix-item-slot-interaction-performance
