name: Publicar SR Studio Launcher base2.9 Fast

on:
  push:
    paths:
      - '.github/workflows/publicar-launcher-base2.9-fast.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Base 2.9
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          from datetime import datetime, timezone, timedelta
          p=Path('launcher/files/SRStudioLauncher.ps1')
          t=p.read_text(encoding='utf-8-sig')
          t=t.replace("$LauncherVersion = '4.0.1-hybrid.base2.8'", "$LauncherVersion = '4.0.1-hybrid.base2.9'", 1)
          repl=[
          ('''        $proc = Start-Process -FilePath $exe -ArgumentList @('-c',\"import sys; print('%d.%d.%d' % sys.version_info[:3])\") -Wait -PassThru -RedirectStandardOutput $tmpOut -RedirectStandardError $tmpErr -WindowStyle Hidden''', '''        $probe = Join-Path $LogDir 'python_candidate_probe.py'\n        [IO.File]::WriteAllText($probe,\"import sys`nprint('%d.%d.%d' % sys.version_info[:3])`n\",(New-Object Text.UTF8Encoding($false)))\n        & $exe $probe 1> $tmpOut 2> $tmpErr\n        $candidateExit = $LASTEXITCODE'''),
          ('''      $stageProc = Start-Process -FilePath $stagePython -ArgumentList @('-c',\"import sys; print('%d.%d.%d' % sys.version_info[:3])\") -Wait -PassThru -RedirectStandardOutput $stageOut -RedirectStandardError $stageErr -WindowStyle Hidden''', '''      $stageProbe = Join-Path $LogDir 'portable_python_start_probe.py'\n      [IO.File]::WriteAllText($stageProbe,\"import sys`nprint('%d.%d.%d' % sys.version_info[:3])`n\",(New-Object Text.UTF8Encoding($false)))\n      & $stagePython $stageProbe 1> $stageOut 2> $stageErr\n      $stageExit = $LASTEXITCODE'''),
          ('''    $importProc = Start-Process -FilePath $stagePython -ArgumentList @('-c',\"import tkinter, openpyxl, pypdf, PIL, numpy, cv2, tkinterdnd2; print('SR_RUNTIME_OK')\") -Wait -PassThru -RedirectStandardOutput $importOut -RedirectStandardError $importErr -WindowStyle Hidden''', '''    $importProbe = Join-Path $LogDir 'portable_python_imports_probe.py'\n    [IO.File]::WriteAllText($importProbe,\"import tkinter, openpyxl, pypdf, PIL, numpy, cv2, tkinterdnd2`nprint('SR_RUNTIME_OK')`n\",(New-Object Text.UTF8Encoding($false)))\n    & $stagePython $importProbe 1> $importOut 2> $importErr\n    $importExit = $LASTEXITCODE''')]
          for old,new in repl:
              if old not in t: raise SystemExit('Linha de probe esperada nao encontrada')
              t=t.replace(old,new,1)
          t=t.replace('if($proc.ExitCode -ne 0 -or -not $ver)','if($candidateExit -ne 0 -or -not $ver)',1)
          t=t.replace("Write-SrLog ('Python candidate rejected. Exit=' + $proc.ExitCode", "Write-SrLog ('Python candidate rejected. Exit=' + $candidateExit",1)
          t=t.replace("Write-SrLog ('Portable Python startup exit=' + $stageProc.ExitCode", "Write-SrLog ('Portable Python startup exit=' + $stageExit",1)
          t=t.replace('if($stageProc.ExitCode -ne 0 -or $stageVersion','if($stageExit -ne 0 -or $stageVersion',1)
          t=t.replace("'Runtime Python portatil nao iniciou corretamente. Exit=' + $stageProc.ExitCode", "'Runtime Python portatil nao iniciou corretamente. Exit=' + $stageExit",1)
          t=t.replace('if($importProc.ExitCode -ne 0)','if($importExit -ne 0)',1)
          t=t.replace("'Runtime Python portatil esta incompleto. Exit=' + $importProc.ExitCode", "'Runtime Python portatil esta incompleto. Exit=' + $importExit",1)
          if "ArgumentList @('-c'" in t: raise SystemExit('Ainda existe probe -c')
          data=('\ufeff'+t.lstrip('\ufeff')).encode('utf-8')
          p.write_bytes(data)
          m={'format':'SRSTUDIO_LAUNCHER_MANIFEST_1','product':'SR Studio Launcher','version':'4.0.1-hybrid.base2.9','published_at':datetime.now(timezone(timedelta(hours=-3))).isoformat(timespec='seconds'),'files':[{'path':'SRStudioLauncher.ps1','source':'launcher/files/SRStudioLauncher.ps1','sha256':hashlib.sha256(data).hexdigest(),'size':len(data)}]}
          Path('manifests/launcher.json').write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

      - name: Validar e publicar
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='launcher/files/SRStudioLauncher.ps1'
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors -and $errors.Count){ throw $errors[0].Message }
          if(-not (Select-String $p -SimpleMatch '4.0.1-hybrid.base2.9')){ throw 'Base2.9 ausente' }
          git config user.name 'SR Studio Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add launcher/files/SRStudioLauncher.ps1 manifests/launcher.json
          git commit -m 'Publica Launcher base2.9 com correção de quoting Python'
          git push origin HEAD:main

      - name: Confirmar online
        shell: powershell
        run: |
          Start-Sleep -Seconds 2
          $m=Invoke-RestMethod -Uri ('https://raw.githubusercontent.com/lucasamaralvida3-del/SR-STUDIO/main/manifests/launcher.json?x='+[DateTimeOffset]::UtcNow.ToUnixTimeSeconds()) -Headers @{'Cache-Control'='no-cache'}
          if([string]$m.version -ne '4.0.1-hybrid.base2.9'){ throw "Online em $($m.version)" }
