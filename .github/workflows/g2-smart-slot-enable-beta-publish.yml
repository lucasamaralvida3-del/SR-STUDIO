name: G2 Smart Slot Enable Beta Publish

# One-shot publisher patch; self-removes after the first successful run.
on:
  push:
    branches:
      - g2/integrate-studio-shell
    paths:
      - '.github/workflows/g2-smart-slot-enable-beta-publish.yml'

permissions:
  contents: write

jobs:
  patch-publisher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g2/integrate-studio-shell
          fetch-depth: 0

      - name: Extend Beta publisher fail-closed
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/g2-full-studio-beta.yml')
          text = path.read_text(encoding='utf-8')
          marker = "      - 'src/srstudio/graphics2/smart_slot_geometry.py'"

          if marker not in text:
              anchors = [
                  (
                      "      - 'tests/test_graphics2_studio_bridge.py'\n      - 'build/build_graphics2_host.py'",
                      "      - 'tests/test_graphics2_studio_bridge.py'\n      - 'tests/test_graphics2_smart_slot_geometry.py'\n      - 'src/srstudio/graphics2/smart_slot_geometry.py'\n      - 'src/srstudio/graphics2/semantic_recovery.py'\n      - 'src/srstudio/graphics2/qml/GraphicsEditor.qml'\n      - 'build/build_graphics2_host.py'",
                      2,
                  ),
                  (
                      'python -m pytest -q tests/test_graphics2_full_studio_entrypoint.py tests/test_graphics2_studio_bridge.py',
                      'python -m pytest -q tests/test_graphics2_full_studio_entrypoint.py tests/test_graphics2_studio_bridge.py tests/test_graphics2_smart_slot_geometry.py',
                      1,
                  ),
                  (
                      'python -m compileall -q src/srstudio/app/turbo_posters.py src/srstudio/graphics2/full_studio_bridge.py',
                      'python -m compileall -q src/srstudio/app/turbo_posters.py src/srstudio/graphics2/full_studio_bridge.py src/srstudio/graphics2/smart_slot_geometry.py src/srstudio/graphics2/semantic_recovery.py',
                      1,
                  ),
              ]
              for old, new, expected in anchors:
                  count = text.count(old)
                  if count != expected:
                      raise SystemExit(f'Fail-closed publisher patch: expected {expected}, got {count}: {old[:100]}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          verify = path.read_text(encoding='utf-8')
          required = [
              "src/srstudio/graphics2/smart_slot_geometry.py",
              "src/srstudio/graphics2/semantic_recovery.py",
              "src/srstudio/graphics2/qml/GraphicsEditor.qml",
              "tests/test_graphics2_smart_slot_geometry.py",
          ]
          missing = [item for item in required if item not in verify]
          if missing:
              raise SystemExit(f'Missing Beta publisher paths: {missing}')
          test_line = 'tests/test_graphics2_full_studio_entrypoint.py tests/test_graphics2_studio_bridge.py tests/test_graphics2_smart_slot_geometry.py'
          if test_line not in verify:
              raise SystemExit('Smart Slot tests were not added to full Beta certification')

      - name: Commit publisher patch and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/g2-smart-slot-enable-beta-publish.yml
          if git diff --quiet; then
            echo 'No publisher change required.'
            exit 0
          fi
          git config user.name 'sr-studio-beta-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/g2-full-studio-beta.yml
          git commit -m 'ci(g2): publish Smart Slot fixes through continuous Beta'
          git push origin HEAD:g2/integrate-studio-shell
