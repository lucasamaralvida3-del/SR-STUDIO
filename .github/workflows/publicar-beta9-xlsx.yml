name: Publicar SR Studio Beta 16 Edicao Visual Canva-like

on:
  push:
    paths:
      - '.github/workflows/publicar-beta9-xlsx.yml'
      - 'staging/beta16/**'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Montar e validar Beta 16
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work dist && mkdir -p work dist
          gh release download v4.0.14-hybrid.beta15 -p 'SR_STUDIO_4.0.14_BETA15_EDITOR_PRO.zip' -D dist
          unzip -q dist/SR_STUDIO_4.0.14_BETA15_EDITOR_PRO.zip -d work
          python staging/beta16/assemble.py
          python -m compileall -q work/files
          node --check work/files/Encartes8_beta14.js
          node --check work/files/Encartes9_beta15.js
          node --check work/files/Encartes10_beta16.js
          python staging/beta16/test_beta16.py
          test -s work/files/Encartes10_beta16.js
          grep -q 'Encartes9_beta15.js' work/files/Encartes3_index.html
          grep -q 'Encartes10_beta16.js' work/files/Encartes3_index.html
          grep -q '4.0.15-hybrid.beta16' work/files/version.json
          find work -type d -name __pycache__ -prune -exec rm -rf {} + || true
          find work -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.xlsx' -o -name '*.xls' -o -name '*.csv' \) -delete

      - name: Criar release e ativar Beta 16
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FILE='SR_STUDIO_4.0.15_BETA16_EDITOR_CANVA_LIKE.zip'
          TAG='v4.0.15-hybrid.beta16'
          (cd work && zip -qr "../dist/$FILE" .)
          SHA=$(sha256sum "dist/$FILE" | awk '{print $1}')
          SIZE=$(stat -c%s "dist/$FILE")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$FILE" --clobber
          else
            gh release create "$TAG" "dist/$FILE" --prerelease --title 'SR Studio 4.0.15 Beta 16 - Editor Visual Canva-like' --notes 'Beta 16: reconstrói a edição manual do Encartes Studio com fluxo inspirado no Canva: seleção natural, Shift+clique e seleção por área, 8 alças de redimensionamento, rotação, edição direta de texto, recorte/enquadramento por duplo clique, barra flutuante contextual, menu de contexto, posição X/Y/W/H, opacidade, alinhamento e distribuição, agrupar/desagrupar, bloquear, camadas, ocultar, flip de imagem e atalhos de teclado. Mantém PPTX Canva, Banco de Produtos, aprendizado de template, backup e recursos PRO anteriores.'
          fi
          export SHA SIZE FILE TAG
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          p=Path('beta/manifest.json')
          m=json.loads(p.read_text(encoding='utf-8'))
          m['version']='4.0.15-hybrid.beta16'
          m['created_at']=datetime.now(timezone(timedelta(hours=-3))).isoformat(timespec='seconds')
          m['bundle']={
            'url':f"https://github.com/${{ github.repository }}/releases/download/{os.environ['TAG']}/{os.environ['FILE']}",
            'sha256':os.environ['SHA'],'size':int(os.environ['SIZE']),'member_prefix':'files/'
          }
          m['delete']=['Encartes3_app.js','Encartes3_style.css','Encartes4_beta6.js','Encartes5_beta11.js','Encartes6_beta12.js']
          m['notes']='Beta 16: edição manual reconstruída com interação Canva-like: multi-seleção, 8 alças, rotação, edição direta, recorte, barra contextual, posição, alinhamento, grupos, camadas e atalhos.'
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'SR Studio Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add beta/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Ativa SR Studio 4.0.15 Beta 16'
            git push
          fi
