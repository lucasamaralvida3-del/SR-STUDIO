name: Publicar SR Studio Beta 13 Imagens PPTX

on:
  push:
    paths:
      - '.github/workflows/publicar-beta9-xlsx.yml'
      - 'staging/beta13/**'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Montar e validar Beta 13
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work dist && mkdir -p work dist
          gh release download v4.0.11-hybrid.beta12 -p 'SR_STUDIO_4.0.11_BETA12_PPTX_DESIGN_COMPLETO.zip' -D dist
          unzip -q dist/SR_STUDIO_4.0.11_BETA12_PPTX_DESIGN_COMPLETO.zip -d work
          python staging/beta13/assemble.py
          python -m compileall -q work/files
          node --check work/files/Encartes7_beta13.js
          PYTHONPATH=work/files python staging/beta13/test_shape_slots.py
          test -s work/files/EncartesPPTXFields.py
          test -s work/files/EncartesPPTXReader.py
          test -s work/files/EncartesPPTXVisual.py
          test ! -e work/files/Encartes6_beta12.js
          grep -q 'IMAGEM_AREA' work/files/EncartesPPTXFields.py
          grep -q 'imageCandidate' work/files/EncartesPPTXReader.py
          grep -q 'autoImageSlotCount' work/files/EncartesPPTXReader.py
          grep -q 'Encartes7_beta13.js' work/files/Encartes3_index.html
          find work -type d -name __pycache__ -prune -exec rm -rf {} + || true
          find work -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.xlsx' -o -name '*.xls' -o -name '*.csv' \) -delete

      - name: Criar release Beta 13
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          (cd work && zip -qr ../dist/SR_STUDIO_4.0.12_BETA13_IMAGENS_CANVA.zip .)
          gh release create v4.0.12-hybrid.beta13 dist/SR_STUDIO_4.0.12_BETA13_IMAGENS_CANVA.zip --prerelease --title 'SR Studio 4.0.12 Beta 13 - Imagens Automáticas no PPTX Canva' --notes 'Beta 13: reconhece automaticamente caixas brancas e Freeforms agrupadas exportadas pelo Canva como áreas de imagem de produto. Mantém o design completo da Beta 12, vincula cada área ao bloco de nome/preço mais próximo e preenche a imagem oficial cadastrada no Banco de Produtos ao clicar ou arrastar o item.'
