name: Publicar SR Studio Beta 10 Banco Produtos

on:
  push:
    paths:
      - 'staging/beta10/READY.json'
      - '.github/workflows/publicar-beta9-xlsx.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar e validar Beta 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf work dist && mkdir -p work dist
          gh release download v4.0.8-hybrid.beta9 -p 'SR_STUDIO_4.0.8_BETA9_XLSX_LOCAL.zip' -D dist
          unzip -q dist/SR_STUDIO_4.0.8_BETA9_XLSX_LOCAL.zip -d work
          python staging/beta10/build_beta10.py work
          python -m compileall -q work/files
          node --check work/files/Encartes3_app.js
          node --check work/files/Encartes4_beta6.js
          test -s work/files/xlsx.full.min.js
          python staging/beta10/validate_beta10.py work
      - name: Publicar Beta 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find work -type d -name __pycache__ -prune -exec rm -rf {} + || true
          python -c "from pathlib import Path;import hashlib,json,shutil;out=Path('dist/SR_STUDIO_4.0.9_BETA10_BANCO_AUTOMATICO.zip');shutil.make_archive(str(out.with_suffix('')),'zip','work');b=out.read_bytes();Path('dist/result.json').write_text(json.dumps({'sha256':hashlib.sha256(b).hexdigest(),'size':len(b)}))"
          gh release create v4.0.9-hybrid.beta10 dist/SR_STUDIO_4.0.9_BETA10_BANCO_AUTOMATICO.zip --prerelease --title 'SR Studio 4.0.9 Beta 10 - Banco Automático' --notes 'Ao importar XLSX/CSV, o Encartes consulta automaticamente o Banco de Produtos por EAN, Código CISS ou nome e reaproveita os dados oficiais cadastrados.'
      - name: Ativar canal Beta
        run: |
          python staging/beta10/write_manifest.py dist/result.json '${{ github.repository }}'
          git config user.name 'SR Studio Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add beta/manifest.json
          git commit -m 'Ativa SR Studio 4.0.9 Beta 10'
          git push
