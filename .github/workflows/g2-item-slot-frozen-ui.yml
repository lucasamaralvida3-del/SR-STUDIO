name: G2 ItemSlot Frozen Visible Gate

on:
  workflow_dispatch:
  push:
    branches:
      - g2/fix-item-slot-visible-beta26
    paths:
      - 'src/srstudio/graphics2/item_slot_host.py'
      - 'src/srstudio/graphics2/item_slots.py'
      - 'src/srstudio/graphics2/entrypoint.py'
      - 'src/srstudio/graphics2/qml/ProjectActions.qml'
      - 'src/srstudio/graphics2/qml/GraphicsEditor.qml'
      - 'tests/test_graphics2_item_slots.py'
      - 'tools/verify_frozen_item_slot_ui.py'
      - 'tools/capture_studio_ui_viewports.py'
      - 'build/build_graphics2_host.py'
      - '.github/workflows/g2-item-slot-frozen-ui.yml'
  pull_request:
    branches:
      - g2/integrate-studio-shell
    paths:
      - 'src/srstudio/graphics2/item_slot_host.py'
      - 'src/srstudio/graphics2/item_slots.py'
      - 'src/srstudio/graphics2/entrypoint.py'
      - 'src/srstudio/graphics2/qml/ProjectActions.qml'
      - 'src/srstudio/graphics2/qml/GraphicsEditor.qml'
      - 'tests/test_graphics2_item_slots.py'
      - 'tools/verify_frozen_item_slot_ui.py'
      - 'tools/capture_studio_ui_viewports.py'
      - 'build/build_graphics2_host.py'
      - '.github/workflows/g2-item-slot-frozen-ui.yml'

permissions:
  contents: write

jobs:
  frozen-item-slot-visible-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Apply final visual-only target adjustments once
        shell: pwsh
        run: |
          $code = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          python -c $code
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if (Test-Path '.github/workflows/g2-visual-final-one-shot.yml') { git rm '.github/workflows/g2-visual-final-one-shot.yml' }
          git add src/srstudio/graphics2/qml/GraphicsEditor.qml
          git diff --cached --check
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "style(g2): finalize Studio chrome against approved target"
            git push origin HEAD:g2/reconcile-studio-ui-with-itemslot-perf
          }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install focused dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graphics2,graphics2-build]" pyinstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record source SHA and clean tree
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          Write-Host "SOURCE_SHA=$sha"
          "SOURCE_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          git diff --quiet
          if ($LASTEXITCODE -ne 0) { throw "Tracked working tree changed before gate" }
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { throw "Tracked index changed before gate" }

      - name: Reproduce fixed QML dispatch contract
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
        run: |
          python -m compileall -q src/srstudio/graphics2 tools/verify_frozen_item_slot_ui.py tools/capture_studio_ui_viewports.py tests/test_graphics2_item_slots.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/test_graphics2_item_slots.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build frozen Graphics2 host
        shell: pwsh
        run: |
          python build/build_graphics2_host.py --output "dist/graphics2-host"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = "dist/graphics2-host/SRGraphicsEngine2Host"
          if (!(Test-Path "$root/SRGraphicsEngine2Host.exe")) { throw "Frozen Graphics2Host missing" }
          if (!(Test-Path "$root/_internal/srstudio/graphics2/qml/GraphicsEditor.qml")) { throw "Frozen GraphicsEditor.qml missing" }
          if (!(Test-Path "$root/_internal/srstudio/graphics2/qml/ProjectActions.qml")) { throw "Frozen ProjectActions.qml missing" }
          & "$root/SRGraphicsEngine2Host.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Frozen Graphics2Host --version failed" }

      - name: Prove click to visible ItemSlot in native Windows Qt
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          QSG_RHI_BACKEND: software
          QT_SCALE_FACTOR: '1'
        run: |
          New-Item -ItemType Directory -Force -Path item-slot-frozen-evidence | Out-Null
          python tools/verify_frozen_item_slot_ui.py --runtime-root "dist/graphics2-host/SRGraphicsEngine2Host" --output-dir item-slot-frozen-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Capture exact Studio viewports with real QQuickWindow grabWindow
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
          QT_SCALE_FACTOR: '1'
          QT_QPA_FONTDIR: 'C:\Windows\Fonts'
        run: |
          New-Item -ItemType Directory -Force -Path item-slot-frozen-evidence/studio-viewports | Out-Null
          python tools/capture_studio_ui_viewports.py --runtime-root "dist/graphics2-host/SRGraphicsEngine2Host" --output-dir item-slot-frozen-evidence/studio-viewports
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enforce final visible-slot evidence
        shell: pwsh
        run: |
          $ui = Get-Content "item-slot-frozen-evidence/frozen-item-slot-visible.json" -Raw | ConvertFrom-Json
          if (-not [bool]$ui.runtime_manifest_hash_match) { throw "Frozen QML manifest mismatch" }
          if (-not [bool]$ui.all_visible) { throw "At least one ItemSlot preset is not visibly represented" }
          if (@($ui.presets).Count -ne 3) { throw "Expected three ItemSlot presets" }
          foreach ($preset in @($ui.presets)) {
            if ([int]$preset.slot_count_before -ne 0) { throw "$($preset.preset_id): slot count before != 0" }
            if ([int]$preset.slot_count_after -ne 1) { throw "$($preset.preset_id): slot count after != 1" }
            if (-not [bool]$preset.page_model_updated) { throw "$($preset.preset_id): page model did not refresh" }
            if (-not [bool]$preset.root_visible) { throw "$($preset.preset_id): root is not visible" }
            if ([string]$preset.empty_state -ne "empty") { throw "$($preset.preset_id): empty state changed" }
            if (-not [string]::IsNullOrEmpty([string]$preset.product_id)) { throw "$($preset.preset_id): empty slot has stale product" }
            if ([int]$preset.changed_pixels_after_clear_selection -lt 500) { throw "$($preset.preset_id): screenshot has insufficient canvas change" }
            foreach ($required in @('image_placeholder','name_placeholder','price_currency','price_integer','price_decimal','unit_placeholder')) {
              $delegate = $preset.delegate_evidence.$required
              if ($null -eq $delegate -or -not [bool]$delegate.visible -or [int]$delegate.delegate_matches -lt 1) { throw "$($preset.preset_id): missing visible delegate $required" }
            }
          }
          $viewports = Get-Content "item-slot-frozen-evidence/studio-viewports/studio-ui-viewports.json" -Raw | ConvertFrom-Json
          if (-not [bool]$viewports.pass) { throw "Studio viewport gate failed" }
          if ([string]$viewports.grab_method -ne "QQuickWindow.grabWindow") { throw "Studio screenshots were not captured with QQuickWindow.grabWindow" }
          if (-not [bool]$viewports.product_drag_runtime.pass) { throw "Product drag end-to-end failed" }
          if ([string]$viewports.product_drag_runtime.product_id -ne [string]$viewports.product_drag_runtime.slot_product_id_after_drop) { throw "Wrong product bound after drag" }
          if ([string]$viewports.product_drag_runtime.target_slot_id -ne [string]$viewports.product_drag_runtime.hit_test_slot_id) { throw "Product drag hit-test targeted wrong slot" }
          if (-not [bool]$viewports.product_drag_runtime.highlight_active_before_drop) { throw "Product drag highlight did not activate" }
          if (-not [bool]$viewports.product_drag_runtime.drop_product_dispatched) { throw "drop_product was not dispatched" }
          if ([string]$viewports.product_drag_runtime.name_applied -ne "LEITE INTEGRAL 1L") { throw "Product name not applied" }
          if ([string]$viewports.product_drag_runtime.price_integer_applied -ne "4") { throw "Product integer price not applied" }
          if ([string]$viewports.product_drag_runtime.price_decimal_applied -ne ",79") { throw "Product decimal price not applied" }
          if ([string]$viewports.product_drag_runtime.unit_applied -ne "/UN") { throw "Product unit not applied" }
          if ([string]$viewports.product_drag_runtime.image_applied -ne "fixture://prod-5.png") { throw "Product image not applied" }
          if ([bool]$viewports.product_drag_runtime.image_placeholder_after_drop) { throw "Product image remained a placeholder" }
          if (@($viewports.viewports).Count -ne 3) { throw "Expected exactly three Studio viewports" }
          Write-Host "PRODUCT_DRAG_E2E=PASS"
          Write-Host "STUDIO_VIEWPORTS=PASS"
          Write-Host "SOURCE_SHA=$env:SOURCE_SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: g2-item-slot-frozen-visible-evidence
          path: item-slot-frozen-evidence
          if-no-files-found: error
          retention-days: 30
