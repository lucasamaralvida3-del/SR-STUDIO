name: G2 ItemSlot Stable Hitbox Harness Patch Once

on:
  push:
    branches:
      - g2/fix-item-slot-interaction-performance
    paths:
      - 'tools/g2-itemslot-hitbox-harness-activate.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g2/fix-item-slot-interaction-performance
          fetch-depth: 0

      - name: Patch permanent continuous and benchmark harnesses
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          verify_path = Path('tools/verify_frozen_item_slot_interaction.py')
          verify = verify_path.read_text(encoding='utf-8')
          verify = verify.replace('resize_start = safe_handle_point(resize_area)', 'resize_start = center(resize_area)')
          start_token = '    def safe_handle_point(item: QQuickItem) -> QPoint:\n'
          if start_token in verify:
              start = verify.index(start_token)
              next_def = verify.index('    def visual_rect(', start)
              verify = verify[:start] + verify[next_def:]
          if 'safe_handle_point(' in verify:
              raise SystemExit('obsolete continuous edge-hit helper remains')
          if 'resize_start = center(resize_area)' not in verify:
              raise SystemExit('continuous resize does not target stable hitbox center')
          verify_path.write_text(verify, encoding='utf-8')

          bench_path = Path('tools/benchmark_frozen_item_slot_interaction.py')
          bench = bench_path.read_text(encoding='utf-8')
          old_center = '''    def scene_center(item: QQuickItem) -> QPoint:
        p = item.mapToScene(QPointF(max(1.0, item.width()) / 2.0, max(1.0, item.height()) / 2.0)); return QPoint(round(p.x()), round(p.y()))
'''
          new_center = '''    def window_point(item: QQuickItem, x: float, y: float) -> QPoint:
        global_point = item.mapToGlobal(QPointF(x, y))
        return root.mapFromGlobal(QPoint(round(global_point.x()), round(global_point.y())))
    def scene_center(item: QQuickItem) -> QPoint:
        return window_point(item, max(1.0, item.width()) / 2.0, max(1.0, item.height()) / 2.0)
'''
          if old_center in bench:
              bench = bench.replace(old_center, new_center, 1)
          elif 'def window_point(item: QQuickItem' not in bench:
              raise SystemExit('benchmark window-coordinate anchor not found')
          bench = bench.replace('resize_start = inner_handle_point(resize_area)', 'resize_start = scene_center(resize_area)')
          marker = '    def inner_handle_point(item: QQuickItem, inset: float = 2.0) -> QPoint:\n'
          if marker in bench:
              start = bench.index(marker)
              next_def = bench.index('    def visual_rect(', start)
              bench = bench[:start] + bench[next_def:]
          if 'inner_handle_point(' in bench:
              raise SystemExit('obsolete benchmark edge-hit helper remains')
          if 'resize_start = scene_center(resize_area)' not in bench:
              raise SystemExit('benchmark resize does not target stable hitbox center')
          if 'def window_point(item: QQuickItem' not in bench:
              raise SystemExit('benchmark lacks QWindow-local coordinate conversion')
          bench_path.write_text(bench, encoding='utf-8')
          PY

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/verify_frozen_item_slot_interaction.py tools/benchmark_frozen_item_slot_interaction.py
          if git diff --cached --quiet; then
            echo 'Permanent harnesses already current'
          else
            git commit -m 'test(g2): target center of stable resize hitbox'
            git push origin HEAD:g2/fix-item-slot-interaction-performance
          fi
