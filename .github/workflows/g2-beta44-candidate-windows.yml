name: G2 Beta44 Windows Candidate

on:
  push:
    branches:
      - feature/g2-beta44-slots-promotion-layouts
    paths:
      - 'src/srstudio/graphics2/**'
      - 'src/srstudio/app/**'
      - 'tests/test_graphics2_beta44_*.py'
      - '.github/workflows/g2-beta44-candidate-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta44-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,graphics2]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile G2
        shell: pwsh
        run: |
          python -m compileall -q src/srstudio/graphics2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate Beta44 and existing Azul contracts
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q tests/test_graphics2_beta44_promotion_layouts.py tests/test_graphics2_beta44_multi_slots.py tests/test_graphics2_beta42_shell_layout.py tests/test_graphics2_item_slots.py tests/test_graphics2_slot_limpeza_blue.py tests/test_graphics2_quinta3_studio_manual_build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove Qt Quick runtime
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from srstudio.graphics2.qt_host import qt_quick_available; assert qt_quick_available()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  package:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install packager
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,graphics2-build,background-removal]" pyinstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package SR Studio 5 shell
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name "SR Studio 5" --paths src --collect-all pypdfium2 --collect-all pypdfium2_raw --icon "src/srstudio/assets/brand/SR_Studio.ico" --add-data "src/srstudio/assets/brand;srstudio/assets/brand" --add-data "src/srstudio/assets/poster_templates;srstudio/assets/poster_templates" src/srstudio/app/turbo_posters.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "dist/SR Studio 5/SR Studio 5.exe")) { throw "EXE ausente" }
      - name: Package Graphics2 child host
        shell: pwsh
        run: |
          python build/build_graphics2_host.py --output "dist/graphics2-host"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path "dist/SR Studio 5/Graphics2Host" | Out-Null
          Copy-Item "dist/graphics2-host/SRGraphicsEngine2Host/*" "dist/SR Studio 5/Graphics2Host" -Recurse -Force
          if (!(Test-Path "dist/SR Studio 5/Graphics2Host/SRGraphicsEngine2Host.exe")) { throw "Qt host ausente" }
      - name: Validate runtime and SHA-256
        shell: pwsh
        run: |
          python -c "from pathlib import Path; from srstudio.graphics2.host_runtime import validate_runtime_host; r=validate_runtime_host(Path('dist/SR Studio 5/Graphics2Host').resolve(), full=True); assert r.ok, r"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path "release" | Out-Null
          $file = "release/SR_STUDIO_G2_BETA_44_CANDIDATE_WIN64.zip"
          Compress-Archive -Path "dist/SR Studio 5/*" -DestinationPath $file -Force
          $digest = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "commit=$env:GITHUB_SHA" | Out-File "release/beta44-provenance.txt" -Encoding utf8
          "sha256=$digest" | Out-File "release/beta44-checksum.txt" -Encoding ascii
          Write-Host "BETA44_CANDIDATE_SHA256=$digest"
      - uses: actions/upload-artifact@v4
        with:
          name: SR-Studio-G2-Beta44-Windows-Candidate
          path: |
            release/SR_STUDIO_G2_BETA_44_CANDIDATE_WIN64.zip
            release/beta44-checksum.txt
            release/beta44-provenance.txt
          if-no-files-found: error
          retention-days: 30
