name: Apply G2 Alpha 43 QML Visibility Fix

on:
  push:
    branches:
      - integration/sr-studio-next
    paths:
      - '.github/workflows/g2-alpha43-apply-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/sr-studio-next
          fetch-depth: 0
      - name: Apply audited QML startup-selection fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/srstudio/graphics2/qml/ImageInspector.qml')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '    visible: !!imageNode\n',
                  '    visible: hasImageSelection\n',
              ),
              (
                  '    property var imageNode: null\n    property bool syncing: false\n',
                  '    property var imageNode: null\n    property bool hasImageSelection: false\n    property bool syncing: false\n',
              ),
              (
                  '            scene = JSON.parse(sceneBridge.sceneJson)\n            imageNode = selectedImage()\n            if (!imageNode)\n                return\n',
                  '            scene = JSON.parse(sceneBridge.sceneJson)\n            var selected = selectedImage()\n            imageNode = selected\n            hasImageSelection = selected !== null && selected !== undefined\n            if (!hasImageSelection)\n                return\n',
              ),
              (
                  '    Component.onCompleted: Qt.callLater(refresh)\n',
                  '    Component.onCompleted: refresh()\n',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'expected one QML match, got {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Static sanity checks
        run: |
          git diff --check
          grep -F 'visible: hasImageSelection' src/srstudio/graphics2/qml/ImageInspector.qml
          grep -F 'Component.onCompleted: refresh()' src/srstudio/graphics2/qml/ImageInspector.qml
      - name: Commit QML visibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/srstudio/graphics2/qml/ImageInspector.qml
          git commit -m "fix: sync ImageInspector selection on startup"
          git push origin HEAD:integration/sr-studio-next
