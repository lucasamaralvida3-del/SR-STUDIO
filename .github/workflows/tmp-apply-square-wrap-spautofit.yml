name: TEMP Apply PPTX Square Wrap

on:
  pull_request:
    branches:
      - g2/fix-meat-strip-exact-source-page-contract

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.ref == 'g2/fix-pptx-square-wrap-spautofit'
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      BASE_SHA: 21dda44fe758a2899b4c15ffa041b2e0f6ff6d33
      BRANCH: g2/fix-pptx-square-wrap-spautofit
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Exact base ancestry gate
        shell: pwsh
        run: |
          $base = (git merge-base HEAD $env:BASE_SHA).Trim()
          "BASE_SHA=$env:BASE_SHA"
          "MERGE_BASE=$base"
          if ($base -ne $env:BASE_SHA) { throw 'Branch is not stacked exactly on frozen base' }
          $productionBefore = @(git diff --name-only "$env:BASE_SHA..HEAD" -- 'src/**' 'tests/**')
          if ($productionBefore.Count -ne 0) { throw "Production/test changes existed before patch: $productionBefore" }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply exact generic patch
        shell: pwsh
        run: |
          python tools/diagnostics/tmp_apply_square_wrap_spautofit.py
          python -m py_compile src/srstudio/graphics2/qt_renderer.py src/srstudio/graphics2/slot_corpus_full_card.py tests/test_graphics2_pptx_square_wrap_spautofit.py tests/test_graphics2_quinta3_meat_text_wrap_contract.py

      - name: Install runtime and test dependencies
        shell: pwsh
        run: |
          python -m pip install -q '.[dev,graphics2]'

      - name: Generic square-wrap regressions
        shell: pwsh
        run: |
          python -m pytest -q tests/test_graphics2_pptx_square_wrap_spautofit.py tests/test_graphics2_pptx_shape_autofit_text_layout.py

      - name: Meat source-contract regressions
        shell: pwsh
        run: |
          python -m pytest -q tests/test_graphics2_quinta3_meat_text_wrap_contract.py

      - name: Ruff changed Python files
        shell: pwsh
        run: |
          python -m ruff check src/srstudio/graphics2/qt_renderer.py src/srstudio/graphics2/slot_corpus_full_card.py tests/test_graphics2_pptx_square_wrap_spautofit.py tests/test_graphics2_quinta3_meat_text_wrap_contract.py

      - name: Final production diff gate
        shell: pwsh
        run: |
          git clean -fd -- build/lib
          $changed = @(git status --short | ForEach-Object { $_.Substring(3) })
          $allowed = @(
            'src/srstudio/graphics2/qt_renderer.py',
            'src/srstudio/graphics2/slot_corpus_full_card.py',
            'tests/test_graphics2_pptx_square_wrap_spautofit.py',
            'tests/test_graphics2_quinta3_meat_text_wrap_contract.py',
            '.github/workflows/tmp-apply-square-wrap-spautofit.yml',
            'tools/diagnostics/tmp_apply_square_wrap_spautofit.py'
          )
          foreach ($path in $changed) {
            if ($allowed -notcontains $path) { throw "Unexpected file: $path" }
          }
          if (Test-Path '.github/workflows/tmp-apply-square-wrap-spautofit.yml') { throw 'Temporary workflow was not removed' }
          if (Test-Path 'tools/diagnostics/tmp_apply_square_wrap_spautofit.py') { throw 'Temporary patcher was not removed' }

      - name: Commit verified production candidate
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'G2: implement DrawingML square-wrap shape autofit'
          $sha = (git rev-parse HEAD).Trim()
          "PRODUCTION_SHA=$sha"
          git push origin "HEAD:$env:BRANCH"
