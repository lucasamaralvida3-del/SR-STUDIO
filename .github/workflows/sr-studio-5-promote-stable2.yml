name: Promote SR Studio 5 Stable 2 Professional

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sr-studio-5-promote-stable2.yml'

permissions:
  contents: write

env:
  SOURCE_COMMIT: c8d0c3954ce7f54717ad009d81e6a6043212ae3a
  PRODUCT_VERSION: 5.0.0
  STABLE_LABEL: Stable 2 Professional
  STABLE_DIST: 5.0.0-hybrid.stable2
  STABLE_TAG: v5.0.0-hybrid.stable2
  STABLE_FILE: SR_STUDIO_5_0_0-hybrid_stable2_PROFESSIONAL.zip

jobs:
  promote-stable:
    runs-on: windows-latest
    steps:
      - name: Checkout exact Beta 7.29 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Verify frozen Beta 7.29 identity
        shell: pwsh
        run: |
          python -m pip install -e . pyinstaller pytest ruff
          $channel = python -c "from srstudio import __channel__; print(__channel__)"
          $label = python -c "from srstudio import __release_label__; print(__release_label__)"
          $distribution = python -c "from srstudio import __distribution_version__; print(__distribution_version__)"
          if ($channel.Trim() -ne 'beta') { throw "Fonte congelada não é Beta." }
          if ($distribution.Trim() -ne '5.0.0-hybrid.beta7.29') { throw "Fonte inesperada: $($distribution.Trim())" }
          Write-Host "PROMOTION_SOURCE_OK $($label.Trim()) $($distribution.Trim())"

      - name: Full quality gate before Stable promotion
        shell: pwsh
        run: |
          python -m compileall -q src
          ruff check src tests --select E9,F63,F7,F82
          pytest -q

      - name: Apply Stable 2 release identity for build only
        shell: pwsh
        run: |
          @'
          """SR Studio 5.0 Professional core package."""

          __version__ = "5.0.0"
          __channel__ = "stable"
          __release_label__ = "Stable 2 Professional"
          __distribution_version__ = "5.0.0-hybrid.stable2"
          '@ | Set-Content -LiteralPath 'src/srstudio/__init__.py' -Encoding UTF8
          $channel = python -c "from srstudio import __channel__; print(__channel__)"
          $label = python -c "from srstudio import __release_label__; print(__release_label__)"
          $distribution = python -c "from srstudio import __distribution_version__; print(__distribution_version__)"
          if ($channel.Trim() -ne 'stable') { throw 'Identidade Stable não aplicada.' }
          if ($distribution.Trim() -ne $env:STABLE_DIST) { throw 'Versão Stable divergente.' }
          Write-Host "STABLE_IDENTITY_OK $($label.Trim()) $($distribution.Trim())"

      - name: Build SR Studio 5 Professional Stable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name "SR Studio 5" --collect-all pypdfium2 --collect-all pypdfium2_raw --icon "src/srstudio/assets/brand/SR_Studio.ico" --add-data "src/srstudio/assets/brand;srstudio/assets/brand" --add-data "src/srstudio/assets/poster_templates;srstudio/assets/poster_templates" --paths src src/srstudio/app/turbo_posters.py
          if (!(Test-Path "dist/SR Studio 5/SR Studio 5.exe")) { throw "Executável Stable não foi gerado." }
          $modelA = "dist/SR Studio 5/_internal/srstudio/assets/poster_templates/legacy/models/ATACADO.pptx"
          $modelB = "dist/SR Studio 5/srstudio/assets/poster_templates/legacy/models/ATACADO.pptx"
          if (!(Test-Path $modelA) -and !(Test-Path $modelB)) { throw "Modelo oficial ATACADO.pptx ausente." }
          $engineA = "dist/SR Studio 5/_internal/srstudio/assets/poster_templates/legacy/engines/PowerPointEngine.ps1"
          $engineB = "dist/SR Studio 5/srstudio/assets/poster_templates/legacy/engines/PowerPointEngine.ps1"
          if (!(Test-Path $engineA) -and !(Test-Path $engineB)) { throw "Engine oficial de Promoções ausente." }
          $atacadoA = "dist/SR Studio 5/_internal/srstudio/assets/poster_templates/legacy/engines/AtacadoEngine.ps1"
          $atacadoB = "dist/SR Studio 5/srstudio/assets/poster_templates/legacy/engines/AtacadoEngine.ps1"
          if (!(Test-Path $atacadoA) -and !(Test-Path $atacadoB)) { throw "Engine oficial de Atacado ausente." }
          $pdfium = Get-ChildItem "dist/SR Studio 5" -Recurse -File -Filter "pdfium.dll" | Select-Object -First 1
          if ($null -eq $pdfium) { throw "PDFium nativo ausente." }
          python -c "from srstudio import __channel__, __distribution_version__; from srstudio.app.turbo_posters import SRStudioTurboPosters; from srstudio.posters.preflight import PosterBatchPreflight; assert __channel__ == 'stable'; assert __distribution_version__ == '5.0.0-hybrid.stable2'; print(SRStudioTurboPosters.__name__, PosterBatchPreflight.__name__)"

      - name: Assemble launcher-compatible Stable bundle
        shell: pwsh
        run: |
          $bundleRoot = "release/stable2-bundle"
          $filesRoot = Join-Path $bundleRoot "files"
          $appRoot = Join-Path $filesRoot "SRStudio5"
          Remove-Item $bundleRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $appRoot | Out-Null
          Copy-Item "dist/SR Studio 5/*" $appRoot -Recurse -Force

          @'
          from __future__ import annotations
          import os
          import subprocess
          from pathlib import Path

          def main() -> int:
              app_dir = Path(__file__).resolve().parent
              executable = app_dir / "SRStudio5" / "SR Studio 5.exe"
              if not executable.is_file():
                  raise FileNotFoundError(f"SR Studio 5 Professional não encontrado: {executable}")
              env = os.environ.copy()
              env["SR_STUDIO_LAUNCHED_BY_UPDATER"] = "1"
              subprocess.Popen([str(executable)], cwd=str(executable.parent), env=env)
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          '@ | Set-Content -LiteralPath (Join-Path $filesRoot "SR_Studio_Gerador.py") -Encoding UTF8

          "SR Studio $env:PRODUCT_VERSION - $env:STABLE_LABEL" | Set-Content -LiteralPath (Join-Path $filesRoot "VERSAO.txt") -Encoding UTF8
          @{
            version = $env:STABLE_DIST
            product_version = $env:PRODUCT_VERSION
            channel = "stable"
            release_label = $env:STABLE_LABEL
            entrypoint = "SR_Studio_Gerador.py"
            professional_executable = "SRStudio5/SR Studio 5.exe"
            promoted_from = "5.0.0-hybrid.beta7.29"
            source_commit = $env:SOURCE_COMMIT
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $filesRoot "version.json") -Encoding UTF8

          New-Item -ItemType Directory -Force -Path release | Out-Null
          $zip = Join-Path "release" $env:STABLE_FILE
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path $filesRoot -DestinationPath $zip -CompressionLevel Optimal
          if (!(Test-Path $zip)) { throw "Bundle Stable não foi criado." }

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $zip).Length
          "STABLE_ZIP=$zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "STABLE_SHA256=$hash" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "STABLE_SIZE=$size" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "STABLE_BUNDLE $zip $size $hash"

      - name: Validate Stable bundle
        shell: pwsh
        run: |
          $validation = "release/stable2-validate"
          Remove-Item $validation -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $env:STABLE_ZIP -DestinationPath $validation -Force
          if (!(Test-Path "$validation/files/SR_Studio_Gerador.py")) { throw "Shim do Launcher ausente." }
          if (!(Test-Path "$validation/files/SRStudio5/SR Studio 5.exe")) { throw "Executável profissional ausente." }
          $version = Get-Content -Raw "$validation/files/version.json" | ConvertFrom-Json
          if ([string]$version.channel -ne 'stable') { throw "Bundle não está marcado Stable." }
          if ([string]$version.version -ne $env:STABLE_DIST) { throw "Versão interna do bundle divergente." }
          $pdfium = Get-ChildItem "$validation/files/SRStudio5" -Recurse -File -Filter "pdfium.dll" | Select-Object -First 1
          if ($null -eq $pdfium) { throw "Bundle Stable sem PDFium nativo." }
          $got = (Get-FileHash $env:STABLE_ZIP -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:STABLE_SHA256) { throw "SHA-256 mudou após empacotamento." }

      - name: Create official Stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          SR Studio $env:STABLE_LABEL

          Promoção oficial da Beta 7.29 Professional validada para o canal Stable.
          Versão: $env:STABLE_DIST
          Fonte congelada: $env:SOURCE_COMMIT

          CARTAZES PRO
          - tabela profissional legível e responsiva, sem redesenho do layout;
          - erros e itens que exigem atenção destacados em vermelho;
          - diagnóstico compacto na coluna Status, filtros e priorização por gravidade;
          - edição inline, edição em lote, histórico, atalhos F8/F9 e correções automáticas seguras;
          - preflight de lote, geração com erro controlada, auditoria e PDF em segundo plano;
          - correção da seleção/lista invisível da Beta 7.29 preservada.

          BASE PROFISSIONAL PRESERVADA
          - Promoções e Atacado com modelos automáticos, Clube/APP, limites e unidades;
          - SR Image Cloud Sync, cache offline e publicação administrativa;
          - Encartes Studio/Canva V2 no estado validado da Beta 7.29;
          - PDFium, engines históricos e compatibilidade com Launcher Base 3.4.

          Stable 1 permanece disponível para rollback.
          "@
          if (gh release view $env:STABLE_TAG *> $null) {
            gh release upload $env:STABLE_TAG $env:STABLE_ZIP --clobber
            gh release edit $env:STABLE_TAG --prerelease=false --title "SR Studio $env:STABLE_LABEL" --notes $notes
          } else {
            gh release create $env:STABLE_TAG $env:STABLE_ZIP --target $env:SOURCE_COMMIT --title "SR Studio $env:STABLE_LABEL" --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar release Stable." }

      - name: Checkout main for Stable activation
        uses: actions/checkout@v4
        with:
          ref: main
          path: mainrepo

      - name: Activate Stable only after release is valid
        shell: pwsh
        run: |
          $manifestPath = "mainrepo/stable/manifest.json"
          $previousVersion = ""
          if (Test-Path $manifestPath) {
            try { $previousVersion = [string]((Get-Content -Raw $manifestPath | ConvertFrom-Json).version) } catch { }
          }
          $published = (Get-Date).ToString("o")
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:STABLE_TAG/$env:STABLE_FILE"
          $manifest = [ordered]@{
            format = "SRSTUDIO_HYBRID_BUNDLE_1"
            product = "SR Studio"
            channel = "stable"
            version = $env:STABLE_DIST
            product_version = $env:PRODUCT_VERSION
            release_label = $env:STABLE_LABEL
            published_at = $published
            min_launcher = "4.0.1-hybrid.base3.4"
            min_launcher_version = "4.0.1-hybrid.base3.4"
            bundle = [ordered]@{
              url = $url
              sha256 = $env:STABLE_SHA256
              size = [int64]$env:STABLE_SIZE
              member_prefix = "files/"
            }
            url = $url
            bundle_url = $url
            sha256 = $env:STABLE_SHA256
            size = [int64]$env:STABLE_SIZE
            member_prefix = "files/"
            previous_version = $previousVersion
            promoted_from = "5.0.0-hybrid.beta7.29"
            source_commit = $env:SOURCE_COMMIT
            repair = [ordered]@{
              mode = "local_hash_catalog"
              full_check_every_days = 7
            }
            delete = @(
              "Encartes3_app.js",
              "Encartes3_style.css",
              "Encartes4_beta6.js",
              "Encartes5_beta11.js",
              "Encartes6_beta12.js"
            )
            notes = "SR Studio Stable 2 Professional - promoção da Beta 7.29 validada; Cartazes Pro, base profissional, Image Cloud e Encartes/Canva V2 preservados."
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $manifestPath -Encoding UTF8

          Push-Location mainrepo
          git config user.name "SR Studio Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main
          git add stable/manifest.json
          git commit -m "release: activate SR Studio Stable 2 Professional"
          git push origin HEAD:main
          Pop-Location

      - name: Publication summary
        shell: pwsh
        run: |
          Write-Host "STABLE_PROMOTION_SUCCESS"
          Write-Host "Stable: $env:STABLE_DIST"
          Write-Host "Promoted from: 5.0.0-hybrid.beta7.29"
          Write-Host "Source: $env:SOURCE_COMMIT"
          Write-Host "SHA256: $env:STABLE_SHA256"
          Write-Host "Size: $env:STABLE_SIZE"
