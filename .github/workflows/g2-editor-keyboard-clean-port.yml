name: G2 Editor Keyboard Clean Port

on:
  push:
    branches:
      - g2/parallel-editor-polish-keyboard-clean
    paths:
      - '.github/workflows/g2-editor-keyboard-clean-port.yml'

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 3e568f7717bb86978c58f50a5162fe44e27c4bd8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g2/parallel-editor-polish-keyboard-clean
          fetch-depth: 0
      - name: Verify authoritative base ancestry and pristine Inspector
        run: |
          echo "BRANCH_HEAD=$(git rev-parse HEAD)"
          echo "BASE_HEAD=$(git rev-parse $BASE_SHA)"
          test "$(git rev-parse $BASE_SHA)" = "$BASE_SHA"
          test "$(git merge-base HEAD $BASE_SHA)" = "$BASE_SHA"
          git diff --exit-code "$BASE_SHA" -- src/srstudio/graphics2/qml/ImageInspector.qml
      - name: Apply only keyboard focus semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/srstudio/graphics2/qml/GraphicsEditor.qml')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '    property string dragHoverSlotId: ""\n',
                  '    property string dragHoverSlotId: ""\n'
                  '    readonly property bool textEditingActive: isEditableTextControl(activeFocusItem)\n\n'
                  '    function isEditableTextControl(item) {\n'
                  '        var current = item\n'
                  '        while (current) {\n'
                  '            if (current instanceof TextInput || current instanceof TextEdit)\n'
                  '                return true\n'
                  '            current = current.parent\n'
                  '        }\n'
                  '        return false\n'
                  '    }\n\n'
                  '    function restoreCanvasFocus() {\n'
                  '        if (sheet)\n'
                  '            sheet.forceActiveFocus()\n'
                  '    }\n'
              ),
              (
                  '    function refreshScene() {\n        scene = JSON.parse(sceneBridge.sceneJson)\n        page = activePage()\n',
                  '    function refreshScene() {\n'
                  '        var previousPageId = page ? String(page.id || "") : ""\n'
                  '        scene = JSON.parse(sceneBridge.sceneJson)\n'
                  '        page = activePage()\n'
                  '        var nextPageId = page ? String(page.id || "") : ""\n'
                  '        if (previousPageId && nextPageId !== previousPageId)\n'
                  '            Qt.callLater(restoreCanvasFocus)\n'
              ),
              (
                  '    Shortcut { sequence: StandardKey.Undo; onActivated: sceneBridge.undo() }\n'
                  '    Shortcut { sequence: StandardKey.Redo; onActivated: sceneBridge.redo() }\n'
                  '    Shortcut { sequence: StandardKey.Delete; onActivated: sceneBridge.dispatch(\'{"name":"delete"}\') }\n'
                  '    Shortcut { sequence: "Ctrl+D"; onActivated: sceneBridge.dispatch(\'{"name":"duplicate"}\') }\n'
                  '    Shortcut { sequence: "Ctrl+G"; onActivated: sceneBridge.dispatch(\'{"name":"group"}\') }\n'
                  '    Shortcut { sequence: "Ctrl+Shift+G"; onActivated: sceneBridge.dispatch(\'{"name":"ungroup"}\') }\n'
                  '    Shortcut { sequence: "G"; onActivated: showGrid = !showGrid }\n',
                  '    Shortcut { sequence: StandardKey.Undo; enabled: !window.textEditingActive; onActivated: sceneBridge.undo() }\n'
                  '    Shortcut { sequence: StandardKey.Redo; enabled: !window.textEditingActive; onActivated: sceneBridge.redo() }\n'
                  '    Shortcut { sequence: StandardKey.Delete; enabled: !window.textEditingActive; onActivated: sceneBridge.dispatch(\'{"name":"delete"}\') }\n'
                  '    Shortcut { sequence: "Ctrl+D"; enabled: !window.textEditingActive; onActivated: sceneBridge.dispatch(\'{"name":"duplicate"}\') }\n'
                  '    Shortcut { sequence: "Ctrl+G"; enabled: !window.textEditingActive; onActivated: sceneBridge.dispatch(\'{"name":"group"}\') }\n'
                  '    Shortcut { sequence: "Ctrl+Shift+G"; enabled: !window.textEditingActive; onActivated: sceneBridge.dispatch(\'{"name":"ungroup"}\') }\n'
                  '    Shortcut { sequence: "G"; enabled: !window.textEditingActive; onActivated: showGrid = !showGrid }\n'
                  '    Shortcut { sequence: "Escape"; enabled: window.textEditingActive; onActivated: window.restoreCanvasFocus() }\n'
              ),
              (
                  '                        Rectangle {\n                            id: sheet\n',
                  '                        Rectangle {\n                            id: sheet\n                            objectName: "editorCanvasFocusTarget"\n                            focus: true\n'
              ),
              (
                  '                                        onPressed: sceneBridge.selectNodeAdvanced(modelData.id, (mouse.modifiers & Qt.ShiftModifier) !== 0, (mouse.modifiers & Qt.ControlModifier) !== 0)\n',
                  '                                        onPressed: {\n'
                  '                                            window.restoreCanvasFocus()\n'
                  '                                            sceneBridge.selectNodeAdvanced(modelData.id, (mouse.modifiers & Qt.ShiftModifier) !== 0, (mouse.modifiers & Qt.ControlModifier) !== 0)\n'
                  '                                        }\n'
              ),
              (
                  '                            TextField { id: xField; Layout.fillWidth: true; inputMethodHints: Qt.ImhFormattedNumbersOnly }\n',
                  '                            TextField { id: xField; objectName: "editorGeometryXField"; Layout.fillWidth: true; inputMethodHints: Qt.ImhFormattedNumbersOnly }\n'
              ),
              (
                  '                            TextArea { id: textEditor; Layout.fillWidth: true; Layout.preferredHeight: 90; wrapMode: TextEdit.Wrap }\n',
                  '                            TextArea { id: textEditor; objectName: "editorTextArea"; Layout.fillWidth: true; Layout.preferredHeight: 90; wrapMode: TextEdit.Wrap }\n'
              ),
              (
                  '                        onClicked: sceneBridge.dispatch(JSON.stringify({"name":"select_page","page_id":modelData.id}))\n',
                  '                        onClicked: {\n'
                  '                            window.restoreCanvasFocus()\n'
                  '                            sceneBridge.dispatch(JSON.stringify({"name":"select_page","page_id":modelData.id}))\n'
                  '                        }\n'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify isolated tree diff
        run: |
          git diff --check
          git diff --exit-code "$BASE_SHA" -- src/srstudio/graphics2/qml/ImageInspector.qml
          git diff -- src/srstudio/graphics2/qml/GraphicsEditor.qml
          python -m compileall -q tests/test_graphics2_editor_keyboard_focus_qml.py
      - name: Commit keyboard logic
        run: |
          git config user.name "g2-editor-polish-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/srstudio/graphics2/qml/GraphicsEditor.qml
          git commit -m "fix(g2): isolate keyboard focus handling"
      - name: Remove temporary port workflow
        run: |
          git rm .github/workflows/g2-editor-keyboard-clean-port.yml
          git commit -m "chore(g2): remove keyboard port helper"
          git push origin HEAD:g2/parallel-editor-polish-keyboard-clean
