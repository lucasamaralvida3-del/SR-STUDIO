name: Publicar Launcher Base 3.1 AutoRepair

on:
  workflow_dispatch:
  push:
    paths:
      - 'staging/launcher31/patch_launcher31.py'
      - '.github/workflows/publicar-launcher-base3.1-autorepair.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Aplicar patch
        run: python staging/launcher31/patch_launcher31.py
      - name: Validar PowerShell
        shell: powershell
        run: |
          $text=Get-Content -Raw -LiteralPath 'launcher/files/SRStudioLauncher.ps1'
          [void][scriptblock]::Create($text)
      - name: Publicar
        shell: powershell
        run: |
          git config user.name 'SR Studio Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add launcher/files/SRStudioLauncher.ps1 manifests/launcher.json
          if(-not (git diff --cached --quiet)){
            git commit -m 'Publica Launcher Base 3.1 com AutoRepair'
            git push origin HEAD:main
          }
