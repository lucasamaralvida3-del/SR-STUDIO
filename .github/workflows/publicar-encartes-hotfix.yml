name: Publicar SR Studio Beta 7 - Hotfix Encartes

on:
  push:
    paths:
      - '.github/workflows/publicar-encartes-hotfix.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar Beta 6.1 corrigida
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work dist
          gh release download v4.0.5-hybrid.beta6.1 -p 'SR_STUDIO_4.0.5_BETA6.1.zip' -D dist
          unzip -q dist/SR_STUDIO_4.0.5_BETA6.1.zip -d work
      - name: Promover hotfix para Beta 7
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('work/files')
          v=json.load(open(p/'version.json',encoding='utf-8'))
          v['distribution_version']='4.0.6-hybrid.beta7'
          v['product_version']='4.0.6'
          v['release_label']='Beta 7'
          v['updated_at']='2026-08-13T16:24:00-03:00'
          (p/'version.json').write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (p/'VERSAO.txt').write_text('SR Studio 4.0.6 • Beta 7\nHotfix do Studio de Encartes: corrige o carregamento da aba e mantém o novo editor iniciado na Beta 6.\n',encoding='utf-8')
          h=p/'Encartes3_index.html'
          text=h.read_text(encoding='utf-8')
          text=text.replace('SR Studio 4.0.5 — Encartes Intelligence','SR Studio 4.0.6 — Encartes Intelligence')
          text=text.replace('SR Studio 4.0.5 • Beta 6.1','SR Studio 4.0.6 • Beta 7')
          text=text.replace('Encartes Intelligence 4.0.5 pronto','Encartes Intelligence 4.0.6 pronto')
          h.write_text(text,encoding='utf-8')
          j=p/'Encartes4_beta6.js'
          js=j.read_text(encoding='utf-8')
          js=js.replace('BETA 6 · NOVO ENCARTES','BETA 7 · NOVO ENCARTES')
          js=js.replace('4.0.5 • BETA 6','4.0.6 • BETA 7')
          j.write_text(js,encoding='utf-8')
          PY
      - name: Validar Beta 7
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q work/files
          node --check work/files/Encartes3_app.js
          node --check work/files/Encartes4_beta6.js
          python - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('work/files')
          v=json.load(open(p/'version.json',encoding='utf-8'))
          assert v['distribution_version']=='4.0.6-hybrid.beta7'
          assert v['release_label']=='Beta 7'
          h=(p/'Encartes3_index.html').read_text(encoding='utf-8')
          assert 'href="Encartes3_style.css"' in h
          assert 'src="Encartes3_app.js"' in h
          assert 'src="Encartes4_beta6.js"' in h
          refs=re.findall(r'(?:href|src)="([^"]+)"',h)
          missing=[x for x in refs if not x.startswith(('http:','https:','data:','#')) and not (p/x).exists()]
          assert not missing, missing
          assert 'Beta 7' in h
          assert 'BETA 7 · NOVO ENCARTES' in (p/'Encartes4_beta6.js').read_text(encoding='utf-8')
          print('Beta 7 validada com referencias locais OK')
          PY
      - name: Empacotar e publicar Beta 7
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          find work -type d -name __pycache__ -prune -exec rm -rf {} + || true
          python - <<'PY'
          import pathlib,shutil,hashlib,json
          out=pathlib.Path('dist/SR_STUDIO_4.0.6_BETA7_HOTFIX_ENCARTES.zip')
          shutil.make_archive(str(out.with_suffix('')),'zip','work')
          raw=out.read_bytes()
          pathlib.Path('dist/result.json').write_text(json.dumps({'sha256':hashlib.sha256(raw).hexdigest(),'size':len(raw)}),encoding='utf-8')
          PY
          gh release create v4.0.6-hybrid.beta7 dist/SR_STUDIO_4.0.6_BETA7_HOTFIX_ENCARTES.zip --prerelease --title 'SR Studio 4.0.6 Beta 7 - Hotfix Encartes' --notes 'Beta 7: corrige o carregamento da aba Studio de Encartes. Publicada com número inteiro para manter compatibilidade com o fluxo de atualização Beta do SR Studio.'
      - name: Ativar canal Beta 7
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          z=json.load(open('dist/result.json',encoding='utf-8'))
          repo='${{ github.repository }}'
          m={'format':'SRSTUDIO_HYBRID_BUNDLE_1','product':'SR Studio Desktop Core','channel':'beta','version':'4.0.6-hybrid.beta7','created_at':'2026-08-13T16:24:00-03:00','min_launcher_version':'4.0.0-hybrid.pro1.1','bundle':{'url':f'https://github.com/{repo}/releases/download/v4.0.6-hybrid.beta7/SR_STUDIO_4.0.6_BETA7_HOTFIX_ENCARTES.zip','sha256':z['sha256'],'size':z['size'],'member_prefix':'files/'},'repair':{'mode':'local_hash_catalog','full_check_every_days':7},'delete':[],'notes':'Beta 7: hotfix de carregamento do Studio de Encartes, mantendo o novo editor e a regra de imagens oficiais manuais.'}
          pathlib.Path('beta/manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'SR Studio Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add beta/manifest.json
          git commit -m 'Ativa SR Studio 4.0.6 Beta 7'
          git push
