name: G2 Export Output

on:
  push:
    branches:
      - g2/parallel-export-output
    paths:
      - "src/srstudio/graphics2/export_output.py"
      - "src/srstudio/graphics2/qt_render_runtime.py"
      - "src/srstudio/graphics2/qt_renderer.py"
      - "tests/test_graphics2_export_output.py"
      - "tests/test_graphics2_qt_renderer.py"
      - ".github/workflows/g2-export-output.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: g2-export-output-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-contracts:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install G2 export runtime
        id: install
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e ".[dev,graphics2]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile, lint and test export contracts
        id: checks
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q src/srstudio/graphics2/export_output.py src/srstudio/graphics2/qt_render_runtime.py src/srstudio/graphics2/qt_renderer.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check src/srstudio/graphics2/export_output.py src/srstudio/graphics2/qt_render_runtime.py tests/test_graphics2_export_output.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/test_graphics2_export_output.py tests/test_graphics2_qt_renderer.py --junitxml=g2-export-output.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload export test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-export-output-report
          path: g2-export-output.xml
          if-no-files-found: ignore

      - name: Publish observable commit gate
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ok = ("${{ steps.install.outcome }}" -eq "success") -and ("${{ steps.checks.outcome }}" -eq "success")
          $state = if ($ok) { "success" } else { "failure" }
          $description = if ($ok) { "G2 export contracts passed on Windows/PySide6" } else { "G2 export contracts failed; inspect workflow" }
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" `
            --raw-field state="$state" `
            --raw-field context="g2/export-output" `
            --raw-field description="$description"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fail job when export gate failed
        if: always()
        shell: pwsh
        run: |
          $ok = ("${{ steps.install.outcome }}" -eq "success") -and ("${{ steps.checks.outcome }}" -eq "success")
          if (-not $ok) { exit 1 }
