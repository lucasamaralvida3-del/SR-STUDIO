name: G2 Export Output

on:
  push:
    branches:
      - g2/parallel-export-output
    paths:
      - "src/srstudio/graphics2/export_output.py"
      - "src/srstudio/graphics2/qt_renderer.py"
      - "tests/test_graphics2_export_output.py"
      - "tests/test_graphics2_qt_renderer.py"
      - ".github/workflows/g2-export-output.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g2-export-output-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-contracts:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install G2 export runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graphics2]"

      - name: Compile export modules
        shell: pwsh
        run: python -m compileall -q src/srstudio/graphics2/export_output.py src/srstudio/graphics2/qt_renderer.py

      - name: Ruff execution errors
        shell: pwsh
        run: python -m ruff check src/srstudio/graphics2/export_output.py tests/test_graphics2_export_output.py

      - name: Export output contracts
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_graphics2_export_output.py tests/test_graphics2_qt_renderer.py --junitxml=g2-export-output.xml

      - name: Upload export test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-export-output-report
          path: g2-export-output.xml
          if-no-files-found: ignore
