name: G2 Export Output

on:
  push:
    branches:
      - g2/parallel-export-output
    paths:
      - "src/srstudio/graphics2/export_output.py"
      - "src/srstudio/graphics2/export_batch.py"
      - "src/srstudio/graphics2/pdf_output_renderer.py"
      - "src/srstudio/graphics2/qt_render_runtime.py"
      - "src/srstudio/graphics2/qt_renderer.py"
      - "tests/test_graphics2_export_output.py"
      - "tests/test_graphics2_export_roundtrip.py"
      - "tests/test_graphics2_export_batch_transaction.py"
      - "tests/test_graphics2_export_print_contract.py"
      - "tests/test_graphics2_qt_renderer.py"
      - "tests/benchmark_graphics2_export_output.py"
      - ".github/workflows/g2-export-output.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: g2-export-output-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-contracts:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install G2 export runtime
        id: install
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e ".[dev,graphics2]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile export modules
        id: compile
        if: ${{ always() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          python -m compileall -q src/srstudio/graphics2/export_output.py src/srstudio/graphics2/export_batch.py src/srstudio/graphics2/pdf_output_renderer.py src/srstudio/graphics2/qt_render_runtime.py src/srstudio/graphics2/qt_renderer.py tests/benchmark_graphics2_export_output.py
          exit $LASTEXITCODE

      - name: Ruff execution errors
        id: lint
        if: ${{ always() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          python -m ruff check src/srstudio/graphics2/export_output.py src/srstudio/graphics2/export_batch.py src/srstudio/graphics2/pdf_output_renderer.py src/srstudio/graphics2/qt_render_runtime.py tests/test_graphics2_export_output.py tests/test_graphics2_export_roundtrip.py tests/test_graphics2_export_batch_transaction.py tests/test_graphics2_export_print_contract.py tests/benchmark_graphics2_export_output.py
          exit $LASTEXITCODE

      - name: Core output contracts
        id: test_core
        if: ${{ always() && steps.install.outcome == 'success' && steps.compile.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_graphics2_export_output.py --junitxml=g2-export-core.xml

      - name: Visual round-trip contracts
        id: test_roundtrip
        if: ${{ always() && steps.install.outcome == 'success' && steps.compile.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_graphics2_export_roundtrip.py --junitxml=g2-export-roundtrip.xml

      - name: Transactional batch contracts
        id: test_batch
        if: ${{ always() && steps.install.outcome == 'success' && steps.compile.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_graphics2_export_batch_transaction.py --junitxml=g2-export-batch.xml

      - name: Print A4 landscape raster
        id: print_a4
        if: ${{ always() && steps.install.outcome == 'success' && steps.compile.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_graphics2_export_print_contract.py::test_a4_landscape_png_at_300_dpi_has_expected_pixel_dimensions --junitxml=g2-export-print-a4.xml

      - name: Print point-unit raster
        id: print_point
        if: ${{ always() && steps.install.outcome == 'success' && steps.compile.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_graphics2_export_print_contract.py::test_point_units_respect_dpi_contract --junitxml=g2-export-print-point.xml

      - name: Print PDF physical size
        id: print_pdf_size
        if: ${{ always() && steps.install.outcome == 'success' && steps.compile.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_graphics2_export_print_contract.py::test_pdf_dpi_does_not_change_a4_physical_page_size --junitxml=g2-export-print-pdf-size.xml

      - name: Print PDF edge coverage
        id: print_edges
        if: ${{ always() && steps.install.outcome == 'success' && steps.compile.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_graphics2_export_print_contract.py::test_pdf_background_reaches_page_edges_without_implicit_margin --junitxml=g2-export-print-edges.xml

      - name: Print DPI validation
        id: print_dpi
        if: ${{ always() && steps.install.outcome == 'success' && steps.compile.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_graphics2_export_print_contract.py::test_invalid_dpi_is_rejected_before_export --junitxml=g2-export-print-dpi.xml

      - name: Print locked destination
        id: print_lock
        if: ${{ always() && steps.install.outcome == 'success' && steps.compile.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_graphics2_export_print_contract.py::test_file_in_use_fails_cleanly_and_preserves_existing_output --junitxml=g2-export-print-lock.xml

      - name: Existing Qt renderer regression contracts
        id: test_legacy
        if: ${{ always() && steps.install.outcome == 'success' && steps.compile.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_graphics2_qt_renderer.py --junitxml=g2-export-legacy.xml

      - name: Export performance benchmark
        id: benchmark
        if: >-
          ${{ always() &&
              steps.install.outcome == 'success' &&
              steps.compile.outcome == 'success' &&
              steps.test_core.outcome == 'success' &&
              steps.test_roundtrip.outcome == 'success' &&
              steps.test_batch.outcome == 'success' &&
              steps.print_a4.outcome == 'success' &&
              steps.print_point.outcome == 'success' &&
              steps.print_pdf_size.outcome == 'success' &&
              steps.print_edges.outcome == 'success' &&
              steps.print_dpi.outcome == 'success' &&
              steps.print_lock.outcome == 'success' &&
              steps.test_legacy.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/benchmark_graphics2_export_output.py --output g2-export-benchmark.json

      - name: Upload export reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-export-output-report
          path: |
            g2-export-*.xml
            g2-export-benchmark.json
          if-no-files-found: ignore

      - name: Publish diagnostic commit statuses
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Publish-Status([string]$context, [string]$outcome) {
            $state = if ($outcome -eq "success") { "success" } else { "failure" }
            gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" `
              --raw-field state="$state" `
              --raw-field context="$context" `
              --raw-field description="$context = $outcome"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          Publish-Status "g2/export/install" "${{ steps.install.outcome }}"
          Publish-Status "g2/export/compile" "${{ steps.compile.outcome }}"
          Publish-Status "g2/export/lint" "${{ steps.lint.outcome }}"
          Publish-Status "g2/export/test-core" "${{ steps.test_core.outcome }}"
          Publish-Status "g2/export/test-roundtrip" "${{ steps.test_roundtrip.outcome }}"
          Publish-Status "g2/export/test-batch" "${{ steps.test_batch.outcome }}"
          Publish-Status "g2/export/print-a4" "${{ steps.print_a4.outcome }}"
          Publish-Status "g2/export/print-point" "${{ steps.print_point.outcome }}"
          Publish-Status "g2/export/print-pdf-size" "${{ steps.print_pdf_size.outcome }}"
          Publish-Status "g2/export/print-edges" "${{ steps.print_edges.outcome }}"
          Publish-Status "g2/export/print-dpi" "${{ steps.print_dpi.outcome }}"
          Publish-Status "g2/export/print-lock" "${{ steps.print_lock.outcome }}"
          Publish-Status "g2/export/test-legacy" "${{ steps.test_legacy.outcome }}"
          Publish-Status "g2/export/benchmark" "${{ steps.benchmark.outcome }}"

          $ok = ("${{ steps.install.outcome }}" -eq "success") -and `
                ("${{ steps.compile.outcome }}" -eq "success") -and `
                ("${{ steps.lint.outcome }}" -eq "success") -and `
                ("${{ steps.test_core.outcome }}" -eq "success") -and `
                ("${{ steps.test_roundtrip.outcome }}" -eq "success") -and `
                ("${{ steps.test_batch.outcome }}" -eq "success") -and `
                ("${{ steps.print_a4.outcome }}" -eq "success") -and `
                ("${{ steps.print_point.outcome }}" -eq "success") -and `
                ("${{ steps.print_pdf_size.outcome }}" -eq "success") -and `
                ("${{ steps.print_edges.outcome }}" -eq "success") -and `
                ("${{ steps.print_dpi.outcome }}" -eq "success") -and `
                ("${{ steps.print_lock.outcome }}" -eq "success") -and `
                ("${{ steps.test_legacy.outcome }}" -eq "success") -and `
                ("${{ steps.benchmark.outcome }}" -eq "success")
          $state = if ($ok) { "success" } else { "failure" }
          if ($ok -and (Test-Path "g2-export-benchmark.json")) {
            $bench = Get-Content "g2-export-benchmark.json" -Raw | ConvertFrom-Json
            Publish-Status "g2/bench/first-png-$($bench.first_png_ms)ms" "success"
            Publish-Status "g2/bench/png10-$($bench.png_batch_total_ms)ms" "success"
            Publish-Status "g2/bench/png-per-page-$($bench.png_batch_per_page_ms)ms" "success"
            Publish-Status "g2/bench/pdf10-$($bench.pdf_total_ms)ms" "success"
            Publish-Status "g2/bench/pdf-per-page-$($bench.pdf_per_page_ms)ms" "success"
            Publish-Status "g2/bench/a4-300-$($bench.a4_300_ms)ms" "success"
            Publish-Status "g2/bench/png-rss-$($bench.png_batch_peak_rss_delta_mb)MB" "success"
            Publish-Status "g2/bench/pdf-rss-$($bench.pdf_peak_rss_delta_mb)MB" "success"
            $description = "PASS PNG10 $($bench.png_batch_total_ms)ms PDF10 $($bench.pdf_total_ms)ms RSS+$($bench.png_batch_peak_rss_delta_mb)MB"
          } else {
            $description = "FAIL; inspect g2/export/* diagnostic statuses"
          }
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" `
            --raw-field state="$state" `
            --raw-field context="g2/export-output" `
            --raw-field description="$description"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fail job when export gate failed
        if: always()
        shell: pwsh
        run: |
          $ok = ("${{ steps.install.outcome }}" -eq "success") -and `
                ("${{ steps.compile.outcome }}" -eq "success") -and `
                ("${{ steps.lint.outcome }}" -eq "success") -and `
                ("${{ steps.test_core.outcome }}" -eq "success") -and `
                ("${{ steps.test_roundtrip.outcome }}" -eq "success") -and `
                ("${{ steps.test_batch.outcome }}" -eq "success") -and `
                ("${{ steps.print_a4.outcome }}" -eq "success") -and `
                ("${{ steps.print_point.outcome }}" -eq "success") -and `
                ("${{ steps.print_pdf_size.outcome }}" -eq "success") -and `
                ("${{ steps.print_edges.outcome }}" -eq "success") -and `
                ("${{ steps.print_dpi.outcome }}" -eq "success") -and `
                ("${{ steps.print_lock.outcome }}" -eq "success") -and `
                ("${{ steps.test_legacy.outcome }}" -eq "success") -and `
                ("${{ steps.benchmark.outcome }}" -eq "success")
          if (-not $ok) { exit 1 }
