name: G2 Editor Polish Image Inspector PR Certification V2

on:
  pull_request:
    branches:
      - g2/integration-beta

permissions:
  contents: read

env:
  TARGET_SHA: 0de7177c29a015f6d63e781383ea5a83b31f2462

jobs:
  exact-sha-windows-qml:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0de7177c29a015f6d63e781383ea5a83b31f2462
          fetch-depth: 0
      - name: Verify exact SHA
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          Write-Host "HEAD=$head"
          if ($head -ne "$env:TARGET_SHA") { throw "SHA mismatch: $head != $env:TARGET_SHA" }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Qt Quick
        shell: pwsh
        run: python -m pip install -U pip; python -m pip install -e '.[dev,graphics2]'
      - name: Verify Qt Quick runtime
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from srstudio.graphics2.qt_host import qt_quick_available; assert qt_quick_available()"
          python -m srstudio.graphics2.qt_host --graphics-api software --probe-graphics-api
      - name: QML Image Inspector real-scene contract
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          @'
          import json, sys, time
          from pathlib import Path
          from PySide6.QtCore import QObject, Property, Signal, Slot, QUrl
          from PySide6.QtGui import QGuiApplication
          from PySide6.QtQml import QQmlComponent, QQmlEngine
          from srstudio.graphics2.command_router import GraphicsCommandRouter
          from srstudio.graphics2.model import GraphicsDocument, GraphicsNode, NodeKind, Transform
          from srstudio.graphics2.operations import GraphicsSession

          app = QGuiApplication.instance() or QGuiApplication(sys.argv)
          qml_dir = Path.cwd() / "src" / "srstudio" / "graphics2" / "qml"

          doc = GraphicsDocument(name="Image Inspector Certification")
          image1 = GraphicsNode(kind=NodeKind.IMAGE, name="Image 1", transform=Transform(x=10,y=20,width=100,height=80))
          text1 = GraphicsNode(kind=NodeKind.TEXT, name="Text 1", transform=Transform(x=20,y=30,width=150,height=40), text="sample")
          image2 = GraphicsNode(kind=NodeKind.IMAGE, name="Image 2", transform=Transform(x=30,y=40,width=110,height=90))
          doc.active_page.add_node(image1)
          doc.active_page.add_node(text1)
          doc.active_page.add_node(image2)
          router = GraphicsCommandRouter(GraphicsSession(doc))

          class Bridge(QObject):
              sceneChanged = Signal()
              statusChanged = Signal()
              @Property(str, notify=sceneChanged)
              def sceneJson(self):
                  return json.dumps(router.payload(), ensure_ascii=False, separators=(",", ":"))
              @Property(str, notify=statusChanged)
              def status(self): return "cert"
              @Slot(str, result=str)
              def dispatch(self, payload):
                  result = router.dispatch_json(payload); self.sceneChanged.emit(); return result
              @Slot()
              def undo(self): pass
              @Slot()
              def redo(self): pass
              @Slot(str, str)
              def editText(self, node_id, text): pass
              def select(self, node_id):
                  router.dispatch({"name":"select", "node_id": node_id})
                  self.sceneChanged.emit()

          def spin(predicate, timeout=2.0):
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  app.processEvents()
                  if predicate(): return True
                  time.sleep(0.005)
              app.processEvents()
              return bool(predicate())

          def load(name, bridge):
              engine = QQmlEngine()
              engine.rootContext().setContextProperty("sceneBridge", bridge)
              component = QQmlComponent(engine, QUrl.fromLocalFile(str(qml_dir / name)))
              if component.status() == QQmlComponent.Error:
                  raise AssertionError(" | ".join(e.toString() for e in component.errors()))
              obj = component.create()
              if obj is None:
                  raise AssertionError(" | ".join(e.toString() for e in component.errors()))
              assert spin(lambda: obj is not None)
              return engine, component, obj

          def selected_id(inspector):
              value = inspector.property("imageNode")
              if value is None: return None
              if hasattr(value, "toVariant"): value = value.toVariant()
              return value.get("id") if isinstance(value, dict) else None

          bridge = Bridge()
          ge, gc, graphics = load("GraphicsEditor.qml", bridge)
          assert graphics is not None
          print("GRAPHICS_EDITOR_QML=PASS")
          graphics.close(); graphics.deleteLater(); app.processEvents()

          ie, ic, inspector = load("ImageInspector.qml", bridge)
          assert spin(lambda: not bool(inspector.property("visible")))
          print("NO_IMAGE_VISIBLE_FALSE=PASS")

          bridge.select(image1.id)
          assert spin(lambda: bool(inspector.property("visible")))
          assert spin(lambda: selected_id(inspector) == image1.id)
          print("IMAGE_VISIBLE_TRUE=PASS")

          bridge.select(text1.id)
          assert spin(lambda: not bool(inspector.property("visible")))
          assert spin(lambda: selected_id(inspector) is None)
          print("IMAGE_TO_TEXT=PASS")

          bridge.select(image1.id)
          assert spin(lambda: bool(inspector.property("visible")))
          assert spin(lambda: selected_id(inspector) == image1.id)
          print("TEXT_TO_IMAGE=PASS")

          bridge.select(image2.id)
          assert spin(lambda: bool(inspector.property("visible")))
          assert spin(lambda: selected_id(inspector) == image2.id)
          print("IMAGE_TO_IMAGE=PASS")

          bridge.sceneChanged.emit()
          assert spin(lambda: bool(inspector.property("visible")) and selected_id(inspector) == image2.id)
          print("SCENE_CHANGED_REFRESH=PASS")
          print("IMAGE_INSPECTOR_QML=PASS")
          '@ | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\image_inspector_cert_v2.py"
          python "$env:RUNNER_TEMP\image_inspector_cert_v2.py"
