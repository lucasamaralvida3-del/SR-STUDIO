name: SR Studio 5 Build

on:
  workflow_dispatch:
  push:
    branches: [sr-studio-5-professional]
    paths:
      - 'src/srstudio/**'
      - 'pyproject.toml'
      - 'build/**'
      - '.github/workflows/sr-studio-5-build.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install project and builder
        run: python -m pip install -e . pyinstaller
      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name "SR Studio 5" --paths src src/srstudio/app/main.py
      - name: Smoke check artifact
        shell: pwsh
        run: |
          if (!(Test-Path "dist/SR Studio 5/SR Studio 5.exe")) { throw "Executável não foi gerado" }
      - uses: actions/upload-artifact@v4
        with:
          name: SR-Studio-5-Windows
          path: dist/SR Studio 5/
          if-no-files-found: error
