name: SR Studio 5 Build

on:
  workflow_dispatch:
  push:
    branches: [sr-studio-5-professional]
    paths:
      - 'src/srstudio/**'
      - 'pyproject.toml'
      - 'build/**'
      - '.github/workflows/sr-studio-5-build.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install project and builder
        run: python -m pip install -e . pyinstaller
      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name "SR Studio 5" --paths src --icon "src/srstudio/assets/brand/SR_Studio.ico" --add-data "src/srstudio/assets/brand;srstudio/assets/brand" --add-data "src/srstudio/assets/poster_templates;srstudio/assets/poster_templates" src/srstudio/app/advanced_posters.py
      - name: Smoke check executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist/SR Studio 5/SR Studio 5.exe")) { throw "Executável não foi gerado" }
          if (!(Test-Path "dist/SR Studio 5/_internal/srstudio/assets/brand/SR_logo.png") -and !(Test-Path "dist/SR Studio 5/srstudio/assets/brand/SR_logo.png")) { throw "Logo oficial não foi empacotada" }
          $legacyA = "dist/SR Studio 5/_internal/srstudio/assets/poster_templates/legacy/models/ATACADO.pptx"
          $legacyB = "dist/SR Studio 5/srstudio/assets/poster_templates/legacy/models/ATACADO.pptx"
          if (!(Test-Path $legacyA) -and !(Test-Path $legacyB)) { throw "Modelo oficial ATACADO.pptx não foi empacotado" }
          $engineA = "dist/SR Studio 5/_internal/srstudio/assets/poster_templates/legacy/engines/PowerPointEngine.ps1"
          $engineB = "dist/SR Studio 5/srstudio/assets/poster_templates/legacy/engines/PowerPointEngine.ps1"
          if (!(Test-Path $engineA) -and !(Test-Path $engineB)) { throw "Engine oficial de Promoções não foi empacotado" }
          python -c "from srstudio.posters.staging import PosterStagingService; from srstudio.app.advanced_posters import AdvancedPromotionPosterModule; assert PosterStagingService.PRINT_WIDTH == 1772; assert PosterStagingService.PRINT_HEIGHT == 2480; print(AdvancedPromotionPosterModule.__name__)"
      - name: Create portable update package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "dist/SR Studio 5/*" -DestinationPath "release/SR-Studio-5-Windows.zip" -Force
          python build/create_update_manifest.py "release/SR-Studio-5-Windows.zip" "release/update-manifest.json"
          if (!(Test-Path "release/update-manifest.json")) { throw "Manifesto não foi gerado" }
      - name: Verify update manifest
        shell: pwsh
        run: |
          python -c "from srstudio.updater.manifest import UpdateManifest; m=UpdateManifest.load('release/update-manifest.json'); assert m.verify_package('release/SR-Studio-5-Windows.zip'); print(m.version, m.channel, m.sha256)"
      - uses: actions/upload-artifact@v4
        with:
          name: SR-Studio-5-Windows
          path: |
            release/SR-Studio-5-Windows.zip
            release/update-manifest.json
          if-no-files-found: error
