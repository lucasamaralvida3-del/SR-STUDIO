name: Apply G2 Alpha 43 QML Direct Visibility Fix

on:
  push:
    branches:
      - integration/sr-studio-next
    paths:
      - '.github/workflows/g2-alpha43-qml-payload-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/sr-studio-next
          fetch-depth: 0
      - name: Apply direct sceneBridge visibility binding
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/srstudio/graphics2/qml/ImageInspector.qml')
          text = path.read_text(encoding='utf-8')

          old = '''    visible: hasImageSelection

    property var scene: ({})
    property var imageNode: null
    property bool hasImageSelection: false
    property bool syncing: false
'''
          new = '''    visible: bridgeHasImageSelection

    property var scene: ({})
    property var imageNode: null
    property bool hasImageSelection: false
    readonly property bool bridgeHasImageSelection: {
        try {
            var parsedScene = JSON.parse(sceneBridge.sceneJson)
            return selectedImage(parsedScene) !== null
        } catch (error) {
            return false
        }
    }
    property bool syncing: false
'''
          if text.count(old) != 1:
              raise RuntimeError('expected exactly one ImageInspector visibility block')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Check patch
        run: |
          git diff --check
          grep -F 'visible: bridgeHasImageSelection' src/srstudio/graphics2/qml/ImageInspector.qml
          grep -F 'readonly property bool bridgeHasImageSelection' src/srstudio/graphics2/qml/ImageInspector.qml
          grep -F 'return selectedImage(parsedScene) !== null' src/srstudio/graphics2/qml/ImageInspector.qml
      - name: Commit product fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/srstudio/graphics2/qml/ImageInspector.qml
          git commit -m "fix: bind ImageInspector visibility to bridge selection"
          git push origin HEAD:integration/sr-studio-next
