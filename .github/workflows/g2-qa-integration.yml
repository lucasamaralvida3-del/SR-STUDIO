name: G2 QA Integration

on:
  push:
    branches:
      - g2/integration-beta
    paths:
      - "src/srstudio/graphics2/**"
      - "src/srstudio/importers/**"
      - "tests/test_graphics2_*.py"
      - "tools/g2_qa_*.py"
      - ".github/workflows/g2-qa-integration.yml"
  pull_request:
    branches:
      - g2/integration-beta
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Qt prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install runtime
        run: python -m pip install -e ".[dev,graphics2]"
      - name: Compile QA additions
        run: >-
          python -m compileall -q
          tools/g2_qa_baseline.py
          tools/g2_qa_pptx_baseline.py
          tests/test_graphics2_qa_longrun.py
          tests/test_graphics2_qa_pptx_e2e.py
      - name: Ruff QA additions
        run: >-
          python -m ruff check
          tools/g2_qa_baseline.py
          tools/g2_qa_pptx_baseline.py
          tests/test_graphics2_qa_longrun.py
          tests/test_graphics2_qa_pptx_e2e.py
          tests/test_graphics2_image_replace_qml.py
      - name: Focused production-flow QA
        run: >-
          python -m pytest -q
          tests/test_graphics2_autosave.py
          tests/test_graphics2_bridge_roundtrip.py
          tests/test_graphics2_package_stress.py
          tests/test_graphics2_page_clone_ids.py
          tests/test_graphics2_project_actions.py
          tests/test_graphics2_product_card_duplicate.py
          tests/test_graphics2_pdf_multipage.py
          tests/test_graphics2_real_flyer_e2e.py
          tests/test_graphics2_image_replace_qml.py
          tests/test_graphics2_qa_longrun.py
          tests/test_graphics2_qa_pptx_e2e.py
      - name: Generic performance baseline
        run: python tools/g2_qa_baseline.py --output g2-qa-baseline-linux.json --pages 1,10,25
      - name: PPTX performance baseline
        run: python tools/g2_qa_pptx_baseline.py --output g2-qa-pptx-baseline-linux.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g2-qa-integration-linux
          path: |
            g2-qa-baseline-linux.json
            g2-qa-pptx-baseline-linux.json
          if-no-files-found: ignore

  windows-qa:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime
        shell: pwsh
        run: python -m pip install -e ".[dev,graphics2]"
      - name: Windows/Qt E2E and long-run QA
        shell: pwsh
        run: >-
          python -m pytest -q
          tests/test_graphics2_image_replace_qml.py
          tests/test_graphics2_real_flyer_e2e.py
          tests/test_graphics2_qa_longrun.py
          tests/test_graphics2_qa_pptx_e2e.py
          tests/test_graphics2_editor_persistence.py
          tests/test_graphics2_editor_roundtrip.py
          tests/test_graphics2_export_output.py
          tests/test_graphics2_export_roundtrip.py
      - name: Windows performance baseline
        shell: pwsh
        run: python tools/g2_qa_baseline.py --output g2-qa-baseline-windows.json --pages 1,10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g2-qa-integration-windows
          path: g2-qa-baseline-windows.json
          if-no-files-found: ignore
