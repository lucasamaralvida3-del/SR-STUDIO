name: G2 Editor Polish Inspector Signal Trace

on:
  pull_request:
    branches:
      - g2/integration-beta

permissions:
  contents: read

jobs:
  trace:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Qt test runtime
        shell: bash
        if: runner.os != 'Windows'
        run: python -m pip install -e '.[dev,graphics2]'
      - name: Install Qt test runtime Windows
        shell: pwsh
        if: runner.os == 'Windows'
        run: python -m pip install -e '.[dev,graphics2]'
      - name: Run signal timeline with stdout
        run: python -m pytest -s -q tests/test_graphics2_image_inspector_signal_trace.py
