[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "srstudio"
dynamic = ["version"]
description = "SR Studio 5.0 Professional"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1.2",
  "Pillow>=10.0.0",
  "pypdf>=4.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
sr-studio-5 = "srstudio.app.staged_posters:run"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "srstudio.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
srstudio = [
  "assets/brand/*.png",
  "assets/brand/*.ico",
  "assets/poster_templates/legacy/manifest.json",
  "assets/poster_templates/legacy/models/*.pptx",
  "assets/poster_templates/legacy/engines/*.ps1"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Gate inicial: erros de execução/sintaxe. Estilo é endurecido progressivamente.
select = ["E9", "F63", "F7", "F82"]
